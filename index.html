<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>BLOOM</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <style>
    :root {
      --hud-top-h: 74px;
      --bg: #eaf6ee;
      --panel-bg: rgba(255,255,255,0.94);
      --panel-border: rgba(60,40,20,0.08);
      --text: #332e28;
      --text-dim: #8a8478;
      --green: #4caf6d;
      --green-dark: #3d8f57;
      --blue: #4aa3ff;
      --pink: #ff6fa0;
      --amber: #f0a93a;
      --shadow: 0 6px 24px rgba(60,40,20,0.16);
      --shadow-sm: 0 2px 10px rgba(60,40,20,0.14);
    }

    /* user-select/-webkit-touch-callout: none everywhere - there is no text
       anywhere in this game worth selecting, and a one-second press-and-hold
       on a flower (see startHold) is a tool confirmation, not a text
       selection or an iOS copy/paste long-press menu. Without this, Android
       Chrome in particular paints its own blue selection highlight over
       whatever's under a finger held down that long, on top of the ring
       that's supposed to be the only thing responding to the hold. */
    * {
      box-sizing: border-box; -webkit-tap-highlight-color: transparent;
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bg); }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--text); }
    button { font-family: inherit; }

    #map { position: fixed; inset: 0; background: var(--bg); }
    .leaflet-container { background: var(--bg); }

    /* ================= TOP BAR ================= */
    #hud-top {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(255,255,255,0.86));
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 14px 16px 10px;
      display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
      box-shadow: var(--shadow-sm);
      border-radius: 0 0 22px 22px;
    }
    #title-wrap { display: flex; flex-direction: column; line-height: 1.1; }
    #game-title {
      font-weight: 800; font-size: 23px; letter-spacing: 1.5px;
      background: linear-gradient(90deg, #ff6fa0, #f0a93a, #4caf6d, #4aa3ff);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    #game-version { font-size: 10px; color: var(--text-dim); font-weight: 600; letter-spacing: 0.4px; margin-top: 2px; }

    #top-right { display: flex; align-items: center; gap: 8px; }
    #gps-status {
      font-size: 10px; font-weight: 700; letter-spacing: 0.5px; padding: 5px 10px;
      border-radius: 999px; background: rgba(240,169,58,0.16); color: #a06a00;
      white-space: nowrap;
    }
    #gps-status.pending { animation: pulse 1.6s ease-in-out infinite; }
    #gps-status.locked { background: rgba(76,175,109,0.16); color: var(--green-dark); }
    #gps-status.err { background: rgba(240,169,58,0.22); color: #a06a00; }

    #currency-pill {
      font-size: 11px; font-weight: 800; letter-spacing: 0.3px; padding: 5px 10px;
      border-radius: 999px; background: rgba(240,169,58,0.16); color: #a06a00;
      white-space: nowrap; cursor: pointer;
    }
    #currency-pill:active { background: rgba(240,169,58,0.26); }

    #top-menu-btn {
      width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--panel-border);
      background: rgba(255,255,255,0.9); color: var(--text); font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-sm);
    }
    #top-menu-btn:active { background: rgba(0,0,0,0.06); }

    #menu-dropdown {
      position: fixed; top: 68px; right: 16px; z-index: 1001;
      background: var(--panel-bg); border-radius: 16px; box-shadow: var(--shadow);
      border: 1px solid var(--panel-border); overflow: hidden;
      display: none; min-width: 190px;
    }
    #menu-dropdown.open { display: block; }
    #menu-dropdown button {
      display: block; width: 100%; text-align: left; padding: 13px 16px; border: none;
      background: none; font-size: 14px; color: var(--text); cursor: pointer;
      border-bottom: 1px solid var(--panel-border);
    }
    #menu-dropdown button:last-child { border-bottom: none; }
    #menu-dropdown button:active { background: rgba(0,0,0,0.05); }
    #menu-dropdown button.danger { color: #c0554a; }

    /* ================= BOTTOM HUD ================= */
    #hud-bottom {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 900;
      background: linear-gradient(0deg, rgba(255,255,255,0.97), rgba(255,255,255,0.88));
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 14px 18px calc(14px + env(safe-area-inset-bottom, 0px));
      border-radius: 22px 22px 0 0;
      box-shadow: var(--shadow-sm);
      text-align: center;
    }
    #hud-status-line { font-size: 13.5px; color: var(--text); font-weight: 600; }

    #recenter-btn {
      position: fixed; right: 16px; bottom: 96px; z-index: 900;
      width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--panel-border);
      background: var(--panel-bg); box-shadow: var(--shadow); font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    #recenter-btn:active { background: rgba(0,0,0,0.06); }

    /* ================= TUTORIAL BANNER ================= */
    /* First-run only (see the TUTORIAL section in the script). Sits below
       the toolbox (which now hugs the top-left corner, see #tool-rail) so
       the two never overlap - it used to be the other way around, with the
       toolbox pushed down to clear this banner instead. */
    #tutorial-banner {
      position: fixed; left: 12px; right: 12px; top: calc(var(--hud-top-h) + 74px); z-index: 950;
      background: linear-gradient(135deg, #fff6e0, #ffffff);
      border: 2px solid var(--amber); border-radius: 16px; box-shadow: var(--shadow);
      padding: 12px 16px; text-align: center; display: none;
    }
    #tutorial-banner.open { display: block; }
    #tutorial-text { font-size: 13.5px; font-weight: 700; line-height: 1.4; }
    #tutorial-skip-link {
      display: inline-block; margin-top: 6px; font-size: 11px; font-weight: 700;
      color: var(--text-dim); text-decoration: underline; cursor: pointer;
    }

    /* ================= PLANT PANEL ================= */
    #plant-panel {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 1100;
      background: var(--panel-bg); border-radius: 24px 24px 0 0; box-shadow: var(--shadow);
      padding: 10px 22px calc(22px + env(safe-area-inset-bottom, 0px));
      transform: translateY(105%);
      transition: transform 0.28s ease;
    }
    #plant-panel.open { transform: translateY(0); }
    .panel-handle { width: 40px; height: 4px; border-radius: 2px; background: var(--panel-border); margin: 4px auto 10px; }
    #panel-close-btn {
      position: absolute; top: 14px; right: 16px; width: 30px; height: 30px; border-radius: 50%;
      border: none; background: rgba(0,0,0,0.05); font-size: 17px; color: var(--text-dim); cursor: pointer;
    }
    #plant-icon-big { display: flex; align-items: center; justify-content: center; margin: 4px auto 8px; }
    #plant-title { text-align: center; font-size: 18px; font-weight: 800; margin-bottom: 2px; }
    #plant-meta { text-align: center; font-size: 12.5px; color: var(--text-dim); margin-bottom: 12px; }

    /* Progress toward the next stage, i.e. how long until this plant is ready
       for its next watering visit. There is no water-level bar any more -
       water is not a resource that meters down, it is just the action that
       advances a stage (or clears a cosmetic wilt). */
    .growth-bar-track { width: 100%; height: 10px; background: rgba(0,0,0,0.07); border-radius: 999px; overflow: hidden; }
    #growth-bar-fill { height: 100%; background: linear-gradient(90deg, var(--green), #8fd9a8); border-radius: 999px; transition: width 0.4s ease; }
    /* Wild flowers reuse the same bar as a life bar - amber, so an emptying
       bar is never mistaken for growth. */
    #growth-bar-fill.fading { background: linear-gradient(90deg, var(--amber), #f5c169); }
    #growth-bar-label { text-align: center; font-size: 11.5px; color: var(--text-dim); margin-top: 5px; margin-bottom: 10px; }

    #plant-status-line { text-align: center; font-size: 13.5px; font-weight: 700; margin-bottom: 14px; }
    .status-good { color: var(--green-dark); }
    .status-wilt { color: var(--blue); }

    /* The panel does not act on a flower any more - the tool rail does - so
       this line names whichever tool applies right now instead of offering a
       button that would duplicate it. */
    #panel-hint {
      font-size: 12.5px; color: var(--text-dim); text-align: center;
      line-height: 1.6; margin-bottom: 12px;
    }
    .hint-tool { color: var(--text); font-weight: 800; white-space: nowrap; }
    .hint-icon { display: inline-block; vertical-align: -3px; margin-right: 3px; line-height: 0; }

    /* Hidden by default - renderBreedButton shows it only when this plant is
       flourishing and has a flourishing neighbour, so it never advertises a
       cross that isn't there. Green rather than blue: watering is the routine
       action, crossing is the deliberate one. */
    #breed-btn {
      display: none; width: 100%; padding: 13px; border: 2px solid var(--green);
      border-radius: 16px; margin-top: 10px; font-size: 14.5px; font-weight: 800;
      cursor: pointer; background: #fff; color: var(--green-dark); box-shadow: var(--shadow-sm);
    }
    #breed-btn:disabled {
      border-color: #d8d4c8; background: #f0ede4; color: #948e80;
      box-shadow: none; cursor: default;
    }

    /* The two parents of a proposed cross, side by side with a plus between,
       so the pairing reads as an equation rather than a list. */
    .breed-pair {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      margin-bottom: 12px;
    }
    .breed-parent {
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      font-size: 12px; font-weight: 700; text-align: center; flex: 1;
    }
    .breed-plus { font-size: 20px; font-weight: 800; color: var(--text-dim); flex-shrink: 0; }

    /* ================= TOOL RAIL ================= */
    /* A tool is a mode, not a one-shot: equip it, tap (or hold-confirm) every
       flower you want it applied to, then put it away. That is what makes
       watering a whole bed a row of taps instead of a panel round-trip per
       flower.

       Presented as a toolbox at the top-left corner rather than a permanent
       stack of buttons: a single tap (or a press-and-hold-then-drag) flies
       the tools out across the top-left quarter circle (right, down-right,
       below - a fourth, fertilizer, only once a bag is owned; see
       .tool-btn.fert/syncFertTool), and picking one swaps the toolbox for
       that tool's own icon in place - so there is exactly one button here
       at rest, and the fan only exists while you are actively choosing.
       #tool-rail is a fixed-size anchor box; #tool-toggle and the .petal
       buttons are all absolutely positioned inside it from the same
       top-left origin, so every "fly out" is just a transform.

       Anchored flush to the top-left corner, right under the top bar -
       and stacked ABOVE both the tutorial banner (950) and the plant panel
       (1100): the panel's hints name these tools, so on a short phone they
       have to stay tappable even when the sheet is up, and the tutorial
       banner is pushed down below it (see #tutorial-banner) rather than the
       other way around. Equipping a tool closes the sheet anyway. */
    #tool-rail {
      position: fixed; left: 12px; top: calc(var(--hud-top-h) + 10px); z-index: 1150;
      width: 52px; height: 52px;
    }
    #tool-toggle { position: absolute; left: 0; top: 0; z-index: 2; }
    /* Zero-size on purpose - it only exists to give the petals a shared
       transform origin; pointer-events stay off here and are switched on per
       petal only once flown out, so a closed fan can never eat a map tap. */
    #tool-petals { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; }

    .tool-btn {
      width: 52px; height: 52px; border-radius: 50%; padding: 0;
      border: 2px solid var(--panel-border); background: var(--panel-bg);
      box-shadow: var(--shadow); cursor: pointer; color: var(--text-dim);
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.12s ease, border-color 0.22s ease, background 0.22s ease, color 0.22s ease;
    }
    #tool-toggle:active { transform: scale(0.92); }
    /* Small green badge on the resting toolbox hints there is more inside;
       it steps aside the instant the fan is open, since that is now obvious. */
    .tool-btn.toolbox { position: relative; }
    .tool-btn.toolbox::after {
      content: ''; position: absolute; right: 2px; bottom: 2px; width: 8px; height: 8px;
      border-radius: 50%; background: var(--green); box-shadow: 0 0 0 2px var(--panel-bg);
      transition: opacity 0.15s ease, transform 0.15s ease;
    }
    .tool-btn.toolbox.rail-open::after { opacity: 0; transform: scale(0.4); }

    /* Each tool keeps its own accent when equipped, so a glance at the
       toolbox says which mode you are in without reading the HUD line - the
       toggle button itself picks up these classes once a tool is equipped. */
    .tool-btn.active { border-color: currentColor; }
    .tool-btn.water.active { color: var(--blue); background: rgba(74,163,255,0.15); }
    .tool-btn.shear.active { color: var(--green-dark); background: rgba(76,175,109,0.17); }
    .tool-btn.sell.active { color: #a06a00; background: rgba(240,169,58,0.2); }
    .tool-btn.fert.active { color: #6b4423; background: rgba(201,165,101,0.35); }
    .tool-sell-glyph { font-weight: 900; line-height: 1; }
    .tool-fert-glyph { line-height: 1; }
    /* The equip/unequip swap gets a small spring pop so the icon change reads
       as a physical action rather than a jump-cut. Triggered by JS re-adding
       this class on every activeTool change. */
    @keyframes tool-equip-pop {
      0% { transform: scale(0.55) rotate(-8deg); }
      65% { transform: scale(1.14) rotate(3deg); }
      100% { transform: scale(1) rotate(0deg); }
    }
    .tool-btn.equip-pop { animation: tool-equip-pop 0.32s cubic-bezier(.34,1.56,.64,1); }

    /* The tools themselves. Closed = collapsed onto the toolbox origin,
       shrunk, faded and untappable. Each one flies out to its own spot on an
       overshoot easing with a slight counter-rotation, staggered so they
       cascade out rather than jumping together; closing reverses the
       stagger so the last one out is the first one home.

       Fertilizer is a fourth petal, but only ever shown once a bag is
       actually owned (see .tool-btn.fert below and syncFertTool) - so there
       are two layouts here: the original three spots (right, down-right,
       below, unchanged) for the common case, and a wider evenly-spaced
       quarter-circle (#tool-petals.has-fert) for the four-tool case, rather
       than always reserving a fourth spot nobody without fertilizer would
       ever see filled. */
    .tool-btn.petal {
      position: absolute; left: 0; top: 0;
      transform: translate(0, 0) scale(0.3) rotate(-32deg);
      opacity: 0; pointer-events: none;
      transition: transform 0.38s cubic-bezier(.34,1.56,.64,1), opacity 0.2s ease;
    }
    /* Never a tap target and never occupies a spot in the 3-tool layout -
       only #tool-petals.has-fert (state.fertilizer > 0) makes it visible.
       Scoped to .petal specifically, NOT plain .tool-btn.fert - #tool-toggle
       also picks up a bare "fert" class (via renderToolRail, to color it
       while fert is the active tool) and is a .tool-btn too, so an
       unscoped rule here hid the toggle itself the moment fertilizer was
       actually used - the equipped tool's own icon vanishing, with no
       button left to tap to put it away. */
    .tool-btn.petal.fert { display: none; }
    #tool-petals.has-fert .tool-btn.fert { display: flex; }

    .tool-btn.petal.water { transition-delay: 0.10s, 0.10s; }
    .tool-btn.petal.shear { transition-delay: 0.05s, 0.05s; }
    .tool-btn.petal.sell  { transition-delay: 0s, 0s; }
    #tool-petals.open .tool-btn.petal { opacity: 1; pointer-events: auto; }
    #tool-petals.open .tool-btn.water { transform: translate(76px, 0) scale(1) rotate(0deg); transition-delay: 0s, 0s; }
    #tool-petals.open .tool-btn.shear { transform: translate(54px, 54px) scale(1) rotate(0deg); transition-delay: 0.06s, 0.06s; }
    #tool-petals.open .tool-btn.sell  { transform: translate(0, 76px) scale(1) rotate(0deg); transition-delay: 0.12s, 0.12s; }
    /* Live highlight while a press-and-hold drag is passing over a petal -
       the fast path from the skill spec: hold the toolbox, drag over the
       icon you want, release to equip it without a second tap. */
    .tool-btn.petal.drag-hover { box-shadow: 0 0 0 5px rgba(255,255,255,0.55), var(--shadow); }
    #tool-petals.open .tool-btn.water.drag-hover { transform: translate(76px, 0) scale(1.22) rotate(0deg); }
    #tool-petals.open .tool-btn.shear.drag-hover { transform: translate(54px, 54px) scale(1.22) rotate(0deg); }
    #tool-petals.open .tool-btn.sell.drag-hover  { transform: translate(0, 76px) scale(1.22) rotate(0deg); }

    /* Four-tool layout: same 76px radius, now spread evenly across the
       quarter circle (0/30/60/90deg) instead of 0/45/90, so the new fourth
       spot (fert, at 90deg/straight down) doesn't just bolt on past the old
       "sell" spot - closing order is reversed and re-staggered the same way
       the three-tool layout is (last opened, first home). Higher specificity
       than the plain .open rules above (two classes vs one), so this wins
       whenever has-fert is set. */
    #tool-petals.has-fert .tool-btn.water { transition-delay: 0.18s, 0.18s; }
    #tool-petals.has-fert .tool-btn.shear { transition-delay: 0.12s, 0.12s; }
    #tool-petals.has-fert .tool-btn.sell  { transition-delay: 0.06s, 0.06s; }
    #tool-petals.has-fert .tool-btn.fert  { transition-delay: 0s, 0s; }
    #tool-petals.open.has-fert .tool-btn.water {
      transform: translate(76px, 0) scale(1) rotate(0deg); transition-delay: 0s, 0s;
    }
    #tool-petals.open.has-fert .tool-btn.shear {
      transform: translate(65.8px, 38px) scale(1) rotate(0deg); transition-delay: 0.06s, 0.06s;
    }
    #tool-petals.open.has-fert .tool-btn.sell {
      transform: translate(38px, 65.8px) scale(1) rotate(0deg); transition-delay: 0.12s, 0.12s;
    }
    #tool-petals.open.has-fert .tool-btn.fert {
      transform: translate(0, 76px) scale(1) rotate(0deg); transition-delay: 0.18s, 0.18s;
    }
    #tool-petals.open.has-fert .tool-btn.water.drag-hover { transform: translate(76px, 0) scale(1.22) rotate(0deg); }
    #tool-petals.open.has-fert .tool-btn.shear.drag-hover { transform: translate(65.8px, 38px) scale(1.22) rotate(0deg); }
    #tool-petals.open.has-fert .tool-btn.sell.drag-hover  { transform: translate(38px, 65.8px) scale(1.22) rotate(0deg); }
    #tool-petals.open.has-fert .tool-btn.fert.drag-hover  { transform: translate(0, 76px) scale(1.22) rotate(0deg); }

    /* First run only - the tutorial points at whichever tool it is asking
       for, on the toolbox itself while it is stowed and on the real petal
       once the fan is open. */
    @keyframes tool-hint {
      0%, 100% { box-shadow: 0 0 0 0 rgba(240,169,58,0.6), var(--shadow); }
      50% { box-shadow: 0 0 0 9px rgba(240,169,58,0), var(--shadow); }
    }
    .tool-btn.hint { border-color: var(--amber); color: #a06a00; animation: tool-hint 1.6s ease-out infinite; }

    /* ================= SEED RAIL ================= */
    /* Same idea as the tool rail (see above), mirrored to the top-right
       corner and one level deeper: tap (or hold-and-drag) the seed packet to
       fan out every species you actually hold a seed of, tap one of those to
       swap the fan for that species' owned colors, then tap a color to equip
       it - which replaces the packet with that flower's own icon, exactly
       like a tool. An equipped seed is planted with a plain tap on empty
       ground (see plantEquippedSeedAt), and it stays equipped across many
       taps so a whole bed of the same color is a row of taps, not a picker
       round-trip per hex.

       Species and color counts are both open-ended (up to 7 species, up to
       14 colors each), unlike the tool rail's fixed three, so there is no
       per-item CSS selector to fan them out with - .seed-petal only carries
       the closed rest state and the transition; the open position for each
       one is computed by JS (seedFanSlots) and written as an inline
       transform. See renderSeedPetals/animateSeedFanOpen in the SEEDS
       section of the script for the JS half of this. */
    #seed-rail {
      position: fixed; right: 12px; top: calc(var(--hud-top-h) + 10px); z-index: 1150;
      width: 52px; height: 52px;
    }
    #seed-toggle { position: absolute; right: 0; top: 0; z-index: 2; }
    #seed-toggle:active { transform: scale(0.92); }
    #seed-petals { position: absolute; right: 0; top: 0; width: 0; height: 0; pointer-events: none; }

    .tool-btn.seed-packet { position: relative; }
    .tool-btn.seed-packet::after {
      content: ''; position: absolute; left: 2px; bottom: 2px; width: 8px; height: 8px;
      border-radius: 50%; background: var(--amber); box-shadow: 0 0 0 2px var(--panel-bg);
      transition: opacity 0.15s ease, transform 0.15s ease;
    }
    .tool-btn.seed-packet.seed-rail-open::after { opacity: 0; transform: scale(0.4); }

    .seed-petal {
      position: absolute; right: 0; top: 0; width: 40px; height: 40px;
      transform: translate(0, 0) scale(0.3) rotate(28deg);
      opacity: 0; pointer-events: none;
      transition: transform 0.38s cubic-bezier(.34,1.56,.64,1), opacity 0.2s ease;
    }
    #seed-petals.open .seed-petal { opacity: 1; pointer-events: auto; }
    .seed-petal.drag-hover { box-shadow: 0 0 0 5px rgba(255,255,255,0.55), var(--shadow); z-index: 1; }

    /* Same shape/position as the journal's slot badge - a small filled pill
       in the corner rather than a bare number, so it reads at a glance
       against every flower color instead of blending into pale petals. */
    .seed-count-badge {
      position: absolute; top: -4px; right: -3px; min-width: 16px; padding: 0 3px;
      border-radius: 8px; background: var(--green); color: #fff;
      font-size: 9.5px; font-weight: 800; line-height: 16px; text-align: center;
      box-shadow: 0 0 0 2px var(--panel-bg);
    }

    /* ================= MAP EFFECTS LAYER ================= */
    /* The hold-to-confirm ring and the watering can are drawn in screen space
       over the map rather than as Leaflet markers: they are transient, they
       must never become tap targets, and a divIcon would be rebuilt out from
       under them by the next renderPlants(). Positions are refreshed on map
       move so they stay glued to their flower. */
    #fx-layer { position: fixed; inset: 0; z-index: 940; pointer-events: none; overflow: hidden; }
    .fx-item { position: absolute; width: 0; height: 0; }

    /* Press-and-hold confirmation. The arc sweeps from empty to a full green
       ring over HOLD_MS with the tool's own icon in the middle, so collecting
       and selling - the two irreversible taps in the game - can't happen by
       brushing the screen. Driven from JS per frame rather than a CSS
       animation, because it has to be cancellable mid-sweep. */
    /* Real size rather than the 0x0 box the other effects use, because the
       icon inside is centred with inset:0 - it needs a box to be centred in.
       The negative margins are what sit that box over the flower. */
    .fx-item.hold-ring { width: 56px; height: 56px; margin-left: -28px; margin-top: -28px; }
    .hold-ring svg { display: block; }
    .hold-ring-icon {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: var(--green-dark);
    }

    /* The can drifts in above the flower, tips towards its spout, rains for a
       beat, then rights itself and leaves - the plant grows only once it is
       gone, so the animation reads as the cause of the growth rather than
       decoration alongside it. */
    .water-fx { color: var(--blue); }
    .water-can { position: absolute; left: 6px; bottom: 24px; transform-origin: 78% 72%; }
    .water-can.pour { animation: can-pour 1150ms ease-in-out forwards; }
    @keyframes can-pour {
      0%   { opacity: 0; transform: translate(7px, -14px) rotate(6deg); }
      16%  { opacity: 1; transform: translate(0, 0) rotate(6deg); }
      30%  { opacity: 1; transform: translate(0, 0) rotate(-44deg); }
      70%  { opacity: 1; transform: translate(0, 0) rotate(-44deg); }
      86%  { opacity: 1; transform: translate(0, 0) rotate(4deg); }
      100% { opacity: 0; transform: translate(5px, -13px) rotate(4deg); }
    }
    .water-drop {
      position: absolute; width: 5px; height: 7px; background: var(--blue); opacity: 0;
      border-radius: 50% 50% 55% 55% / 62% 62% 40% 40%;
      animation: drop-fall 480ms ease-in forwards;
    }
    @keyframes drop-fall {
      0% { opacity: 0; transform: translateY(0) scale(0.6); }
      22% { opacity: 0.95; }
      100% { opacity: 0; transform: translateY(30px) scale(1); }
    }

    /* ================= SHOP PANEL ================= */
    /* Full-screen takeover rather than a bottom sheet - stepping up to the
       stand should feel like leaving the map for a moment, not peeking at a
       drawer over it. Still slides up like every other panel; it just now
       covers the whole viewport when open. Laid out as one flex column
       (basket, then the stand) sized to fit a phone screen with no
       scrolling of its own - see stand-counter below for the one internal
       scroll left as a safety net for unusually short screens. */
    #shop-panel {
      position: fixed; inset: 0; z-index: 1100;
      /* Opaque, not var(--panel-bg) - that's a translucent white meant to
         float a sheet over the map, and at full-screen size the HUD bar
         ghosted through the top of it. */
      background: #fdfbf5;
      padding: calc(14px + env(safe-area-inset-top, 0px)) 22px calc(16px + env(safe-area-inset-bottom, 0px));
      display: flex; flex-direction: column;
      transform: translateY(105%);
      transition: transform 0.28s ease;
    }
    #shop-panel.open { transform: translateY(0); }
    #shop-close-btn {
      position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: 16px;
      width: 32px; height: 32px; border-radius: 50%; z-index: 2;
      border: none; background: rgba(0,0,0,0.06); font-size: 18px; color: var(--text-dim); cursor: pointer;
    }
    /* Deliberately plain rather than themed to the stand - a debug shortcut,
       not a piece of the market fiction, so it should read as separate from
       it at a glance. Off is a muted outline; on turns solid red as an
       unmissable "yes, this is really on" cue, same idea as an armed tool. */
    #cheat-toggle-btn {
      position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); left: 16px; z-index: 2;
      border: 2px solid #6b4423; border-radius: 14px; padding: 6px 11px;
      font-size: 11px; font-weight: 800; color: #5a3d22; background: #fff6e0; cursor: pointer;
    }
    #cheat-toggle-btn.on { background: #c0453c; border-color: #7a2a22; color: #fff; }
    /* The petal basket: how much you have to spend, front and center instead
       of a sentence of stats. A woven basket (repeating gradients, same
       trick as the stand counter) with a handle arc, flowers spilling over
       the rim, and a hanging tag carrying the actual number - "a basket
       with petals in it that has a number on it". */
    #shop-basket { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; margin: 6px 0 10px; }
    #basket-handle {
      width: 60px; height: 30px; margin-bottom: -15px;
      border: 5px solid #6b4423; border-bottom: none; border-radius: 60px 60px 0 0;
    }
    #basket-body {
      position: relative; width: 132px; height: 58px;
      background:
        repeating-linear-gradient(45deg, rgba(107,68,35,0.32) 0 6px, transparent 6px 12px),
        repeating-linear-gradient(180deg, #caa06a 0 11px, #ad7f48 11px 13px);
      border: 3px solid #6b4423; border-radius: 12px 12px 34px 34px; box-shadow: var(--shadow-sm);
    }
    #basket-petals {
      position: absolute; top: -22px; left: 0; right: 0; text-align: center;
      font-size: 22px; letter-spacing: -5px;
    }
    /* Anchored to basket-body (not shop-basket) so the offset is relative to
       the basket itself, not the whole full-screen panel. */
    #basket-tag {
      position: absolute; top: -10px; right: -20px; transform: rotate(7deg);
      background: #fff6e0; border: 2px solid #6b4423; color: #5a3d22; border-radius: 10px;
      padding: 4px 9px; font-size: 13.5px; font-weight: 800; white-space: nowrap;
      box-shadow: var(--shadow-sm);
    }
    /* The stand: a wooden farmer's-market counter under a striped awning,
       with a hand-painted price sign leaning over it. Pure CSS/gradients, no
       image assets, matching the rest of the game's inline-SVG art. One
       crate per seed on sale sits on the counter; fertilizer gets its own
       sack off to the side rather than blending in with the seed row.
       flex:1 (not a fixed height) so it soaks up whatever room is left under
       the basket on any phone, rather than being sized for one screen and
       leaving a gap - or a scrollbar - on every other. */
    #stand-scene { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; margin: 0 -22px; padding: 0 22px; }
    #stand-canopy {
      flex: 0 0 auto; height: 20px; margin: 0 -22px 4px;
      background: repeating-linear-gradient(-45deg, #c0453c 0 16px, #f6ecd8 16px 32px);
      border-bottom: 3px solid #6b4423;
    }
    #stand-sign {
      flex: 0 0 auto; position: relative; left: 50%; transform: translateX(-50%) rotate(-2.5deg);
      width: fit-content; margin: -22px 0 12px;
      background: #7a5330; color: #fff6e0; border: 3px solid #5a3d22; border-radius: 8px;
      padding: 7px 16px; font-size: 12.5px; font-weight: 800; text-align: center; line-height: 1.35;
      box-shadow: var(--shadow-sm); white-space: nowrap;
    }
    #stand-counter {
      flex: 1 1 auto; min-height: 0;
      display: flex; flex-direction: column; gap: 14px;
      align-items: center; justify-content: center;
      background: repeating-linear-gradient(180deg, #b8824a 0 13px, #a06f3d 13px 15px);
      border: 3px solid #6b4423; border-radius: 14px;
      padding: 16px 14px 14px; box-shadow: inset 0 3px 10px rgba(0,0,0,0.28);
      overflow-y: auto; -webkit-overflow-scrolling: touch;
    }
    /* Seven crates, one per species on sale that day, always laid out three
       to a row - a fixed count (not a responsive auto-fill) since the
       species list itself is fixed, so there is no "does it still fit"
       guesswork. The seventh has no row-mate among the crates, so it shares
       the last row with the fertilizer sack instead: that row is centered
       and left at natural size (not stretched edge to edge like the two
       rows above it), so the odd flower-plus-sack pair reads as one small
       group under the two full rows rather than a stretched mismatch. */
    .stand-row { display: flex; gap: 9px; }
    .stand-row-crates { width: 100%; }
    .stand-row-crates .stand-item { flex: 1 1 0; min-width: 0; }
    .stand-row-last { justify-content: center; }
    /* Base width matches the fertilizer sack (86px) - without it, the
       seventh crate has no row-mates to stretch against on its own row and
       shrinks to fit its wrapped two-line name instead, reading noticeably
       narrower than the six crates above it. Rows 1/2 override this with
       flex-grow to stretch edge to edge. */
    .stand-item {
      display: flex; flex-direction: column; align-items: center; gap: 3px; width: 86px;
      background: linear-gradient(180deg, #fff6e0, #ecdcb2); border: 2px solid #6b4423;
      border-radius: 12px; padding: 8px 3px 6px; cursor: pointer; box-shadow: var(--shadow-sm);
    }
    .stand-item:disabled { filter: grayscale(60%); opacity: 0.5; cursor: default; box-shadow: none; }
    .stand-item-name { font-size: 9.5px; font-weight: 800; color: #5a3d22; text-align: center; line-height: 1.15; }
    .stand-item-price { font-size: 8.5px; font-weight: 700; color: #a06a00; }
    .stand-item-owned { font-size: 8px; font-weight: 700; color: #8a7550; }
    /* Fertilizer's own sack, styled apart from the seed crates but no
       longer set off with a divider line - it now just sits beside the
       seventh flower on their shared, centered row. */
    .stand-fert-btn {
      display: flex; flex-direction: column; align-items: center; gap: 3px; width: 86px;
      background: linear-gradient(180deg, #e8cfa0, #c9a565); border: 2px solid #6b4423;
      border-radius: 12px; padding: 10px 6px 7px; cursor: pointer; box-shadow: var(--shadow-sm);
    }
    .stand-fert-btn:disabled { filter: grayscale(60%); opacity: 0.5; cursor: default; box-shadow: none; }
    .stand-fert-icon { font-size: 26px; line-height: 1; }
    .stand-fert-label { font-size: 9.5px; font-weight: 800; color: #5a3d22; text-align: center; }
    .stand-fert-price { font-size: 8.5px; font-weight: 700; color: #a06a00; }
    .stand-fert-owned { font-size: 8px; font-weight: 700; color: #8a7550; margin-top: 4px; }
    /* Purchase confirmation: what you are about to buy, drawn big enough to
       tell a Red Tulip from a Pink one before the Petals are gone. */
    .buy-preview {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 14px; margin-bottom: 12px; border: 2px solid; border-radius: 16px;
      font-size: 15.5px; font-weight: 800; text-align: center;
    }

    /* ================= JOURNAL PANEL ================= */
    /* Full-screen like the shop - the panel IS the page, edge to edge, no
       table backdrop showing around it. The only depth cue left is the
       darker gradient strip down the left edge (::before), standing in for
       a spine/binding so it still reads as "the middle of a page" rather
       than a flat rectangle. Ruled lines and soft aged-paper blotches are
       CSS gradients, no image assets. */
    #journal-panel {
      position: fixed; inset: 0; z-index: 1100;
      background:
        repeating-linear-gradient(180deg, transparent 0 27px, rgba(120,90,50,0.11) 27px 28px),
        radial-gradient(ellipse 340px 200px at 18% 12%, rgba(150,110,60,0.08), transparent 60%),
        radial-gradient(ellipse 300px 240px at 88% 85%, rgba(150,110,60,0.07), transparent 60%),
        linear-gradient(#faf1da, #f0dfb8);
      padding: calc(54px + env(safe-area-inset-top, 0px)) 0 env(safe-area-inset-bottom, 0px) 0;
      display: flex; flex-direction: column;
      transform: translateY(105%);
      transition: transform 0.28s ease;
    }
    #journal-panel.open { transform: translateY(0); }
    #journal-panel::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 16px;
      background: linear-gradient(90deg, rgba(90,61,34,0.45), rgba(90,61,34,0));
    }
    #journal-close-btn {
      position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: 16px;
      width: 32px; height: 32px; border-radius: 50%; z-index: 3;
      border: none; background: rgba(0,0,0,0.16); color: #fff; font-size: 18px; cursor: pointer;
    }
    #journal-heading {
      flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 8px;
      font-size: 19px; font-weight: 800; color: #4a3218; margin: 0 0 6px; text-align: center;
      padding: 0 22px 0 30px;
    }
    /* Padded well clear of the spine on the left, and generously on the
       right/bottom - overflow-y:auto here also makes overflow-x auto (per
       spec, pairing a non-visible axis with 'visible' resolves both), so
       anything that pokes past this box's own edge (a card's tape, its
       drop shadow) gets clipped by the scroll container. The padding is
       the buffer that keeps the tape on the first and last columns clear
       of that edge. */
    #journal-body {
      flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 4px 22px 18px 30px;
    }

    /* The scrapbook page: found colors get a looser grid than the crossing
       notes' plain swatch grid (.color-grid) does, since every found cell
       here is a little taped-down photo rather than a dot - it needs the
       extra room for the tape to overhang without crowding its neighbors. */
    /* .color-grid.scrapbook-grid (not just .scrapbook-grid) - .color-grid
       is defined later in the stylesheet for the crossing notes' grid, and
       at equal specificity the later rule wins the cascade regardless of
       this comment's position, silently overriding grid-template-columns
       back to auto-fill. The compound selector outranks it outright. */
    .color-grid.scrapbook-grid {
      /* Fixed 4 columns rather than auto-fill - a species' full palette is
         16 colors (14 shared plus its own two signatures), so 4x4 is the
         natural shape for a full page and stays consistent across phone
         widths instead of reflowing to 5 columns on a wider screen. */
      display: grid; grid-template-columns: repeat(4, 1fr);
      /* Tall row-gap, not the crossing notes' tight 7px - each card's tape
         pokes up above its own top edge, and needs real clearance from the
         row above it or it visually overlaps that row's cards. */
      gap: 36px 12px; margin: 10px 0 16px; padding-top: 6px;
    }
    /* Every found color is a little paper card taped to the page - a note
       card, not a glossy photo: a soft cream gradient with a couple of
       faint blotches (the same aged-paper trick as the journal-panel
       background, scaled down) rather than flat white, plus a thin inset
       stroke standing in for a cut paper edge. A drop shadow lifts it off
       the page, a slight per-cell tilt (cycled by grid position, not
       random, so it never jitters on re-render) keeps it from looking
       grid-stamped, and two rotated strips of tape sit over the top
       corners. An unfound color stays a plain dashed pocket instead -
       nothing is taped down yet. */
    .color-cell.slot {
      position: relative; border: none; padding: 10px 4px 7px; border-radius: 2px;
      background:
        radial-gradient(ellipse 42px 22px at 18% 12%, rgba(120,90,50,0.07), transparent 70%),
        radial-gradient(ellipse 36px 20px at 82% 88%, rgba(120,90,50,0.06), transparent 70%),
        linear-gradient(178deg, #fffaf0 0%, #fbf0d4 100%);
      box-shadow: 0 3px 7px rgba(60,40,20,0.3), inset 0 0 0 1px rgba(120,90,50,0.1);
      transform: rotate(var(--tilt, -2deg));
    }
    .color-cell.slot:nth-child(4n+2) { --tilt: 2.5deg; }
    .color-cell.slot:nth-child(4n+3) { --tilt: -1.5deg; }
    .color-cell.slot:nth-child(4n) { --tilt: 1.5deg; }
    .color-cell.slot.held { cursor: pointer; }
    .color-cell.slot.picked {
      box-shadow: 0 0 0 2px var(--green), 0 6px 12px rgba(60,40,20,0.32),
        inset 0 0 0 1px rgba(120,90,50,0.1);
      transform: rotate(0deg) scale(1.05); z-index: 1;
    }
    .color-cell.slot:not(.blank)::before,
    .color-cell.slot:not(.blank)::after {
      content: ''; position: absolute; top: -7px; width: 26px; height: 14px;
      background: rgba(255,244,214,0.85); border: 1px solid rgba(160,120,60,0.4);
      box-shadow: 0 1px 2px rgba(60,40,20,0.28);
    }
    .color-cell.slot:not(.blank)::before { left: -6px; transform: rotate(-40deg); }
    .color-cell.slot:not(.blank)::after { right: -6px; transform: rotate(40deg); }
    /* An unfound color is a plain grey question mark in a dashed pocket -
       not a card, since nothing has been taped down yet. */
    .color-cell.slot.blank {
      background: transparent; border: 2px dashed rgba(90,61,34,0.3);
      box-shadow: none; color: #a49d90; transform: none;
    }
    .slot-unknown {
      display: inline-flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; border-radius: 50%; font-size: 15px; font-weight: 800;
      background: rgba(60,40,20,0.07); color: #a49d90;
    }
    /* Name and count on one line, centered together - not a badge stamped
       in a corner, which used to clip against the tape in the grid's last
       column. */
    .slot-line { display: flex; align-items: baseline; justify-content: center; gap: 4px; }
    .slot-label { font-style: italic; }
    /* No pill, no circle - just green ink in a handwriting-style font, as
       if the count were jotted onto the card by hand rather than printed.
       Muted when the color was found but none are on hand right now (kept,
       held 0); full green and bolder once you actually have some. */
    .slot-note {
      font-family: 'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive, sans-serif;
      font-size: 13px; color: rgba(61,143,87,0.6); display: inline-block; transform: rotate(-6deg);
    }
    .slot-note.some { color: var(--green-dark); font-weight: 700; }

    /* ================= NOTES PANEL (BREEDING TREE) ================= */
    /* Full-screen and paper-textured exactly like the journal (same ruled
       lines, aged blotches, left spine gradient, top species tabs), but the
       page itself is a breeding family tree instead of a stamp album: the
       four standard colors at the top, lines down to whatever they've
       actually been crossed into. Every node and every line is driven by
       state.crosses - nothing here comes from BREED_TABLE/SIGNATURE_TABLE
       directly, so nothing is shown before the player has genuinely seen it
       happen (see crossResultDiscovered/computeCrossEdges). */
    #notes-panel {
      position: fixed; inset: 0; z-index: 1100;
      background:
        repeating-linear-gradient(180deg, transparent 0 27px, rgba(120,90,50,0.11) 27px 28px),
        radial-gradient(ellipse 340px 200px at 18% 12%, rgba(150,110,60,0.08), transparent 60%),
        radial-gradient(ellipse 300px 240px at 88% 85%, rgba(150,110,60,0.07), transparent 60%),
        linear-gradient(#faf1da, #f0dfb8);
      padding: calc(54px + env(safe-area-inset-top, 0px)) 0 env(safe-area-inset-bottom, 0px) 0;
      display: flex; flex-direction: column;
      transform: translateY(105%);
      transition: transform 0.28s ease;
    }
    #notes-panel.open { transform: translateY(0); }
    #notes-panel::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 16px;
      background: linear-gradient(90deg, rgba(90,61,34,0.45), rgba(90,61,34,0));
    }
    #notes-close-btn {
      position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: 16px;
      width: 32px; height: 32px; border-radius: 50%; z-index: 3;
      border: none; background: rgba(0,0,0,0.16); color: #fff; font-size: 18px; cursor: pointer;
    }
    #notes-heading {
      flex: 0 0 auto; font-size: 19px; font-weight: 800; color: #4a3218; margin: 0 0 6px;
      text-align: center; padding: 0 22px 0 30px;
    }
    #notes-body {
      flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 4px 22px 18px 30px;
    }
    .tree-caption { font-size: 11.5px; font-weight: 700; color: var(--text-dim); text-align: center; margin: 0 0 6px; }
    .tree-hint { font-size: 12px; color: var(--text-dim); text-align: center; margin: 0 0 6px; }
    /* The tree canvas has its own horizontal scroll, independent of the
       page's vertical one, as a fallback for the six-wide middle row on
       narrow phones - panning just that row (not the tabs/caption above
       it) is the natural way to see the rest of it. Bled to the panel's
       own edges (negative margin) rather than staying inset, so there is
       real room before a scroll is even needed. Cards are picture-only and
       small (see below) specifically so this scroll is rarely needed at
       all, rather than being the normal way to read the tree. */
    #tree-scroll {
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      margin: 0 -22px 0 -30px; padding: 6px 22px 10px 30px;
    }
    /* Six 44px cards plus five 8px gaps - fits inside a 360px-and-up phone
       with no horizontal scroll at all; only genuinely narrow phones need
       to pan the tree. */
    #tree-wrap { position: relative; min-width: 310px; }
    .tree-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .tree-edge { stroke: rgba(90,61,34,0.55); stroke-width: 2; fill: none; stroke-linecap: round; }
    /* Smaller row gap than a first pass needed - picture-only cards (see
       below) are shorter AND wear smaller tape, so there is less to clear
       between one row's cards and the tape poking above the row below it. */
    .tree-row {
      position: relative; z-index: 1; width: 100%;
      display: flex; justify-content: center; gap: 8px; margin: 0 0 24px;
    }
    .tree-row:last-child { margin-bottom: 4px; }
    /* Picture only, no name/count underneath (see crossNodeCard) - "to save
       space" per request, so the card shrinks to just wrap a small flower
       icon rather than the journal's full name+count layout. Fixed width
       rather than the journal grid's stretch-to-fill either way: rows here
       hold different counts (4, 6, 3, 1, 2), so every card needs to stay
       the same size for the tree to read as one diagram, not five
       differently-scaled ones. */
    .tree-row .color-cell.slot { width: 44px; padding: 7px 5px; flex: 0 0 auto; }
    .tree-row .slot-unknown { width: 26px; height: 26px; font-size: 13px; }
    /* Tape scaled down to match - the journal's full-size tape (26x14,
       poking 7px proud) would swallow a 44px card whole. */
    .tree-row .color-cell.slot:not(.blank)::before,
    .tree-row .color-cell.slot:not(.blank)::after {
      top: -4px; width: 16px; height: 9px;
    }
    .tree-row .color-cell.slot:not(.blank)::before { left: -3px; }
    .tree-row .color-cell.slot:not(.blank)::after { right: -3px; }

    /* ================= HOW TO PLAY PANEL ================= */
    /* Full-screen and paper-toned like the journal/notes panels, but the
       ruled lines and blotches live on #howto-body (the scrolling element,
       background-attachment: local) instead of the static outer panel. The
       journal and notes panels never needed that - their content is a grid
       of cards that doesn't care about pixel-exact line position - but this
       page is prose set to sit on those rules, so the rules have to scroll
       along with the text or the two drift apart past the first screenful.
       #howto-panel itself keeps only the flat paper base color, for
       whatever's visible around/before the scroll container. */
    #howto-panel {
      position: fixed; inset: 0; z-index: 1100;
      background: linear-gradient(#faf1da, #f0dfb8);
      padding: calc(54px + env(safe-area-inset-top, 0px)) 0 env(safe-area-inset-bottom, 0px) 0;
      display: flex; flex-direction: column;
      transform: translateY(105%);
      transition: transform 0.28s ease;
    }
    #howto-panel.open { transform: translateY(0); }
    #howto-panel::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 16px;
      background: linear-gradient(90deg, rgba(90,61,34,0.45), rgba(90,61,34,0));
    }
    #howto-close-btn {
      position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: 16px;
      width: 32px; height: 32px; border-radius: 50%; z-index: 3;
      border: none; background: rgba(0,0,0,0.16); color: #fff; font-size: 18px; cursor: pointer;
    }
    /* Extra margin below (vs. the journal/notes heading's 6px) does the
       breathing room instead of top padding on #howto-body, which has to
       stay at 0 - see that rule below for why. */
    #howto-heading {
      flex: 0 0 auto; font-size: 19px; font-weight: 800; color: #4a3218; margin: 0 0 16px;
      text-align: center; padding: 0 22px 0 30px;
    }
    /* padding-top MUST stay 0: the repeating-gradient's rule pattern starts
       counting from this box's own padding-box origin, and .howto-body p
       below sets every line to the same 28px height as one repeat of that
       pattern - so a 0 top offset is what keeps the very first line in
       phase with the first rule. Any nonzero top padding here would shift
       the text down without shifting the rules, throwing off every line
       after it too. Left/right/bottom padding are free to be whatever looks
       right, since nothing below relies on their exact value. */
    #howto-body {
      flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 0 22px 28px 30px;
      background:
        repeating-linear-gradient(180deg, transparent 0 27px, rgba(120,90,50,0.11) 27px 28px),
        radial-gradient(ellipse 340px 200px at 18% 12%, rgba(150,110,60,0.08), transparent 60%),
        radial-gradient(ellipse 300px 240px at 88% 85%, rgba(150,110,60,0.07), transparent 60%);
      background-attachment: local;
    }
    /* One blank ruled line between paragraphs (28px margin, the same period
       as the rule spacing) rather than a partial gap - that keeps every
       paragraph's total height a whole multiple of 28px, so the phase set
       by #howto-body's zero top padding never drifts no matter how many
       paragraphs come before it. */
    #howto-body p { margin: 0 0 28px; line-height: 28px; font-size: 14px; color: var(--text); }
    #howto-body p:last-child { margin-bottom: 0; }

    /* ================= MODAL ================= */
    #modal-overlay {
      position: fixed; inset: 0; z-index: 1500; background: rgba(30,25,15,0.4);
      display: none; align-items: center; justify-content: center; padding: 20px;
    }
    #modal-overlay.open { display: flex; }
    #modal-card {
      background: var(--panel-bg); border-radius: 22px; padding: 26px 24px; max-width: 360px;
      box-shadow: var(--shadow); text-align: center;
    }
    #modal-title { font-size: 20px; font-weight: 800; margin-bottom: 12px; }
    #modal-body { font-size: 14px; line-height: 1.55; color: var(--text); margin-bottom: 18px; text-align: left; }
    #modal-body p { margin: 0 0 10px; }
    /* Up to seven owned species can be listed, so this scrolls rather than
       pushing the modal's buttons off-screen. */
    .seed-pick-list { display: flex; flex-direction: column; gap: 10px; max-height: 52vh; overflow-y: auto; }

    /* Journal blocks. */
    .inv-meta { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
    .inv-stack-title { font-size: 13.5px; font-weight: 800; margin-top: 12px; }
    /* Two per row on a phone; Sell and Extract sit side by side so the choice
       between them is visible rather than sequential. */
    .inv-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 7px; }
    .inv-btn {
      flex: 1 1 44%; padding: 11px 8px; border-radius: 12px; font-size: 12.5px;
      font-weight: 800; cursor: pointer; box-shadow: var(--shadow-sm); border: none;
    }
    .inv-btn.sell { background: linear-gradient(90deg, var(--amber), #f5c169); color: #fff; }
    .inv-btn.extract { background: #fff; color: var(--green-dark); border: 2px solid var(--green); }

    /* Every color of one species, undiscovered ones dimmed - the collection's
       real goal, so a gap reads as "still to breed". Auto-fill rather than a
       fixed column count so it stays square on any phone width. */
    .color-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr));
      gap: 7px; margin-bottom: 12px;
    }
    .color-cell {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 7px 2px; border-radius: 12px; background: rgba(255,255,255,0.55);
      font-size: 9.5px; font-weight: 700; color: var(--text-dim); text-align: center;
    }
    .color-cell.missing { opacity: 0.26; filter: grayscale(70%); }
    /* .color-cell.slot (the journal page's own spots) is styled in the
       JOURNAL PANEL section below, as a taped-down scrapbook photo rather
       than a plain swatch. */

    /* Bookmarks along the top of the journal - one tab per species, so
       switching flower is one tap from anywhere instead of a trip back out to
       a contents page. The superscript is how many of that species you are
       holding, which is the thing you'd flip through looking for. */
    .journal-tabs { display: flex; gap: 4px; margin-bottom: 12px; }
    .journal-tab {
      position: relative; flex: 1 1 0; min-width: 0; padding: 7px 2px 6px; line-height: 0;
      border: 2px solid transparent; border-radius: 13px 13px 7px 7px;
      background: rgba(255,255,255,0.5); cursor: pointer;
    }
    .journal-tab.active { border-color: var(--green); background: #fff; box-shadow: var(--shadow-sm); }
    .journal-tab.blank { opacity: 0.4; }
    .journal-tab-count {
      position: absolute; top: -4px; right: -3px; min-width: 15px; padding: 0 3px;
      border-radius: 8px; background: var(--green); color: #fff;
      font-size: 9px; font-weight: 800; line-height: 15px; text-align: center;
    }
    .journal-caption { font-size: 11.5px; font-weight: 700; color: var(--text-dim); text-align: center; margin: 0 0 10px; }
    .journal-hint { font-size: 12px; color: var(--text-dim); text-align: center; margin: 0 0 4px; }
    /* The lifetime tally at the foot of every page - one line per stat
       rather than a bullet-run sentence, with each count in the same
       handwritten style as a card's note, as if it were jotted onto the
       page rather than printed. */
    .journal-stats { margin: 4px 0 0; }
    .journal-stats p { font-size: 12px; color: var(--text-dim); text-align: center; margin: 0; }
    .journal-stats .stat-num {
      font-family: 'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive, sans-serif;
      font-size: 14px; font-weight: 700; color: var(--green-dark);
    }
    /* One bordered block per color held, so a Red and a Purple of the same
       species never look like one interchangeable pile. */
    .inv-variant {
      border: 2px solid; border-radius: 14px; padding: 10px 13px 12px; margin-bottom: 10px;
    }
    .inv-variant-name { font-size: 14px; font-weight: 800; }
    .inv-variant .inv-stack-title:first-of-type { margin-top: 8px; }

    /* Crossing notes moved to its own full-screen panel (#notes-panel,
       breeding tree) - .cross-list/.cross-row/etc are gone with the old
       list rendering that used them. */
    .seed-pick-btn {
      display: flex; align-items: center; justify-content: space-between; width: 100%;
      padding: 13px 16px; border: 2px solid; border-radius: 14px; background: #fff;
      font-size: 14.5px; font-weight: 800; cursor: pointer;
    }
    .seed-pick-btn span:last-child { color: var(--text-dim); font-weight: 700; }
    #modal-body p:last-child { margin-bottom: 0; }
    #modal-ok-btn {
      display: block; width: 100%; padding: 14px; border: none; border-radius: 16px;
      font-size: 15px; font-weight: 800; cursor: pointer; color: #fff;
      background: linear-gradient(90deg, var(--green), var(--green-dark)); box-shadow: var(--shadow-sm);
    }

    /* ================= TOAST ================= */
    #toast-container {
      position: fixed; left: 0; right: 0; bottom: 92px; z-index: 1300;
      display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none;
    }
    .toast {
      background: rgba(40,35,25,0.92); color: #fff; font-size: 13px; font-weight: 600;
      padding: 10px 18px; border-radius: 999px; box-shadow: var(--shadow-sm);
      opacity: 0; transform: translateY(8px); transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* ================= ANIMATIONS ================= */
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    @keyframes sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
    .flourish-cluster { animation: sway 3.2s ease-in-out infinite; transform-origin: bottom center; }

    /* Wild flowers wear a soft halo so they read as "found" rather than
       "planted" at a glance, without needing a second marker shape. */
    @keyframes wild-pulse { 0%, 100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 0.9; transform: scale(1.12); } }
    .wild-glow { animation: wild-pulse 2.8s ease-in-out infinite; }

    /* Signature colors only (see COLORS `species`). These are drawn inside the
       flower's own SVG, so the same markup glows in a 26px bookmark and a
       110px map marker with no extra elements around it.

       Both base states are deliberately visible, not transparent: the global
       reduced-motion rule collapses every animation to 0.01ms and does not
       hold the final frame, so anything that starts at opacity 0 would simply
       vanish for those players. */
    @keyframes bloom-halo { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.9; } }
    @keyframes bloom-spark { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    .bloom-halo { opacity: 0.6; animation: bloom-halo 3.4s ease-in-out infinite; }
    .bloom-spark { opacity: 0.8; animation: bloom-spark 2.2s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important; animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="hud-top">
    <div id="title-wrap">
      <span id="game-title">BLOOM &#x1F338;</span>
      <span id="game-version">v1.34.0</span>
    </div>
    <div id="top-right">
      <span id="gps-status" class="pending">LOCATING&hellip;</span>
      <span id="currency-pill" onclick="openShop()" title="Open the Seed Shop">&#x1F338; 0</span>
      <button id="top-menu-btn" onclick="toggleMenu()">&#8942;</button>
    </div>
  </div>

  <div id="menu-dropdown">
    <button onclick="toggleMenu();openShop()">Seed Shop</button>
    <button onclick="openInventory()">Flower Journal</button>
    <button onclick="openCrossNotes()">Crossing Notes</button>
    <button onclick="openWildInfo()">Wild Flowers</button>
    <button onclick="openHowToPlay()">How to Play</button>
    <button class="danger" onclick="onResetSave()">Reset Save</button>
  </div>

  <button id="recenter-btn" onclick="onRecenter()" title="Center on me">&#x1F3AF;</button>

  <!-- Icons are filled in by initToolRail() so the same artwork can be reused
       by the hold ring, the panel hints and the watering animation. Pointer
       handling for the open/drag/equip gesture is wired up in JS, not via
       onclick, since the toolbox has to track the finger while it is still
       down; the three petals each still take a plain click for the tap-then-
       tap path. -->
  <div id="tool-rail">
    <button id="tool-toggle" class="tool-btn toolbox" title="Tools" onclick="onToolboxEquippedClick()"></button>
    <div id="tool-petals">
      <button id="tool-water" class="tool-btn petal water" onclick="selectTool('water')" title="Watering can"></button>
      <button id="tool-shear" class="tool-btn petal shear" onclick="selectTool('shear')" title="Shears - collect"></button>
      <button id="tool-sell" class="tool-btn petal sell" onclick="selectTool('sell')" title="Sell"></button>
      <!-- Only shown once you own a bag - see .tool-btn.fert/#tool-petals.has-fert
           and syncFertTool(). -->
      <button id="tool-fert" class="tool-btn petal fert" onclick="selectTool('fert')" title="Fertilizer - cross with a neighbour"></button>
    </div>
  </div>

  <!-- Mirrors #tool-rail at the top-right corner, but the fan's contents are
       built by JS (renderSeedPetals, in the SEEDS section of the script)
       instead of living here as static buttons - species/color counts are
       both open-ended, so #seed-petals starts empty. -->
  <div id="seed-rail">
    <button id="seed-toggle" class="tool-btn seed-packet" title="Seeds" onclick="onSeedPacketEquippedClick()"></button>
    <div id="seed-petals"></div>
  </div>

  <div id="fx-layer"></div>

  <div id="tutorial-banner">
    <div id="tutorial-text">&nbsp;</div>
    <span id="tutorial-skip-link" onclick="skipTutorial()">Skip tutorial</span>
  </div>

  <div id="hud-bottom">
    <div id="hud-status-line">Finding your location&hellip;</div>
  </div>

  <div id="plant-panel">
    <div class="panel-handle"></div>
    <button id="panel-close-btn" onclick="closePlantPanel()">&times;</button>
    <div id="plant-icon-big"></div>
    <div id="plant-title">&nbsp;</div>
    <div id="plant-meta">&nbsp;</div>
    <div id="growth-bar-track" class="growth-bar-track"><div id="growth-bar-fill" style="width:0%"></div></div>
    <div id="growth-bar-label">&nbsp;</div>
    <div id="plant-status-line">&nbsp;</div>
    <div id="panel-hint">&nbsp;</div>
    <button id="breed-btn">Cross with a neighbour</button>
  </div>

  <div id="shop-panel">
    <button id="shop-close-btn" onclick="closeShop()">&times;</button>
    <button id="cheat-toggle-btn" onclick="toggleCheatMode()">Cheat Mode: Off</button>
    <div id="shop-basket">
      <div id="basket-handle"></div>
      <div id="basket-body">
        <div id="basket-petals">&#x1F338;&#x1F338;&#x1F338;&#x1F338;&#x1F338;</div>
        <div id="basket-tag">&nbsp;</div>
      </div>
    </div>
    <div id="stand-scene">
      <div id="stand-canopy"></div>
      <div id="stand-sign">&nbsp;</div>
      <div id="stand-counter">
        <div id="stand-row-1" class="stand-row stand-row-crates"></div>
        <div id="stand-row-2" class="stand-row stand-row-crates"></div>
        <div id="stand-row-3" class="stand-row stand-row-last"></div>
      </div>
    </div>
  </div>

  <div id="journal-panel">
    <button id="journal-close-btn" onclick="closeJournal()">&times;</button>
    <div id="journal-heading"></div>
    <div id="journal-body"></div>
  </div>

  <div id="notes-panel">
    <button id="notes-close-btn" onclick="closeCrossNotes()">&times;</button>
    <div id="notes-heading">Crossing Notes &#x1F331;</div>
    <div id="notes-body"></div>
  </div>

  <div id="howto-panel">
    <button id="howto-close-btn" onclick="closeHowToPlay()">&times;</button>
    <div id="howto-heading">How to Play</div>
    <div id="howto-body"></div>
  </div>

  <div id="modal-overlay">
    <div id="modal-card">
      <div id="modal-title">Welcome to Bloom</div>
      <div id="modal-body"></div>
      <button id="modal-ok-btn" onclick="closeModal()">Let's grow! &#x1F331;</button>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script>
    // =====================================================================
    //  BLOOM - a chill, walking-based gardening game.
    //  Plant seeds on foot, water them on your next walk, watch them grow.
    //  No score pressure and no failure state at all - flowers cannot die and
    //  are never taken away, so the only thing a long absence changes is how
    //  the garden looks. The whole point is a relaxed excuse to go outside.
    //
    //  Encoding note: every emoji below is written as a JS \u{...} escape
    //  (in script) or an HTML numeric entity &#x...; (in markup) rather than
    //  a raw UTF-8 glyph, so the file itself contains only ASCII bytes.
    // =====================================================================

    // ---------------------------------------------------------------------
    //  CONSTANTS
    // ---------------------------------------------------------------------
    var HOUR = 3600000;

    // Hex grid cell size - same ~20m scale used by the Porter game backbone,
    // a good balance between "walkable in a few minutes" and "not so tiny
    // that GPS jitter causes mis-taps".
    var CELL_LAT_DEG = 20 / 111111;
    var SQ3 = Math.sqrt(3);
    // Longitude degrees-per-meter shrink with latitude (cos(lat) factor), so
    // this is corrected once at first GPS lock and persisted - see onGpsLocked.
    var CELL_LNG_DEG = parseFloat(localStorage.getItem('bloom_cell_lng')) || CELL_LAT_DEG;

    var PLANT_RANGE_HEX = 2;   // how close (in hexes) you must be to plant or water

    // Full water drains to empty over 2 days, at which point the flower starts
    // *looking* wilted. That is the entire consequence: wilting is cosmetic.
    // Plants cannot die and are never removed from the ground, so going away
    // for a fortnight costs you nothing but a droopy-looking garden and one
    // watering visit to perk it back up. A browser page can't send a reminder
    // notification, so any real penalty here would land as an unannounced loss
    // on a player who had no way to know it was coming - exactly the kind of
    // pressure this game is meant not to have.
    var WATER_DURATION_MS = 48 * HOUR;

    // Stages are advanced by WATERING, not by elapsed time. A plant becomes
    // "ready" STAGE_READY_MS after it was planted or last advanced, and the
    // next watering visit is what actually moves it up a stage - so a full
    // cluster costs three separate walks back, which is the entire point of
    // the game. (The old model accumulated growth purely from elapsed time,
    // which meant a plant reached a full cluster with zero watering visits
    // and the watering mechanic had no mechanical weight at all.)
    var STAGE_READY_MS = 12 * HOUR;
    var MAX_STAGE = 3;
    var STAGE_LABELS = ['Seed', 'Sprout', 'In Bloom', 'Flourishing'];

    // Cheat Mode (see the shop panel's toggle): a dev/testing shortcut, not a
    // real difficulty setting, so it gets one flat 15s stage-readiness time
    // instead of anything tunable. stageReadyMs() is the one place growth
    // timing is actually read from - every readyAt assignment and the growth
    // bar's percentage math go through it, so flipping the toggle can never
    // leave one of them still counting against the real 12h constant.
    var CHEAT_STAGE_MS = 15 * 1000;
    function stageReadyMs() { return state.cheatMode ? CHEAT_STAGE_MS : STAGE_READY_MS; }
    // Indexed by the stage just reached; index 0 is unused (you never water
    // your way *into* being a seed).
    var GROWTH_MESSAGES = [
      '',
      'It sprouted! \u{1F331}',
      'It burst into bloom! \u{1F338}',
      'It flourished into a full cluster! \u{1F337}'
    ];

    // Every species is bought by name and every species is worth exactly the
    // same, so which flower you plant is a matter of taste rather than a
    // power decision. (The old common/rare/prized tiers made higher tiers
    // strictly dominant: growth time did not vary by tier, so once you could
    // afford the top one there was no reason to ever plant anything else,
    // and two thirds of the shop became dead content.)
    // Species is SHAPE, color is PAINT, and the two are deliberately
    // orthogonal: `shape` describes the flower's silhouette as rows of petals
    // and COLORS supplies every hex that gets painted into it. That split is
    // what makes cross-breeding possible at all - any color can be worn by any
    // species without a single new asset. Flowers used to be system emoji
    // glyphs on a tinted disc, which meant the "color" of a flower was baked
    // into a font we don't control: unrecolorable, and different on every
    // device. See flowerSVG() for how these rows are drawn.
    //
    // Rows are drawn outermost first. Each row: n petals of half-width rx and
    // half-height ry, centred r units out from the middle of a 100x100 box,
    // optionally rotated by `rot` degrees so a row interleaves with the one
    // outside it. `deep` paints the row a shade darker for depth; `tip` picks
    // the petal outline (round ellipse / pointed almond / notched heart).
    var SPECIES = [
      { key: 'sunflower', name: 'Sunflower', base: 'yellow',
        shape: { rows: [{ n: 16, rx: 6.5, ry: 20, r: 25, tip: 'point' },
                        { n: 16, rx: 5.5, ry: 14, r: 19, rot: 11.25, tip: 'point', deep: true }],
                 center: { r: 15, dots: 8 } } },
      { key: 'tulip', name: 'Tulip', base: 'red',
        shape: { rows: [{ n: 6, rx: 13, ry: 21, r: 19, tip: 'round' }],
                 center: { r: 7 } } },
      { key: 'daisy', name: 'Daisy', base: 'white',
        shape: { rows: [{ n: 16, rx: 4.5, ry: 21, r: 24, tip: 'round' }],
                 center: { r: 12 } } },
      { key: 'hibiscus', name: 'Hibiscus', base: 'red',
        shape: { rows: [{ n: 5, rx: 19, ry: 23, r: 19, tip: 'round' }],
                 center: { r: 6, stamen: true } } },
      { key: 'blossom', name: 'Blossom', base: 'white',
        shape: { rows: [{ n: 5, rx: 15, ry: 19, r: 20, tip: 'notch' }],
                 center: { r: 6, dots: 5 } } },
      { key: 'rose', name: 'Rose', base: 'red',
        shape: { rows: [{ n: 8, rx: 13, ry: 18, r: 22, tip: 'round' },
                        { n: 7, rx: 10, ry: 14, r: 15, rot: 26, tip: 'round', deep: true },
                        { n: 5, rx: 7.5, ry: 10, r: 8, rot: 14, tip: 'round', deep: true }],
                 center: { r: 4 } } },
      { key: 'lotus', name: 'Lotus', base: 'white',
        shape: { rows: [{ n: 8, rx: 8.5, ry: 24, r: 21, tip: 'point' },
                        { n: 8, rx: 7, ry: 17, r: 16, rot: 22.5, tip: 'point', deep: true }],
                 center: { r: 7 } } }
    ];
    function speciesFor(key) {
      for (var i = 0; i < SPECIES.length; i++) if (SPECIES[i].key === key) return SPECIES[i];
      return SPECIES[0];
    }

    // ---- Colors ----------------------------------------------------------
    // One palette shared by every species, so "red" means the same red on a
    // rose and on a lotus and the breeding table stays a single small table
    // rather than one per species.
    //
    // `tier` is breeding depth, not power: every color sells and grows exactly
    // the same, matching the flat economy above. Tier 0 are the STANDARDS -
    // the only colors the shop stocks and the only ones wild flowers come in -
    // and every other color has to be bred. Their six pairings produce the
    // six tier-1 colors, which is the whole entry-level table: four colors,
    // six pairs, six results, nothing to memorise from a wiki.
    //
    // Only `petal` and `center` are authored. Everything else (the darker
    // inner-row shade, the outline, the disc tint behind the flower) is
    // derived in resolveColors() so a new color is two hex values and cannot
    // drift out of step with itself.
    var COLORS = [
      { id: 'white',   name: 'White',   tier: 0, petal: '#fbfbf6', center: '#ffd45e' },
      { id: 'red',     name: 'Red',     tier: 0, petal: '#e03e52', center: '#ffd45e' },
      { id: 'yellow',  name: 'Yellow',  tier: 0, petal: '#ffcb3a', center: '#a06a22' },
      { id: 'blue',    name: 'Blue',    tier: 0, petal: '#4f86e8', center: '#ffe6a0' },
      { id: 'pink',    name: 'Pink',    tier: 1, petal: '#ff8ab4', center: '#ffe08a' },
      { id: 'orange',  name: 'Orange',  tier: 1, petal: '#ff8c3a', center: '#8a4715' },
      { id: 'purple',  name: 'Purple',  tier: 1, petal: '#9a63d8', center: '#ffe08a' },
      { id: 'green',   name: 'Green',   tier: 1, petal: '#5cb45f', center: '#f2f0c0' },
      { id: 'cream',   name: 'Cream',   tier: 1, petal: '#fff2c4', center: '#e0a83c' },
      { id: 'sky',     name: 'Sky',     tier: 1, petal: '#8ecff0', center: '#ffe6a0' },
      { id: 'magenta', name: 'Magenta', tier: 2, petal: '#d4359b', center: '#ffd45e' },
      { id: 'peach',   name: 'Peach',   tier: 2, petal: '#ffb184', center: '#b06a3a' },
      { id: 'black',   name: 'Midnight',tier: 2, petal: '#3b3648', center: '#b98ee8' },
      { id: 'gold',    name: 'Gold',    tier: 3, petal: '#e8a91c', center: '#fff3c2' },

      // ---- Signature colors ----------------------------------------------
      // Two per species, and the ONE place the species/color split is broken
      // on purpose. `species` locks a color to one shape: there is no such
      // thing as an Ember Daisy, and doBreed() enforces that rather than
      // trusting the breeding table to never produce one.
      //

      var out = {};
      Object.keys(seeds).forEach(function (k) {
        var vk = k.indexOf(':') >= 0 ? k : variantKey(k, baseColorOf(k));
        out[vk] = (out[vk] || 0) + (seeds[k] || 0);
      });
      return out;
    }

    // Saves from before the water-gated growth model (v1.4.x and earlier)
    // stored a `growthMs` accumulator instead of an explicit `stage`. Convert
    // once on load: award whatever stage the old thresholds had already earned
    // them, then start the readiness clock from now rather than backdating it,
    // so a returning player's next watering advances one stage instead of
    // silently swallowing all the visits they never had to make.
    var OLD_GROWTH_THRESHOLDS = [0, 8 * HOUR, 20 * HOUR, 40 * HOUR];
    function migratePlant(p, now) {
      // Pre-v1.14 flowers had no color at all (they were emoji, whose colors
      // came from the device's font). They become their species' base color -
      // the same standard the shop sells - so nothing in an existing garden
      // turns into a bred rarity it was never grown for.
      if (!p.color) p.color = baseColorOf(p.species);
      if (typeof p.stage === 'number') return p;
      var g = p.growthMs || 0;
      p.stage = 0;
      for (var i = OLD_GROWTH_THRESHOLDS.length - 1; i >= 0; i--) {
        if (g >= OLD_GROWTH_THRESHOLDS[i]) { p.stage = i; break; }
      }
      p.readyAt = now;
      delete p.growthMs;
      delete p.lastGrowthCheckAt;
      return p;
    }

    // v1.12 recorded a kept flower as a bare { count, firstAt } with no record
    // of whether it was a single bloom or a cluster. Extraction pays out by
    // stage, so those totals are credited to `single` - wild picks are always
    // single blooms and so were most early keeps, and crediting clusters the
    // player may not have earned would hand out seeds they never worked for.
    //
    // v1.15 re-keys the collection from species to species:color. Pre-color
    // keeps become their species' base color - the same standard the shop
    // stocks - so an old collection reads as "found the common one", never as
    // credit for a cross that was never bred. Merging is additive and keeps
    // the earliest firstAt, so nothing is lost if both keys somehow exist.
    function migrateInventory(inv) {
      if (!inv) return {};
      var out = {};
      Object.keys(inv).forEach(function (k) {
        var e = inv[k];
        if (typeof e.count === 'number' && typeof e.single !== 'number') {
          e.single = e.count;
          delete e.count;
        }
        if (typeof e.single !== 'number') e.single = 0;
        if (typeof e.cluster !== 'number') e.cluster = 0;
        if (!e.firstAt) e.firstAt = Date.now();

        var vk = k.indexOf(':') >= 0 ? k : variantKey(k, baseColorOf(k));
        var prev = out[vk];
        if (!prev) { out[vk] = e; return; }
        prev.single += e.single;
        prev.cluster += e.cluster;
        prev.firstAt = Math.min(prev.firstAt, e.firstAt);
      });
      return out;
    }

    function loadState() {
      var def = {
        plants: {},
        wild: {},            // hex key -> wild flower, scattered daily
        lastWildDay: null,   // local YYYY-MM-DD of the last spawn
        // hex key -> 1, every hex ever within planting range of the player.
        // Never shrinks - once a spot has been reachable it stays a priority
        // for wild spawning even if the player never goes back. See
        // markAccessible() and pickWildSpots().
        visited: {},
        // species key -> { single, cluster, firstAt }: the flowers you chose to
        // Keep, split by what they were when picked, since a cluster extracts
        // into more seeds than a single bloom. An entry is never deleted once
        // created - a species you've emptied still reads as discovered, so the
        // collection stays a record of what you've found, not just what's in
        // hand right now.
        inventory: {},
        // Crossings you have actually performed: pair key -> { colorId: count }.
        // This is the player's own notebook, not the recipe table - the Notes
        // screen only ever shows results you have seen yourself.
        crosses: {},
        // No `lost` counter - plants cannot die, so nothing is ever lost.
        // extracted is the lifetime seed count extraction has paid out;
        // extractedFlowers is how many blooms/clusters were pulled apart to
        // get them - the same relationship sold/earned already has.
        stats: { planted: 0, bloomed: 0, flourished: 0, kept: 0, sold: 0, earned: 0,
                 extracted: 0, extractedFlowers: 0, bred: 0 },
        seeds: starterSeeds(),
        fertilizer: 0,
        currency: 0,
        following: true,
        seenWelcome: false,
        tutorialDone: false, // brand-new save -> the onboarding tutorial should run
        cheatMode: false     // dev/testing toggle, see the shop panel - see stageReadyMs/setCheatMode
      };
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return def;
      try {
        var parsed = JSON.parse(raw);
        var plants = parsed.plants || {};
        var migrateNow = Date.now();
        Object.keys(plants).forEach(function (k) { migratePlant(plants[k], migrateNow); });
        // Wild flowers predating colors get a standard color too - picked from
        // the species base rather than at random so the same flower doesn't
        // change color between two page loads.
        var wild = parsed.wild || {};
        Object.keys(wild).forEach(function (k) {
          if (!wild[k].color) wild[k].color = baseColorOf(wild[k].species);
        });
        return {
          plants: plants,
          wild: wild,
          lastWildDay: parsed.lastWildDay || null,
          visited: parsed.visited || {},
          inventory: migrateInventory(parsed.inventory),
          crosses: parsed.crosses || {},
          stats: Object.assign({}, def.stats, parsed.stats || {}),
          // A save that predates seeds/currency (v1.1.x) gets starter seeds
          // bootstrapped in rather than being left unable to plant anything -
          // the old free-plant mechanic this replaces never cost seeds. A
          // v1.2-v1.7 save gets its tier counts converted to species counts.
          seeds: migrateSeeds(parsed.seeds),
          fertilizer: typeof parsed.fertilizer === 'number' ? parsed.fertilizer : 0,
          currency: typeof parsed.currency === 'number' ? parsed.currency : 0,
          following: parsed.following !== false,
          seenWelcome: !!parsed.seenWelcome,
          // Any save that already exists predates the tutorial - never
          // interrupt an already-playing garden with onboarding.
