    // Inline flower for text rows (collection list, shop, seed picker, modal
    // titles) - the same artwork the map uses, so a row and its marker are
    // recognisably the same flower. Replaces the emoji those labels used to
    // carry. Callers must use innerHTML, not textContent.
    function speciesChip(species, colorId, px) {
      px = px || 18;
      return '<span style="display:inline-block;vertical-align:-' + Math.round(px * 0.18) +
        'px;width:' + px + 'px;height:' + px + 'px">' +
        flowerSVG(species, colorFor(colorId || species.base), px) + '</span>';
    }

    // Flower icons are sized relative to the current zoom (a fixed real-world
    // size, not a fixed screen-pixel size) so zooming in genuinely makes them
    // bigger and easier to see instead of staying constant while everything
    // else on the map grows. Leaflet's built-in zoom animation already scales
    // markers up visually mid-gesture, but snaps them back to their built-in
    // iconSize once the gesture settles - rebuilding icons on 'zoomend' (see
    // the map.on binding below) is what makes the bigger size actually stick.
    // Clamped so icons stay legible at minZoom and don't get absurd at maxZoom.
    var PLANT_ICON_REF_ZOOM = 17; // the zoom PLANT_ICON_REF_PX looks "normal" at
    var PLANT_ICON_REF_PX = 44;
    function plantIconBase() {
      var scale = Math.pow(2, map.getZoom() - PLANT_ICON_REF_ZOOM);
      return PLANT_ICON_REF_PX * Math.max(0.5, Math.min(2.5, scale));
    }

    function makePlantIcon(plant) {
      var d = recomputePlant(plant, Date.now());
      var v = buildPlantVisual(speciesFor(plant.species), paletteOf(plant), d.stage, d.wilted, plantIconBase());
      var html = v.html;
      // A corner droplet marks any plant that wants a visit, so the map alone
      // answers "is there anything to do right now?". Green means it is ready
      // to grow a stage and takes priority; blue is the cosmetic wilt nudge.
      // Both are fixed by the same action, so they share one badge shape.
      if (d.ready || d.wilted) {
        var badgeBg = d.ready ? '#4caf6d' : '#4aa3ff';
        html = '<div style="position:relative;width:' + v.w + 'px;height:' + v.h + 'px">' + html +
          '<div style="position:absolute;top:-4px;right:-6px;background:' + badgeBg + ';color:#fff;' +
          'border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center;' +
          'font-size:10px;box-shadow:0 1px 4px rgba(0,0,0,0.35)">\u{1F4A7}</div></div>';
      }
      return L.divIcon({ html: html, iconSize: [v.w, v.h], iconAnchor: [v.w / 2, v.h / 2], className: '' });
    }

    // Same bloom artwork as a planted flower, wrapped in a pulsing halo so a
    // wild one is distinguishable at a glance without inventing a second
    // marker shape. Always drawn at single-bloom stage and never wilted -
    // wild flowers don't grow and can't be neglected.
    function makeWildIcon(w) {
      var d = wildDerived(w, Date.now());
      var v = buildPlantVisual(speciesFor(w.species), paletteOf(w), 2, d.wilted, plantIconBase());
      var pad = Math.max(6, Math.round(v.w * 0.18));
      var box = v.w + pad * 2, boxH = v.h + pad * 2;
      var html = '<div style="position:relative;width:' + box + 'px;height:' + boxH + 'px;' +
        'display:flex;align-items:center;justify-content:center">' +
        '<div class="wild-glow" style="position:absolute;inset:0;border-radius:50%;background:' +
        'radial-gradient(circle,rgba(255,255,255,0.9),rgba(255,236,150,0.5) 52%,rgba(255,236,150,0) 72%)"></div>' +
        '<div style="position:relative">' + v.html + '</div></div>';
      return L.divIcon({ html: html, iconSize: [box, boxH], iconAnchor: [box / 2, boxH / 2], className: '' });
    }

    // ---------------------------------------------------------------------
    //  MAP
    // ---------------------------------------------------------------------
    var map = L.map('map', { zoomControl: false, attributionControl: false, minZoom: 14, maxZoom: 19, zoomSnap: 0.5 });
    // Voyager tiles - colorful parks/water/roads, matching the "pretty and
    // colorful" brief better than a flat greyscale basemap would.
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      subdomains: 'abcd', maxZoom: 20
    }).addTo(map);

    // Pane ladder (bottom -> top): tilePane 200 < gridPane 350 (hex mesh) <
    // overlayPane 400 (range circle, Leaflet default) < markerPane 600 (plants/
    // user, Leaflet default). Much shorter than Porter's ladder since Bloom has
    // no zones or connection lines to layer in between.
    map.createPane('gridPane').style.zIndex = 350;
    var gridRenderer = L.canvas({ pane: 'gridPane', padding: 1.0 });
    gridRenderer.addTo(map);

    map.setView([20, 0], 3);
    // Persist immediately: tickPlants no longer saves (it has nothing to save),
    // so without this a player who drags the map and closes the tab comes back
    // to it snapping to their location again.
    map.on('dragstart', function () { state.following = false; saveState(); });

    // Hex mesh is only drawn once zoomed in this close - below it the hex count
    // in view would grow into the thousands (this is a full-viewport mesh, not
    // a bounded zone like Porter's), so it simply fades away on a wide view
    // rather than costing a redraw budget to render or read.
    var GRID_MIN_ZOOM = 17;
    var GRID_MAX_HEXES = 3000; // safety cap in case the viewport math overshoots

    var _gridRedrawPending = false;
    function scheduleGridRedraw() {
      if (_gridRedrawPending) return;
      _gridRedrawPending = true;
      requestAnimationFrame(function () { _gridRedrawPending = false; renderGridMesh(); });
    }

    // Soft outline mesh over the current viewport so planting spots read at a
    // glance. Every edge is shared by exactly two hexes; only drawing edge
    // indices 0-2 of each hex (see HEX_NEIGHBORS / hexVerticesPx) still covers
    // every edge exactly once, so there's no dedup pass and no doubled lines.
    function renderGridMesh() {
      if (!gridRenderer._ctx || !gridRenderer._bounds) return;
      var ctx = gridRenderer._ctx, b = gridRenderer._bounds, sz = b.getSize();
      ctx.clearRect(b.min.x, b.min.y, sz.x, sz.y);
      if (map.getZoom() < GRID_MIN_ZOOM) return;

      var vb = map.getBounds().pad(0.25);
      var corners = [
        latLngToHex(vb.getSouth(), vb.getWest()), latLngToHex(vb.getNorth(), vb.getEast()),
        latLngToHex(vb.getSouth(), vb.getEast()), latLngToHex(vb.getNorth(), vb.getWest())
      ];
      var minQ = Math.min.apply(null, corners.map(function (c) { return c.q; })) - 1;
      var maxQ = Math.max.apply(null, corners.map(function (c) { return c.q; })) + 1;
      var minR = Math.min.apply(null, corners.map(function (c) { return c.r; })) - 1;
      var maxR = Math.max.apply(null, corners.map(function (c) { return c.r; })) + 1;
      if ((maxQ - minQ) * (maxR - minR) > GRID_MAX_HEXES) return;

      ctx.strokeStyle = 'rgba(70,120,80,0.14)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (var q = minQ; q <= maxQ; q++) {
        for (var r = minR; r <= maxR; r++) {
          var verts = hexVerticesPx(q, r);
          if (!hexOnScreen(verts)) continue;
          for (var e = 0; e < 3; e++) {
            ctx.moveTo(verts[e].x, verts[e].y);
            ctx.lineTo(verts[(e + 1) % 6].x, verts[(e + 1) % 6].y);
          }
        }
      }
      ctx.stroke();
    }
    map.on('moveend zoomend viewreset resize', scheduleGridRedraw);

    var plantMarkers = {};
    function renderPlants() {
      var seen = {};
      Object.keys(state.plants).forEach(function (key) {
        var p = state.plants[key];
        seen[key] = true;
        var icon = makePlantIcon(p);
        if (plantMarkers[key]) plantMarkers[key].setIcon(icon);
        else plantMarkers[key] = L.marker([p.lat, p.lng], { icon: icon, interactive: false, zIndexOffset: 100 }).addTo(map);
      });
      Object.keys(plantMarkers).forEach(function (key) {
        if (!seen[key]) { map.removeLayer(plantMarkers[key]); delete plantMarkers[key]; }
      });
    }
    // Wild flowers sit just under the player's own plants (zIndexOffset 90 vs
    // 100), so on the rare overlap your garden is never hidden by scenery.
    var wildMarkers = {};
    function renderWild() {
      var seen = {};
      Object.keys(state.wild).forEach(function (key) {
        var w = state.wild[key];
        seen[key] = true;
        var icon = makeWildIcon(w);
        if (wildMarkers[key]) wildMarkers[key].setIcon(icon);
        else wildMarkers[key] = L.marker([w.lat, w.lng], { icon: icon, interactive: false, zIndexOffset: 90 }).addTo(map);
      });
      Object.keys(wildMarkers).forEach(function (key) {
        if (!seen[key]) { map.removeLayer(wildMarkers[key]); delete wildMarkers[key]; }
      });
    }

    // Rebuild every icon at the new zoom's size once a zoom gesture settles -
    // see plantIconBase()/makePlantIcon above for why this is what actually
    // makes zooming in grow the flowers instead of them snapping back.
    map.on('zoomend', function () { renderPlants(); renderWild(); });

    // Empty ground within range plants immediately; an occupied hex opens its
    // panel (from any distance - browsing your garden from afar is fine,
    // only *acting* on a plant requires being physically close).
    map.on('click', function (e) {
      var h = latLngToHex(e.latlng.lat, e.latlng.lng);
      var key = hexKey(h.q, h.r);
      if (state.plants[key]) { openPlantPanel(key); return; }
      if (state.wild[key]) { openPlantPanel(key, true); return; }
      if (!state.userPos) { toast('Waiting for GPS to lock on...'); return; }
      var uh = latLngToHex(state.userPos.lat, state.userPos.lng);
      if (hexDist(uh.q, uh.r, h.q, h.r) > PLANT_RANGE_HEX) {
        toast('Walk closer to plant a seed here \u{1F6B6}');
        return;
      }
      attemptPlant(h.q, h.r);
    });

    // ---------------------------------------------------------------------
    //  GPS
    // ---------------------------------------------------------------------
    // No player marker - only the translucent range circle marks the player,
    // so it never sits on top of (and hides) a flower planted right next to
    // them. userHexQ/userHexR is the hex the circle is currently snapped to.
    var rangeCircle = null, viewingKey = null, viewingWild = false;
    var userHexQ = null, userHexR = null;
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (!navigator.geolocation) {
      document.getElementById('gps-status').textContent = 'NO GPS';
      document.getElementById('hud-status-line').textContent = 'Geolocation is not supported on this device.';
    } else {
      navigator.geolocation.watchPosition(onLocationUpdate, onLocationError, {
        enableHighAccuracy: true, maximumAge: 3000, timeout: 15000
      });
    }

    // Eases the range circle from one hex center to the next over ~450ms
    // instead of jumping. Only runs on an actual hex change (see
    // onLocationUpdate), so ordinary GPS jitter within the same hex never
    // moves the circle at all - that's the real fix for the twitchiness,
    // this animation just makes real hex-to-hex steps read as movement
    // rather than a teleport.
    var _circleAnimRAF = null;
    function animateCircleTo(fromLat, fromLng, toLat, toLng) {
      if (_circleAnimRAF) cancelAnimationFrame(_circleAnimRAF);
      if (reduceMotion) { rangeCircle.setLatLng([toLat, toLng]); return; }
      var start = performance.now(), dur = 450;
      function step(now) {
        var t = Math.min(1, (now - start) / dur);
        var e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; // ease-in-out-quad
        rangeCircle.setLatLng([fromLat + (toLat - fromLat) * e, fromLng + (toLng - fromLng) * e]);
        _circleAnimRAF = (t < 1) ? requestAnimationFrame(step) : null;
      }
      _circleAnimRAF = requestAnimationFrame(step);
    }

    function onLocationUpdate(pos) {
      var lat = pos.coords.latitude, lng = pos.coords.longitude;
      state.userPos = { lat: lat, lng: lng };

      // Snap the displayed position to the current hex's center rather than
      // following raw GPS - range checks elsewhere already work in hex
      // distance (hexDist), not raw lat/lng, so this changes nothing about
      // what counts as "in range", only how steady the circle looks.
      var h = latLngToHex(lat, lng);
      var c = hexCenter(h.q, h.r);

      if (!rangeCircle) {
        userHexQ = h.q; userHexR = h.r;
        markAccessible(h.q, h.r);
        rangeCircle = L.circle([c.lat, c.lng], {
          radius: RANGE_METERS, color: '#4caf6d', weight: 1.5,
          fillColor: '#4caf6d', fillOpacity: 0.08, interactive: false
        }).addTo(map);
        map.setView([c.lat, c.lng], 17);
        onGpsLocked();
      } else if (h.q !== userHexQ || h.r !== userHexR) {
        var from = hexCenter(userHexQ, userHexR);
        userHexQ = h.q; userHexR = h.r;
        markAccessible(h.q, h.r);
        animateCircleTo(from.lat, from.lng, c.lat, c.lng);
        if (state.following) map.panTo([c.lat, c.lng], { animate: true, duration: 0.4 });
      }
      if (viewingKey) renderPlantPanel(viewingKey); // range may have just changed
      updateHUD();
    }

    function onLocationError(err) {
      var msgs = { 1: 'Location permission denied.', 2: 'Position unavailable.', 3: 'GPS timed out, retrying...' };
      var badge = document.getElementById('gps-status');
      badge.textContent = 'NO GPS'; badge.className = 'err';
      document.getElementById('hud-status-line').textContent = msgs[err.code] || err.message;
    }

    function onGpsLocked() {
      var badge = document.getElementById('gps-status');
      badge.textContent = 'GPS LOCKED';
      badge.className = 'locked';
      setTimeout(function () { badge.style.display = 'none'; }, 3000);
      // Longitude scale depends on latitude - lock it once so hexes stay
      // visually even-sided near where the player actually is.
      if (!localStorage.getItem('bloom_cell_lng')) {
        CELL_LNG_DEG = CELL_LAT_DEG / Math.cos(state.userPos.lat * Math.PI / 180);
        localStorage.setItem('bloom_cell_lng', CELL_LNG_DEG);
      }
      // The map.setView() a moment ago in onLocationUpdate already fired
      // 'moveend' (and so a grid redraw) before CELL_LNG_DEG was corrected
      // above - redraw once more now so the very first mesh isn't stretched.
      scheduleGridRedraw();
      vibrate(30);
      tickPlants();
      // Needs a real fix before it can ask "what paths are near here?", so it
      // hangs off the lock rather than off init. No-ops if today already ran.
      maybeSpawnWild();
      // Brand-new player: show the welcome modal, then the tutorial starts
      // once they dismiss it (see openWelcome). Returning to a save where the
      // tutorial was started but never finished/skipped (app closed mid-way)
      // skips straight to resuming it, since they've already seen Welcome.
      if (!state.seenWelcome) openWelcome();
      else if (!state.tutorialDone) startTutorial();
    }

    // ---------------------------------------------------------------------
    //  PLANT PANEL
    // ---------------------------------------------------------------------
    function formatAgo(ts) {
      var min = Math.floor((Date.now() - ts) / 60000);
      if (min < 1) return 'just now';
      if (min < 60) return min + (min === 1 ? ' minute ago' : ' minutes ago');
      var hr = Math.floor(min / 60);
      if (hr < 24) return hr + (hr === 1 ? ' hour ago' : ' hours ago');
      var day = Math.floor(hr / 24);
      return day + (day === 1 ? ' day ago' : ' days ago');
    }

    // Forward-looking counterpart to formatAgo, for the ready-to-water wait.
    // Rounds up so a plant never reads "0m" while still counting down.
    function formatDuration(ms) {
      var min = Math.ceil(ms / 60000);
      if (min < 60) return min + 'm';
      var hr = Math.floor(min / 60), rem = min % 60;
      return rem > 0 ? hr + 'h ' + rem + 'm' : hr + 'h';
    }

    function openPlantPanel(key, isWild) {
      closeShop(); closeJournal(); // only one full-screen/bottom-sheet panel open at a time
      viewingKey = key;
      viewingWild = !!isWild;
      renderPlantPanel(key);
      document.getElementById('plant-panel').classList.add('open');
    }
    function closePlantPanel() {
      viewingKey = null;
      viewingWild = false;
      document.getElementById('plant-panel').classList.remove('open');
    }

    // A wild flower reuses the same sheet, minus everything that only applies
    // to something you planted: no growth bar (it never grows) and no water
    // button (it can't be tended). All that's left is picking it.
    function renderWildPanel(key) {
      var w = state.wild[key];
      if (!w) { closePlantPanel(); return; }
      var species = speciesFor(w.species);
      var d = wildDerived(w, Date.now());

      var v = buildPlantVisual(species, paletteOf(w), 2, d.wilted, 88);
      var iconEl = document.getElementById('plant-icon-big');
      iconEl.innerHTML = v.html;
      iconEl.style.width = v.w + 'px';
      iconEl.style.height = v.h + 'px';

      document.getElementById('plant-title').textContent =
        'Wild ' + variantName(variantKey(w.species, w.color || baseColorOf(w.species)));
      document.getElementById('plant-meta').textContent = 'Found growing wild \u{1F33C} ' + formatAgo(w.spawnedAt);

      // The growth bar is reused as a life bar here - a wild flower doesn't
      // grow, it runs down. Amber rather than green so an emptying bar never
      // reads as progress.
      var track = document.getElementById('growth-bar-track');
      var fill = document.getElementById('growth-bar-fill');
      var barLabel = document.getElementById('growth-bar-label');
      track.style.display = '';
      barLabel.style.display = '';
      fill.classList.add('fading');
      fill.style.width = Math.round(d.lifeFrac * 100) + '%';
      barLabel.textContent = 'Fades in ' + formatDuration(d.goneIn);

      var btn = document.getElementById('plant-action-btn');
      btn.style.display = 'none';
      btn.onclick = null;
      // Wild flowers can't be crossed - they aren't yours and never flourish.
      var breedBtn = document.getElementById('breed-btn');
      breedBtn.style.display = 'none';
      breedBtn.onclick = null;

      var uh = state.userPos ? latLngToHex(state.userPos.lat, state.userPos.lng) : null;
      var inRange = uh && hexDist(uh.q, uh.r, w.q, w.r) <= PLANT_RANGE_HEX;

      var statusEl = document.getElementById('plant-status-line');
      if (!inRange) { statusEl.textContent = 'Walk over to pick it'; statusEl.className = 'status-wilt'; }
      else if (d.wilted) { statusEl.textContent = 'Wilting - pick it before it fades'; statusEl.className = 'status-wilt'; }
      else { statusEl.textContent = 'Ready to pick - it\'s yours if you want it'; statusEl.className = 'status-good'; }

      var harvestRow = document.getElementById('harvest-row');
      if (inRange) {
        harvestRow.style.display = 'flex';
        document.getElementById('sell-btn').textContent = 'Sell ' + SELL_SINGLE + ' \u{1F338}';
        document.getElementById('sell-btn').onclick = function () { pickWild(key, true); };
        document.getElementById('keep-btn').onclick = function () { pickWild(key, false); };
      } else {
        harvestRow.style.display = 'none';
      }
    }

    // Wild flowers are free, so picking one is pure upside either way - Keep
    // adds it to your tally, Sell pays the single-bloom rate. Either way the
    // hex clears, which is also what makes room for the next daily spawn.
    function pickWild(key, sell) {
      var w = state.wild[key];
      if (!w) return;
      var vk = variantKey(w.species, w.color || baseColorOf(w.species));
      delete state.wild[key];

      if (sell) {
        state.currency += SELL_SINGLE;
        state.stats.sold++;
        state.stats.earned += SELL_SINGLE;
        toast('Sold a wild ' + variantName(vk) + ' for ' + SELL_SINGLE + ' \u{1F338}');
      } else {
        state.stats.kept++;
        addToInventory(vk, false); // wild blooms are always single-stage
        toast('Picked a wild ' + variantName(vk) + ' \u{1F33C} - it\'s in your collection');
      }

      saveState();
      renderWild();
      updateHUD();
      updateCurrencyPill();
      closePlantPanel();
      vibrate(20);
    }

    function renderPlantPanel(key) {
      if (viewingWild) { renderWildPanel(key); return; }
      var p = state.plants[key];
      if (!p) { closePlantPanel(); return; }
      // Undo whatever the wild variant may have changed last time round.
      document.getElementById('growth-bar-track').style.display = '';
      document.getElementById('growth-bar-label').style.display = '';
      document.getElementById('growth-bar-fill').classList.remove('fading');
      var d = recomputePlant(p, Date.now());
      var species = speciesFor(p.species);

      var v = buildPlantVisual(species, paletteOf(p), d.stage, d.wilted, 88);
      var iconEl = document.getElementById('plant-icon-big');
      iconEl.innerHTML = v.html;
      iconEl.style.width = v.w + 'px';
      iconEl.style.height = v.h + 'px';

      // A bred seedling keeps its color secret until it blooms - the seed and
      // sprout artwork is colorless anyway, so the title is the only thing
      // that would give it away.
      document.getElementById('plant-title').textContent = p.mystery
        ? 'Mystery Seedling - ' + STAGE_LABELS[d.stage]
        : variantName(variantKey(p.species, p.color || baseColorOf(p.species))) +
          ' - ' + STAGE_LABELS[d.stage];
      document.getElementById('plant-meta').textContent = p.mystery
        ? 'A cross, sown ' + formatAgo(p.plantedAt) + ' - water it to see what it is'
        : 'Planted ' + formatAgo(p.plantedAt);

      // The bar fills across the readiness wait, so it reads as "this plant is
      // getting there" rather than "this plant is running out of something".
      var growthPct = d.stage >= MAX_STAGE
        ? 100
        : Math.max(0, Math.min(100, Math.round((1 - d.readyIn / STAGE_READY_MS) * 100)));
      document.getElementById('growth-bar-fill').style.width = growthPct + '%';
      document.getElementById('growth-bar-label').textContent =
        d.stage >= MAX_STAGE ? 'Fully grown' :
        d.ready ? 'Ready to grow now!' :
        'Ready to grow in ' + formatDuration(d.readyIn);

      // Status line says how the plant is doing; the bar above says when it
      // next needs you. Readiness leads because it is the only state a visit
      // converts into progress - wilt is cosmetic, so it ranks below it.
      var statusEl = document.getElementById('plant-status-line');
      if (d.ready) { statusEl.textContent = 'Ready to grow - give it a drink!'; statusEl.className = 'status-good'; }
      else if (d.wilted) { statusEl.textContent = 'Looking wilted - a drink will perk it back up'; statusEl.className = 'status-wilt'; }
      else if (d.stage >= MAX_STAGE) { statusEl.textContent = 'Fully grown - Keep it or Sell it'; statusEl.className = 'status-good'; }
      else { statusEl.textContent = 'Thriving'; statusEl.className = 'status-good'; }

      var uh = state.userPos ? latLngToHex(state.userPos.lat, state.userPos.lng) : null;
      var inRange = uh && hexDist(uh.q, uh.r, p.q, p.r) <= PLANT_RANGE_HEX;
      // Watering is only offered when it would actually do something: advance
      // a stage, or clear a cosmetic wilt. A plant that is mid-wait has no
      // action to take, so the button is hidden rather than shown as a tap
      // that quietly achieves nothing.
      var btn = document.getElementById('plant-action-btn');
      if (!d.ready && !d.wilted) {
        btn.style.display = 'none';
        btn.onclick = null;
      } else {
        btn.style.display = '';
        if (inRange) {
          btn.disabled = false;
          btn.textContent = d.ready ? 'Water + Grow \u{1F4A7}' : 'Water \u{1F4A7}';
          btn.onclick = function () { waterPlant(key); };
        } else {
          btn.disabled = true;
          btn.textContent = 'Walk closer to water';
          btn.onclick = null;
        }
      }

      // Harvesting (Keep or Sell) only shows up once a plant has something to
      // harvest - single bloom or flourishing cluster - and only when close
      // enough to act on it, same proximity rule as watering.
      var harvestRow = document.getElementById('harvest-row');
      if (d.stage >= 2 && inRange) {
        harvestRow.style.display = 'flex';
        document.getElementById('sell-btn').textContent = 'Sell ' + harvestValue(p, d.stage) + ' \u{1F338}';
        document.getElementById('sell-btn').onclick = function () { onHarvestClick(key, true); };
        document.getElementById('keep-btn').onclick = function () { onHarvestClick(key, false); };
      } else {
        harvestRow.style.display = 'none';
      }

      renderBreedButton(key, p, d, inRange);
    }

    // The Cross button only appears when a cross is actually possible, and
    // otherwise says which part is missing rather than sitting there greyed
    // out with no explanation. A flourishing plant with no flourishing
    // neighbour shows nothing at all - there is no cross to hint at.
    function renderBreedButton(key, p, d, inRange) {
      var btn = document.getElementById('breed-btn');
      btn.onclick = null;

      var waiting = breedWaitMs(p);
      var partners = (d.stage >= MAX_STAGE && !waiting) ? breedPartnersFor(key) : [];
      var neighborWaiting = false;
      if (d.stage >= MAX_STAGE && !waiting && !partners.length) {
        neighborWaiting = neighborsOf(p.q, p.r).some(function (h) {
          var o = state.plants[hexKey(h.q, h.r)];
          return o && recomputePlant(o, Date.now()).stage >= MAX_STAGE;
        });
      }

      if (d.stage < MAX_STAGE || (!partners.length && !waiting && !neighborWaiting)) {
        btn.style.display = 'none';
        return;
      }
      btn.style.display = '';

      if (waiting) {
        btn.disabled = true;
        btn.textContent = 'Can cross again in ' + formatDuration(waiting);
      } else if (neighborWaiting) {
        btn.disabled = true;
        btn.textContent = 'Neighbour is still resting';
      } else if (!inRange) {
        btn.disabled = true;
        btn.textContent = 'Walk closer to cross';
      } else if (state.fertilizer <= 0) {
        btn.disabled = true;
        btn.textContent = 'Needs fertilizer - buy a bag';
      } else {
        btn.disabled = false;
        btn.textContent = 'Cross with a neighbour \u{1F331}';
        btn.onclick = function () { openBreedPicker(key); };
      }
    }

    // Thin wrapper so the tutorial (see TUTORIAL section) can observe a real
    // harvest without renderPlantPanel needing to know it exists.
    function onHarvestClick(key, sell) {
      var value = harvestPlant(key, sell);
      tutorialOnHarvest(key, sell, value);
    }

    // ---------------------------------------------------------------------
    //  BREEDING
    // ---------------------------------------------------------------------
    function neighborsOf(q, r) {
      return HEX_NEIGHBORS.map(function (d) { return { q: q + d[0], r: r + d[1] }; });
    }
    // Free means nothing of yours and no wild flower - a bred seedling must
    // never overwrite something already growing there.
    function hexFree(q, r) {
      var k = hexKey(q, r);
      return !state.plants[k] && !state.wild[k];
    }
    function colorOfPlant(p) { return p.color || baseColorOf(p.species); }

    // A parent must be fully grown and off its cooldown. Both halves matter:
    // flourishing is what makes breeding the end of the watering loop rather
    // than a way around it.
    function breedReady(p) {
      return recomputePlant(p, Date.now()).stage >= MAX_STAGE &&
             Date.now() >= (p.breedReadyAt || 0);
    }
    function breedWaitMs(p) { return Math.max(0, (p.breedReadyAt || 0) - Date.now()); }

    // Adjacent plants of yours that could cross with this one right now.
    function breedPartnersFor(key) {
      var p = state.plants[key];
      if (!p || !breedReady(p)) return [];
      return neighborsOf(p.q, p.r).map(function (h) { return hexKey(h.q, h.r); })
        .filter(function (k) {
          var o = state.plants[k];
          return o && breedReady(o);
        });
    }

    // "Between them" where possible: two adjacent hexes share exactly two
    // neighbours, so a seedling lands in the gap the parents make. Only if
    // both of those are taken does it fall back to any free neighbour of
    // either parent.
    function breedSpotFor(a, b) {
      var shared = neighborsOf(a.q, a.r).filter(function (h) {
        return hexDist(h.q, h.r, b.q, b.r) === 1 && hexFree(h.q, h.r);
      });
      var pool = shared;
      if (!pool.length) {
        var seen = {};
        pool = neighborsOf(a.q, a.r).concat(neighborsOf(b.q, b.r)).filter(function (h) {
          var k = hexKey(h.q, h.r);
          if (seen[k] || !hexFree(h.q, h.r)) return false;
          seen[k] = 1;
          return true;
        });
      }
      if (!pool.length) return null;
      return pool[Math.floor(Math.random() * pool.length)];
    }

    // Records that this pairing produced this color, so the Crossing Notes
    // screen can show what you have actually seen rather than the whole table.
    function recordCross(ca, cb, result) {
      var k = crossKey(ca, cb);
      if (!state.crosses[k]) state.crosses[k] = {};
      state.crosses[k][result] = (state.crosses[k][result] || 0) + 1;
    }

    function doBreed(keyA, keyB) {
      var a = state.plants[keyA], b = state.plants[keyB];
      if (!a || !b) { closePlantPanel(); return; }
      if (!breedReady(a) || !breedReady(b)) { toast('Those two are not both ready.'); return; }
      if (state.fertilizer <= 0) {
        toast('You are out of fertilizer - buy a bag in the Shop \u{1F338}');
        return;
      }
      var spot = breedSpotFor(a, b);
      if (!spot) { toast('No free ground next to them for a seedling.'); return; }

      state.fertilizer--;
      var now = Date.now();
      a.breedReadyAt = now + BREED_COOLDOWN_MS;
      b.breedReadyAt = now + BREED_COOLDOWN_MS;

      var ca = colorOfPlant(a), cb = colorOfPlant(b);
      // Signature recipes need both parents on the same shape; everything else
      // ignores species entirely.
      var color = crossColor(ca, cb, a.species === b.species ? a.species : null);
      // Either parent's shape, so a color you have bred can be walked onto a
      // different species instead of being stuck on the one it appeared in.
      var species = Math.random() < 0.5 ? a.species : b.species;
      // ...except a signature color, which has exactly one shape it can wear.
      // Crossing an Ember Tulip with a Red Daisy can fall through to Ember on
      // the coin flip, and the species roll could then pick Daisy - so the
      // lock is enforced where the plant is created rather than trusted to
      // every table entry. There is no such thing as an Ember Daisy.
      var lock = exclusiveSpeciesOf(color);
      if (lock) species = lock;
      recordCross(ca, cb, color);

      var c = hexCenter(spot.q, spot.r);
      var key = hexKey(spot.q, spot.r);
      state.plants[key] = {
        q: spot.q, r: spot.r, lat: c.lat, lng: c.lng, species: species, color: color,
        plantedAt: now, lastWateredAt: now, stage: 0, readyAt: now + STAGE_READY_MS,
        reachedBloom: false, reachedFlourish: false,
        // The color is decided now but stays hidden until it blooms. Seed and
        // sprout artwork is colorless anyway, so nothing leaks - and the
        // reveal is the payoff the whole feature is built around. Nothing is
        // at stake while it is hidden: the outcome is already recorded.
        mystery: true
      };
      state.stats.planted++;
      state.stats.bred++;

      saveState();
      renderPlants();
      updateHUD();
      closePlantPanel();
      toast('\u{1F331} A seedling came up between them! Water it to see what it is.');
      vibrate(30);
    }

    // Confirms the cross, and always names the fertilizer cost and the
    // cooldown before it is spent - a timed cost the player only discovers
    // afterwards is exactly the kind of surprise this game avoids.
    function openBreedConfirm(keyA, keyB) {
      var a = state.plants[keyA], b = state.plants[keyB];
      if (!a || !b) return;
      var ca = colorOfPlant(a), cb = colorOfPlant(b);
      var vkA = variantKey(a.species, ca), vkB = variantKey(b.species, cb);

      resetModalChrome();
      document.getElementById('modal-title').textContent = 'Cross these two?';

      var html = '<div class="breed-pair">' +
        '<div class="breed-parent">' + variantChip(vkA, 34) + '<span>' + variantName(vkA) + '</span></div>' +
        '<div class="breed-plus">+</div>' +
        '<div class="breed-parent">' + variantChip(vkB, 34) + '<span>' + variantName(vkB) + '</span></div>' +
        '</div>';

      // Show what this pairing has produced before, if anything - the notes
      // you have earned, never the underlying table.
      var known = state.crosses[crossKey(ca, cb)];
      if (known) {
        var seen = Object.keys(known).sort(function (x, y) { return known[y] - known[x]; });
        html += '<p>You have crossed these before and got ' +
          seen.map(function (id) {
            return '<b>' + colorFor(id).name + '</b>' +
              (known[id] > 1 ? ' (x' + known[id] + ')' : '');
          }).join(', ') + '.</p>';
      } else {
        html += '<p>You have not tried this pairing before.</p>';
      }

      html += '<p style="color:var(--text-dim)">Costs <b>1 bag of fertilizer</b> (you have ' +
        state.fertilizer + '). A seedling comes up on free ground next to them, and its color ' +
        'stays a mystery until it blooms. Both parents then need <b>' +
        formatDuration(BREED_COOLDOWN_MS) + '</b> before they can be crossed again.</p>';

      document.getElementById('modal-body').innerHTML = html;
      var ok = document.getElementById('modal-ok-btn');
      ok.textContent = 'Cross them \u{1F331}';
      ok.onclick = function () { closeModal(); doBreed(keyA, keyB); };
      document.getElementById('modal-overlay').classList.add('open');
    }

    // With one partner this goes straight to the confirm; with several it asks
    // which, because which neighbour you cross with is the entire decision.
    function openBreedPicker(key) {
      var partners = breedPartnersFor(key);
      if (!partners.length) return;
      if (partners.length === 1) { openBreedConfirm(key, partners[0]); return; }

      resetModalChrome();
      document.getElementById('modal-title').textContent = 'Cross with which one?';
      document.getElementById('modal-body').innerHTML = '<div class="seed-pick-list">' +
        partners.map(function (pk) {
          var o = state.plants[pk];
          var vk = variantKey(o.species, colorOfPlant(o));
          var c = colorFor(colorOfPlant(o));
          return '<button class="seed-pick-btn" style="border-color:' + c.line +
            '" onclick="openBreedConfirm(\'' + key + '\',\'' + pk + '\')">' +
            '<span style="color:' + c.ink + '">' + variantChip(vk) + ' ' + variantName(vk) +
            '</span></button>';
        }).join('') + '</div>';
      document.getElementById('modal-ok-btn').style.display = 'none';
      document.getElementById('modal-overlay').classList.add('open');
    }

    // ---------------------------------------------------------------------
    //  HUD / MENU / MODAL / TOAST
    // ---------------------------------------------------------------------
    function updateHUD() {
      var keys = Object.keys(state.plants);
      var total = keys.length;
      var wilted = keys.filter(function (k) {
        var d = state.plants[k]._d;
        return d && d.wilted;
      }).length;
      // state.stats.bloomed is a lifetime "ever reached bloom" counter (it
      // never decrements, even after that plant is harvested) - that's right
      // for the How to Play footer, but wrong here: "N in bloom" needs to
      // count what's actually blooming right now, so a harvested flower
      // stops being counted immediately instead of lingering forever.
      var blooming = keys.filter(function (k) {
        var d = state.plants[k]._d;
        return d && d.stage >= 2;
      }).length;

      // Ready-to-grow outranks merely wilted: it is the one line that sends
      // the player out the door, and it is the only status that a watering
      // visit converts into actual progress.
      var ready = keys.filter(function (k) {
        var d = state.plants[k]._d;
        return d && d.ready;
      }).length;

      // Wild flowers are a standing "there's something out there to find", so
      // they get a tail on every line rather than competing for the whole one.
      var wildCount = Object.keys(state.wild).length;
      var wildTail = wildCount > 0
        ? ' &bull; \u{1F33C} ' + wildCount + ' wild to find'
        : '';

      var line;
      if (total === 0) {
        line = 'Tap the map near you to plant your first seed \u{1F331}' + wildTail;
        document.getElementById('hud-status-line').innerHTML = line;
        return;
      }
      if (ready > 0) {
        line = '\u{1F4A7} ' + ready + (ready === 1 ? ' flower is' : ' flowers are') +
          ' ready to grow &bull; go water ' + (ready === 1 ? 'it' : 'them') + '!';
      } else if (wilted > 0) {
        line = wilted + (wilted === 1 ? ' flower is' : ' flowers are') + ' looking wilted \u{1F4A7} &bull; ' +
          blooming + ' in bloom';
      } else {
        // No "all watered" tail here any more - watering stopped being upkeep
        // when it became the thing that grows a plant, so there is nothing to
        // reassure the player about, and the line needs room for wildTail.
        line = '\u{1F338} ' + total + ' growing &bull; ' + blooming + ' in bloom';
      }
      document.getElementById('hud-status-line').innerHTML = line + wildTail;
    }

    function toggleMenu() { document.getElementById('menu-dropdown').classList.toggle('open'); }
    document.addEventListener('click', function (e) {
      var menu = document.getElementById('menu-dropdown'), btn = document.getElementById('top-menu-btn');
      if (menu.classList.contains('open') && !menu.contains(e.target) && e.target !== btn) menu.classList.remove('open');
    });

    function onRecenter() {
      state.following = true;
      saveState();
      // Pan to the snapped hex center (where the range circle actually is),
      // not raw GPS - otherwise recenter can land slightly off from the
      // visible circle.
      if (userHexQ !== null) {
        var c = hexCenter(userHexQ, userHexR);
        map.panTo([c.lat, c.lng], { animate: true });
      }
    }

    // Wipes the whole save (garden, seeds, Petals, stats, and the welcome/
    // tutorial flags) and reloads, rather than resetting each state field by
    // hand - that way a full reset can never drift out of sync as new state
    // fields get added later (it always matches whatever loadState()'s
    // defaults are, since a reload with no saved key runs the exact same
    // brand-new-player path, tutorial included).
    function onResetSave() {
      toggleMenu();
      if (!confirm('Erase your save completely - garden, seeds, Petals, and all progress? This cannot be undone.')) return;
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    }

    function openWelcome() {
      resetModalChrome();
      document.getElementById('modal-title').textContent = 'Welcome to Bloom';
      document.getElementById('modal-body').innerHTML =
        '<p>Bloom gives you a gentle reason to get out and walk. Plant one of your starter seeds in the ' +
        'ground near you, then swing back by to water it.</p>' +
        '<p>Watering is what makes it grow. About every 12 hours a plant is ready for a drink, and each ' +
        'visit moves it up a stage - seed to sprout to bloom to a full flourishing cluster. Three walks ' +
        'back, three stages.</p>' +
        '<p>Harvest it to keep for yourself or sell to the shop for Petals \u{1F338} - spend those on more ' +
        'seeds. Every flower costs and sells for the same, so plant whichever ones you like the look of.</p>' +
        '<p>Nothing here can be lost. Go a couple of days without watering and a flower just looks a bit ' +
        'wilted until your next visit - it never dies, and it never stops being ready to grow. No score, ' +
        'no clock, no rush.</p>';
      document.getElementById('modal-ok-btn').textContent = "Let's grow! \u{1F331}";
      document.getElementById('modal-ok-btn').onclick = function () {
        state.seenWelcome = true; saveState(); closeModal();
        if (!state.tutorialDone) startTutorial();
      };
      document.getElementById('modal-overlay').classList.add('open');
    }

    function openHowToPlay() {
      toggleMenu();
      resetModalChrome();
      document.getElementById('modal-title').textContent = 'How to Play';
      var s = state.stats;
      document.getElementById('modal-body').innerHTML =
        '<p><b>Plant</b> - tap the ground within a couple hexes of you, then confirm which seed to plant ' +
        '- a quick safety check so a stray tap never spends one by accident.</p>' +
        '<p><b>Water</b> - tap a growing flower, then walk close enough for the Water button to light up.</p>' +
        '<p><b>Grow</b> - watering is what grows a plant, not just time. Every 12 hours or so it becomes ' +
        'ready, and your next watering visit moves it up a stage: seed, sprout, single bloom, full ' +
        'flourishing cluster. A green \u{1F4A7} on the map means one is ready right now. Watering early is ' +
        'never wasted - it still tops up the tank and holds off wilting.</p>' +
        '<p><b>Harvest</b> - once a flower is in bloom or flourishing, walk up to it and Keep it or Sell ' +
        'it for Petals \u{1F338} - clusters sell for much more than a single bloom. Kept flowers go into ' +
        'your Flower Journal in the menu, which has a page per species and tracks all ' + TOTAL_VARIANTS +
        ' flowers.</p>' +
        '<p><b>Color</b> - every flower has a species (its shape) and a color, and almost any color can ' +
        'turn up on any species. Four are standard - White, Red, Yellow and Blue - and those are the ' +
        'only ones the shop sells or wild flowers grow in. The rest have to be bred.</p>' +
        '<p><b>Signature colors</b> - past all of those, each species has <b>two colors of its own</b> ' +
        'that no other flower can wear. They shimmer and glow, and the only way to reach one is to ' +
        'cross two flowers <b>of the same species</b> deep in the Gold line.</p>' +
        '<p><b>Crossing</b> \u{1F331} - grow two flowers to flourishing on hexes next to each other, buy a ' +
        'bag of fertilizer, and tap <b>Cross with a neighbour</b>. A seedling comes up in the gap between ' +
        'them, and its color stays a mystery until you water it into bloom. Crossing two of the four ' +
        'standards always gives the same result - six pairs, six new colors - and those in turn cross ' +
        'into the rarer ones. Both parents rest for ' + formatDuration(BREED_COOLDOWN_MS) +
        ' afterwards, and they stay right where they are. Your Crossing Notes in the menu remember every ' +
        'pairing you\'ve tried.</p>' +
        '<p><b>Shop</b> - tap your Petals total (top right) to buy seeds, one swatch per standard color, ' +
        'and fertilizer. Every seed costs the same and every flower sells for the same, so pick by looks, ' +
        'not by value.</p>' +
        '<p><b>Wild flowers</b> \u{1F33C} - each day you open Bloom, up to ten wild blooms are scattered ' +
        'around you, marked with a soft glow. They cost nothing - just walk over and pick one. Unlike your ' +
        'own flowers they don\'t last: a wild bloom wilts after 12 hours and is gone 6 hours later, so ' +
        'they\'re worth going out for today.</p>' +
        '<p><b>No pressure</b> - after a couple of days without water a flower starts to look wilted, and ' +
        'that\'s all it is: a look. Flowers never die, never get removed, and keep becoming ready to grow ' +
        'no matter how long you\'ve been away. One drink perks a wilted one right back up.</p>' +
        '<p style="color:var(--text-dim);margin-top:14px">So far: ' + s.planted + ' planted &bull; ' +
        s.bloomed + ' bloomed &bull; ' + s.flourished + ' flourished &bull; ' + s.sold + ' sold for ' +
        s.earned + ' Petals &bull; ' + s.kept + ' kept</p>';
      document.getElementById('modal-ok-btn').textContent = 'Got it';
      document.getElementById('modal-ok-btn').onclick = closeModal;
      document.getElementById('modal-overlay').classList.add('open');
    }

    function heldOf(vk, isCluster) {
      var e = state.inventory[vk];
      if (!e) return 0;
      return (isCluster ? e.cluster : e.single) || 0;
    }
    function heldTotalOf(vk) { return heldOf(vk, false) + heldOf(vk, true); }
    // Every variant of one species that has ever been kept, rarest last.
    function discoveredColorsOf(speciesKey) {
      return sortVariants(Object.keys(state.inventory).filter(function (vk) {
        return parseVariant(vk).species === speciesKey;
      }));
    }
    function heldOfSpecies(speciesKey) {
      return discoveredColorsOf(speciesKey).reduce(function (n, vk) {
        return n + heldTotalOf(vk);
      }, 0);
    }
    // Not SPECIES * COLORS any more: a signature color counts once, on the one
    // species that can wear it.
    var TOTAL_VARIANTS = SPECIES.reduce(function (n, s) {
      return n + colorsForSpecies(s.key).length;
    }, 0);

    // Sell held flowers straight from the collection at the same rate as
    // harvesting them in the field would have paid.
    function sellHeld(vk, isCluster, qty) {
      var e = state.inventory[vk];
      if (!e) return;
      qty = Math.min(qty, heldOf(vk, isCluster));
      if (qty <= 0) return;

      var total = (isCluster ? SELL_CLUSTER : SELL_SINGLE) * qty;
      if (isCluster) e.cluster -= qty; else e.single -= qty;
      state.currency += total;
      state.stats.sold += qty;
      state.stats.earned += total;

      saveState();
      updateCurrencyPill();
      toast('Sold ' + qty + ' ' + variantName(vk) +
        (isCluster ? ' cluster' : ' bloom') + (qty === 1 ? '' : 's') + ' for ' + total + ' \u{1F338}');
      vibrate(20);
      renderJournalPage(parseVariant(vk).species);
    }

    // Pull held flowers apart for seeds of that same species. Rolled per
    // flower rather than once for the batch, so extracting five at once has
    // the same spread as extracting one five times.
    function extractHeld(vk, isCluster, qty) {
      var e = state.inventory[vk];
      if (!e) return;
      qty = Math.min(qty, heldOf(vk, isCluster));
      if (qty <= 0) return;

      var gained = 0;
      for (var i = 0; i < qty; i++) {
        gained += rollWeighted(isCluster ? SEED_YIELD_CLUSTER : SEED_YIELD_SINGLE);
      }
      if (isCluster) e.cluster -= qty; else e.single -= qty;
      // Extraction returns the exact variant it consumed, color included. That
      // is what makes a bred color self-sustaining once you have one, and why
      // the shop (standards only) still matters for anything you lack.
      state.seeds[vk] = (state.seeds[vk] || 0) + gained;
      state.stats.extracted += gained;

      saveState();
      toast('\u{1F331} Got ' + gained + ' ' + variantName(vk) + ' seed' +
        (gained === 1 ? '' : 's') + ' from ' + qty + ' ' + (isCluster ? 'cluster' : 'bloom') +
        (qty === 1 ? '' : 's'));
      vibrate(25);
      renderJournalPage(parseVariant(vk).species);
    }

    // Which colors have ever been kept, on any species at all. A color you
    // found as a Tulip is a color you know, so its name shows on every
    // species' page - only the spot itself stays empty.
    function discoveredColorSet() {
      var found = {};
      Object.keys(state.inventory).forEach(function (vk) {
        found[parseVariant(vk).color] = true;
      });
      return found;
    }
    // The variants of one species you are actually holding right now, as
    // opposed to discoveredColorsOf(), which is everything ever kept.
    function heldVariantsOf(speciesKey) {
      return discoveredColorsOf(speciesKey).filter(function (vk) {
        return heldTotalOf(vk) > 0;
      });
    }

    // Every flower you've chosen to Keep, kept as a journal: one page per
    // species, with a spot for each of the fourteen colors and a row of
    // bookmarks along the top to switch between them. All seven bookmarks and
    // all fourteen spots are always drawn, so a gap reads as "still to breed"
    // rather than as a list that happens to be short.
    //
    // There was a contents page in front of this. It was removed because it
    // had one job - pick a species - and the bookmarks do that from anywhere,
    // so it had become a screen you tapped through on the way to the journal.
    var journalSpecies = null;  // which page is open
    var journalPick = null;     // which spot on it is selected, if any

    // Opening the journal cold lands on a page with something on it rather
    // than always on Sunflower, which may well be blank.
    function defaultJournalSpecies() {
      for (var i = 0; i < SPECIES.length; i++) {
        if (heldOfSpecies(SPECIES[i].key) > 0) return SPECIES[i].key;
      }
      for (var j = 0; j < SPECIES.length; j++) {
        if (discoveredColorsOf(SPECIES[j].key).length) return SPECIES[j].key;
      }
      return SPECIES[0].key;
    }

    function openInventory() {
      toggleMenu();
      closeShop(); closePlantPanel(); // only one full-screen/bottom-sheet panel open at a time
      // journalSpecies persists for the session, so re-opening the journal
      // returns to the page you were last reading.
      openJournalPage(journalSpecies || defaultJournalSpecies());
      document.getElementById('journal-panel').classList.add('open');
    }
    function closeJournal() { document.getElementById('journal-panel').classList.remove('open'); }

    // The bookmark strip: the species' flower, in the rarest color of it you
    // own, with a superscript count of how many you're holding.
    function journalTabsHtml(activeKey) {
      return '<div class="journal-tabs">' + SPECIES.map(function (s) {
        var found = discoveredColorsOf(s.key);
        var held = heldOfSpecies(s.key);
        var color = found.length ? parseVariant(found[found.length - 1]).color : s.base;
        return '<button class="journal-tab' + (s.key === activeKey ? ' active' : '') +
          (found.length ? '' : ' blank') + '" title="' + s.name +
          '" onclick="openJournalPage(\'' + s.key + '\')">' +
          (held > 0 ? '<span class="journal-tab-count">' + held + '</span>' : '') +
          speciesChip(s, color, 26) + '</button>';
      }).join('') + '</div>';
    }

    // One stack (blooms or clusters) and its actions. Offers "1" and "all N"
    // rather than a quantity stepper - it covers "one or more" without adding
    // a fiddly control to a bottom-sheet-sized modal.
    function inventoryStackHtml(vk, isCluster) {
      var n = heldOf(vk, isCluster);
      if (n <= 0) return '';
      var label = isCluster ? 'Cluster' : 'Bloom';
      var each = isCluster ? SELL_CLUSTER : SELL_SINGLE;
      var yieldText = isCluster ? '2-4 seeds' : '1-2 seeds';
      var args = '\'' + vk + '\',' + (isCluster ? 'true' : 'false') + ',';

      var html = '<div class="inv-stack-title">' + label + 's &times; ' + n +
        ' <span style="font-weight:600;color:var(--text-dim)">(' + each + ' \u{1F338} or ' +
        yieldText + ' each)</span></div><div class="inv-actions">';
      html += '<button class="inv-btn sell" onclick="sellHeld(' + args + '1)">Sell 1 &bull; ' +
        each + ' \u{1F338}</button>';
      html += '<button class="inv-btn extract" onclick="extractHeld(' + args + '1)">Extract 1</button>';
      if (n > 1) {
        html += '<button class="inv-btn sell" onclick="sellHeld(' + args + n + ')">Sell all ' + n +
          ' &bull; ' + (each * n) + ' \u{1F338}</button>';
        html += '<button class="inv-btn extract" onclick="extractHeld(' + args + n + ')">Extract all ' +
          n + '</button>';
      }
      return html + '</div>';
    }

    // Opening a page picks the spot for you when there is only one thing on
    // it to act on - with a single color held, making you tap it first would
    // be a step with no decision in it.
    function openJournalPage(speciesKey) {
      var held = heldVariantsOf(speciesKey);
      journalPick = held.length === 1 ? held[0] : null;
      renderJournalPage(speciesKey);
    }
    function pickJournalSpot(vk) {
      // Tapping the open spot again closes it, so the page can go back to
      // being just the album.
      journalPick = (journalPick === vk) ? null : vk;
      renderJournalPage(parseVariant(vk).species);
    }

    function renderJournalPage(speciesKey) {
      var s = speciesFor(speciesKey);
      journalSpecies = speciesKey;

      var found = discoveredColorsOf(speciesKey);
      // Title and bookmark show the same flower in the same color - the
      // rarest of this species you own - so they don't read as two things.
      var headColor = found.length ? parseVariant(found[found.length - 1]).color : s.base;
      // innerHTML, not textContent - the chip is inline SVG markup.
      document.getElementById('journal-heading').innerHTML =
        speciesChip(s, headColor, 22) + ' ' + s.name;

      var known = discoveredColorSet();

      // Resolved before the grid is drawn: selling the last of a color has to
      // drop the selection with it, or the page keeps highlighting a spot that
      // is now empty and has no actions left under it.
      if (journalPick && (parseVariant(journalPick).species !== speciesKey ||
          heldTotalOf(journalPick) <= 0)) {
        journalPick = null;
      }

      // The shared palette plus this species' two signatures - a page never
      // shows a spot that species could not possibly fill.
      var palette = colorsForSpecies(speciesKey);
      var html = journalTabsHtml(speciesKey) +
        '<p class="journal-caption"><b>' + found.length + ' of ' + palette.length + '</b> ' +
        s.name + ' colors &bull; <b>' + Object.keys(state.inventory).length + ' of ' +
        TOTAL_VARIANTS + '</b> flowers found</p>';

      // A spot for every color, always. An empty spot is the point of the
      // page: it is what you have left to breed. The badge is the count you
      // are holding right now, which is a different thing from having found
      // it - a color you found and then sold keeps its spot filled in.
      html += '<div class="color-grid scrapbook-grid">' + palette.map(function (c) {
        var vk = variantKey(speciesKey, c.id);
        var kept = !!state.inventory[vk];
        var n = heldTotalOf(vk);
        // The name shows once the color is known from ANY species - the spot
        // stays empty, but you are no longer being asked to guess a name you
        // have already earned elsewhere.
        var label = known[c.id] ? c.name : '?';
        var cls = 'color-cell slot' + (kept ? '' : ' blank') + (n > 0 ? ' held' : '') +
          (vk === journalPick ? ' picked' : '');
        return '<div class="' + cls + '" title="' + (kept ? label : 'Not found yet') + '"' +
          (n > 0 ? ' onclick="pickJournalSpot(\'' + vk + '\')"' : '') + '>' +
          (kept ? speciesChip(s, c.id, 30) : '<span class="slot-unknown">?</span>') +
          '<span class="slot-line"><span class="slot-label">' + label + '</span>' +
          (kept ? '<span class="slot-note' + (n > 0 ? ' some' : '') + '">' + n + '</span>' : '') +
          '</span></div>';
      }).join('') + '</div>';

      // The picked spot's actions, in one block under the album rather than a
      // stack of every color at once - a full page of held colors used to run
      // well past the bottom of a phone.
      var heldCount = heldVariantsOf(speciesKey).length;
      if (journalPick) {
        var c = colorFor(parseVariant(journalPick).color);
        var seeds = state.seeds[journalPick] || 0;
        html += '<div class="inv-variant" style="border-color:' + c.line + '">' +
          '<div class="inv-variant-name" style="color:' + c.ink + '">' + variantChip(journalPick, 20) +
          ' ' + variantName(journalPick) + '</div>' +
          inventoryStackHtml(journalPick, false) + inventoryStackHtml(journalPick, true) +
          '<div class="inv-meta">' + seeds + ' seed' + (seeds === 1 ? '' : 's') +
          ' in your pouch &bull; first kept ' + formatAgo(state.inventory[journalPick].firstAt) +
          ' &bull; selling pays Petals, extracting gives back seeds of ' +
          'this exact color</div></div>';
      } else if (heldCount > 0) {
        html += '<p class="journal-hint">Tap a spot with a number on it to sell those flowers ' +
          'or pull them apart for seeds.</p>';
      } else {
        html += '<p class="journal-hint">You aren\'t holding any ' + s.name +
          ' right now. Keep one to fill a spot back in.</p>';
      }

      // The lifetime tally lived on the contents page; it belongs somewhere,
      // and the foot of any page is as good as a screen of its own.
      var st = state.stats;
      html += '<p style="color:var(--text-dim);font-size:11.5px;text-align:center;margin:0">Kept ' +
        st.kept + ' all time &bull; sold ' + st.sold + ' for ' + st.earned +
        ' Petals &bull; ' + st.extracted + ' seeds extracted</p>';

      document.getElementById('journal-body').innerHTML = html;
    }

    // The player's own notebook of crossings. It deliberately shows only what
    // has actually been seen, never BREED_TABLE itself - the entry-level table
    // is meant to be worked out by playing, and a screen that printed the
    // answers would make every cross after the first a formality.
    function openCrossNotes() {
      toggleMenu();
      resetModalChrome();
      document.getElementById('modal-title').textContent = 'Crossing Notes \u{1F331}';

      // Which colors you have ever held, which is what the collection counts.
      var foundColors = {};
      Object.keys(state.inventory).forEach(function (vk) {
        foundColors[parseVariant(vk).color] = true;
      });
      var nFound = Object.keys(foundColors).length;

      var html = '<p><b>' + nFound + ' of ' + COLORS.length + '</b> colors found &bull; <b>' +
        state.stats.bred + '</b> crossing' + (state.stats.bred === 1 ? '' : 's') + ' made.</p>';

      html += '<div class="color-grid">' + COLORS.map(function (c) {
        var have = !!foundColors[c.id];
        // Drawn on a real flower rather than an abstract dot. A signature
        // color must use the one species that can wear it - drawing an Ember
        // Daisy here would advertise a flower that cannot exist.
        var on = speciesFor(c.species || SPECIES[0].key);
        return '<div class="color-cell' + (have ? '' : ' missing') + '" title="' +
          (have ? c.name + (c.species ? ' - ' + on.name + ' only' : '') : 'Not found yet') + '">' +
          speciesChip(on, c.id, 30) + '<span>' + (have ? c.name : '???') + '</span></div>';
      }).join('') + '</div>';

      var pairs = Object.keys(state.crosses).sort();
      if (!pairs.length) {
        html += '<p>You haven\'t crossed anything yet. Grow two flowers to <b>flourishing</b> on ' +
          'neighbouring hexes, buy a bag of fertilizer in the Shop, then tap ' +
          '<b>Cross with a neighbour</b>.</p>' +
          '<p style="color:var(--text-dim)">Start with two different standard colors - White, Red, ' +
          'Yellow and Blue. Each of those six pairs makes a different new color, every time.</p>';
      } else {
        html += '<div class="cross-list">' + pairs.map(function (k) {
          var parts = k.split('+');
          var got = state.crosses[k];
          var results = Object.keys(got).sort(function (x, y) {
            return (got[y] - got[x]) || (colorRank(x) - colorRank(y));
          });
          return '<div class="cross-row">' +
            '<div class="cross-parents">' +
            '<span class="cross-dot" style="background:' + colorFor(parts[0]).petal + '"></span>' +
            colorFor(parts[0]).name + ' + ' +
            '<span class="cross-dot" style="background:' + colorFor(parts[1]).petal + '"></span>' +
            colorFor(parts[1]).name + '</div>' +
            '<div class="cross-results">' + results.map(function (id) {
              return '<span class="cross-result"><span class="cross-dot" style="background:' +
                colorFor(id).petal + '"></span>' + colorFor(id).name +
                (got[id] > 1 ? ' x' + got[id] : '') + '</span>';
            }).join('') + '</div></div>';
        }).join('') + '</div>' +
        '<p style="color:var(--text-dim)">Crossing two standards always gives the same result. ' +
        'Deeper pairings can go more than one way.</p>';
      }

      // Explains what they have already seen rather than spoiling it: a
      // signature only shows up once you own one, and by then the same pairing
      // has visibly produced different colors on different flowers.
      if (COLORS.some(function (c) { return c.species && foundColors[c.id]; })) {
        html += '<p style="color:var(--text-dim)">Some colors belong to a single flower and glow. ' +
          'Those only ever appear when <b>both parents are the same species</b> - the same pairing ' +
          'on a different flower gives that flower\'s own color instead.</p>';
      }

      document.getElementById('modal-body').innerHTML = html;
      document.getElementById('modal-ok-btn').textContent = 'Got it';
      document.getElementById('modal-ok-btn').onclick = closeModal;
      document.getElementById('modal-overlay').classList.add('open');
    }

    // Answers "where are they, then?". Most of a day's wild flowers land
    // off-screen on purpose - the whole point is to walk to them - so without
    // a screen like this a successful spawn is indistinguishable from a failed
    // one, since both leave the visible map unchanged.
    function openWildInfo() {
      toggleMenu();
      resetModalChrome();
      document.getElementById('modal-title').textContent = 'Wild Flowers \u{1F33C}';

      var n = Object.keys(state.wild).length;
      var near = nearestWild();
      var html = '<p><b>' + n + '</b> wild ' + (n === 1 ? 'flower is' : 'flowers are') +
        ' out on the map right now, of up to ' + WILD_MAX + '.</p>';

      if (near) {
        var nd = wildDerived(near.w, Date.now());
        html += '<p>The nearest is a <b>' +
          variantName(variantKey(near.w.species, near.w.color || baseColorOf(near.w.species))) +
          '</b>, about <b>' +
          Math.round(near.dist) + 'm</b> to the <b>' + near.dir + '</b>' +
          (nd.wilted ? ', already wilting' : '') + ' - fades in <b>' + formatDuration(nd.goneIn) + '</b>.</p>';
      } else if (n > 0) {
        html += '<p>Waiting on GPS before it can tell you how far off they are.</p>';
      }

      if (n > 0) {
        html += '<p style="color:var(--text-dim)">They can be up to ' + WILD_SPAWN_RADIUS_M +
          'm away, so most start off-screen - zoom out and look for the glowing ones.</p>';
      }
      html += '<p style="color:var(--text-dim)">Wild flowers wilt after ' + (WILD_WILT_MS / HOUR) +
        ' hours and vanish ' + ((WILD_GONE_MS - WILD_WILT_MS) / HOUR) + ' hours after that.</p>';
      html += '<p style="color:var(--text-dim)">Today: ' + wildStatus + '</p>';

      // Spawning is local and synchronous now, so it can't fail and there is
      // nothing to retry - the day either ran or is still waiting on GPS.
      document.getElementById('modal-ok-btn').textContent = 'Got it';
      document.getElementById('modal-ok-btn').onclick = closeModal;
      document.getElementById('modal-body').innerHTML = html;
      document.getElementById('modal-overlay').classList.add('open');
    }

    // Seed-tier picker shown on every plant attempt (see attemptPlant) as a
    // confirm step, even with only one tier owned - reuses the same generic
    // modal as Welcome/How to Play/etc, just with the OK button hidden in
    // favor of one button per owned tier.
    function openSeedPicker(q, r, owned) {
      resetModalChrome();
      document.getElementById('modal-title').textContent = 'Choose a Seed';
      document.getElementById('modal-body').innerHTML = '<div class="seed-pick-list">' +
        owned.map(function (o) {
          var c = colorFor(parseVariant(o.vk).color);
          return '<button class="seed-pick-btn" style="border-color:' + c.line +
            '" onclick="plantSeedAt(' + q + ',' + r + ',\'' + o.vk + '\');closeModal();">' +
            '<span style="color:' + c.ink + '">' + variantChip(o.vk) + ' ' + variantName(o.vk) +
            '</span><span>x' + o.count + '</span></button>';
        }).join('') + '</div>';
      document.getElementById('modal-ok-btn').style.display = 'none';
      document.getElementById('modal-overlay').classList.add('open');
    }

    // Modals normally show one full-width OK button; the seed picker hides it
    // in favor of its own buttons. Called at the top of every other opener so
    // that state doesn't leak between modal uses.
    function resetModalChrome() { document.getElementById('modal-ok-btn').style.display = ''; }

    function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
    // Tapping the dimmed backdrop (not the card itself) closes whatever
    // modal is open - mainly so the seed picker has a way to back out
    // without planting, since it hides the usual OK/close button.
    document.getElementById('modal-overlay').addEventListener('click', function (e) {
      if (e.target.id === 'modal-overlay') closeModal();
    });

    // ---------------------------------------------------------------------
    //  SHOP
    // ---------------------------------------------------------------------
    function updateCurrencyPill() {
      document.getElementById('currency-pill').innerHTML = '\u{1F338} ' + state.currency;
    }

    // A farmer's-market stand rather than a catalogue: one crate per species
    // sits out on the counter, restocked once a day (see dailyStock above),
    // each wearing whichever STANDARD color today's shuffle gave it. Every
    // crate is the same price, so the stand is a pick-a-favourite display,
    // not a power ladder - and since it only ever shows STANDARD colors,
    // breeding stays the only route to everything past tier 0.
    function renderShopRows() {
      // The basket tag carries the one number that matters here; everything
      // else that used to be a sentence above the stand (sell price range,
      // "one of each flower") lives elsewhere (the sell screen, the crates
      // themselves) rather than crowding this screen with text.
      document.getElementById('basket-tag').textContent = state.currency + ' \u{1F338}';
      document.getElementById('stand-sign').innerHTML = 'ALL ITEMS<br>' + SEED_COST + ' \u{1F338}';
      var afford = state.currency >= SEED_COST;

      var crates = dailyStock().map(function (vk) {
        var v = parseVariant(vk), s = speciesFor(v.species), c = colorFor(v.color);
        var owned = state.seeds[vk] || 0;
        return '<button class="stand-item"' + (afford ? '' : ' disabled') +
          ' title="' + c.name + ' ' + s.name + ' - ' + SEED_COST + ' Petals"' +
          ' onclick="confirmBuySeed(\'' + vk + '\')">' +
          speciesChip(s, v.color, 34) +
          '<span class="stand-item-name">' + c.name + '<br>' + s.name + '</span>' +
          '<span class="stand-item-price">' + SEED_COST + ' \u{1F338}</span>' +
          (owned > 0 ? '<span class="stand-item-owned">have ' + owned + '</span>' : '') +
          '</button>';
      });

      // Fertilizer is the only non-seed thing for sale, and the only way
      // into the colors the stand never stocks - so it gets its own sack
      // rather than blending into the crate rows. Species come seven to a
      // day (see dailyStock), three per row, so the seventh always ends up
      // alone; rather than leave it stranded on its own row, it shares the
      // last row with the sack instead (see .stand-row-last).
      var fert =
        '<button class="stand-fert-btn"' + (state.currency >= FERTILIZER_COST ? '' : ' disabled') +
        ' title="Fertilizer - ' + FERTILIZER_COST + ' Petals" onclick="confirmBuyFertilizer()">' +
        '<span class="stand-fert-icon">\u{1F33E}</span>' +
        '<span class="stand-fert-label">Fertilizer</span>' +
        '<span class="stand-fert-price">' + FERTILIZER_COST + ' \u{1F338}</span>' +
        '<span class="stand-fert-owned">have ' + state.fertilizer + '</span>' +
        '</button>';

      document.getElementById('stand-row-1').innerHTML = crates.slice(0, 3).join('');
      document.getElementById('stand-row-2').innerHTML = crates.slice(3, 6).join('');
      document.getElementById('stand-row-3').innerHTML = crates.slice(6, 7).join('') + fert;
    }

    // Nothing in the shop spends Petals on a single tap. The buy controls are
    // small - four 38px swatches per species row on a phone - and a mis-tap
    // used to cost 20 Petals with only a toast to show for it, and no undo.
    // Same reasoning as the seed picker on every plant attempt: the confirm
    // is cheap, the mistake isn't. Costs and the balance you'd be left with
    // are both stated before the button, not after.
    function openPurchaseConfirm(opts) {
      if (state.currency < opts.cost) return;
      resetModalChrome();
      document.getElementById('modal-title').textContent = opts.title;
      document.getElementById('modal-body').innerHTML = opts.preview +
        '<p style="color:var(--text-dim)">Costs <b>' + opts.cost + ' \u{1F338} Petals</b>. ' +
        'You have ' + state.currency + ' and would be left with <b>' +
        (state.currency - opts.cost) + '</b>.</p>';
      var ok = document.getElementById('modal-ok-btn');
      ok.textContent = opts.okText;
      // Close first: the shop sheet sits underneath and stays open, so the
      // purchase lands back on a shop that re-renders with the new balance.
      ok.onclick = function () { closeModal(); opts.onOk(); };
      document.getElementById('modal-overlay').classList.add('open');
    }

    function confirmBuySeed(vk) {
      if (STANDARD_COLORS.indexOf(parseVariant(vk).color) < 0) return;
      var c = colorFor(parseVariant(vk).color);
      var have = state.seeds[vk] || 0;
      openPurchaseConfirm({
        title: 'Buy this seed?',
        preview: '<div class="buy-preview" style="border-color:' + c.line + '">' +
          variantChip(vk, 40) + '<span style="color:' + c.ink + '">' + variantName(vk) +
          ' seed</span></div>' +
          '<p>You have <b>' + have + '</b> of these in your pouch.</p>',
        cost: SEED_COST,
        okText: 'Buy it \u{1F331}',
        onOk: function () { buySeed(vk); }
      });
    }

    function confirmBuyFertilizer() {
      openPurchaseConfirm({
        title: 'Buy fertilizer?',
        preview: '<p>One bag of fertilizer crosses two <b>flourishing</b> flowers standing on ' +
          'neighbouring hexes, and a seedling comes up in the gap between them.</p>' +
          '<p>You have <b>' + state.fertilizer + '</b> bag' +
          (state.fertilizer === 1 ? '' : 's') + '.</p>',
        cost: FERTILIZER_COST,
        okText: 'Buy it \u{1F331}',
        onOk: buyFertilizer
      });
    }

    function buySeed(vk) {
      if (state.currency < SEED_COST) return;
      // Guard the shop's own rule at the point of purchase, not just in the
      // markup that renders it.
      if (STANDARD_COLORS.indexOf(parseVariant(vk).color) < 0) return;
      state.currency -= SEED_COST;
      state.seeds[vk] = (state.seeds[vk] || 0) + 1;
      saveState();
      renderShopRows();
      updateCurrencyPill();
      toast('Bought a ' + variantName(vk) + ' seed \u{1F331}');
      vibrate(15);
      tutorialOnBuy();
    }

    function buyFertilizer() {
      if (state.currency < FERTILIZER_COST) return;
      state.currency -= FERTILIZER_COST;
      state.fertilizer++;
      saveState();
      renderShopRows();
      updateCurrencyPill();
      toast('Bought a bag of fertilizer \u{1F331}');
      vibrate(15);
    }

    // Opened both from the menu ("Seed Shop") and by tapping the currency
    // pill directly - callers handle closing the menu dropdown themselves
    // (see the menu button's onclick) so this doesn't force it open/closed.
    function openShop() {
      closePlantPanel(); closeJournal(); // only one full-screen/bottom-sheet panel open at a time
      renderShopRows();
      document.getElementById('shop-panel').classList.add('open');
    }
    function closeShop() { document.getElementById('shop-panel').classList.remove('open'); }

    function toast(msg) {
      var c = document.getElementById('toast-container');
      var t = document.createElement('div');
      t.className = 'toast';
      t.textContent = msg;
      c.appendChild(t);
      requestAnimationFrame(function () { t.classList.add('show'); });
      setTimeout(function () {
        t.classList.remove('show');
        setTimeout(function () { t.remove(); }, 300);
      }, 2600);
    }

    function vibrate(ms) {
      if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} }
    }

    // ---------------------------------------------------------------------
    //  TUTORIAL (first run only)
    //  A brand-new save (see loadState's tutorialDone default) walks through
    //  one real plant -> water -> water -> water -> harvest -> shop cycle, i.e.
    //  the exact three-visit shape of the real game. The 12-hour readiness
    //  waits are simulated (tutorialMakeReady clears the ONE tutorial plant's
    //  readyAt, not a global time multiplier - recomputePlant treats that
    //  plant no differently from any other on every later call), so a new
    //  player sees the whole loop in under a minute instead of a day and a
    //  half. Every other step - actually planting, actually tapping Water,
    //  actually harvesting, actually buying - is a real action the player
    //  performs; nothing is auto-clicked for them. Always skippable via the
    //  banner's persistent link.
    // ---------------------------------------------------------------------
    var tutorial = { active: false, step: null, plantKey: null };

    function showTutorialBanner(html) {
      document.getElementById('tutorial-text').innerHTML = html;
      document.getElementById('tutorial-banner').classList.add('open');
    }
    function hideTutorialBanner() { document.getElementById('tutorial-banner').classList.remove('open'); }

    function startTutorial() {
      tutorial.active = true;
      tutorial.step = 'plant';
      tutorial.plantKey = null;
      showTutorialBanner('Let\'s plant your first seed - tap the ground within the green circle \u{1F331}');
    }

    function skipTutorial() {
      tutorial.active = false;
      state.tutorialDone = true;
      saveState();
      hideTutorialBanner();
    }

    function finishTutorial() {
      tutorial.active = false;
      state.tutorialDone = true;
      saveState();
      showTutorialBanner('You\'ve got the hang of it! Plant, water, harvest, and shop for better seeds ' +
        'whenever you like. Have fun out there! \u{1F337}');
      setTimeout(hideTutorialBanner, 6000);
    }

    // Clears the one tutorial plant's readiness wait so the next watering
    // advances it immediately. recomputePlant can't tell this apart from a
    // real 12 hours having passed, so nothing needs to be "reverted" once the
    // tutorial ends - it's just a normal plant with a running start.
    function tutorialMakeReady(p) {
      p.readyAt = Date.now();
      saveState();
      renderPlants();
      if (viewingKey === hexKey(p.q, p.r)) renderPlantPanel(viewingKey);
      updateHUD();
    }

    // Shared by every "wait, then it's ready again" beat. The callback
    // re-checks tutorial.active and the plant's existence because the player
    // can skip the tutorial - or harvest the plant - during the wait.
    function tutorialReadyAfterPause(bannerHtml) {
      tutorial.step = 'settling';
      setTimeout(function () {
        var p = state.plants[tutorial.plantKey];
        if (!p || !tutorial.active || tutorial.step !== 'settling') return;
        tutorialMakeReady(p);
        tutorial.step = 'water';
        showTutorialBanner(bannerHtml);
      }, 2500);
    }

    function tutorialOnPlant(key) {
      if (!tutorial.active || tutorial.step !== 'plant') return;
      tutorial.plantKey = key;
      showTutorialBanner('Nice! Give it a moment to settle in&hellip; \u{1F331}');
      tutorialReadyAfterPause('It\'s ready! Tap it, then tap Water to grow it \u{1F4A7}');
    }

    // Out in the real game each of these beats is a 12-hour wait and a walk
    // back; here they're a 2.5s pause so the shape of the loop lands without
    // the player having to leave and return three times before anything
    // happens. Driven off the plant's real stage, not a step counter, so it
    // stays correct no matter which watering tap actually advanced it.
    function tutorialOnWater(key) {
      if (!tutorial.active || tutorial.step !== 'water' || key !== tutorial.plantKey) return;
      var p = state.plants[key];
      if (!p) return;
      if (p.stage >= MAX_STAGE) {
        tutorial.step = 'harvest';
        showTutorialBanner('Flourishing! Tap it, then Keep it for yourself or Sell it to the shop \u{1F337}');
        return;
      }
      showTutorialBanner(GROWTH_MESSAGES[p.stage] + ' Give it another moment&hellip;');
      tutorialReadyAfterPause(p.stage === 1
        ? 'Ready again - water it once more to bring it into bloom \u{1F4A7}'
        : 'Ready again! One more watering makes it a full cluster \u{1F4A7}');
    }

    // Deliberately accepts a harvest at ANY step, not just the scripted one.
    // The Keep/Sell row is genuinely available from "In Bloom" onward, so a
    // player who harvests a stage early would otherwise leave the tutorial
    // pointing at a plant that no longer exists, with no way to advance it
    // short of Skip. Any pending settle timer sees the plant is gone and bows
    // out on its own, so the step move to 'shop' below can't be clobbered.
    function tutorialOnHarvest(key, sell, value) {
      if (!tutorial.active || key !== tutorial.plantKey) return;
      // A bonus (on top of any sale) guarantees a first seed is affordable
      // either way - Keep is never presented as the "wrong" choice, this just
      // makes sure the shop step isn't a wall for it. Tied to SEED_COST rather
      // than a literal so it cannot silently stop covering a seed if the price
      // is ever retuned; Keep pays nothing, so this bonus is the whole budget.
      var bonus = SEED_COST;
      state.currency += bonus;
      saveState();
      updateCurrencyPill();
      tutorial.step = 'shop';
      var msg = sell
        ? 'Nice sale! Plus a first-harvest bonus of +' + bonus + ' \u{1F338}.'
        : 'Kept for your collection! Here\'s a first-harvest bonus of +' + bonus + ' \u{1F338} to get you started.';
      showTutorialBanner(msg + ' Open the Shop (top right) and buy your next seed \u{1F337}');
    }

    function tutorialOnBuy() {
      if (!tutorial.active || tutorial.step !== 'shop') return;
      finishTutorial();
    }

    // ---------------------------------------------------------------------
    //  INIT
    // ---------------------------------------------------------------------
    tickPlants();               // recompute any growth/wilt accrued while closed
    renderWild();               // wild flowers persist across sessions until picked
    updateHUD();
    updateCurrencyPill();
    setInterval(tickPlants, 60000);
  </script>
</body>
</html>
