          tutorialDone: typeof parsed.tutorialDone === 'boolean' ? parsed.tutorialDone : true,
          cheatMode: !!parsed.cheatMode
        };
      } catch (e) {
        return def; // corrupted save falls back to defaults rather than breaking load
      }
    }

    var state = loadState();
    state.userPos = null; // runtime-only, never persisted

    // One-time catch-up for anything already blooming the moment
    // journal-on-bloom discovery shipped (see discoverVariant/waterPlant) -
    // discoverVariant only ever fires from the exact instant reachedBloom
    // flips false->true, so a flower that had already crossed that line
    // under the older Keep-only journal would otherwise sit blooming on the
    // map forever without ever showing up in the collection. Skips anything
    // still mystery - that reveal (and its own discovery) hasn't happened
    // yet and shouldn't be forced here.
    (function backfillBloomedIntoJournal() {
      var changed = false;
      Object.keys(state.plants).forEach(function (key) {
        var p = state.plants[key];
        if (p.stage < 2 || p.mystery) return;
        var vk = variantKey(p.species, colorOfPlant(p));
        if (state.inventory[vk]) return;
        discoverVariant(vk);
        changed = true;
      });
      if (changed) saveState();
    })();

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        plants: state.plants, wild: state.wild, lastWildDay: state.lastWildDay,
        visited: state.visited,
        inventory: state.inventory, crosses: state.crosses, stats: state.stats,
        seeds: state.seeds, fertilizer: state.fertilizer, currency: state.currency,
        following: state.following, seenWelcome: state.seenWelcome, tutorialDone: state.tutorialDone,
        cheatMode: state.cheatMode
      }));
    }

    // ---------------------------------------------------------------------
    //  HEX MATH (flat-top axial, same shape as the Porter backbone)
    // ---------------------------------------------------------------------
    function hexRound(qf, rf) {
      var sf = -qf - rf;
      var q = Math.round(qf), r = Math.round(rf), s = Math.round(sf);
      var dq = Math.abs(q - qf), dr = Math.abs(r - rf), ds = Math.abs(s - sf);
      if (dq > dr && dq > ds) q = -r - s;
      else if (dr > ds) r = -q - s;
      return { q: q, r: r };
    }
    function latLngToHex(lat, lng) {
      var nx = lng / CELL_LNG_DEG, ny = lat / CELL_LAT_DEG;
      return hexRound(2 / 3 * nx, -1 / 3 * nx + SQ3 / 3 * ny);
    }
    function hexCenter(q, r) {
      return { lat: (SQ3 / 2 * q + SQ3 * r) * CELL_LAT_DEG, lng: (3 / 2 * q) * CELL_LNG_DEG };
    }
    function hexKey(q, r) { return q + ',' + r; }
    function hexDist(q1, r1, q2, r2) {
      var dq = q1 - q2, dr = r1 - r2;
      return (Math.abs(dq) + Math.abs(dr) + Math.abs(dq + dr)) / 2;
    }

    // Same six directions Porter uses, paired with hexVerticesPx's edge index
    // (edge `e`, between vertices e and e+1, borders the neighbor at HEX_NEIGHBORS[e]).
    var HEX_NEIGHBORS = [[1, 0], [0, 1], [-1, 1], [-1, 0], [0, -1], [1, -1]];

    // Six corner points (in Leaflet layer-point space) of the hex at (q, r),
    // used only by the grid-mesh renderer below - plant markers are placed by
    // lat/lng center (hexCenter), not by these pixel vertices.
    function hexVerticesPx(q, r) {
      var verts = [];
      for (var i = 0; i < 6; i++) {
        var angle = Math.PI / 3 * i;
        var lat = (SQ3 / 2 * q + SQ3 * r + Math.sin(angle)) * CELL_LAT_DEG;
        var lng = (3 / 2 * q + Math.cos(angle)) * CELL_LNG_DEG;
        verts.push(map.latLngToLayerPoint([lat, lng]));
      }
      return verts;
    }
    // Cheap cull against gridRenderer's own (padded) bounds, in layer points.
    function hexOnScreen(verts) {
      var b = gridRenderer && gridRenderer._bounds;
      if (!b) return true;
      return verts.some(function (v) {
        return v.x >= b.min.x - 4 && v.x <= b.max.x + 4 && v.y >= b.min.y - 4 && v.y <= b.max.y + 4;
      });
    }
    // Same six corners as hexVerticesPx, but in lat/lng instead of screen
    // pixels - used to build the range overlay below, which is a real
    // Leaflet vector layer (so it survives pan/zoom on its own) rather than
    // a canvas mesh redrawn per-frame.
    function hexCornersLatLng(q, r) {
      var pts = [];
      for (var i = 0; i < 6; i++) {
        var angle = Math.PI / 3 * i;
        var lat = (SQ3 / 2 * q + SQ3 * r + Math.sin(angle)) * CELL_LAT_DEG;
        var lng = (3 / 2 * q + Math.cos(angle)) * CELL_LNG_DEG;
        pts.push([lat, lng]);
      }
      return pts;
    }
    // The outer boundary of every hex within hexDist <= N of (centerQ,
    // centerR) - i.e. the exact shape of "in range", not a circle that only
    // approximates it. Built by edge-cancellation rather than a hand-derived
    // formula: every one of the N-cluster's hexes contributes its 6 edges,
    // any edge shared by two hexes in the cluster cancels out (interior),
    // and whatever's left over is walked into a single ordered ring. Works
    // for any N with no special-casing, at the cost of leaving collinear
    // points along each side of the big hexagon instead of 6 clean corners -
    // harmless for rendering, and this only runs when the player crosses
    // into a new hex, not per animation frame (see animateRangeTo).
    function hexRingLatLngs(centerQ, centerR, N) {
      var hexes = [];
      for (var dq = -N; dq <= N; dq++) {
        var rMin = Math.max(-N, -dq - N), rMax = Math.min(N, -dq + N);
        for (var dr = rMin; dr <= rMax; dr++) hexes.push({ q: centerQ + dq, r: centerR + dr });
      }
      function ptKey(p) { return Math.round(p[0] * 1e7) + '_' + Math.round(p[1] * 1e7); }
      var edgeMap = {}, edgeOrder = [];
      hexes.forEach(function (h) {
        var c = hexCornersLatLng(h.q, h.r);
        for (var i = 0; i < 6; i++) {
          var a = c[i], b = c[(i + 1) % 6];
          var ka = ptKey(a), kb = ptKey(b);
          var ek = ka < kb ? ka + '|' + kb : kb + '|' + ka;
          if (edgeMap[ek]) { edgeMap[ek].count++; }
          else { edgeMap[ek] = { count: 1, a: a, b: b }; edgeOrder.push(ek); }
        }
      });
      var boundary = edgeOrder.filter(function (ek) { return edgeMap[ek].count === 1; })
        .map(function (ek) { return edgeMap[ek]; });
      if (!boundary.length) return [];
      var used = new Array(boundary.length).fill(false);
      var ring = [boundary[0].a];
      var curPt = boundary[0].b;
      used[0] = true;
      for (var iter = 0; iter < boundary.length; iter++) {
        ring.push(curPt);
        var foundIdx = -1;
        for (var bi = 0; bi < boundary.length; bi++) {
          if (used[bi]) continue;
          var e = boundary[bi];
          if (ptKey(e.a) === ptKey(curPt)) { foundIdx = bi; curPt = e.b; break; }
          if (ptKey(e.b) === ptKey(curPt)) { foundIdx = bi; curPt = e.a; break; }
        }
        if (foundIdx === -1) break;
        used[foundIdx] = true;
      }
      return ring;
    }

    // ---------------------------------------------------------------------
    //  GROWTH ENGINE
    //  Fully timestamp-derived so it stays correct across long offline gaps
    //  (the whole point of the game is that you walk away for hours/days).
    // ---------------------------------------------------------------------
    // Derives a plant's display state as of `now`. Purely a read - every stored
    // field it looks at (lastWateredAt, stage, readyAt) is only ever written by
    // an actual player action, so this is safe to call from render paths as
    // often as you like and can never advance the game on its own.
    //
    // `ready` is the whole loop: a plant that has finished its STAGE_READY_MS
    // wait is waiting on a real watering visit to move up a stage. Both
    // readiness and stage are entirely independent of `wilted`, which is now
    // purely a look - a wilted plant grows exactly as well as a lush one, so
    // neglect never costs progress, only appearances.
    function recomputePlant(p, now) {
      var d = {
        wilted: (now - p.lastWateredAt) >= WATER_DURATION_MS,
        stage: p.stage,
        ready: p.stage < MAX_STAGE && now >= p.readyAt,
        readyIn: Math.max(0, p.readyAt - now)
      };
      p._d = d;
      return d;
    }

    // Consumes one seed of the given species from inventory and plants exactly
    // that flower - no randomness, you get what you chose. Callers are expected
    // to have already confirmed a seed of this species is actually owned (see
    // plantEquippedSeedAt) - this only re-checks defensively, it doesn't
    // surface its own error UI. Returns the new plant's hex key, or null if
    // there was no seed to spend.
    // Takes a variant key ("tulip:red"), not a bare species - a seed is a
    // species and a color, and planting spends exactly the one chosen.
    function plantSeedAt(q, r, vk) {
      if (!(state.seeds[vk] > 0)) return null;
      state.seeds[vk]--;
      if (state.seeds[vk] <= 0) delete state.seeds[vk]; // keep the pouch tidy

      var now = Date.now();
      var v = parseVariant(vk);
      var c = hexCenter(q, r);
      var key = hexKey(q, r);
      state.plants[key] = {
        q: q, r: r, lat: c.lat, lng: c.lng, species: v.species, color: v.color,
        plantedAt: now, lastWateredAt: now, stage: 0, readyAt: now + stageReadyMs(),
        reachedBloom: false, reachedFlourish: false
      };
      state.stats.planted++;
      saveState();
      renderPlants();
      updateHUD();
      toast('\u{1F331} ' + variantName(vk) + ' planted! It will be ready for water in ' +
        formatDuration(stageReadyMs()) + '.');
      vibrate(20);
      tutorialOnPlant(key);
      return key;
    }

    // Watering is always allowed in range and always refills the tank (which
    // resets the wilt/death clock), but it only advances a stage if the plant
    // has finished its readiness wait - that separation is what makes each
    // stage cost its own walk back without ever making a tap feel wasted.
    // Bloom/flourish milestones are credited here, at the moment they actually
    // happen, rather than being swept up later by tickPlants.
    function waterPlant(key) {
      var p = state.plants[key];
      if (!p) return;
      var now = Date.now();
      var grew = p.stage < MAX_STAGE && now >= p.readyAt;

      p.lastWateredAt = now;
      var revealed = null;
      if (grew) {
        p.stage++;
        p.readyAt = now + stageReadyMs();
        if (p.stage >= 2 && !p.reachedBloom) {
          p.reachedBloom = true;
          state.stats.bloomed++;
          // Discovered the moment it's actually seen in bloom, not only if
          // it's later Kept or sold - growing it is the whole point, so the
          // journal shouldn't require a second decision on top of that.
          // discoverVariant never touches held counts, only Keep does.
          discoverVariant(variantKey(p.species, colorOfPlant(p)));
        }
        if (p.stage >= 3 && !p.reachedFlourish) { p.reachedFlourish = true; state.stats.flourished++; }
        // A bred seedling opening is the payoff of the whole crossing loop, so
        // it gets its own message instead of the generic "burst into bloom".
        // This is also the right moment (not doBreed, back when the cross was
        // started) to record it in the Crossing Notes - recording it earlier
        // would let the Notes screen spoil a still-mystery seedling's color
        // before the player ever saw it revealed here.
        if (p.mystery && p.stage >= 2) {
          delete p.mystery;
          revealed = variantKey(p.species, colorOfPlant(p));
          if (p.parentColors) {
            recordCross(p.parentColors[0], p.parentColors[1], colorOfPlant(p));
            delete p.parentColors;
          }
        }
      }

      recomputePlant(p, now);   // refresh derived state for immediate UI feedback
      saveState();
      renderPlants();
      if (viewingKey === key) renderPlantPanel(key);
      updateHUD();

      if (revealed) {
        toast('\u{1F338} Your cross opened - it\'s a ' + variantName(revealed) + '!');
      } else if (grew) {
        toast('\u{1F4A7} ' + GROWTH_MESSAGES[p.stage]);
      } else if (p.stage >= MAX_STAGE) {
        toast('\u{1F4A7} Watered! It is fully grown - Keep it or Sell it whenever you like.');
      } else {
        toast('\u{1F4A7} Watered! Ready to grow again in ' + formatDuration(p.readyAt - now) + '.');
      }
      vibrate(grew ? 30 : 15);
      tutorialOnWater(key);
    }

    // Records a kept flower against its species. A Keep used to only bump a
    // running total, so the flower vanished off the map leaving no trace of
    // what it had been - this is what makes Keep a real choice rather than a
    // discard, and what the collection screen lists.
    function addToInventory(vk, isCluster) {
      var e = state.inventory[vk];
      if (!e) e = state.inventory[vk] = { single: 0, cluster: 0, firstAt: Date.now() };
      if (isCluster) e.cluster++; else e.single++;
    }

    // Marks a variant as discovered without crediting any held count - called
    // when one of your own plants blooms for the first time (see
    // waterPlant), so the journal remembers everything you've ever grown,
    // not just what you chose to Keep. Never overwrites an existing entry
    // (and so never disturbs an earlier real Keep/pick's firstAt or counts) -
    // it only creates one if this variant has truly never been seen before.
    function discoverVariant(vk) {
      if (state.inventory[vk]) return;
      state.inventory[vk] = { single: 0, cluster: 0, firstAt: Date.now() };
    }

    // Picks a fully-grown plant (single bloom or flourishing cluster) whether
    // to Keep (into your collection, no currency) or Sell (clears the hex for
    // Petals via harvestValue). Either way the hex frees up for replanting -
    // "harvesting" always removes the plant from the ground.
    function harvestPlant(key, sell) {
      var p = state.plants[key];
      if (!p) return;
      var d = recomputePlant(p, Date.now());
      var vk = variantKey(p.species, p.color || baseColorOf(p.species));
      var label = variantName(vk) + (d.stage >= 3 ? ' cluster' : '');
      delete state.plants[key];

      if (sell) {
        var val = harvestValue(p, d.stage);
        state.currency += val;
        state.stats.sold++;
        state.stats.earned += val;
        toast('Sold your ' + label + ' for ' + val + ' \u{1F338}');
      } else {
        state.stats.kept++;
        addToInventory(vk, d.stage >= MAX_STAGE);
        toast('Kept your ' + label + ' \u{1F33C} - it\'s in your collection');
      }

      saveState();
      renderPlants();
      updateHUD();
      updateCurrencyPill();
      closePlantPanel();
      vibrate(20);
      return sell ? harvestValue(p, d.stage) : 0; // used by the tutorial's bonus top-up
    }

    // Runs on load and every minute purely to refresh derived state, so the
    // HUD and map markers notice a plant crossing into ready or wilted. It
    // never changes a plant: stage advancement and milestone credit live in
    // waterPlant, and nothing removes a plant from the ground but harvesting.
    function tickPlants() {
      var now = Date.now();
      Object.keys(state.plants).forEach(function (key) { recomputePlant(state.plants[key], now); });

      // Wild flowers run on their own short clock and are the one thing in the
      // game that can be lost by leaving it - 12h to wilt, 18h to vanish.
      var vanished = 0;
      Object.keys(state.wild).forEach(function (key) {
        if (wildDerived(state.wild[key], now).gone) { delete state.wild[key]; vanished++; }
      });
      if (vanished > 0) saveState();

      renderPlants();
      renderWild();
      updateHUD();
      if (viewingKey) renderPlantPanel(viewingKey);
    }

    // ---------------------------------------------------------------------
    //  WILD FLOWERS
    //  Spawned once per local calendar day along real OSM paths. See the
    //  WILD_* constants above for the placement rules and the privacy note.
    // ---------------------------------------------------------------------
    // Local calendar day, not UTC - "the first time you open it each day"
    // should mean the player's day, so the roll-over happens at their midnight.
    function localDayKey(d) {
      d = d || new Date();
      var m = d.getMonth() + 1, day = d.getDate();
      return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
    }

    // How far through its short life a wild flower is. Entirely derived from
    // spawnedAt, so - like the plant growth engine - it stays correct across
    // however long the page was closed.
    function wildDerived(w, now) {
      var age = now - w.spawnedAt;
      return {
        wilted: age >= WILD_WILT_MS,
        gone: age >= WILD_GONE_MS,
        goneIn: Math.max(0, WILD_GONE_MS - age),
        lifeFrac: Math.max(0, Math.min(1, 1 - age / WILD_GONE_MS))
      };
    }

    // Records every hex within planting range of (q, r) as "accessible" - a
    // spot the player was actually able to stand close enough to plant at,
    // at least once. pickWildSpots draws from this pool first, so the wild
    // crop gravitates toward ground that's proven reachable instead of a
    // uniformly random disc that doesn't know about lakes, rooftops, or
    // fenced yards. Persisted forever (once reachable, always a priority),
    // and cheap: only newly-seen hexes trigger a save, so retracing the same
    // streets costs nothing after the first pass.
    function markAccessible(q, r) {
      var added = false;
      for (var dq = -PLANT_RANGE_HEX; dq <= PLANT_RANGE_HEX; dq++) {
        var rMin = Math.max(-PLANT_RANGE_HEX, -dq - PLANT_RANGE_HEX);
        var rMax = Math.min(PLANT_RANGE_HEX, -dq + PLANT_RANGE_HEX);
        for (var dr = rMin; dr <= rMax; dr++) {
          var key = hexKey(q + dq, r + dr);
          if (!state.visited[key]) { state.visited[key] = 1; added = true; }
        }
      }
      if (added) saveState();
    }

    // Priority + rejection sampling. First fills from state.visited - hexes
    // proven reachable before, within WILD_SPAWN_RADIUS_M and shuffled so the
    // same handful near home don't always win - then, if that pool can't
    // cover `needed` (a fresh save, or a walk into brand-new territory),
    // falls back to throwing darts at the disc around the player like
    // before. Either way, a spot only survives if it's at least
    // WILD_MIN_HEX_GAP hexes from every existing wild flower, every plant
    // the player owns, and every spot already chosen in this same pass.
    // Capped attempts on the fallback, so a garden so dense that nothing
    // fits simply yields fewer flowers instead of spinning.
    function pickWildSpots(needed) {
      if (!state.userPos) return [];
      var avoid = [];
      Object.keys(state.wild).forEach(function (k) { avoid.push(state.wild[k]); });
      Object.keys(state.plants).forEach(function (k) { avoid.push(state.plants[k]); });

      var origin = state.userPos;
      var lngScale = 111111 * Math.cos(origin.lat * Math.PI / 180);
      var chosen = [];

      var visitedCandidates = [];
      Object.keys(state.visited).forEach(function (k) {
        var parts = k.split(','), q = +parts[0], r = +parts[1];
        var c = hexCenter(q, r);
        if (metersBetween(origin, c) <= WILD_SPAWN_RADIUS_M) visitedCandidates.push({ q: q, r: r });
      });
      // Fisher-Yates - an unshuffled visited list would always favor the
      // earliest-discovered hexes over ground found more recently.
      for (var i = visitedCandidates.length - 1; i > 0; i--) {
        var j0 = Math.floor(Math.random() * (i + 1));
        var tmp = visitedCandidates[i]; visitedCandidates[i] = visitedCandidates[j0]; visitedCandidates[j0] = tmp;
      }
      for (var vi = 0; vi < visitedCandidates.length && chosen.length < needed; vi++) {
        var vh = visitedCandidates[vi];
        var vok = true;
        for (var vj = 0; vj < avoid.length; vj++) {
          if (hexDist(vh.q, vh.r, avoid[vj].q, avoid[vj].r) < WILD_MIN_HEX_GAP) { vok = false; break; }
        }
        if (!vok) continue;
        chosen.push(vh);
        avoid.push(vh);
      }

      var attempts = needed * 200;
      for (var a = 0; a < attempts && chosen.length < needed; a++) {
        // sqrt of a uniform gives an even spread over the disc's *area*;
        // without it everything bunches towards the player.
        var ang = Math.random() * Math.PI * 2;
        var dist = Math.sqrt(Math.random()) * WILD_SPAWN_RADIUS_M;
        var h = latLngToHex(
          origin.lat + (dist * Math.cos(ang)) / 111111,
          origin.lng + (dist * Math.sin(ang)) / lngScale
        );
        var ok = true;
        for (var j = 0; j < avoid.length; j++) {
          if (hexDist(h.q, h.r, avoid[j].q, avoid[j].r) < WILD_MIN_HEX_GAP) { ok = false; break; }
        }
        if (!ok) continue;
        chosen.push(h);
        avoid.push(h);
      }
      return chosen;
    }

    // Straight-line metres and a rough compass point, used by the Wild Flowers
    // screen so "nothing appeared" can always be told apart from "it appeared
    // 600m north of you". Equirectangular is plenty at sub-kilometre scale.
    function metersBetween(a, b) {
      var dLat = (b.lat - a.lat) * 111111;
      var dLng = (b.lng - a.lng) * 111111 * Math.cos(a.lat * Math.PI / 180);
      return Math.sqrt(dLat * dLat + dLng * dLng);
    }
    function compassLabel(from, to) {
      var dLat = to.lat - from.lat;
      var dLng = (to.lng - from.lng) * Math.cos(from.lat * Math.PI / 180);
      var ang = (Math.atan2(dLng, dLat) * 180 / Math.PI + 360) % 360;
      return ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][Math.round(ang / 45) % 8];
    }
    function nearestWild() {
      if (!state.userPos) return null;
      var best = null;
      Object.keys(state.wild).forEach(function (k) {
        var w = state.wild[k];
        var dist = metersBetween(state.userPos, w);
        if (!best || dist < best.dist) {
          best = { key: k, w: w, dist: dist, dir: compassLabel(state.userPos, w) };
        }
      });
      return best;
    }

    // Plain-language account of what the last spawn did, shown on the Wild
    // Flowers screen. Runtime-only. Most of a crop lands off-screen by design,
    // so without this a successful spawn and a skipped one look identical.
    var wildStatus = 'No crop scattered yet this session.';

    // Called once per session after the GPS locks. Now entirely local and
    // synchronous - no network, so the only way to come up short is a garden
    // too crowded to fit anything.
    function maybeSpawnWild() {
      var today = localDayKey();
      if (!state.userPos) { wildStatus = 'Waiting for GPS.'; return; }
      if (state.lastWildDay === today) {
        wildStatus = 'Today\'s crop has already been scattered. More tomorrow.';
        return;
      }

      var needed = WILD_MAX - Object.keys(state.wild).length;
      if (needed <= 0) {
        state.lastWildDay = today;
        wildStatus = 'The map is already full at ' + WILD_MAX + '. Pick some to make room.';
        saveState();
        return;
      }

      var spots = pickWildSpots(needed);
      spots.forEach(function (h) {
        var c = hexCenter(h.q, h.r);
        var sp = SPECIES[Math.floor(Math.random() * SPECIES.length)];
        // Wild flowers only ever come in the standard colors. Everything past
        // tier 0 has to be bred, so a walk can never hand you what breeding is
        // supposed to be for.
        var col = STANDARD_COLORS[Math.floor(Math.random() * STANDARD_COLORS.length)];
        state.wild[hexKey(h.q, h.r)] = {
          q: h.q, r: h.r, lat: c.lat, lng: c.lng, species: sp.key, color: col,
          stage: 2, spawnedAt: Date.now()
        };
      });

      state.lastWildDay = today;
      saveState();
      renderWild();
      updateHUD();

      if (spots.length > 0) {
        var near = nearestWild();
        wildStatus = spots.length + ' scattered within ' + WILD_SPAWN_RADIUS_M +
          'm. They wilt after ' + (WILD_WILT_MS / HOUR) + 'h and are gone by ' + (WILD_GONE_MS / HOUR) + 'h.';
        // Lead with the distance to the closest one - most of the crop lands
        // off-screen, so otherwise this announces blooms against a map that
        // looks completely unchanged.
        toast('\u{1F33C} ' + spots.length + ' wild ' + (spots.length === 1 ? 'flower' : 'flowers') +
          ' bloomed nearby' + (near ? ' - nearest is ' + Math.round(near.dist) + 'm ' + near.dir : '') + '!');
        vibrate(25);
      } else {
        wildStatus = 'Nowhere free to scatter any - your flowers cover the area.';
      }
    }

    // ---------------------------------------------------------------------
    //  VISUALS
    // ---------------------------------------------------------------------
    // ---- Flower artwork --------------------------------------------------
    // Flowers are drawn as inline SVG built here at runtime, not as emoji or
    // image files. That is what makes an arbitrary color wearable by an
    // arbitrary species: shape comes from species.shape, every fill comes from
    // the color, and the two never have to know about each other. It also
    // keeps the game a single dependency-free file and makes a flower look the
    // same on every device, which emoji never did.
    //
    // Everything is authored in a 100x100 viewBox and scaled by the caller, so
    // one definition serves an 18px inline chip and a 110px zoomed-in marker.
    var PETAL_STROKE = 2.2;  // viewBox units, so it scales with the flower

    // A petal centred `r` units above the middle, then rotated into place.
    function petalShape(row, cy, fill, edge, angle) {
      var rx = row.rx, ry = row.ry;
      var common = ' fill="' + fill + '" stroke="' + edge + '" stroke-width="' + PETAL_STROKE +
        '" stroke-linejoin="round" transform="rotate(' + angle.toFixed(2) + ' 50 50)"/>';
      if (row.tip === 'round') {
        return '<ellipse cx="50" cy="' + cy.toFixed(2) + '" rx="' + rx + '" ry="' + ry + '"' + common;
      }
      var top = cy - ry, bot = cy + ry;
      if (row.tip === 'notch') {
        // Heart-shaped petal: two lobes at the tip with a dip between them.
        return '<path d="M50 ' + (top + ry * 0.42).toFixed(2) +
          ' L' + (50 - rx * 0.55).toFixed(2) + ' ' + top.toFixed(2) +
          ' C' + (50 - rx).toFixed(2) + ' ' + (top + ry * 0.75).toFixed(2) +
          ' ' + (50 - rx).toFixed(2) + ' ' + (bot - ry * 0.35).toFixed(2) +
          ' 50 ' + bot.toFixed(2) +
          ' C' + (50 + rx).toFixed(2) + ' ' + (bot - ry * 0.35).toFixed(2) +
          ' ' + (50 + rx).toFixed(2) + ' ' + (top + ry * 0.75).toFixed(2) +
          ' ' + (50 + rx * 0.55).toFixed(2) + ' ' + top.toFixed(2) + ' Z"' + common;
      }
      // 'point' - an almond, tapered at both ends.
      return '<path d="M50 ' + top.toFixed(2) +
        ' C' + (50 + rx).toFixed(2) + ' ' + (top + ry * 0.55).toFixed(2) +
        ' ' + (50 + rx).toFixed(2) + ' ' + (bot - ry * 0.45).toFixed(2) +
        ' 50 ' + bot.toFixed(2) +
        ' C' + (50 - rx).toFixed(2) + ' ' + (bot - ry * 0.45).toFixed(2) +
        ' ' + (50 - rx).toFixed(2) + ' ' + (top + ry * 0.55).toFixed(2) +
        ' 50 ' + top.toFixed(2) + ' Z"' + common;
    }

    // Icons are rebuilt on every zoomend and every 60s tick, and a rose is 20
    // petals of path maths, so the finished markup is memoised. Species and
    // colors are both static, so the key is complete.
    // Gradient/halo/spark markup for a signature color, or '' for the rest.
    //
    // The gradient ids are deterministic (`pg-<colorid>`), so the same id
    // appears in every copy of that flower on screen at once. That is safe
    // *because* it is deterministic: every element carrying a given id has
    // byte-identical contents, so whichever one the browser resolves
    // url(#pg-ember) against paints the same thing, and each <svg> carries
    // its own copy so a reference can never be left dangling. Unique ids per
    // instance would defeat the memo cache below for no gain.
    function fancyDefs(color) {
      if (!color.grad) return '';
      var g = color.grad;
      // objectBoundingBox units (the default), so the axis is each petal's own
      // box - and since petals are drawn pointing up and then rotated, the
      // gradient rotates with them: light at every tip, deep at every base.
      return '<defs>' +
        '<linearGradient id="pg-' + color.id + '" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0" stop-color="' + g[0] + '"/>' +
        '<stop offset="0.55" stop-color="' + g[1] + '"/>' +
        '<stop offset="1" stop-color="' + g[2] + '"/></linearGradient>' +
        '<linearGradient id="pgd-' + color.id + '" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0" stop-color="' + shadeHex(g[0], 0.88) + '"/>' +
        '<stop offset="0.55" stop-color="' + shadeHex(g[1], 0.86) + '"/>' +
        '<stop offset="1" stop-color="' + shadeHex(g[2], 0.86) + '"/></linearGradient>' +
        '<radialGradient id="hg-' + color.id + '">' +
        '<stop offset="0.35" stop-color="' + color.glow + '" stop-opacity="0.75"/>' +
        '<stop offset="0.7" stop-color="' + color.glow + '" stop-opacity="0.28"/>' +
        '<stop offset="1" stop-color="' + color.glow + '" stop-opacity="0"/>' +
        '</radialGradient></defs>';
    }
    // Six motes on a ring outside the petals, twinkling out of phase. Fixed
    // positions rather than a particle simulation: this markup is memoised and
    // re-injected on every zoom, so it has to stay a pure function of the
    // color, and CSS does the moving.
    var SPARK_COUNT = 6;
    function sparkMarkup(color) {
      if (!color.spark) return '';
      var out = '';
      for (var i = 0; i < SPARK_COUNT; i++) {
        var a = (Math.PI * 2 / SPARK_COUNT) * i - Math.PI / 2;
        var rr = i % 2 ? 47 : 41;
        out += '<circle class="bloom-spark" cx="' + (50 + Math.cos(a) * rr).toFixed(2) +
          '" cy="' + (50 + Math.sin(a) * rr).toFixed(2) + '" r="' + (i % 2 ? 1.9 : 2.7) +
          '" fill="' + color.spark + '" style="animation-delay:' + (i * 0.37).toFixed(2) + 's"/>';
      }
      return out;
    }

    var flowerSvgCache = {};
    function flowerSVG(species, color, px) {
      var ck = species.key + '|' + color.id + '|' + px;
      if (flowerSvgCache[ck]) return flowerSvgCache[ck];

      var sh = species.shape, out = fancyDefs(color);
      if (color.glow) {
        out += '<circle class="bloom-halo" cx="50" cy="50" r="49" fill="url(#hg-' +
          color.id + ')"/>';
      }
      sh.rows.forEach(function (row) {
        var fill = color.grad
          ? 'url(#' + (row.deep ? 'pgd-' : 'pg-') + color.id + ')'
          : (row.deep ? color.deep : color.petal);
        var cy = 50 - row.r;
        for (var i = 0; i < row.n; i++) {
          out += petalShape(row, cy, fill, color.edge, (360 / row.n) * i + (row.rot || 0));
        }
      });

      var c = sh.center;
      out += '<circle cx="50" cy="50" r="' + c.r + '" fill="' + color.center +
        '" stroke="' + color.edge + '" stroke-width="' + PETAL_STROKE + '"/>';
      if (c.dots) {
        // Speckled disc florets - what separates a sunflower/blossom eye from
        // a plain dot at map scale.
        for (var d = 0; d < c.dots; d++) {
          var a = (Math.PI * 2 / c.dots) * d, rr = c.r * 0.5;
          out += '<circle cx="' + (50 + Math.cos(a) * rr).toFixed(2) + '" cy="' +
            (50 + Math.sin(a) * rr).toFixed(2) + '" r="' + (c.r * 0.22).toFixed(2) +
            '" fill="' + shadeHex(color.center, 0.7) + '"/>';
        }
      }
      if (c.stamen) {
        out += '<path d="M50 50 L50 ' + (50 - c.r * 3.2).toFixed(2) + '" stroke="' + color.center +
          '" stroke-width="2.4" stroke-linecap="round"/>' +
          '<circle cx="50" cy="' + (50 - c.r * 3.2).toFixed(2) + '" r="' + (c.r * 0.7).toFixed(2) +
          '" fill="' + color.center + '"/>';
      }

      // Sparks go last so they sit above the petals rather than behind them.
      out += sparkMarkup(color);

      var svg = '<svg viewBox="0 0 100 100" width="' + px + '" height="' + px +
        '" style="display:block">' + out + '</svg>';
      flowerSvgCache[ck] = svg;
      return svg;
    }

    function seedSVG(px) {
      return '<svg viewBox="0 0 100 100" width="' + px + '" height="' + px + '" style="display:block">' +
        '<ellipse cx="50" cy="54" rx="26" ry="32" fill="#a9773f" stroke="#7d5628" stroke-width="3"/>' +
        '<path d="M50 24 C45 40 45 52 50 68" stroke="#7d5628" stroke-width="3" fill="none"/>' +
        '<ellipse cx="41" cy="42" rx="7" ry="10" fill="#d8b184" opacity="0.75" ' +
        'transform="rotate(-22 41 42)"/></svg>';
    }

    function sproutSVG(px) {
      return '<svg viewBox="0 0 100 100" width="' + px + '" height="' + px + '" style="display:block">' +
        '<path d="M50 86 C50 64 50 50 50 32" stroke="#4e8b3f" stroke-width="6" fill="none" ' +
        'stroke-linecap="round"/>' +
        '<ellipse cx="31" cy="52" rx="18" ry="11" fill="#7cc45f" stroke="#4e8b3f" stroke-width="2.6" ' +
        'transform="rotate(-26 31 52)"/>' +
        '<ellipse cx="69" cy="62" rx="16" ry="10" fill="#66b04d" stroke="#4e8b3f" stroke-width="2.6" ' +
        'transform="rotate(24 69 62)"/></svg>';
    }

    // The round backing every stage sits on. It is what makes a marker legible
    // against an arbitrary patch of basemap; the flower itself only has to be
    // a flower.
    function discStyle(bg, size) {
      return 'background:' + bg + ';border:2px solid rgba(255,255,255,0.85);border-radius:50%;width:' +
        size + 'px;height:' + size + 'px;display:flex;align-items:center;justify-content:center;' +
        'box-shadow:0 2px 8px rgba(60,40,20,0.3);flex-shrink:0;overflow:hidden';
    }

    // Builds the "look" for a plant at a given stage/size and returns its
    // rendered box dimensions so callers (map marker vs. big panel preview)
    // can size their container to match exactly.
    function buildPlantVisual(species, color, stage, wilted, base) {
      var wiltFilter = wilted ? 'filter:grayscale(55%) opacity(0.7);' : '';
      function dot(size) {
        return '<div style="' + discStyle(color.soft, size) + '">' +
          flowerSVG(species, color, Math.round(size * 0.94)) + '</div>';
      }
      var html, w, h;
      if (stage === 0) {
        w = h = Math.round(base * 0.5);
        html = '<div style="' + wiltFilter + discStyle('#e6cfa8', w) + '">' +
          seedSVG(Math.round(w * 0.72)) + '</div>';
      } else if (stage === 1) {
        w = h = Math.round(base * 0.55);
        html = '<div style="' + wiltFilter + discStyle('#d8ecc4', w) + '">' +
          sproutSVG(Math.round(w * 0.82)) + '</div>';
      } else if (stage === 2) {
        w = h = Math.round(base * 0.85);
        html = '<div style="' + wiltFilter + '">' + dot(w) + '</div>';
      } else {
        var ds = Math.round(base * 0.5), gap = Math.max(2, Math.round(base * 0.04));
        w = 2 * ds + gap; h = 2 * ds + gap;
        html = '<div class="flourish-cluster" style="' + wiltFilter + 'display:flex;flex-direction:column;' +
          'gap:' + gap + 'px;align-items:center"><div style="display:flex;gap:' + gap + 'px">' +
          dot(ds) + dot(ds) + '</div>' + dot(ds) + '</div>';
      }
      return { html: html, w: w, h: h };
    }

    // Inline flower for text rows (collection list, shop, seed picker, modal
    // titles) - the same artwork the map uses, so a row and its marker are
    // recognisably the same flower. Replaces the emoji those labels used to
    // carry. Callers must use innerHTML, not textContent.
    function speciesChip(species, colorId, px) {
      px = px || 18;
      return '<span style="display:inline-block;vertical-align:-' + Math.round(px * 0.18) +
        'px;width:' + px + 'px;height:' + px + 'px">' +
        flowerSVG(species, colorFor(colorId || species.base), px) + '</span>';
    }

    // Flower icons are sized relative to the current zoom (a fixed real-world
    // size, not a fixed screen-pixel size) so zooming in genuinely makes them
    // bigger and easier to see instead of staying constant while everything
    // else on the map grows. A divIcon's DOM size is otherwise frozen at
    // whatever it was built at - Leaflet repositions markers continuously
    // through a zoom gesture but never resizes them - so without help the
    // flowers held one size through the whole gesture and only snapped to the
    // right size once 'zoomend' rebuilt them. rescalePlantIcons() below covers
    // the gap by CSS-scaling the live DOM every 'zoom' tick; 'zoomend' (see the
    // map.on binding further down) then does the real rebuild.
    // Clamped so icons stay legible at minZoom and don't get absurd at maxZoom.
    var PLANT_ICON_REF_ZOOM = 17; // the zoom PLANT_ICON_REF_PX looks "normal" at
    var PLANT_ICON_REF_PX = 44;
    function plantIconBase() {
      var scale = Math.pow(2, map.getZoom() - PLANT_ICON_REF_ZOOM);
      return PLANT_ICON_REF_PX * Math.max(0.5, Math.min(2.5, scale));
    }
    // The px plantIconBase() returned the last time icons were actually
    // rebuilt (makePlantIcon/makeWildIcon). rescalePlantIcons() compares the
    // current value against this to know how far the live gesture has drifted.
    var _iconBuiltPx = PLANT_ICON_REF_PX;

    function makePlantIcon(plant) {
      var d = recomputePlant(plant, Date.now());
      var px = plantIconBase();
      _iconBuiltPx = px;
      var v = buildPlantVisual(speciesFor(plant.species), paletteOf(plant), d.stage, d.wilted, px);
      var html = v.html;
      // A corner droplet marks any plant that wants a visit, so the map alone
      // answers "is there anything to do right now?". Green means it is ready
      // to grow a stage and takes priority; blue is the cosmetic wilt nudge.
      // Both are fixed by the same action, so they share one badge shape.
      if (d.ready || d.wilted) {
        var badgeBg = d.ready ? '#4caf6d' : '#4aa3ff';
        html = '<div style="position:relative;width:' + v.w + 'px;height:' + v.h + 'px">' + html +
          '<div style="position:absolute;top:-4px;right:-6px;background:' + badgeBg + ';color:#fff;' +
          'border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center;' +
          'font-size:10px;box-shadow:0 1px 4px rgba(0,0,0,0.35)">\u{1F4A7}</div></div>';
      }
      return L.divIcon({ html: html, iconSize: [v.w, v.h], iconAnchor: [v.w / 2, v.h / 2], className: '' });
    }

    // Same bloom artwork as a planted flower, wrapped in a pulsing halo so a
    // wild one is distinguishable at a glance without inventing a second
    // marker shape. Always drawn at single-bloom stage and never wilted -
    // wild flowers don't grow and can't be neglected.
    function makeWildIcon(w) {
      var d = wildDerived(w, Date.now());
      var px = plantIconBase();
      _iconBuiltPx = px;
      var v = buildPlantVisual(speciesFor(w.species), paletteOf(w), 2, d.wilted, px);
      var pad = Math.max(6, Math.round(v.w * 0.18));
      var box = v.w + pad * 2, boxH = v.h + pad * 2;
      var html = '<div style="position:relative;width:' + box + 'px;height:' + boxH + 'px;' +
        'display:flex;align-items:center;justify-content:center">' +
        '<div class="wild-glow" style="position:absolute;inset:0;border-radius:50%;background:' +
        'radial-gradient(circle,rgba(255,255,255,0.9),rgba(255,236,150,0.5) 52%,rgba(255,236,150,0) 72%)"></div>' +
        '<div style="position:relative">' + v.html + '</div></div>';
      return L.divIcon({ html: html, iconSize: [box, boxH], iconAnchor: [box / 2, boxH / 2], className: '' });
    }

    // ---------------------------------------------------------------------
    //  MAP
    // ---------------------------------------------------------------------
    var map = L.map('map', { zoomControl: false, attributionControl: false, minZoom: 14, maxZoom: 19, zoomSnap: 0.5 });
    // Voyager tiles - colorful parks/water/roads, matching the "pretty and
    // colorful" brief better than a flat greyscale basemap would.
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      subdomains: 'abcd', maxZoom: 20
    }).addTo(map);

    // Pane ladder (bottom -> top): tilePane 200 < gridPane 350 (hex mesh) <
    // overlayPane 400 (range shape, Leaflet default) < markerPane 600 (plants/
    // user, Leaflet default). Much shorter than Porter's ladder since Bloom has
    // no zones or connection lines to layer in between.
    map.createPane('gridPane').style.zIndex = 350;
    var gridRenderer = L.canvas({ pane: 'gridPane', padding: 1.0 });
    gridRenderer.addTo(map);

    map.setView([20, 0], 3);
    // Persist immediately: tickPlants no longer saves (it has nothing to save),
    // so without this a player who drags the map and closes the tab comes back
    // to it snapping to their location again.
    map.on('dragstart', function () { state.following = false; saveState(); });

    // Hex mesh is only drawn once zoomed in this close - below it the hex count
    // in view would grow into the thousands (this is a full-viewport mesh, not
    // a bounded zone like Porter's), so it simply fades away on a wide view
    // rather than costing a redraw budget to render or read.
    var GRID_MIN_ZOOM = 17;
    var GRID_MAX_HEXES = 3000; // safety cap in case the viewport math overshoots

    var _gridRedrawPending = false;
    function scheduleGridRedraw() {
      if (_gridRedrawPending) return;
      _gridRedrawPending = true;
      requestAnimationFrame(function () { _gridRedrawPending = false; renderGridMesh(); });
    }

    // Soft outline mesh over the current viewport so planting spots read at a
    // glance. Every edge is shared by exactly two hexes; only drawing edge
    // indices 0-2 of each hex (see HEX_NEIGHBORS / hexVerticesPx) still covers
    // every edge exactly once, so there's no dedup pass and no doubled lines.
    function renderGridMesh() {
      if (!gridRenderer._ctx || !gridRenderer._bounds) return;
      var ctx = gridRenderer._ctx, b = gridRenderer._bounds, sz = b.getSize();
      ctx.clearRect(b.min.x, b.min.y, sz.x, sz.y);
      if (map.getZoom() < GRID_MIN_ZOOM) return;

      var vb = map.getBounds().pad(0.25);
      var corners = [
        latLngToHex(vb.getSouth(), vb.getWest()), latLngToHex(vb.getNorth(), vb.getEast()),
        latLngToHex(vb.getSouth(), vb.getEast()), latLngToHex(vb.getNorth(), vb.getWest())
      ];
      var minQ = Math.min.apply(null, corners.map(function (c) { return c.q; })) - 1;
      var maxQ = Math.max.apply(null, corners.map(function (c) { return c.q; })) + 1;
      var minR = Math.min.apply(null, corners.map(function (c) { return c.r; })) - 1;
      var maxR = Math.max.apply(null, corners.map(function (c) { return c.r; })) + 1;
      if ((maxQ - minQ) * (maxR - minR) > GRID_MAX_HEXES) return;

      ctx.strokeStyle = 'rgba(70,120,80,0.14)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (var q = minQ; q <= maxQ; q++) {
        for (var r = minR; r <= maxR; r++) {
          var verts = hexVerticesPx(q, r);
          if (!hexOnScreen(verts)) continue;
          for (var e = 0; e < 3; e++) {
            ctx.moveTo(verts[e].x, verts[e].y);
            ctx.lineTo(verts[(e + 1) % 6].x, verts[(e + 1) % 6].y);
          }
        }
      }
      ctx.stroke();
    }
    map.on('moveend zoomend viewreset resize', scheduleGridRedraw);

    var plantMarkers = {};
    function renderPlants() {
      var seen = {};
      Object.keys(state.plants).forEach(function (key) {
        var p = state.plants[key];
        seen[key] = true;
        var icon = makePlantIcon(p);
        if (plantMarkers[key]) plantMarkers[key].setIcon(icon);
        else plantMarkers[key] = L.marker([p.lat, p.lng], { icon: icon, interactive: false, zIndexOffset: 100 }).addTo(map);
      });
      Object.keys(plantMarkers).forEach(function (key) {
        if (!seen[key]) { map.removeLayer(plantMarkers[key]); delete plantMarkers[key]; }
      });
    }
    // Wild flowers sit just under the player's own plants (zIndexOffset 90 vs
    // 100), so on the rare overlap your garden is never hidden by scenery.
    var wildMarkers = {};
    function renderWild() {
      var seen = {};
      Object.keys(state.wild).forEach(function (key) {
        var w = state.wild[key];
        seen[key] = true;
        var icon = makeWildIcon(w);
        if (wildMarkers[key]) wildMarkers[key].setIcon(icon);
        else wildMarkers[key] = L.marker([w.lat, w.lng], { icon: icon, interactive: false, zIndexOffset: 90 }).addTo(map);
      });
      Object.keys(wildMarkers).forEach(function (key) {
        if (!seen[key]) { map.removeLayer(wildMarkers[key]); delete wildMarkers[key]; }
      });
    }

    // Rebuild every icon at the new zoom's size once a zoom gesture settles -
    // see plantIconBase()/makePlantIcon above for why this is what actually
    // makes zooming in grow the flowers instead of them snapping back.
    map.on('zoomend', function () { renderPlants(); renderWild(); });

    // Live in-between-frames fix for the gap 'zoomend' alone leaves: CSS-scale
    // each marker's inner content div (never the marker element itself, which
    // carries Leaflet's own translate3d positioning transform and must not be
    // clobbered) on every 'zoom' event, which fires continuously through a
    // wheel/button zoom animation and a touch pinch alike. makePlantIcon and
    // makeWildIcon always emit exactly one wrapping div as the marker's whole
    // content, so firstElementChild is always that div. zoomend's real rebuild
    // then hands back fresh, untransformed DOM and updates _iconBuiltPx, so the
    // live scale falls back to identity on its own once the true size lands.
    var _iconRescalePending = false, _lastIconScale = 1;
    function rescalePlantIcons() {
      if (!_iconBuiltPx) return;
      var s = plantIconBase() / _iconBuiltPx;
      if (!(s > 0) || s === _lastIconScale) return;
      _lastIconScale = s;
      var t = s === 1 ? '' : 'scale(' + s + ')';
      function apply(markers) {
        Object.keys(markers).forEach(function (key) {
          var el = markers[key].getElement();
          var c = el && el.firstElementChild;
          if (c) c.style.transform = t;
        });
      }
      apply(plantMarkers);
      apply(wildMarkers);
    }
    map.on('zoom', function () {
      if (_iconRescalePending) return;
      _iconRescalePending = true;
      requestAnimationFrame(function () { _iconRescalePending = false; rescalePlantIcons(); });
    });

    // Empty ground within range plants immediately, but only with a seed
    // already equipped from the pouch (see plantEquippedSeedAt) - a bare tap
    // never spends a seed on its own, it just points at the pouch. An
    // occupied hex opens its panel (from any distance - browsing your garden
    // from afar is fine, only *acting* on a plant requires being physically
    // close).
    // With a tool in hand every map tap belongs to the tool instead - see the
    // TOOLS section below, which drives itself off pointer events so it can
    // tell a tap from a press-and-hold.
    map.on('click', function (e) {
      // A tap anywhere else on the map while the tool fan is out is just a
      // "never mind" - it closes the fan instead of planting or opening a
      // panel underneath it. See onToolboxPointerUp for why the fan can be
      // left open after a plain tap on the toolbox.
      if (railOpen) { setRailOpen(false); return; }
      if (seedRailOpen) { closeSeedFan(); return; }
      if (activeTool) return;
      var h = latLngToHex(e.latlng.lat, e.latlng.lng);
      var key = hexKey(h.q, h.r);
      if (state.plants[key]) { openPlantPanel(key); return; }
      if (state.wild[key]) { openPlantPanel(key, true); return; }
      if (!state.userPos) { toast('Waiting for GPS to lock on...'); return; }
      var uh = latLngToHex(state.userPos.lat, state.userPos.lng);
      if (hexDist(uh.q, uh.r, h.q, h.r) > PLANT_RANGE_HEX) {
        toast('Walk closer to plant a seed here \u{1F6B6}');
        return;
      }
      if (equippedSeed) { plantEquippedSeedAt(h.q, h.r); return; }
      if (totalSeedCount() === 0) { toast("You're out of seeds - open the Shop \u{1F338} to buy more"); return; }
      toast('Tap the seed pouch to choose what to plant \u{1F331}');
    });

    // ---------------------------------------------------------------------
    //  TOOLS
    //  Three tools live behind a toolbox icon at the top-left: the watering
    //  can, the shears (collect into your journal) and $ (sell). A fourth,
    //  fertilizer, joins them once a bag is actually owned (see .tool-btn.fert
    //  and syncFertTool below) - press-and-hold a flourishing flower with it
    //  out and it crosses with a random ready neighbour, the same worker
    //  (doBreed) the plant panel's "Cross with a neighbour" button already
    //  uses, just without picking which neighbour first. Equipping any tool
    //  is a MODE - you tap every flower you want it applied to and then
    //  unequip it to put it away - which is what turns watering a whole bed
    //  into a row of taps rather than open-panel/tap-Water/close per flower.
    //
    //  Watering is a plain tap, because it is the routine action and it can't
    //  cost you anything. Collecting, selling and fertilizing take a
    //  one-second press and hold with a filling ring, because all three take
    //  something off the board for good (a flower, or a fertilizer bag plus
    //  both parents' next 12h) and there is no undo.
    //
    //  Picking a tool up is itself a two-stage gesture (see the RAIL section
    //  below): tap the toolbox to fan the tools out and tap the one you
    //  want, or press-and-hold the toolbox and drag straight to it. Whichever
    //  one gets equipped replaces the toolbox icon in place; tapping it again
    //  unequips and the toolbox comes back.
    // ---------------------------------------------------------------------
    var HOLD_MS = 1000;      // press-and-hold to confirm a collect or a sale
    var HOLD_MOVE_PX = 14;   // finger travel that turns a hold back into a pan
    var WATER_ANIM_MS = 1150; // matches the can-pour keyframes; growth lands after

    var TOOL_NAMES = { water: 'watering can', shear: 'shears', sell: '$', fert: 'fertilizer' };
    var TOOL_HUD = {
      water: '\u{1F4A7} Watering can out &bull; tap each flower to water it',
      shear: 'Shears out &bull; press and hold a flower to collect it',
      sell: 'Selling &bull; press and hold a flower to sell it',
      fert: '\u{1F33E} Fertilizer out &bull; press and hold a flourishing flower to cross it with a neighbour'
    };

    // Tool artwork is drawn, not emoji, for the same reason the flowers are:
    // a glyph from a font we don't control can't be recolored to match the
    // tool's state, and looks different on every device.
    function canIconSVG(px) {
      return '<svg viewBox="0 0 32 28" width="' + px + '" height="' + Math.round(px * 28 / 32) + '">' +
        '<path d="M13 8 a5 4.5 0 0 1 9 0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>' +
        '<path d="M12 11 L3 6 L1 11 L3 13 L12 16 Z" fill="currentColor"/>' +
        '<path d="M11 9 h16 v9 a5 5 0 0 1 -5 5 h-6 a5 5 0 0 1 -5 -5 z" fill="currentColor"/>' +
        '</svg>';
    }
    function shearIconSVG(px) {
      return '<svg viewBox="0 0 32 32" width="' + px + '" height="' + px + '" fill="none" ' +
        'stroke="currentColor" stroke-width="2.6" stroke-linecap="round">' +
        '<circle cx="8" cy="25" r="4"/><circle cx="24" cy="25" r="4"/>' +
        '<path d="M10.7 21.6 L25 4"/><path d="M21.3 21.6 L7 4"/>' +
        '</svg>';
    }
    function toolIconHtml(tool, px) {
      if (tool === 'water') return canIconSVG(px);
      if (tool === 'shear') return shearIconSVG(px);
      // Same sheaf-of-rice glyph the shop's fertilizer sack already uses
      // (see .stand-fert-icon) - reused rather than hand-drawing a second
      // stroke-only icon for the same concept.
      if (tool === 'fert') return '<span class="tool-fert-glyph" style="font-size:' +
        Math.round(px * 1.05) + 'px">\u{1F33E}</span>';
      return '<span class="tool-sell-glyph" style="font-size:' + Math.round(px * 1.05) + 'px">$</span>';
    }
    // The toolbox itself: a handle, a lid seam and a latch, drawn stroke-only
    // like the shears so the set reads as one hand-drawn family.
    function toolboxIconSVG(px) {
      return '<svg viewBox="0 0 32 26" width="' + px + '" height="' + Math.round(px * 26 / 32) + '" ' +
        'fill="none" stroke="currentColor" stroke-linecap="round">' +
        '<path d="M9 9 a7 6.5 0 0 1 14 0" stroke-width="2.4"/>' +
        '<rect x="2" y="9" width="28" height="15" rx="3" stroke-width="2.4"/>' +
        '<line x1="2" y1="15.5" x2="30" y2="15.5" stroke-width="2.2"/>' +
        '<rect x="13" y="13" width="6" height="5" rx="1.2" stroke-width="2.2"/>' +
        '</svg>';
    }

    var activeTool = null;
    var TOOL_KEYS = ['water', 'shear', 'sell', 'fert'];

    function initToolRail() {
      TOOL_KEYS.forEach(function (t) {
        document.getElementById('tool-' + t).innerHTML = toolIconHtml(t, t === 'water' ? 27 : 24);
      });
      document.getElementById('tool-toggle').innerHTML = toolboxIconSVG(26);
      var toggle = document.getElementById('tool-toggle');
      toggle.addEventListener('pointerdown', onToolboxPointerDown);
      window.addEventListener('pointermove', onToolboxPointerMove);
      window.addEventListener('pointerup', onToolboxPointerUp);
      window.addEventListener('pointercancel', onToolboxPointerUp);
      syncFertTool();
    }
    // The fourth petal only shows up once there's actually a bag to spend -
    // an always-visible slot nobody without fertilizer could ever use would
    // just be dead weight the other three don't carry. Called at boot and
    // wherever state.fertilizer actually changes (buyFertilizer, doBreed),
    // rather than folded into updateHUD, which runs far more often than
    // fertilizer count does.
    function syncFertTool() {
      document.getElementById('tool-petals').classList.toggle('has-fert', state.fertilizer > 0);
    }
    // Uses classList.toggle rather than overwriting className wholesale, so a
    // pending tutorial .hint on the toggle button survives an equip/unequip.
    function renderToolRail() {
      var toggle = document.getElementById('tool-toggle');
      TOOL_KEYS.forEach(function (t) {
        document.getElementById('tool-' + t).classList.toggle('active', activeTool === t);
        toggle.classList.toggle(t, activeTool === t);
      });
      toggle.classList.toggle('active', !!activeTool);
      toggle.classList.toggle('toolbox', !activeTool);
      toggle.innerHTML = activeTool ? toolIconHtml(activeTool, activeTool === 'water' ? 27 : 24) : toolboxIconSVG(26);
      toggle.title = activeTool ? ('Put away the ' + TOOL_NAMES[activeTool]) : 'Tools';
      // Spring pop on every change so the icon swap reads as a physical
      // action. Removed and re-added to restart the animation even when the
      // class is already there from a previous swap.
      toggle.classList.remove('equip-pop');
      void toggle.offsetWidth;
      toggle.classList.add('equip-pop');
    }

    // The rail floats above the plant sheet on purpose - that sheet's hints
    // name these tools, so they have to stay tappable underneath it - but it
    // must never float above a full-screen panel: a toolbox stuck on top of
    // the scrapbook or the market stand reads as a rendering bug, and there
    // is nothing to tend in any of them. One check called wherever a
    // full-screen panel opens or closes, rather than a display toggle
    // duplicated across six functions.
    var FULLSCREEN_PANELS = ['shop-panel', 'journal-panel', 'notes-panel', 'howto-panel'];
    function fullscreenPanelOpen() {
      return FULLSCREEN_PANELS.some(function (id) {
        return document.getElementById(id).classList.contains('open');
      });
    }
    function syncToolRail() {
      var covered = fullscreenPanelOpen();
      document.getElementById('tool-rail').style.display = covered ? 'none' : '';
      if (covered) setRailOpen(false); // don't come back with the fan stuck out
      syncSeedRail();
    }
    // The seed pouch hides for either of two independent reasons - a
    // full-screen panel covering the map (nothing to plant underneath it),
    // or the top-right ... menu being open (they share that same corner and
    // the dropdown would otherwise overlap it) - so this is its own function
    // rather than folded into syncToolRail's tool-rail-only "covered" check,
    // which the menu has no business affecting.
    function syncSeedRail() {
      var hide = fullscreenPanelOpen() || document.getElementById('menu-dropdown').classList.contains('open');
      document.getElementById('seed-rail').style.display = hide ? 'none' : '';
      if (hide && seedRailOpen) closeSeedFan();
    }
    // The tutorial's pointer at whichever tool it is asking for next; cleared
    // the moment that tool is equipped. A tool already in hand is never
    // pointed at - the player has plainly found it. Pulses the toolbox itself
    // (so it's visible while stowed) as well as the real petal underneath,
    // which starts pulsing the moment the fan is opened.
    function setToolHint(tool) {
      if (tool && tool === activeTool) tool = null;
      document.getElementById('tool-toggle').classList.toggle('hint', !!tool && !activeTool);
      TOOL_KEYS.forEach(function (t) {
        document.getElementById('tool-' + t).classList.toggle('hint', tool === t);
      });
    }

    // Same idea as setToolHint, but for the seed pouch - it lives outside the
    // tool rail (see #seed-toggle) so it needs its own on/off switch rather
    // than fitting the tool-keyed one above. Cleared the moment a seed is
    // actually equipped (see equipSeed), never toggled back on itself.
    function setSeedHint(on) {
      document.getElementById('seed-toggle').classList.toggle('hint', !!on);
    }

    function setActiveTool(tool) {
      cancelHold();
      activeTool = tool;
      if (tool) {
        setToolHint(null);
        closePlantPanel();  // both are ways of acting on a flower; only one at a time
        closeShop();
        // A tool and an equipped seed are two different "what does a tap do"
        // modes - can't have both, so picking up a tool puts any seed away.
        if (equippedSeed) unequipSeed();
        vibrate(10);
      }
      renderToolRail();
      updateHUD();
    }

    // ---- The toolbox fan: open/close state and the tap-or-drag gesture ----
    var railOpen = false;
    var RAIL_HOVER_PAD = 10; // px of slop added around a petal's hit box for finger imprecision
    function setRailOpen(open) {
      railOpen = open;
      document.getElementById('tool-petals').classList.toggle('open', open);
      document.getElementById('tool-toggle').classList.toggle('rail-open', open);
      clearRailHover();
    }
    function clearRailHover() {
      if (!railPointer || !railPointer.hoverTool) return;
      document.getElementById('tool-' + railPointer.hoverTool).classList.remove('drag-hover');
      railPointer.hoverTool = null;
    }
    // Picking a tool selects it, closes the fan, and cancels any hover glow.
    function selectTool(tool) {
      setRailOpen(false);
      setActiveTool(tool);
    }
    // Equipped-state tap: fires as a normal click after pointerup, since
    // onToolboxPointerDown below does not preventDefault while a tool is
    // already active (there is nothing to fan out to).
    function onToolboxEquippedClick() {
      if (activeTool) setActiveTool(null);
    }

    function hitTestPetal(x, y) {
      for (var i = 0; i < TOOL_KEYS.length; i++) {
        var t = TOOL_KEYS[i];
        var el = document.getElementById('tool-' + t);
        // A hidden petal (fert with no fertilizer - see .tool-btn.fert)
        // collapses to a degenerate 0,0,0,0 rect at the viewport origin, not
        // to nothing - skip it explicitly rather than let a drag near the
        // literal top-left corner of the screen phantom-hit it.
        if (el.offsetParent === null) continue;
        var r = el.getBoundingClientRect();
        if (x >= r.left - RAIL_HOVER_PAD && x <= r.right + RAIL_HOVER_PAD &&
            y >= r.top - RAIL_HOVER_PAD && y <= r.bottom + RAIL_HOVER_PAD) return t;
      }
      return null;
    }

    var railPointer = null;
    function onToolboxPointerDown(ev) {
      // With a tool already equipped the toggle button is a plain unequip
      // tap (handled by onToolboxEquippedClick) - there is no fan to open.
      if (activeTool || railPointer) return;
      ev.preventDefault();
      railPointer = { id: ev.pointerId, startedOpen: railOpen, hoverTool: null };
      if (!railOpen) { setRailOpen(true); vibrate(10); }
    }
    function onToolboxPointerMove(ev) {
      if (!railPointer || ev.pointerId !== railPointer.id) return;
      var hit = hitTestPetal(ev.clientX, ev.clientY);
      if (hit === railPointer.hoverTool) return;
      if (railPointer.hoverTool) document.getElementById('tool-' + railPointer.hoverTool).classList.remove('drag-hover');
      railPointer.hoverTool = hit;
      if (hit) {
        document.getElementById('tool-' + hit).classList.add('drag-hover');
        vibrate(8);
      }
    }
    function onToolboxPointerUp(ev) {
      if (!railPointer || ev.pointerId !== railPointer.id) return;
      var rp = railPointer;
      railPointer = null;
      if (rp.hoverTool) {
        document.getElementById('tool-' + rp.hoverTool).classList.remove('drag-hover');
        selectTool(rp.hoverTool);
        return;
      }
      // Released over nothing. If the fan was already open when this press
      // started, this was a second deliberate tap on the toolbox - close it.
      // If this press is what opened the fan (a plain tap, or a hold that
      // never reached a petal), leave it open so a follow-up tap can pick one.
      if (rp.startedOpen) setRailOpen(false);
    }

    // ---- Screen-space effects over the map -------------------------------
    // Kept out of Leaflet entirely: these are transient, must never be tap
    // targets, and a divIcon would be thrown away by the next renderPlants().
    var fxItems = [];
    function positionFx(item) {
      var pt = map.latLngToContainerPoint([item.lat, item.lng]);
      item.el.style.left = pt.x + 'px';
      item.el.style.top = pt.y + 'px';
    }
    function addFx(html, lat, lng, cls, ms) {
      var el = document.createElement('div');
      el.className = 'fx-item ' + (cls || '');
      el.innerHTML = html;
      document.getElementById('fx-layer').appendChild(el);
      var item = { el: el, lat: lat, lng: lng };
      fxItems.push(item);
      positionFx(item);
      if (ms) setTimeout(function () { removeFx(item); }, ms);
      return item;
    }
    function removeFx(item) {
      var i = fxItems.indexOf(item);
      if (i >= 0) fxItems.splice(i, 1);
      if (item.el.parentNode) item.el.parentNode.removeChild(item.el);
    }
    map.on('move zoom', function () { fxItems.forEach(positionFx); });

    // ---- Watering animation ----------------------------------------------
    // waterPlant() is deliberately called at the END, so the flower grows once
    // the can has poured and left rather than the instant you tap. Guarded per
    // hex so a second tap during the pour can't water the same plant twice.
    var wateringKeys = {};
    function waterWithCan(key) {
      var p = state.plants[key];
      if (!p || wateringKeys[key]) return;
      // Reduced motion collapses every animation to 0.01ms, so the can would
      // never be seen - waiting out its duration would just be dead time.
      if (reduceMotion) { waterPlant(key); return; }

      wateringKeys[key] = true;
      var drops = '';
      for (var i = 0; i < 5; i++) {
        drops += '<div class="water-drop" style="left:' + (i * 4 - 1) + 'px;bottom:17px;' +
          'animation-delay:' + (350 + i * 85) + 'ms"></div>';
      }
      addFx('<div class="water-can pour">' + canIconSVG(30) + '</div>' + drops,
        p.lat, p.lng, 'water-fx', WATER_ANIM_MS + 140);
      setTimeout(function () {
        delete wateringKeys[key];
        if (state.plants[key]) waterPlant(key);
      }, WATER_ANIM_MS);
    }

    // ---- Press-and-hold confirmation --------------------------------------
    var RING_R = 22;
    var RING_C = 2 * Math.PI * RING_R;
    function holdRingHtml(tool) {
      return '<svg width="56" height="56" viewBox="0 0 56 56">' +
        '<circle cx="28" cy="28" r="' + RING_R + '" fill="rgba(255,255,255,0.94)" ' +
        'stroke="rgba(60,40,20,0.14)" stroke-width="5"/>' +
        '<circle class="hold-arc" cx="28" cy="28" r="' + RING_R + '" fill="none" stroke="#bfe6cd" ' +
        'stroke-width="5" stroke-linecap="round" transform="rotate(-90 28 28)" ' +
        'stroke-dasharray="' + RING_C.toFixed(1) + '" stroke-dashoffset="' + RING_C.toFixed(1) + '"/>' +
        '</svg><div class="hold-ring-icon">' + toolIconHtml(tool, 22) + '</div>';
    }

    var hold = null;
    function startHold(tool, target) {
      cancelHold();
      var o = target.obj;
      // One hex north of the flower itself, not on top of it - a finger
      // pressed down on the flower for a full second otherwise covers the
      // ring it's supposed to be watching fill. (0,1) is the one HEX_NEIGHBORS
      // direction with zero longitude delta (see hexCenter's math), i.e. the
      // neighbor directly above on screen rather than up-and-to-a-side.
      var above = hexCenter(o.q, o.r + 1);
      var item = addFx(holdRingHtml(tool), above.lat, above.lng, 'hold-ring', 0);
      hold = {
        tool: tool, target: target, item: item, raf: null,
        arc: item.el.querySelector('.hold-arc'), start: performance.now()
      };
      vibrate(8);
      stepHold();
    }
    function stepHold() {
      if (!hold) return;
      var t = Math.min(1, (performance.now() - hold.start) / HOLD_MS);
      hold.arc.setAttribute('stroke-dashoffset', (RING_C * (1 - t)).toFixed(1));
      hold.arc.setAttribute('stroke', mixHex('#bfe6cd', '#4caf6d', t));
      if (t >= 1) { completeHold(); return; }
      hold.raf = requestAnimationFrame(stepHold);
    }
    function cancelHold() {
      if (!hold) return;
      if (hold.raf) cancelAnimationFrame(hold.raf);
      removeFx(hold.item);
      hold = null;
    }
    function completeHold() {
      var h = hold;
      cancelHold();
      // The finger is still down at this point, so the pointerup that follows
      // must not read as an aborted hold and nag about holding longer.
      if (pointerState) pointerState.completed = true;
      vibrate(30);
      applyToolAction(h.tool, h.target);
    }

    // ---- What a tool can act on ------------------------------------------
    // One shape for both kinds of flower, so every check below can work in
    // terms of `obj` (which always has q/r/lat/lng) and only branch on kind
    // where the two genuinely differ.
    function toolTargetAt(key) {
      if (state.plants[key]) return { kind: 'plant', key: key, obj: state.plants[key] };
      if (state.wild[key]) return { kind: 'wild', key: key, obj: state.wild[key] };
      return null;
    }

    // The reason this tool can't be used on this flower, or null if it can.
    // Checked before the hold ring starts (so you never hold for a second and
    // then get refused) and again on release (so the message is only spoken
    // for a genuine tap, never for a pan that happened to start on a flower).
    function toolBlockedReason(tool, target) {
      var o = target.obj;
      if (!state.userPos) return 'Waiting for GPS to lock on...';
      var uh = latLngToHex(state.userPos.lat, state.userPos.lng);
      if (hexDist(uh.q, uh.r, o.q, o.r) > PLANT_RANGE_HEX) return 'Walk closer to reach this one \u{1F6B6}';

      if (tool === 'water') {
        if (target.kind === 'wild') return 'Wild flowers look after themselves - pick this one instead';
        var d = recomputePlant(o, Date.now());
        if (d.ready || d.wilted) return null;
        return d.stage >= MAX_STAGE
          ? 'Fully grown - the shears or $ take it from here'
          : 'Not thirsty yet - ready to grow in ' + formatDuration(d.readyIn);
      }
      if (tool === 'fert') {
        if (target.kind === 'wild') return 'Wild flowers can\'t be crossed - only your own';
        if (state.fertilizer <= 0) return "You're out of fertilizer - buy some from the Shop \u{1F338}";
        var pd = recomputePlant(o, Date.now());
        if (pd.stage < MAX_STAGE) return 'Not flourishing yet - it needs to fully grow first';
        if (Date.now() < (o.breedReadyAt || 0)) {
          return 'Still resting from its last cross - ready in ' + formatDuration(breedWaitMs(o));
        }
        if (!breedPartnersFor(target.key).length) return 'No flourishing neighbour ready to cross with';
        return null;
      }
      // Shears and $ both need something worth taking. Wild flowers always are.
      if (target.kind === 'wild') return null;
      if (recomputePlant(o, Date.now()).stage < 2) return 'Not in bloom yet - it needs more water first';
      return null;
    }

    function applyToolAction(tool, target) {
      if (tool === 'fert') {
        // toolBlockedReason already guarantees at least one ready neighbour
        // by this point (checked before the hold even starts, and again
        // here can't have changed mid-hold in a single-player game) - a
        // random pick among them, instead of the plant panel's "which one"
        // picker (openBreedPicker), is the whole point of the tool: one
        // press-and-hold to cross, no extra decision first. doBreed does
        // its own full re-validation and is the same worker the panel's
        // "Cross with a neighbour" button already uses.
        var partners = breedPartnersFor(target.key);
        var partnerKey = partners[Math.floor(Math.random() * partners.length)];
        doBreed(target.key, partnerKey);
        return;
      }
      var sell = tool === 'sell';
      if (target.kind === 'wild') pickWild(target.key, sell);
      else onHarvestClick(target.key, sell);  // via onHarvestClick so the tutorial still sees it
    }

    // ---- Pointer plumbing --------------------------------------------------
    // Tool taps can't ride on Leaflet's click event: a press-and-hold has to
    // start reacting while the finger is still down. Dragging is left enabled
    // and a hold is simply cancelled once the finger travels far enough, so
    // panning the map with a tool in hand still works normally.
    var pointerState = null;
    function onToolPointerDown(ev) {
      if (!activeTool || pointerState) return;
      if (ev.pointerType === 'mouse' && ev.button !== 0) return;
      var ll = map.mouseEventToLatLng(ev);
      var h = latLngToHex(ll.lat, ll.lng);
      var target = toolTargetAt(hexKey(h.q, h.r));
      pointerState = {
        id: ev.pointerId, x: ev.clientX, y: ev.clientY,
        hex: h, target: target, moved: false, completed: false
      };
      // Nothing starts sweeping for a tap-action tool, an empty hex, or a
      // flower this tool can't be used on - those are all resolved on release.
      if (activeTool === 'water' || !target) return;
      if (!toolBlockedReason(activeTool, target)) startHold(activeTool, target);
    }
    function onToolPointerMove(ev) {
      if (!pointerState || ev.pointerId !== pointerState.id) return;
      if (Math.abs(ev.clientX - pointerState.x) > HOLD_MOVE_PX ||
          Math.abs(ev.clientY - pointerState.y) > HOLD_MOVE_PX) {
        pointerState.moved = true;
        cancelHold();
      }
    }
    function onToolPointerUp(ev) {
      if (!pointerState || ev.pointerId !== pointerState.id) return;
      var ps = pointerState;
      pointerState = null;
      cancelHold();
      if (ps.moved || ps.completed || !activeTool) return;
      resolveToolTap(ps);
    }

    function resolveToolTap(ps) {
      if (!ps.target) {
        // Empty ground. Only worth a word inside planting range, where the tap
        // was probably meant to plant something - otherwise stay quiet.
        if (state.userPos) {
          var uh = latLngToHex(state.userPos.lat, state.userPos.lng);
          if (hexDist(uh.q, uh.r, ps.hex.q, ps.hex.r) <= PLANT_RANGE_HEX) {
            toast('Put the ' + TOOL_NAMES[activeTool] + ' away to plant here \u{1F331}');
          }
        }
        return;
      }
      var reason = toolBlockedReason(activeTool, ps.target);
      if (reason) { toast(reason); return; }
      if (activeTool === 'water') { waterWithCan(ps.target.key); return; }
      toast('Press and hold to confirm');
    }

    map.getContainer().addEventListener('pointerdown', onToolPointerDown);
    // Move and release go on the window: a mouse can leave the map mid-hold,
    // and a hold that was never cleaned up would keep its ring on screen.
    window.addEventListener('pointermove', onToolPointerMove);
    window.addEventListener('pointerup', onToolPointerUp);
    window.addEventListener('pointercancel', onToolPointerUp);

    // ---------------------------------------------------------------------
    //  SEEDS
    //  The seed packet at the top-right is the same idea as the toolbox,
    //  one level deeper: tap (or hold-and-drag) it to fan out every species
    //  you hold at least one seed of; tap a species and its fan is replaced
    //  by that species' owned colors; tap a color and it equips, replacing
    //  the packet with that flower's own icon - exactly like a tool. An
    //  equipped seed plants itself with a plain tap on empty ground (see
    //  plantEquippedSeedAt, wired into the map click handler below) and
    //  stays equipped across taps, so filling a bed with one color is a row
    //  of taps rather than a picker round-trip per hex.
    //
    //  Every icon carries a count badge: the packet shows the total seeds
    //  held, a species petal shows that species' total, and a color petal
    //  (and the equipped toggle) show that exact variant's count. Species
    //  and colors with zero seeds never appear - "options should be limited
    //  to the seeds the player actually has" - so the fan is never a picker
    //  for things you can't plant, unlike the shop.
    // ---------------------------------------------------------------------
    // A torn-edge packet, like a real seed envelope: zigzags top and
    // bottom stand for the ripped paper, the rect between them is the
    // seam each zigzag tears away from - tall like a real packet, not
    // square - and a real flower (the same flowerSVG the journal draws)
    // sits printed in the middle, standing in for the picture on the
    // front of the packet. The outline stays stroke-only currentColor
    // like the tool icons; the flower carries its own real petal/center
    // colors, same as everywhere else it's drawn.
    function seedPacketIconSVG(px) {
      var fSize = 16, fx = 6, fy = 9;
      var flowerRaw = flowerSVG(speciesFor('tulip'), colorFor('red'), 100);
      var flowerInner = flowerRaw.replace(/^<svg[^>]*>/, '').replace(/<\/svg>\s*$/, '');
      var flowerMarkup = '<svg x="' + fx + '" y="' + fy + '" width="' + fSize + '" height="' + fSize +
        '" viewBox="0 0 100 100">' + flowerInner + '</svg>';
      return '<svg viewBox="0 0 28 34" width="' + px + '" height="' + Math.round(px * 34 / 28) + '" ' +
        'fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M3.5 6 L6.1 1 L8.8 6 L11.4 1 L14 6 L16.6 1 L19.2 6 L21.9 1 L24.5 6" stroke-width="1.5"/>' +
        '<path d="M3.5 28 L6.1 33 L8.8 28 L11.4 33 L14 28 L16.6 33 L19.2 28 L21.9 33 L24.5 28" stroke-width="1.5"/>' +
        '<rect x="3.5" y="6" width="21" height="22" stroke-width="1.5"/>' +
        flowerMarkup +
        '</svg>';
    }
    function seedCountBadgeHtml(n) {
      return n > 0 ? '<span class="seed-count-badge">' + n + '</span>' : '';
    }

    var equippedSeed = null;         // a variant key ("species:color"), or null
    var seedRailOpen = false;
    var seedLevel = 'species';       // 'species' while the fan shows species, 'color' once one is picked
    var seedSpecies = null;          // which species' colors are showing, once seedLevel === 'color'

    // ---- What's actually in the pouch, grouped for the fan -----------------
    function ownedSeedVariantsOfSpecies(speciesKey) {
      return sortVariants(Object.keys(state.seeds).filter(function (vk) {
        return state.seeds[vk] > 0 && parseVariant(vk).species === speciesKey;
      }));
    }
    function ownedSpeciesKeys() {
      return SPECIES.map(function (s) { return s.key; })
        .filter(function (k) { return ownedSeedVariantsOfSpecies(k).length > 0; });
    }
    function totalSeedCount() {
      return Object.keys(state.seeds).reduce(function (n, vk) { return n + (state.seeds[vk] || 0); }, 0);
    }
    function speciesSeedCount(speciesKey) {
      return ownedSeedVariantsOfSpecies(speciesKey).reduce(function (n, vk) { return n + state.seeds[vk]; }, 0);
    }

    // ---- Rendering -----------------------------------------------------
    // Pure DOM sync, safe to call as often as needed - updateHUD() calls
    // this unconditionally on every state change AND on the 60s tick (see
    // tickPlants), so nothing in here may have a visible side effect beyond
    // reflecting current state. The spring-pop animation used to live here
    // and replayed on every one of those calls forever, even with nothing
    // equipped and nothing changing - see popSeedToggle() below, which is
    // what the actual equip/unequip transitions call instead.
    function renderSeedToggle() {
      var toggle = document.getElementById('seed-toggle');
      toggle.classList.toggle('seed-packet', !equippedSeed);
      toggle.classList.toggle('active', !!equippedSeed);
      if (equippedSeed) {
        // No fixed 3-way palette to key a CSS rule off like the tools have -
        // any of 98 variants can end up here, so the accent is resolved and
        // applied inline instead.
        var c = colorFor(parseVariant(equippedSeed).color);
        toggle.style.borderColor = c.line;
        toggle.style.color = c.ink;
      } else {
        toggle.style.borderColor = '';
        toggle.style.color = '';
      }
      toggle.innerHTML = (equippedSeed ? variantChip(equippedSeed, 26) : seedPacketIconSVG(24)) +
        seedCountBadgeHtml(equippedSeed ? (state.seeds[equippedSeed] || 0) : totalSeedCount());
      toggle.title = equippedSeed ? ('Put away the ' + variantName(equippedSeed) + ' seed') : 'Seeds';
    }
    // Small spring pop so an equip/unequip genuinely reads as a physical
    // action - called only by equipSeed()/unequipSeed() themselves, the two
    // places `equippedSeed` actually changes, never by the constant DOM-sync
    // above.
    function popSeedToggle() {
      var toggle = document.getElementById('seed-toggle');
      toggle.classList.remove('equip-pop');
      void toggle.offsetWidth;
      toggle.classList.add('equip-pop');
    }

    // Spreads n petals evenly across an arc starting straight down (90deg)
    // and sweeping toward the left - away from the screen edge the packet
