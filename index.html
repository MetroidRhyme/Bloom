    }

    function heldOf(vk, isCluster) {
      var e = state.inventory[vk];
      if (!e) return 0;
      return (isCluster ? e.cluster : e.single) || 0;
    }
    function heldTotalOf(vk) { return heldOf(vk, false) + heldOf(vk, true); }
    // Every variant of one species that has ever been kept, rarest last.
    function discoveredColorsOf(speciesKey) {
      return sortVariants(Object.keys(state.inventory).filter(function (vk) {
        return parseVariant(vk).species === speciesKey;
      }));
    }
    function heldOfSpecies(speciesKey) {
      return discoveredColorsOf(speciesKey).reduce(function (n, vk) {
        return n + heldTotalOf(vk);
      }, 0);
    }
    // Not SPECIES * COLORS any more: a signature color counts once, on the one
    // species that can wear it.
    var TOTAL_VARIANTS = SPECIES.reduce(function (n, s) {
      return n + colorsForSpecies(s.key).length;
    }, 0);

    // Sell held flowers straight from the collection at the same rate as
    // harvesting them in the field would have paid.
    function sellHeld(vk, isCluster, qty) {
      var e = state.inventory[vk];
      if (!e) return;
      qty = Math.min(qty, heldOf(vk, isCluster));
      if (qty <= 0) return;

      var total = (isCluster ? SELL_CLUSTER : SELL_SINGLE) * qty;
      if (isCluster) e.cluster -= qty; else e.single -= qty;
      state.currency += total;
      state.stats.sold += qty;
      state.stats.earned += total;

      saveState();
      updateCurrencyPill();
      toast('Sold ' + qty + ' ' + variantName(vk) +
        (isCluster ? ' cluster' : ' bloom') + (qty === 1 ? '' : 's') + ' for ' + total + ' \u{1F338}');
      vibrate(20);
      renderJournalPage(parseVariant(vk).species);
    }

    // Pull held flowers apart for seeds of that same species. Rolled per
    // flower rather than once for the batch, so extracting five at once has
    // the same spread as extracting one five times.
    function extractHeld(vk, isCluster, qty) {
      var e = state.inventory[vk];
      if (!e) return;
      qty = Math.min(qty, heldOf(vk, isCluster));
      if (qty <= 0) return;

      var gained = 0;
      for (var i = 0; i < qty; i++) {
        gained += rollWeighted(isCluster ? SEED_YIELD_CLUSTER : SEED_YIELD_SINGLE);
      }
      if (isCluster) e.cluster -= qty; else e.single -= qty;
      // Extraction returns the exact variant it consumed, color included. That
      // is what makes a bred color self-sustaining once you have one, and why
      // the shop (standards only) still matters for anything you lack.
      state.seeds[vk] = (state.seeds[vk] || 0) + gained;
      state.stats.extracted += gained;
      state.stats.extractedFlowers += qty;

      saveState();
      toast('\u{1F331} Got ' + gained + ' ' + variantName(vk) + ' seed' +
        (gained === 1 ? '' : 's') + ' from ' + qty + ' ' + (isCluster ? 'cluster' : 'bloom') +
        (qty === 1 ? '' : 's'));
      vibrate(25);
      renderJournalPage(parseVariant(vk).species);
    }

    // The variants of one species you are actually holding right now, as
    // opposed to discoveredColorsOf(), which is everything ever kept.
    function heldVariantsOf(speciesKey) {
      return discoveredColorsOf(speciesKey).filter(function (vk) {
        return heldTotalOf(vk) > 0;
      });
    }

    // Every flower you've chosen to Keep, kept as a journal: one page per
    // species, with a spot for each of the fourteen colors and a row of
    // bookmarks along the top to switch between them. All seven bookmarks and
    // all fourteen spots are always drawn, so a gap reads as "still to breed"
    // rather than as a list that happens to be short.
    //
    // There was a contents page in front of this. It was removed because it
    // had one job - pick a species - and the bookmarks do that from anywhere,
    // so it had become a screen you tapped through on the way to the journal.
    var journalSpecies = null;  // which page is open
    var journalPick = null;     // which spot on it is selected, if any

    // Opening the journal cold lands on a page with something on it rather
    // than always on Sunflower, which may well be blank.
    function defaultJournalSpecies() {
      for (var i = 0; i < SPECIES.length; i++) {
        if (heldOfSpecies(SPECIES[i].key) > 0) return SPECIES[i].key;
      }
      for (var j = 0; j < SPECIES.length; j++) {
        if (discoveredColorsOf(SPECIES[j].key).length) return SPECIES[j].key;
      }
      return SPECIES[0].key;
    }

    function openInventory() {
      toggleMenu();
      closeShop(); closePlantPanel(); closeCrossNotes(); // only one full-screen/bottom-sheet panel open at a time
      // journalSpecies persists for the session, so re-opening the journal
      // returns to the page you were last reading.
      openJournalPage(journalSpecies || defaultJournalSpecies());
      document.getElementById('journal-panel').classList.add('open');
      syncToolRail();
    }
    function closeJournal() {
      document.getElementById('journal-panel').classList.remove('open');
      syncToolRail();
    }

    // The bookmark strip: the species' flower, in the rarest color of it you
    // own, with a superscript count of how many you're holding.
    function journalTabsHtml(activeKey) {
      return '<div class="journal-tabs">' + SPECIES.map(function (s) {
        var found = discoveredColorsOf(s.key);
        var held = heldOfSpecies(s.key);
        var color = found.length ? parseVariant(found[found.length - 1]).color : s.base;
        return '<button class="journal-tab' + (s.key === activeKey ? ' active' : '') +
          (found.length ? '' : ' blank') + '" title="' + s.name +
          '" onclick="openJournalPage(\'' + s.key + '\')">' +
          (held > 0 ? '<span class="journal-tab-count">' + held + '</span>' : '') +
          speciesChip(s, color, 26) + '</button>';
      }).join('') + '</div>';
    }

    // One stack (blooms or clusters) and its actions. Offers "1" and "all N"
    // rather than a quantity stepper - it covers "one or more" without adding
    // a fiddly control to a bottom-sheet-sized modal.
    function inventoryStackHtml(vk, isCluster) {
      var n = heldOf(vk, isCluster);
      if (n <= 0) return '';
      var label = isCluster ? 'Cluster' : 'Bloom';
      var each = isCluster ? SELL_CLUSTER : SELL_SINGLE;
      var yieldText = isCluster ? '2-4 seeds' : '1-2 seeds';
      var args = '\'' + vk + '\',' + (isCluster ? 'true' : 'false') + ',';

      var html = '<div class="inv-stack-title">' + label + 's &times; ' + n +
        ' <span style="font-weight:600;color:var(--text-dim)">(' + each + ' \u{1F338} or ' +
        yieldText + ' each)</span></div><div class="inv-actions">';
      html += '<button class="inv-btn sell" onclick="sellHeld(' + args + '1)">Sell 1 &bull; ' +
        each + ' \u{1F338}</button>';
      html += '<button class="inv-btn extract" onclick="extractHeld(' + args + '1)">Extract 1</button>';
      if (n > 1) {
        html += '<button class="inv-btn sell" onclick="sellHeld(' + args + n + ')">Sell all ' + n +
          ' &bull; ' + (each * n) + ' \u{1F338}</button>';
        html += '<button class="inv-btn extract" onclick="extractHeld(' + args + n + ')">Extract all ' +
          n + '</button>';
      }
      return html + '</div>';
    }

    // Opening a page picks the spot for you when there is only one thing on
    // it to act on - with a single color held, making you tap it first would
    // be a step with no decision in it.
    function openJournalPage(speciesKey) {
      var held = heldVariantsOf(speciesKey);
      journalPick = held.length === 1 ? held[0] : null;
      renderJournalPage(speciesKey);
    }
    function pickJournalSpot(vk) {
      // Tapping the open spot again closes it, so the page can go back to
      // being just the album.
      journalPick = (journalPick === vk) ? null : vk;
      renderJournalPage(parseVariant(vk).species);
    }

    function renderJournalPage(speciesKey) {
      var s = speciesFor(speciesKey);
      journalSpecies = speciesKey;

      var found = discoveredColorsOf(speciesKey);
      // Title and bookmark show the same flower in the same color - the
      // rarest of this species you own - so they don't read as two things.
      var headColor = found.length ? parseVariant(found[found.length - 1]).color : s.base;
      // innerHTML, not textContent - the chip is inline SVG markup.
      document.getElementById('journal-heading').innerHTML =
        speciesChip(s, headColor, 22) + ' ' + s.name;

      // Resolved before the grid is drawn: selling the last of a color has to
      // drop the selection with it, or the page keeps highlighting a spot that
      // is now empty and has no actions left under it.
      if (journalPick && (parseVariant(journalPick).species !== speciesKey ||
          heldTotalOf(journalPick) <= 0)) {
        journalPick = null;
      }

      // The shared palette plus this species' two signatures - a page never
      // shows a spot that species could not possibly fill.
      var palette = colorsForSpecies(speciesKey);
      var html = journalTabsHtml(speciesKey) +
        '<p class="journal-caption"><b>' + found.length + ' of ' + palette.length + '</b> ' +
        s.name + ' colors &bull; <b>' + Object.keys(state.inventory).length + ' of ' +
        TOTAL_VARIANTS + '</b> flowers found</p>';

      // A spot for every color, always. An empty spot is the point of the
      // page: it is what you have left to breed. The badge is the count you
      // are holding right now, which is a different thing from having found
      // it - a color you found and then sold keeps its spot filled in.
      html += '<div class="color-grid scrapbook-grid">' + palette.map(function (c) {
        var vk = variantKey(speciesKey, c.id);
        var kept = !!state.inventory[vk];
        var n = heldTotalOf(vk);
        // The four standards are unlocked on every page by default, kept
        // or not - they're sold in the Shop for any species already, so
        // there was never really a mystery to preserve there. Everything
        // past a standard still has to be bred and kept to reveal its
        // name, tracked per species (not globally - finding White on a
        // Sunflower used to reveal the name "White" on every other
        // species' still-empty spot too).
        var unlocked = kept || STANDARD_COLORS.indexOf(c.id) >= 0;
        var label = unlocked ? c.name : '?';
        var cls = 'color-cell slot' + (unlocked ? '' : ' blank') + (n > 0 ? ' held' : '') +
          (vk === journalPick ? ' picked' : '');
        return '<div class="' + cls + '" title="' + (unlocked ? label : 'Not found yet') + '"' +
          (n > 0 ? ' onclick="pickJournalSpot(\'' + vk + '\')"' : '') + '>' +
          (unlocked ? speciesChip(s, c.id, 30) : '<span class="slot-unknown">?</span>') +
          '<span class="slot-line"><span class="slot-label">' + label + '</span>' +
          (unlocked ? '<span class="slot-note' + (n > 0 ? ' some' : '') + '">' + n + '</span>' : '') +
          '</span></div>';
      }).join('') + '</div>';

      // The picked spot's actions, in one block under the album rather than a
      // stack of every color at once - a full page of held colors used to run
      // well past the bottom of a phone.
      var heldCount = heldVariantsOf(speciesKey).length;
      if (journalPick) {
        var c = colorFor(parseVariant(journalPick).color);
        var seeds = state.seeds[journalPick] || 0;
        html += '<div class="inv-variant" style="border-color:' + c.line + '">' +
          '<div class="inv-variant-name" style="color:' + c.ink + '">' + variantChip(journalPick, 20) +
          ' ' + variantName(journalPick) + '</div>' +
          inventoryStackHtml(journalPick, false) + inventoryStackHtml(journalPick, true) +
          '<div class="inv-meta">' + seeds + ' seed' + (seeds === 1 ? '' : 's') +
          ' in your pouch &bull; first kept ' + formatAgo(state.inventory[journalPick].firstAt) +
          ' &bull; selling pays Petals, extracting gives back seeds of ' +
          'this exact color</div></div>';
      } else if (heldCount > 0) {
        html += '<p class="journal-hint">Tap a spot with a number on it to sell those flowers ' +
          'or pull them apart for seeds.</p>';
      }

      // The lifetime tally lived on the contents page; it belongs somewhere,
      // and the foot of any page is as good as a screen of its own. One
      // line per stat rather than a bullet-run sentence.
      var st = state.stats;
      function statNum(n) { return '<span class="stat-num">' + n + '</span>'; }
      html += '<div class="journal-stats">' +
        '<p>Kept ' + statNum(st.kept) + ' all time</p>' +
        '<p>Sold ' + statNum(st.sold) + ' for ' + statNum(st.earned) + ' Petals</p>' +
        '<p>Extracted ' + statNum(st.extractedFlowers) + ' for ' + statNum(st.extracted) +
        ' seeds</p></div>';

      document.getElementById('journal-body').innerHTML = html;
    }

    // ---------------------------------------------------------------------
    //  CROSSING NOTES (BREEDING TREE)
    //  The player's own notebook of crossings, drawn as a family tree
    //  instead of a list. It deliberately shows only what has actually
    //  been seen, never BREED_TABLE/SIGNATURE_TABLE themselves - every
    //  node and every line comes from state.crosses (see
    //  crossResultDiscovered/computeCrossEdges below), so nothing here
    //  spoils a pairing the player hasn't actually tried.
    // ---------------------------------------------------------------------
    var notesSpecies = null; // which species tab is open, for the signature row

    // A color counts as "discovered" for the tree once it has actually come
    // out of a cross as something other than the pair fed in - the same
    // event the old list screen recorded, just read back out per-color
    // instead of per-pair. Standards are always discovered; nothing crosses
    // INTO them, they're just what you start with.
    function crossResultDiscovered(colorId) {
      return STANDARD_COLORS.indexOf(colorId) >= 0 || crossResultCount(colorId) > 0;
    }
    // Lifetime count of a color as a genuine cross result. Pairs that fall
    // back to one of their own parents (a tier-2+ attempt that "failed")
    // are excluded by the parts[0]/parts[1] check - that's not a discovery
    // of anything, so it shouldn't inflate the count or light up a node.
    function crossResultCount(colorId) {
      var total = 0;
      Object.keys(state.crosses).forEach(function (k) {
        var parts = k.split('+');
        if (parts[0] === colorId || parts[1] === colorId) return;
        total += state.crosses[k][colorId] || 0;
      });
      return total;
    }
    // Every recorded pairing that produced a genuinely new color, as
    // { a, b, child } triples - the tree's edges, one per discovery. Same
    // exclusion as crossResultCount, for the same reason.
    function computeCrossEdges() {
      var edges = [];
      Object.keys(state.crosses).forEach(function (k) {
        var parts = k.split('+'), got = state.crosses[k];
        Object.keys(got).forEach(function (id) {
          if (got[id] > 0 && id !== parts[0] && id !== parts[1]) {
            edges.push({ a: parts[0], b: parts[1], child: id });
          }
        });
      });
      return edges;
    }
    // The shared (non-species-locked) colors at one breeding tier, in a
    // fixed COLORS-array order - always all of them, discovered or not,
    // same "the gap is the point" logic as the journal's palette grid.
    function tierColors(tier) {
      return COLORS.filter(function (c) { return c.tier === tier && !c.species; });
    }

    // One card per tab, mirroring journalTabsHtml but pointed at the tree
    // instead of a journal page.
    function notesTabsHtml(activeKey) {
      return '<div class="journal-tabs">' + SPECIES.map(function (s) {
        var found = discoveredColorsOf(s.key);
        var color = found.length ? parseVariant(found[found.length - 1]).color : s.base;
        return '<button class="journal-tab' + (s.key === activeKey ? ' active' : '') +
          (found.length ? '' : ' blank') + '" title="' + s.name +
          '" onclick="openCrossPage(\'' + s.key + '\')">' + speciesChip(s, color, 26) + '</button>';
      }).join('') + '</div>';
    }

    // One tree node - the exact same taped-photo/dashed-pocket card the
    // journal uses (.color-cell.slot), so "the items with the lines between
    // them" read as the same object as everything else in the game.
    // showCount is off for the root row - nothing crosses into a standard,
    // so a count there would only ever read "0".
    // Picture only, to save space - no name or count underneath (compare
    // the journal's cards, which show both). The name and how many times
    // it's been bred move into the title tooltip instead of disappearing
    // outright, so a long-press/hover still gives the detail back.
    function crossNodeCard(colorId, speciesKey, showCount) {
      var c = colorFor(colorId);
      var discovered = crossResultDiscovered(colorId);
      // Drawn on a real flower rather than an abstract dot. A signature
      // color must use the one species that can wear it; a shared color
      // just borrows whichever species' page is open, so switching tabs
      // reflavors the whole tree instead of only its bottom row.
      var on = speciesFor(c.species || speciesKey);
      var n = showCount ? crossResultCount(colorId) : 0;
      var title = discovered ?
        (c.name + (showCount ? ' - crossed ' + n + ' time' + (n === 1 ? '' : 's') : '')) :
        'Not found yet';
      var cls = 'color-cell slot' + (discovered ? '' : ' blank');
      return '<div class="' + cls + '" data-color="' + colorId + '" title="' + title + '">' +
        (discovered ? speciesChip(on, colorId, 28) : '<span class="slot-unknown">?</span>') +
        '</div>';
    }

    function openCrossPage(speciesKey) { renderCrossTree(speciesKey); }

    function renderCrossTree(speciesKey) {
      notesSpecies = speciesKey;

      // Global, not per-species - the shared rows (standards through Gold)
      // are identical on every tab, so "how much of the whole tree have I
      // found" only makes sense counted once, not per page.
      var nFound = COLORS.filter(function (c) { return crossResultDiscovered(c.id); }).length;
      var html = notesTabsHtml(speciesKey) +
        '<p class="tree-caption"><b>' + nFound + ' of ' + COLORS.length + '</b> colors found &bull; <b>' +
        state.stats.bred + '</b> crossing' + (state.stats.bred === 1 ? '' : 's') + ' made</p>';

      if (!Object.keys(state.crosses).length) {
        html += '<p class="tree-hint">Grow two flowers to <b>flourishing</b> on neighbouring hexes, buy ' +
          'a bag of fertilizer in the Shop, then tap <b>Cross with a neighbour</b> to start filling this in.</p>';
      }

      var rows = [
        { colors: tierColors(0), showCount: false },
        { colors: tierColors(1), showCount: true },
        { colors: tierColors(2), showCount: true },
        { colors: tierColors(3), showCount: true },
        { colors: signatureColorsOf(speciesKey), showCount: true }
      ];
      html += '<div id="tree-scroll"><div id="tree-wrap"><svg id="tree-svg" class="tree-svg"></svg>' +
        rows.map(function (row) {
          return '<div class="tree-row">' + row.colors.map(function (c) {
            return crossNodeCard(c.id, speciesKey, row.showCount);
          }).join('') + '</div>';
        }).join('') + '</div></div>';

      document.getElementById('notes-body').innerHTML = html;
      // Needs a layout pass before getBoundingClientRect is trustworthy -
      // one frame is enough, and drawTreeEdges no-ops harmlessly if the
      // panel has since closed before it fires.
      requestAnimationFrame(drawTreeEdges);
    }

    // A gentle S-curve rather than a straight line - two of these, mirrored,
    // converging on the same child is what actually reads as a family tree
    // branch rather than a wiring diagram.
    function treeEdgePath(p1, p2) {
      var midY = (p1.y + p2.y) / 2;
      return '<path class="tree-edge" d="M' + p1.x.toFixed(1) + ' ' + p1.y.toFixed(1) +
        ' C ' + p1.x.toFixed(1) + ' ' + midY.toFixed(1) + ', ' +
        p2.x.toFixed(1) + ' ' + midY.toFixed(1) + ', ' +
        p2.x.toFixed(1) + ' ' + p2.y.toFixed(1) + '"/>';
    }
    function treeNodeCenter(el, wrapRect) {
      var r = el.getBoundingClientRect();
      return { x: r.left + r.width / 2 - wrapRect.left, y: r.top + r.height / 2 - wrapRect.top };
    }
    // Measures the actually-rendered card positions and draws a line from
    // each parent to each discovered child - deliberately not a fixed
    // coordinate table, so the tree stays correct however a row happens to
    // wrap or space out on a given phone width.
    function drawTreeEdges() {
      var svg = document.getElementById('tree-svg');
      var wrap = document.getElementById('tree-wrap');
      if (!svg || !wrap) return;
      var wr = wrap.getBoundingClientRect();
      svg.setAttribute('width', wr.width);
      svg.setAttribute('height', wr.height);
      svg.innerHTML = computeCrossEdges().map(function (e) {
        var elA = wrap.querySelector('[data-color="' + e.a + '"]');
        var elB = wrap.querySelector('[data-color="' + e.b + '"]');
        var elC = wrap.querySelector('[data-color="' + e.child + '"]');
        // A signature edge for a species other than the open tab has no
        // matching child node this render - skip it rather than draw to
        // nothing.
        if (!elA || !elB || !elC) return '';
        var pc = treeNodeCenter(elC, wr);
        return treeEdgePath(treeNodeCenter(elA, wr), pc) + treeEdgePath(treeNodeCenter(elB, wr), pc);
      }).join('');
    }
    // Line positions are measured pixels, not something CSS keeps in sync
    // on its own - a width change (rotating the phone, a browser chrome
    // resize) needs a redraw, but only while the tree is actually on screen.
    window.addEventListener('resize', function () {
      var np = document.getElementById('notes-panel');
      if (np && np.classList.contains('open')) drawTreeEdges();
    });

    function openCrossNotes() {
      toggleMenu();
      closeShop(); closePlantPanel(); closeJournal(); // only one full-screen/bottom-sheet panel open at a time
      renderCrossTree(notesSpecies || defaultJournalSpecies());
      document.getElementById('notes-panel').classList.add('open');
      syncToolRail();
    }
    function closeCrossNotes() {
      document.getElementById('notes-panel').classList.remove('open');
      syncToolRail();
    }

    // Answers "where are they, then?". Most of a day's wild flowers land
    // off-screen on purpose - the whole point is to walk to them - so without
    // a screen like this a successful spawn is indistinguishable from a failed
    // one, since both leave the visible map unchanged.
    function openWildInfo() {
      toggleMenu();
      resetModalChrome();
      document.getElementById('modal-title').textContent = 'Wild Flowers \u{1F33C}';

      var n = Object.keys(state.wild).length;
      var near = nearestWild();
      var html = '<p><b>' + n + '</b> wild ' + (n === 1 ? 'flower is' : 'flowers are') +
        ' out on the map right now, of up to ' + WILD_MAX + '.</p>';

      if (near) {
        var nd = wildDerived(near.w, Date.now());
        html += '<p>The nearest is a <b>' +
          variantName(variantKey(near.w.species, near.w.color || baseColorOf(near.w.species))) +
          '</b>, about <b>' +
          Math.round(near.dist) + 'm</b> to the <b>' + near.dir + '</b>' +
          (nd.wilted ? ', already wilting' : '') + ' - fades in <b>' + formatDuration(nd.goneIn) + '</b>.</p>';
      } else if (n > 0) {
        html += '<p>Waiting on GPS before it can tell you how far off they are.</p>';
      }

      if (n > 0) {
        html += '<p style="color:var(--text-dim)">They can be up to ' + WILD_SPAWN_RADIUS_M +
          'm away, so most start off-screen - zoom out and look for the glowing ones.</p>';
      }
      html += '<p style="color:var(--text-dim)">Wild flowers wilt after ' + (WILD_WILT_MS / HOUR) +
        ' hours and vanish ' + ((WILD_GONE_MS - WILD_WILT_MS) / HOUR) + ' hours after that.</p>';
      html += '<p style="color:var(--text-dim)">Today: ' + wildStatus + '</p>';

      // Spawning is local and synchronous now, so it can't fail and there is
      // nothing to retry - the day either ran or is still waiting on GPS.
      document.getElementById('modal-ok-btn').textContent = 'Got it';
      document.getElementById('modal-ok-btn').onclick = closeModal;
      document.getElementById('modal-body').innerHTML = html;
      document.getElementById('modal-overlay').classList.add('open');
    }

    // Modals normally show one full-width OK button; the breed picker hides it
    // in favor of its own buttons. Called at the top of every other opener so
    // that state doesn't leak between modal uses.
    function resetModalChrome() { document.getElementById('modal-ok-btn').style.display = ''; }

    function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
    // Tapping the dimmed backdrop (not the card itself) closes whatever
    // modal is open - mainly so the breed picker has a way to back out
    // without crossing, since it hides the usual OK/close button.
    document.getElementById('modal-overlay').addEventListener('click', function (e) {
      if (e.target.id === 'modal-overlay') closeModal();
    });

    // ---------------------------------------------------------------------
    //  SHOP
    // ---------------------------------------------------------------------

    // Cheat Mode: a dev/testing shortcut, not a real game feature - unlimited
    // Petals and a 15s stage-readiness time instead of 12h. Currency isn't a
    // true sentinel "infinite" value, just topped up to CHEAT_CURRENCY (see
    // buySeed/buyFertilizer, which re-apply the top-up after every spend so
    // it never actually runs down). Turning it off doesn't claw anything
    // back - whatever Petals or grown plants you ended up with stay, only
    // future costs/timing go back to normal, same as any other toggle in
    // this game (nothing here is ever taken away from the player).
    function setCheatMode(on) {
      state.cheatMode = on;
      if (on) {
        state.currency = Math.max(state.currency, CHEAT_CURRENCY);
        // Retroactively shortens whatever's left of the CURRENT wait for
        // anything still growing, so turning the toggle on is useful right
        // away instead of only affecting plants watered after this point.
        // Never lengthens a wait that was already shorter than 15s.
        var now = Date.now();
        Object.keys(state.plants).forEach(function (key) {
          var p = state.plants[key];
          if (p.stage < MAX_STAGE) p.readyAt = Math.min(p.readyAt, now + CHEAT_STAGE_MS);
        });
      }
      saveState();
      renderCheatToggle();
      renderShopRows();
      updateCurrencyPill();
      // renderPlants() before updateHUD(): it's what actually recomputes each
      // plant's cached _d (see makePlantIcon -> recomputePlant) from the
      // readyAt values just changed above - updateHUD only ever reads that
      // cache, so calling it first would still see the pre-toggle numbers.
      renderPlants();
      updateHUD();
      toast(on ? 'Cheat Mode on - unlimited Petals, 15s growth \u{1F31F}' : 'Cheat Mode off');
    }
    function toggleCheatMode() { setCheatMode(!state.cheatMode); }
    function renderCheatToggle() {
      var btn = document.getElementById('cheat-toggle-btn');
      btn.textContent = 'Cheat Mode: ' + (state.cheatMode ? 'On' : 'Off');
      btn.classList.toggle('on', !!state.cheatMode);
    }

    function updateCurrencyPill() {
      document.getElementById('currency-pill').innerHTML = '\u{1F338} ' +
        (state.cheatMode ? 'Unlimited' : state.currency);
    }

    // A farmer's-market stand rather than a catalogue: one crate per species
    // sits out on the counter, restocked once a day (see dailyStock above),
    // each wearing whichever STANDARD color today's shuffle gave it. Every
    // crate is the same price, so the stand is a pick-a-favourite display,
    // not a power ladder - and since it only ever shows STANDARD colors,
    // breeding stays the only route to everything past tier 0.
    function renderShopRows() {
      // The basket tag carries the one number that matters here; everything
      // else that used to be a sentence above the stand (sell price range,
      // "one of each flower") lives elsewhere (the sell screen, the crates
      // themselves) rather than crowding this screen with text.
      document.getElementById('basket-tag').textContent =
        (state.cheatMode ? 'Unlimited' : state.currency) + ' \u{1F338}';
      document.getElementById('stand-sign').innerHTML = 'ALL ITEMS<br>' + SEED_COST + ' \u{1F338}';
      var afford = state.currency >= SEED_COST;

      var crates = dailyStock().map(function (vk) {
        var v = parseVariant(vk), s = speciesFor(v.species), c = colorFor(v.color);
        var owned = state.seeds[vk] || 0;
        return '<button class="stand-item"' + (afford ? '' : ' disabled') +
          ' title="' + c.name + ' ' + s.name + ' - ' + SEED_COST + ' Petals"' +
          ' onclick="confirmBuySeed(\'' + vk + '\')">' +
          speciesChip(s, v.color, 34) +
          '<span class="stand-item-name">' + c.name + '<br>' + s.name + '</span>' +
          '<span class="stand-item-price">' + SEED_COST + ' \u{1F338}</span>' +
          (owned > 0 ? '<span class="stand-item-owned">have ' + owned + '</span>' : '') +
          '</button>';
      });

      // Fertilizer is the only non-seed thing for sale, and the only way
      // into the colors the stand never stocks - so it gets its own sack
      // rather than blending into the crate rows. Species come seven to a
      // day (see dailyStock), three per row, so the seventh always ends up
      // alone; rather than leave it stranded on its own row, it shares the
      // last row with the sack instead (see .stand-row-last).
      var fert =
        '<button class="stand-fert-btn"' + (state.currency >= FERTILIZER_COST ? '' : ' disabled') +
        ' title="Fertilizer - ' + FERTILIZER_COST + ' Petals" onclick="confirmBuyFertilizer()">' +
        '<span class="stand-fert-icon">\u{1F33E}</span>' +
        '<span class="stand-fert-label">Fertilizer</span>' +
        '<span class="stand-fert-price">' + FERTILIZER_COST + ' \u{1F338}</span>' +
        '<span class="stand-fert-owned">have ' + state.fertilizer + '</span>' +
        '</button>';

      document.getElementById('stand-row-1').innerHTML = crates.slice(0, 3).join('');
      document.getElementById('stand-row-2').innerHTML = crates.slice(3, 6).join('');
      document.getElementById('stand-row-3').innerHTML = crates.slice(6, 7).join('') + fert;
    }

    // Nothing in the shop spends Petals on a single tap. The buy controls are
    // small - four 38px swatches per species row on a phone - and a mis-tap
    // used to cost 20 Petals with only a toast to show for it, and no undo.
    // Same reasoning as the seed picker on every plant attempt: the confirm
    // is cheap, the mistake isn't. Costs and the balance you'd be left with
    // are both stated before the button, not after.
    function openPurchaseConfirm(opts) {
      if (state.currency < opts.cost) return;
      resetModalChrome();
      document.getElementById('modal-title').textContent = opts.title;
      document.getElementById('modal-body').innerHTML = opts.preview +
        '<p style="color:var(--text-dim)">Costs <b>' + opts.cost + ' \u{1F338} Petals</b>. ' +
        (state.cheatMode ? 'Cheat Mode is on, so this is free.' :
          'You have ' + state.currency + ' and would be left with <b>' +
          (state.currency - opts.cost) + '</b>.') + '</p>';
      var ok = document.getElementById('modal-ok-btn');
      ok.textContent = opts.okText;
      // Close first: the shop sheet sits underneath and stays open, so the
      // purchase lands back on a shop that re-renders with the new balance.
      ok.onclick = function () { closeModal(); opts.onOk(); };
      document.getElementById('modal-overlay').classList.add('open');
    }

    function confirmBuySeed(vk) {
      if (STANDARD_COLORS.indexOf(parseVariant(vk).color) < 0) return;
      var c = colorFor(parseVariant(vk).color);
      var have = state.seeds[vk] || 0;
      openPurchaseConfirm({
        title: 'Buy this seed?',
        preview: '<div class="buy-preview" style="border-color:' + c.line + '">' +
          variantChip(vk, 40) + '<span style="color:' + c.ink + '">' + variantName(vk) +
          ' seed</span></div>' +
          '<p>You have <b>' + have + '</b> of these in your pouch.</p>',
        cost: SEED_COST,
        okText: 'Buy it \u{1F331}',
        onOk: function () { buySeed(vk); }
      });
    }

    function confirmBuyFertilizer() {
      openPurchaseConfirm({
        title: 'Buy fertilizer?',
        preview: '<p>One bag of fertilizer crosses two <b>flourishing</b> flowers standing on ' +
          'neighbouring hexes, and a seedling comes up in the gap between them.</p>' +
          '<p>You have <b>' + state.fertilizer + '</b> bag' +
          (state.fertilizer === 1 ? '' : 's') + '.</p>',
        cost: FERTILIZER_COST,
        okText: 'Buy it \u{1F331}',
        onOk: buyFertilizer
      });
    }

    function buySeed(vk) {
      if (state.currency < SEED_COST) return;
      // Guard the shop's own rule at the point of purchase, not just in the
      // markup that renders it.
      if (STANDARD_COLORS.indexOf(parseVariant(vk).color) < 0) return;
      state.currency -= SEED_COST;
      if (state.cheatMode) state.currency = CHEAT_CURRENCY; // never actually runs down
      state.seeds[vk] = (state.seeds[vk] || 0) + 1;
      saveState();
      renderShopRows();
      updateCurrencyPill();
      toast('Bought a ' + variantName(vk) + ' seed \u{1F331}');
      vibrate(15);
      tutorialOnBuy();
    }

    function buyFertilizer() {
      if (state.currency < FERTILIZER_COST) return;
      state.currency -= FERTILIZER_COST;
      if (state.cheatMode) state.currency = CHEAT_CURRENCY; // never actually runs down
      state.fertilizer++;
      saveState();
      renderShopRows();
      updateCurrencyPill();
      syncFertTool(); // first bag ever bought - the toolbox petal can show up now
      toast('Bought a bag of fertilizer \u{1F331}');
      vibrate(15);
    }

    // Opened both from the menu ("Seed Shop") and by tapping the currency
    // pill directly - callers handle closing the menu dropdown themselves
    // (see the menu button's onclick) so this doesn't force it open/closed.
    function openShop() {
      closePlantPanel(); closeJournal(); closeCrossNotes(); // only one full-screen/bottom-sheet panel open at a time
      if (activeTool) setActiveTool(null); // shopping is not tending; don't leave a tool armed behind the sheet
      renderShopRows();
      renderCheatToggle();
      document.getElementById('shop-panel').classList.add('open');
      syncToolRail();
    }
    function closeShop() {
      document.getElementById('shop-panel').classList.remove('open');
      syncToolRail();
    }

    function toast(msg) {
      var c = document.getElementById('toast-container');
      var t = document.createElement('div');
      t.className = 'toast';
      t.textContent = msg;
      c.appendChild(t);
      requestAnimationFrame(function () { t.classList.add('show'); });
      setTimeout(function () {
        t.classList.remove('show');
        setTimeout(function () { t.remove(); }, 300);
      }, 2600);
    }

    function vibrate(ms) {
      if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} }
    }

    // ---------------------------------------------------------------------
    //  TUTORIAL (first run only)
    //  A brand-new save (see loadState's tutorialDone default) walks through
    //  one real plant -> water -> water -> water -> harvest -> shop cycle, i.e.
    //  the exact three-visit shape of the real game. The 12-hour readiness
    //  waits are simulated (tutorialMakeReady clears the ONE tutorial plant's
    //  readyAt, not a global time multiplier - recomputePlant treats that
    //  plant no differently from any other on every later call), so a new
    //  player sees the whole loop in under a minute instead of a day and a
    //  half. Every other step - actually planting, actually tapping Water,
    //  actually harvesting, actually buying - is a real action the player
    //  performs; nothing is auto-clicked for them. Always skippable via the
    //  banner's persistent link.
    // ---------------------------------------------------------------------
    var tutorial = { active: false, step: null, plantKey: null };

    function showTutorialBanner(html) {
      document.getElementById('tutorial-text').innerHTML = html;
      document.getElementById('tutorial-banner').classList.add('open');
    }
    function hideTutorialBanner() { document.getElementById('tutorial-banner').classList.remove('open'); }

    function startTutorial() {
      tutorial.active = true;
      tutorial.step = 'plant';
      tutorial.plantKey = null;
      setSeedHint(true);
      showTutorialBanner('Let\'s plant your first seed - tap the seed pouch (top right), pick one, then ' +
        'tap the ground within the green circle \u{1F331}');
    }

    function skipTutorial() {
      tutorial.active = false;
      state.tutorialDone = true;
      saveState();
      setToolHint(null);
      setSeedHint(false);
      hideTutorialBanner();
    }

    function finishTutorial() {
      tutorial.active = false;
      state.tutorialDone = true;
      saveState();
      setToolHint(null);
      setSeedHint(false);
      showTutorialBanner('You\'ve got the hang of it! Plant, water, harvest, and shop for better seeds ' +
        'whenever you like. Have fun out there! \u{1F337}');
      setTimeout(hideTutorialBanner, 6000);
    }

    // Clears the one tutorial plant's readiness wait so the next watering
    // advances it immediately. recomputePlant can't tell this apart from a
    // real 12 hours having passed, so nothing needs to be "reverted" once the
    // tutorial ends - it's just a normal plant with a running start.
    function tutorialMakeReady(p) {
      p.readyAt = Date.now();
      saveState();
      renderPlants();
      if (viewingKey === hexKey(p.q, p.r)) renderPlantPanel(viewingKey);
      updateHUD();
    }

    // Shared by every "wait, then it's ready again" beat. The callback
    // re-checks tutorial.active and the plant's existence because the player
    // can skip the tutorial - or harvest the plant - during the wait.
    function tutorialReadyAfterPause(bannerHtml) {
      tutorial.step = 'settling';
      setTimeout(function () {
        var p = state.plants[tutorial.plantKey];
        if (!p || !tutorial.active || tutorial.step !== 'settling') return;
        tutorialMakeReady(p);
        tutorial.step = 'water';
        setToolHint('water');
        showTutorialBanner(bannerHtml);
      }, 2500);
    }

    function tutorialOnPlant(key) {
      if (!tutorial.active || tutorial.step !== 'plant') return;
      tutorial.plantKey = key;
      showTutorialBanner('Nice! Give it a moment to settle in&hellip; \u{1F331}');
      tutorialReadyAfterPause('It\'s ready! Tap the toolbox (top left), pick the watering can, then tap ' +
        'your flower \u{1F4A7}');
    }

    // Out in the real game each of these beats is a 12-hour wait and a walk
    // back; here they're a 2.5s pause so the shape of the loop lands without
    // the player having to leave and return three times before anything
    // happens. Driven off the plant's real stage, not a step counter, so it
    // stays correct no matter which watering tap actually advanced it.
    function tutorialOnWater(key) {
      if (!tutorial.active || tutorial.step !== 'water' || key !== tutorial.plantKey) return;
      var p = state.plants[key];
      if (!p) return;
      if (p.stage >= MAX_STAGE) {
        tutorial.step = 'harvest';
        setToolHint('shear');
        showTutorialBanner('Flourishing! From the toolbox take the shears (or $ to sell) and press and ' +
          'hold on it \u{1F337}');
        return;
      }
      showTutorialBanner(GROWTH_MESSAGES[p.stage] + ' Give it another moment&hellip;');
      tutorialReadyAfterPause(p.stage === 1
        ? 'Ready again - water it once more to bring it into bloom \u{1F4A7}'
        : 'Ready again! One more watering makes it a full cluster \u{1F4A7}');
    }

    // Deliberately accepts a harvest at ANY step, not just the scripted one.
    // The Keep/Sell row is genuinely available from "In Bloom" onward, so a
    // player who harvests a stage early would otherwise leave the tutorial
    // pointing at a plant that no longer exists, with no way to advance it
    // short of Skip. Any pending settle timer sees the plant is gone and bows
    // out on its own, so the step move to 'shop' below can't be clobbered.
    function tutorialOnHarvest(key, sell, value) {
      if (!tutorial.active || key !== tutorial.plantKey) return;
      // A bonus (on top of any sale) guarantees a first seed is affordable
      // either way - Keep is never presented as the "wrong" choice, this just
      // makes sure the shop step isn't a wall for it. Tied to SEED_COST rather
      // than a literal so it cannot silently stop covering a seed if the price
      // is ever retuned; Keep pays nothing, so this bonus is the whole budget.
      var bonus = SEED_COST;
      state.currency += bonus;
      saveState();
      updateCurrencyPill();
      tutorial.step = 'shop';
      setToolHint(null);
      var msg = sell
        ? 'Nice sale! Plus a first-harvest bonus of +' + bonus + ' \u{1F338}.'
        : 'Kept for your collection! Here\'s a first-harvest bonus of +' + bonus + ' \u{1F338} to get you started.';
      showTutorialBanner(msg + ' Open the Shop (top right) and buy your next seed \u{1F337}');
    }

    function tutorialOnBuy() {
      if (!tutorial.active || tutorial.step !== 'shop') return;
      finishTutorial();
    }

    // ---------------------------------------------------------------------
    //  INIT
    // ---------------------------------------------------------------------
    initToolRail();             // draw the three tool icons once
    tickPlants();               // recompute any growth/wilt accrued while closed
    renderWild();               // wild flowers persist across sessions until picked
    updateHUD();
    updateCurrencyPill();
    setInterval(tickPlants, 60000);
  </script>
</body>
</html>
