    //  the GREENHOUSE section further down for where these get used.
    // -----------------------------------------------------------------------
    var POT_COLOR = '#c17a45';
    var POT_COLOR_DARK = '#9c5a2e';
    var POT_COLOR_LIGHT = '#e2a875';
    var SOIL_DARK = '#5c3a1f';
    var SOIL_MID = '#8a5a34';
    var SOIL_LIGHT = '#b98a54';

    // A clean, usable pot - same footprint every state (empty, mid-growth,
    // full cluster) sits on, so switching a pot's contents never resizes the
    // pot itself. Rim sits at y=86, exactly where the outdoor ground mound's
    // own soil line sat, which is what lets the stem markup below be reused
    // with zero coordinate changes - it was always rooted at (50,92), a few
    // units below where the rim/soil line sits here too.
    //
    // Split into a back (this function - the container wall and shading) and
    // a front (potRimFront, below) rather than one combined shape, so a stem
    // can be sandwiched between them - see buildPottedVisual. Without the
    // split, the stem (drawn on top of everything so it reads over the
    // soil) also drew on top of the rim's own near edge, which looked like
    // the stem was floating in front of the pot instead of growing out of
    // it.
    function potBody() {
      return '<path d="M28 86 L72 86 L65 109 L35 109 Z" fill="' + POT_COLOR + '"/>' +
        '<path d="M50 86 L72 86 L65 109 L54 109 Z" fill="' + POT_COLOR_DARK + '" opacity="0.35"/>' +
        '<path d="M28 86 L72 86 L70 90.5 L30 90.5 Z" fill="' + POT_COLOR_DARK + '" opacity="0.45"/>';
    }
    // The little bump of soil a pot keeps, same layered-ellipse technique the
    // outdoor ground mound uses (flat fill, a raised mound, a highlight
    // patch), just scaled down to a pot's opening. Stays entirely on the
    // back layer, same as potBody - soil is what a stem grows OUT of, so it
    // must never draw on top of one.
    function potSoil() {
      return '<ellipse cx="50" cy="87" rx="20.5" ry="3.2" fill="' + SOIL_DARK + '"/>' +
        '<ellipse cx="50" cy="85.5" rx="16" ry="2.6" fill="' + SOIL_MID + '"/>' +
        '<ellipse cx="50" cy="84.3" rx="8" ry="1.8" fill="' + SOIL_MID + '"/>' +
        '<ellipse cx="44" cy="84.8" rx="4.5" ry="1" fill="' + SOIL_LIGHT + '" opacity="0.55"/>';
    }
    // The rim's own near edge - drawn AFTER the stem (see buildPottedVisual)
    // so it sits in front of the stem's base, the same "something drawn last
    // occludes the very bottom of the stem" trick the outdoor ground mound
    // already uses (see groundNearRandom).
    //
    // The rim ellipse alone only reaches down to cy+ry=89.6 at its deepest
    // (center) point, but every shared stem markup (sproutMarkup,
    // BLOOM_STEM_MARKUP, CLUSTER_STEM_MARKUP) roots its path at literal
    // y=92 with a round line cap on a stroke up to 4.2 wide - so the
    // rendered stem actually paints down to roughly y=94, about 4-5 units
    // past where the rim ellipse's own coverage ends. That gap used to show
    // as a small blob of stem color on the pot's front wall, directly under
    // the rim - "stems clipping through the top of the pot" - on every
    // stage, made obviously visible once .pot-icon-art's scaleY stretch
    // (see the GREENHOUSE PANEL CSS) scales that gap up along with
    // everything else. Reordering stem-then-rim (already done) only
    // occludes what the rim ellipse actually covers; it was never deep
    // enough. This neck patch - opaque pot color first (to fully hide the
    // stem, not just dim it), then the same darkened wash potBody's own
    // neck-shadow band uses - closes that gap without touching the shared
    // stem markup or the rim ellipse's own look. Narrow (rx=9) so it only
    // ever covers the stem column (every stage roots within a couple units
    // of x=50) and starts right at the rim ellipse's own lower edge so it
    // reads as the rim's shadow continuing onto the neck, not a separate
    // patch.
    function potRimFront() {
      return '<ellipse cx="50" cy="86" rx="23" ry="3.6" fill="' + POT_COLOR_LIGHT + '"/>' +
        '<ellipse cx="50" cy="92" rx="9" ry="3.4" fill="' + POT_COLOR + '"/>' +
        '<ellipse cx="50" cy="92" rx="9" ry="3.4" fill="' + POT_COLOR_DARK + '" opacity="0.45"/>';
    }

    // Builds a potted plant at (species, color, stage) - stage 0 is pot +
    // soil only (an unplanted-but-usable pot; the outdoor ground stage 0 is
    // the same "nothing visible yet" convention), 1-3 reuse the exact same
    // stem/head markup the map uses, just with no wind wrap. potRimFront is
    // appended last regardless of stage, both to draw over a real stem's
    // base and (at stage 0, where there's no stem to sandwich) simply to
    // finish the pot - see potBody's own comment for why the rim isn't part
    // of it.
    function buildPottedVisual(species, color, stage, px) {
      var defs = '<defs>' + HEAD_FX_DEFS + headClipDefs(species) + '</defs>' + fancyDefs(color);
      var body = potBody() + potSoil();
      if (stage === 1) body += sproutMarkup();
      else if (stage === 2) body += BLOOM_STEM_MARKUP + headGroup(species, color, 50, 40);
      else if (stage === 3) {
        var left = { cx: 33, cy: 55, scale: SIDE_SCALE_L };
        var right = { cx: 67, cy: 55, scale: SIDE_SCALE_R };
        var front = { cx: 50, cy: 36, scale: HEAD_SCALE };
        var shadow = headContactShadow(species, front, [left, right]);
        defs += shadow.defs;
        body += CLUSTER_STEM_MARKUP +
          headGroup(species, color, left.cx, left.cy, { scale: left.scale, recede: true }) +
          headGroup(species, color, right.cx, right.cy, { scale: right.scale, recede: true }) +
          shadow.markup +
          headGroup(species, color, front.cx, front.cy, { scale: front.scale });
      }
      body += potRimFront();
      // vh trimmed to 109 (not the outdoor ground art's 112) - a pot's own
      // lowest drawn pixel is y=109, so anything taller just left dead
      // transparent space between the art and this box's own bottom edge,
      // which is what a pot-slot's flex alignment (see .pot-slot) actually
      // rests against the shelf below - see the GREENHOUSE PANEL CSS.
      var vw = 100, vh = 109, dispH = Math.round(px * vh / vw);
      var html = '<svg viewBox="0 0 ' + vw + ' ' + vh + '" width="' + px + '" height="' + dispH +
        '" style="display:block">' + defs + body + '</svg>';
      return { html: html, w: px, h: dispH };
    }

    // Broken pots - nine of the greenhouse's twelve slots start unusable, not
    // just locked, so the other nine read as a cost of buying/fixing a pot
    // rather than a plain locked slot sitting there waiting. Three distinct
    // breaks, cycled across the slots (see brokenVariantFor in the
    // GREENHOUSE section), each desaturated a shade duller than a clean pot
    // so "this one needs fixing" reads before the price tag does.
    var BROKEN_COLOR = '#a97e5f';
    var BROKEN_COLOR_DARK = '#84604a';
    var BROKEN_COLOR_LIGHT = '#c49872';
    var DRY_DIRT = '#6b5a44';

    function brokenCracked() {
      return '<g transform="rotate(-4 50 97)">' +
        '<path d="M28 86 L72 86 L65 109 L35 109 Z" fill="' + BROKEN_COLOR + '"/>' +
        '<path d="M50 86 L72 86 L65 109 L54 109 Z" fill="' + BROKEN_COLOR_DARK + '" opacity="0.35"/>' +
        '<ellipse cx="50" cy="86" rx="23" ry="3.6" fill="' + BROKEN_COLOR_LIGHT + '"/>' +
        '<ellipse cx="50" cy="87" rx="18" ry="2.4" fill="' + DRY_DIRT + '" opacity="0.75"/>' +
        '<path d="M39 87 L46 95 L41 100 L51 109" stroke="' + BROKEN_COLOR_DARK + '" stroke-width="1.8" ' +
        'fill="none" stroke-linecap="round"/>' +
        '<path d="M39 87 L46 95 L41 100 L51 109" stroke="#2c1e12" stroke-width="0.6" fill="none" stroke-linecap="round"/>' +
        '</g>';
    }
    function brokenChipped() {
      return '<path d="M28 86 L39 86 L43 90.5 L57 90.5 L61 86 L72 86 L65 109 L35 109 Z" fill="' + BROKEN_COLOR + '"/>' +
        '<path d="M50 86 L72 86 L65 109 L54 109 Z" fill="' + BROKEN_COLOR_DARK + '" opacity="0.35"/>' +
        '<ellipse cx="33.5" cy="86" rx="5.5" ry="2.4" fill="' + BROKEN_COLOR_LIGHT + '"/>' +
        '<ellipse cx="66.5" cy="86" rx="5.5" ry="2.4" fill="' + BROKEN_COLOR_LIGHT + '"/>' +
        '<ellipse cx="50" cy="88.5" rx="12" ry="2" fill="' + DRY_DIRT + '" opacity="0.7"/>';
    }
    // Pivot/angle chosen so the rotated pot's lowest point lands right at
    // y=109 (same floor every other pot shape uses - see buildBrokenVisual's
    // own comment on vh) rather than overshooting it - the original
    // rotate(78 46 100) actually pushed the pot down to y~=122, past the old
    // vh=112 canvas entirely, so part of it was always being silently
    // clipped off. Verified by rotating all four corners through the same
    // math the browser uses and checking the resulting bounding box.
    function brokenToppled() {
      return '<g transform="rotate(82 54 92)">' +
        '<path d="M28 86 L72 86 L65 109 L35 109 Z" fill="' + BROKEN_COLOR + '"/>' +
        '<path d="M50 86 L72 86 L65 109 L54 109 Z" fill="' + BROKEN_COLOR_DARK + '" opacity="0.35"/>' +
        '<ellipse cx="50" cy="86" rx="23" ry="3.6" fill="' + BROKEN_COLOR_LIGHT + '"/>' +
        '</g>' +
        '<ellipse cx="72" cy="92" rx="11" ry="3.2" fill="' + DRY_DIRT + '" opacity="0.75"/>' +
        '<ellipse cx="64" cy="89" rx="5" ry="1.8" fill="' + DRY_DIRT + '" opacity="0.55"/>';
    }
    var BROKEN_VARIANTS = [brokenCracked, brokenChipped, brokenToppled];

    function buildBrokenVisual(variantIndex, px) {
      var body = BROKEN_VARIANTS[variantIndex % BROKEN_VARIANTS.length]();
      // Same vh=109 trim as buildPottedVisual, and the same reason - see its
      // own comment.
      var vw = 100, vh = 109, dispH = Math.round(px * vh / vw);
      var html = '<svg viewBox="0 0 ' + vw + ' ' + vh + '" width="' + px + '" height="' + dispH +
        '" style="display:block">' + body + '</svg>';
      return { html: html, w: px, h: dispH };
    }

    // Inline flower for text rows (collection list, shop, seed picker, modal
    // titles) - the same artwork the map uses, so a row and its marker are
    // recognisably the same flower. Replaces the emoji those labels used to
    // carry. Callers must use innerHTML, not textContent.
    function speciesChip(species, colorId, px) {
      px = px || 18;
      return '<span style="display:inline-block;vertical-align:-' + Math.round(px * 0.18) +
        'px;width:' + px + 'px;height:' + px + 'px">' +
        flowerSVG(species, colorFor(colorId || species.base), px) + '</span>';
    }

    // Flower icons are sized relative to the current zoom (a fixed real-world
    // size, not a fixed screen-pixel size) so zooming in genuinely makes them
    // bigger and easier to see instead of staying constant while everything
    // else on the map grows. A divIcon's DOM size is otherwise frozen at
    // whatever it was built at - Leaflet repositions markers continuously
    // through a zoom gesture but never resizes them - so without help the
    // flowers held one size through the whole gesture and only snapped to the
    // right size once 'zoomend' rebuilt them. rescalePlantIcons() below covers
    // the gap by CSS-scaling the live DOM every 'zoom' tick; 'zoomend' (see the
    // map.on binding further down) then does the real rebuild.
    //
    // The base size used to be a formula (a fixed px at a reference zoom,
    // doubling/halving per zoom level) that was never actually checked
    // against the grid's own real on-screen size - at most zoom levels and
    // latitudes it came out noticeably bigger than one tile, so a flourishing
    // cluster (see buildPlantVisual) visibly overlapped its neighbors. Now
    // it's measured directly off the map's own projection instead: the exact
    // pixel width of one grid cell at the current zoom. Building every icon
    // at (a fraction of) this size is what guarantees it can never bleed
    // into a neighboring tile, at any zoom, rather than hoping a hand-tuned
    // constant happens to match. CELL_LNG_DEG is corrected for latitude once
    // at GPS lock (see onGpsLocked), so a cell is locally square in both
    // meters and screen pixels - and x-pixels-per-degree-longitude in Web
    // Mercator is uniform across latitude, so which latitude these two probe
    // points use doesn't matter.
    function cellPixelWidth() {
      var a = map.latLngToLayerPoint([0, 0]);
      var b = map.latLngToLayerPoint([0, CELL_LNG_DEG]);
      return Math.abs(b.x - a.x);
    }
    // Floor only - a ceiling would reintroduce the overlap this whole
    // function exists to prevent. Only matters below GRID_MIN_ZOOM anyway,
    // where the grid mesh itself isn't even drawn, so there's no visible
    // tile edge for an icon at the floor to look wrong against.
    var PLANT_ICON_MIN_PX = 16;
    function plantIconBase() {
      return Math.max(PLANT_ICON_MIN_PX, cellPixelWidth());
    }
    // The px plantIconBase() returned the last time icons were actually
    // rebuilt (makePlantIcon/makeWildIcon). rescalePlantIcons() compares the
    // current value against this to know how far the live gesture has
    // drifted. Starts at 0 (map doesn't exist yet at this point in the
    // script) - harmless, since nothing reads it before the first real
    // renderPlants()/renderWild() call sets it for real.
    var _iconBuiltPx = 0;

    function makePlantIcon(plant) {
      var d = recomputePlant(plant, Date.now());
      var px = plantIconBase();
      _iconBuiltPx = px;
      var v = buildPlantVisual(speciesFor(plant.species), paletteOf(plant), d.stage, d.wilted, px, plant.q, plant.r);
      var html = v.html;
      // A corner droplet marks any plant that wants a visit, so the map alone
      // answers "is there anything to do right now?". Green means it is ready
      // to grow a stage and takes priority; blue is the cosmetic wilt nudge.
      // Both are fixed by the same action, so they share one badge shape.
      if (d.ready || d.wilted) {
        var badgeBg = d.ready ? '#4caf6d' : '#4aa3ff';
        html = '<div style="position:relative;width:' + v.w + 'px;height:' + v.h + 'px">' + html +
          '<div style="position:absolute;top:-4px;right:-6px;background:' + badgeBg + ';color:#fff;' +
          'border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center;' +
          'font-size:10px;box-shadow:0 1px 4px rgba(0,0,0,0.35)">\u{1F4A7}</div></div>';
      }
      // Anchored at local y=61 (of the 112-tall canvas) - a waist-height
      // point on the stem, not the ground itself. Anchoring at the ground
      // (local y=97, the mound's own position - what this used to do) left
      // the ground sitting well above the tile's own bottom edge with the
      // stem/head overflowing nearly a full tile-height above it. Pinning a
      // point further up the stem to the tile's center instead pushes
      // everything below it - the ground - down to sit right at the tile's
      // bottom edge, and pulls the overflow above the tile down to a much
      // smaller amount, so the planting reads as sitting IN its tile rather
      // than floating above it.
      return L.divIcon({ html: html, iconSize: [v.w, v.h], iconAnchor: [v.w / 2, v.h * (61 / 112)], className: '' });
    }

    // Same bloom artwork as a planted flower, wrapped in a pulsing halo so a
    // wild one is distinguishable at a glance without inventing a second
    // marker shape. Always drawn at single-bloom stage and never wilted -
    // wild flowers don't grow and can't be neglected.
    function makeWildIcon(w) {
      var d = wildDerived(w, Date.now());
      var px = plantIconBase();
      _iconBuiltPx = px;
      var v = buildPlantVisual(speciesFor(w.species), paletteOf(w), 2, d.wilted, px, w.q, w.r);
      // Capped at what's left of the tile past the flower itself - the glow
      // is a nice-to-have, not worth letting the whole marker spill into a
      // neighboring tile the way an uncapped pad could at some zooms. Padded
      // off v.w only (not v.h, which is taller by design - see
      // buildNewVisual) so the glow stays proportioned to the flower's
      // actual width rather than stretching tall with the ground art.
      var pad = Math.max(0, Math.min(Math.max(6, Math.round(v.w * 0.18)), Math.floor((px - v.w) / 2)));
      var box = v.w + pad * 2, boxH = v.h + pad * 2;
      var html = '<div style="position:relative;width:' + box + 'px;height:' + boxH + 'px;' +
        'display:flex;align-items:center;justify-content:center">' +
        '<div class="wild-glow" style="position:absolute;inset:0;border-radius:50%;background:' +
        'radial-gradient(circle,rgba(255,255,255,0.9),rgba(255,236,150,0.5) 52%,rgba(255,236,150,0) 72%)"></div>' +
        '<div style="position:relative">' + v.html + '</div></div>';
      // Same waist-height anchor as makePlantIcon (see its comment), offset
      // by this icon's own padding.
      return L.divIcon({ html: html, iconSize: [box, boxH], iconAnchor: [box / 2, pad + v.h * (61 / 112)], className: '' });
    }

    // A placed sprinkler, drawn at a fixed size (it doesn't grow or wilt),
    // planted into its own small dirt mound - the same layered-ellipse look
    // GROUND_MOUND gives a flower (dark base, a lighter raised mound, a
    // small highlight, a couple of pebble-like flecks) - rather than the
    // old disc-badge background (GitHub issue #18: "look a lot more like
    // the flower icons... slight dirt pile underneath... no icon background
    // or shape"). The mound is drawn in the SAME viewBox as
    // sprinklerGlyphMarkup's stake (sprinklerGlyphMarkup/sprinklerIconSVG
    // are defined in the EQUIPMENT section further down, shared as-is with
    // the toggle button and shop stand, neither of which wants ground under
    // it) - one shared coordinate space, not two separately-positioned
    // pieces, so the stake's own bottom edge (local y=29) actually sits
    // inside the mound instead of merely butting up against it.
    function makeSprinklerIcon() {
      var px = plantIconBase();
      _iconBuiltPx = px;
      var w = Math.round(px * 0.6);
      var vw = 32, vh = 38, dispH = Math.round(w * vh / vw);
      var mound =
        '<ellipse cx="16" cy="32" rx="14" ry="4.5" fill="#5c3a1f"/>' +
        '<ellipse cx="16" cy="30.5" rx="11.5" ry="4.3" fill="#8a5a34"/>' +
        '<ellipse cx="12" cy="29" rx="4.4" ry="1.3" fill="#b98a54" opacity="0.55"/>' +
        '<ellipse cx="21" cy="30.2" rx="1.1" ry="0.8" fill="#6b431f" opacity="0.8"/>';
      var html = '<svg viewBox="0 0 ' + vw + ' ' + vh + '" width="' + w + '" height="' + dispH +
        '" style="display:block">' + mound + sprinklerGlyphMarkup() + '</svg>';
      // Same waist-height anchor convention as makePlantIcon (61/112 down
      // its own stem, not the ground itself - see that function's comment)
      // scaled to this icon's own viewBox height, so the mound sinks toward
      // the tile's bottom edge and the sprinkler sits even with a planted
      // flower instead of floating high in the square.
      return L.divIcon({ html: html, iconSize: [w, dispH], iconAnchor: [w / 2, dispH * (61 / 112)], className: '' });
    }

    // A single, bigger grass clump - the same clumpMarkup/CLUMP_SHAPE/
    // jitterBlade machinery the ambient grass near flowers uses, just
    // mounted in its own small standalone SVG instead of the flower
    // canvas's 0-100 viewBox. Using a viewBox sized to fit the clump
    // itself (rather than reusing the flower canvas's much larger
    // coordinate space verbatim) is what makes the same fixed-size blade
    // shapes read as a big clump here without touching CLUMP_SHAPE's own
    // numbers. No disc, no dirt patch, no icon glyph - it's meant to read
    // as a minor, easy-to-ignore nuisance (a clump of grass to pull), not
    // something worth the map's attention the way a wild bloom or a
    // placed sprinkler is - just a duller, scrubbier green than the lush
    // ambient grass so it never reads as something worth breeding.
    var WEED_CLUMP_SPOT = { bx: 15, by: 20, fill: '#6a7a42', fillCenter: '#82914f' };
    function makeWeedIcon(w) {
      var px = plantIconBase();
      _iconBuiltPx = px;
      var iw = Math.round(px * 0.7);
      var vw = 30, vh = 26, ih = Math.round(iw * vh / vw);
      // Seeded off the weed's own cell (distinct from any flower's ':' -less
      // seed on the same cell key) so a given weed's clump shape stays put
      // across re-renders (zoomend, pluck-fx cleanup, etc.) instead of
      // reshuffling on every rebuild.
      var rng = mulberry32(dailyStockSeed(cellKey(w.q, w.r) + ':weed'));
      var markup = clumpMarkup(rng, WEED_CLUMP_SPOT, 'wind-grass-front');
      var windDelay = windDelayFor(w.q, w.r);
      var html = '<svg viewBox="0 0 ' + vw + ' ' + vh + '" width="' + iw + '" height="' + ih +
        '" style="display:block;--wind-delay:' + windDelay.toFixed(2) + 's">' + markup + '</svg>';
      return L.divIcon({ html: html, iconSize: [iw, ih], iconAnchor: [iw / 2, ih / 2], className: '' });
    }

    // ---------------------------------------------------------------------
    //  MAP
    // ---------------------------------------------------------------------
    var map = L.map('map', { zoomControl: false, attributionControl: false, minZoom: 14, maxZoom: 19, zoomSnap: 0.5, doubleClickZoom: false });
    // Voyager tiles - colorful parks/water/roads, matching the "pretty and
    // colorful" brief better than a flat greyscale basemap would.
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      subdomains: 'abcd', maxZoom: 20
    }).addTo(map);

    // Pane ladder (bottom -> top): tilePane 200 < gridPane 350 (cell mesh) <
    // overlayPane 400 (range shape, Leaflet default) < markerPane 600 (plants/
    // user, Leaflet default). Much shorter than Porter's ladder since Bloom has
    // no zones or connection lines to layer in between.
    map.createPane('gridPane').style.zIndex = 350;
    var gridRenderer = L.canvas({ pane: 'gridPane', padding: 1.0 });
    gridRenderer.addTo(map);

    map.setView([20, 0], 3);
    // Persist immediately: tickPlants no longer saves (it has nothing to save),
    // so without this a player who drags the map and closes the tab comes back
    // to it snapping to their location again.
    map.on('dragstart', function () {
      state.following = false; saveState();
      // A manual drag is the player reaching for control of the camera -
      // don't fight it by flying to the next tour stop out from under them.
      if (wbTour.active) skipWelcomeBackTour();
    });

    // Tile mesh is only drawn once zoomed in this close - below it the tile
    // count in view would grow into the thousands (this is a full-viewport
    // mesh, not a bounded zone like Porter's), so it simply fades away on a
    // wide view rather than costing a redraw budget to render or read.
    var GRID_MIN_ZOOM = 17;
    var GRID_MAX_CELLS = 3000; // safety cap in case the viewport math overshoots

    // Shared by renderGridMesh below and by the marker-culling render
    // functions further down (renderPlants/renderWild/renderSprinklers/
    // renderWeeds) - both need "which cells does the current viewport
    // actually cover, plus some padding around the edges," just with a
    // different amount of padding for their own purposes (see each call
    // site's own comment). padFrac is a fraction of one viewport's
    // width/height, same units L.LatLngBounds.pad() takes.
    function viewportCellBounds(padFrac) {
      var vb = map.getBounds().pad(padFrac);
      var corners = [
        latLngToCell(vb.getSouth(), vb.getWest()), latLngToCell(vb.getNorth(), vb.getEast()),
        latLngToCell(vb.getSouth(), vb.getEast()), latLngToCell(vb.getNorth(), vb.getWest())
      ];
      return {
        minQ: Math.min.apply(null, corners.map(function (c) { return c.q; })) - 1,
        maxQ: Math.max.apply(null, corners.map(function (c) { return c.q; })) + 1,
        minR: Math.min.apply(null, corners.map(function (c) { return c.r; })) - 1,
        maxR: Math.max.apply(null, corners.map(function (c) { return c.r; })) + 1
      };
    }

    var _gridRedrawPending = false;
    function scheduleGridRedraw() {
      if (_gridRedrawPending) return;
      _gridRedrawPending = true;
      requestAnimationFrame(function () { _gridRedrawPending = false; renderGridMesh(); });
    }

    // Soft outline mesh over the current viewport so planting spots read at a
    // glance, plus (drawn first, so the mesh lines above still show through
    // it) a soft green fill over every tile the player currently has access
    // to today (see markAccessibleToday/inRange/todayAccessible) - not just
    // the live PLANT_RANGE square they're standing in right now (that one
    // still gets its own separate, more solid rangeArea polygon - see
    // onLocationUpdate), but everywhere along today's walk that still counts
    // as in range. Both share the same viewport-bounded tile loop below,
    // since recomputing that twice would be pure waste.
    function renderGridMesh() {
      if (!gridRenderer._ctx || !gridRenderer._bounds) return;
      var ctx = gridRenderer._ctx, b = gridRenderer._bounds, sz = b.getSize();
      ctx.clearRect(b.min.x, b.min.y, sz.x, sz.y);
      if (map.getZoom() < GRID_MIN_ZOOM) return;

      var vc = viewportCellBounds(0.25);
      var minQ = vc.minQ, maxQ = vc.maxQ, minR = vc.minR, maxR = vc.maxR;
      if ((maxQ - minQ) * (maxR - minR) > GRID_MAX_CELLS) return;

      // Re-validated against localDayKey() here too, same guard inRange()
      // itself uses - a todayAccessible set left over from before a
      // midnight rollover that simply hasn't been touched yet since must
      // never paint as if it were still today's.
      if (state.todayAccessibleDay === localDayKey()) {
        ctx.fillStyle = 'rgba(76,175,109,0.10)';
        for (var aq = minQ; aq <= maxQ; aq++) {
          for (var ar = minR; ar <= maxR; ar++) {
            if (!state.todayAccessible[cellKey(aq, ar)]) continue;
            var averts = cellVerticesPx(aq, ar);
            if (!cellOnScreen(averts)) continue;
            ctx.beginPath();
            ctx.moveTo(averts[0].x, averts[0].y);
            ctx.lineTo(averts[1].x, averts[1].y);
            ctx.lineTo(averts[2].x, averts[2].y);
            ctx.lineTo(averts[3].x, averts[3].y);
            ctx.closePath();
            ctx.fill();
          }
        }
      }

      ctx.strokeStyle = 'rgba(70,120,80,0.14)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (var q = minQ; q <= maxQ; q++) {
        for (var r = minR; r <= maxR; r++) {
          var verts = cellVerticesPx(q, r);
          if (!cellOnScreen(verts)) continue;
          // Bottom edge (0-1) and left edge (3-0).
          ctx.moveTo(verts[0].x, verts[0].y);
          ctx.lineTo(verts[1].x, verts[1].y);
          ctx.moveTo(verts[3].x, verts[3].y);
          ctx.lineTo(verts[0].x, verts[0].y);
        }
      }
      ctx.stroke();
    }
    map.on('moveend zoomend viewreset resize', scheduleGridRedraw);

    // Viewport virtualization: a marker only ever gets built for a plant/
    // wild bloom/sprinkler/weed whose tile falls within the current map
    // viewport (plus MARKER_VIEWPORT_PAD of slack around the edges, so
    // panning doesn't pop new ones in right at the screen edge). A walking
    // game's whole point is that the garden accumulates across however much
    // real-world ground the player has ever covered - a lifetime garden of
    // thousands of flowers scattered across a city is entirely normal, but
    // at most a couple dozen of those are ever near enough to the player to
    // be on screen at once. Before this, every render function built and
    // kept a real Leaflet marker (a DOM node holding a full inline SVG, plus
    // several infinitely-animating wind-sway groups inside it - see
    // buildNewVisual) for literally every entry in state.plants/wild/
    // sprinklers/weeds forever, whether it was visible or a hundred miles
    // off screen. Measured cost of that: with 1500 plants spread across a
    // realistic play area, a single full rebuild (which a zoom gesture
    // triggers unconditionally, since the icon's pixel size changes) took
    // over 2 seconds of main-thread work, and left 1500+ DOM nodes with
    // 9000+ concurrently-animating child elements sitting in the page for
    // the life of the session - regardless of how few of them a player could
    // actually see. Bounding "how much gets built" by the viewport instead
    // of by lifetime garden size fixes both: cost now tracks what's on
    // screen, which stays small and roughly constant no matter how large the
    // garden grows.
    //
    // A generous pad (MARKER_VIEWPORT_PAD, well beyond the grid mesh's own
    // 0.25 - see viewportCellBounds above) trades a little of that saving
    // for smoother edges: a flower a player is about to pan into view is
    // usually already built by the time it's actually visible. This is a
    // plain filter over every entry in state.* on every call (moveend/
    // zoomend, and every existing render call site - planting, watering,
    // harvesting, etc.), but that's just cheap numeric comparisons, not the
    // expensive part (see the icon-key caching comment that used to sit
    // here, still true for whatever's in view) - it costs low single-digit
    // ms even at several thousand entries.
    var MARKER_VIEWPORT_PAD = 0.5;
    function inMarkerViewport(vc, q, r) {
      return q >= vc.minQ && q <= vc.maxQ && r >= vc.minR && r <= vc.maxR;
    }

    // Every plant/wild/weed marker below is keyed not just by cell but by an
    // "_iconKey" fingerprint of everything that could change how it looks
    // (species/color/stage/wilted/ready/px). tickPlants calls renderPlants/
    // renderWild/renderWeeds once a minute forever, but a plant's actual
    // appearance only changes on a real stage-up or wilt/ready threshold
    // crossing - stretches of many minutes/hours where nothing visible
    // happened are by far the common case. Rebuilding the full SVG markup
    // (grass clumps, defs, gradients - see buildNewVisual) and forcing
    // Leaflet to swap the marker's icon (a real DOM node replace) for every
    // planted flower on every one of those ticks was pure waste: same pixels
    // in, same pixels out. Skipping the rebuild when the fingerprint hasn't
    // moved is invisible to the player - the rendered result is byte-
    // identical either way - it just stops burning CPU/battery on it.
    var plantMarkers = {};
    function renderPlants() {
      var seen = {};
      var now = Date.now(), px = plantIconBase(), vc = viewportCellBounds(MARKER_VIEWPORT_PAD);
      Object.keys(state.plants).forEach(function (key) {
        var p = state.plants[key];
        if (!inMarkerViewport(vc, p.q, p.r)) return; // off screen - leave unbuilt (or torn down below if it already existed)
        seen[key] = true;
        var d = recomputePlant(p, now);
        var iconKey = p.species + '|' + p.color + '|' + d.stage + '|' + d.wilted + '|' + d.ready + '|' + px;
        var m = plantMarkers[key];
        if (m) {
          if (m._iconKey !== iconKey) { m.setIcon(makePlantIcon(p)); m._iconKey = iconKey; }
        } else {
          m = plantMarkers[key] = L.marker([p.lat, p.lng], { icon: makePlantIcon(p), interactive: false, zIndexOffset: 100 }).addTo(map);
          m._iconKey = iconKey;
        }
      });
      Object.keys(plantMarkers).forEach(function (key) {
        if (!seen[key]) { map.removeLayer(plantMarkers[key]); delete plantMarkers[key]; }
      });
    }
    // Wild flowers sit just under the player's own plants (zIndexOffset 90 vs
    // 100), so on the rare overlap your garden is never hidden by scenery.
    var wildMarkers = {};
    function renderWild() {
      var seen = {};
      var now = Date.now(), px = plantIconBase(), vc = viewportCellBounds(MARKER_VIEWPORT_PAD);
      Object.keys(state.wild).forEach(function (key) {
        var w = state.wild[key];
        if (!inMarkerViewport(vc, w.q, w.r)) return;
        seen[key] = true;
        var d = wildDerived(w, now);
        var iconKey = w.species + '|' + w.color + '|' + d.wilted + '|' + px;
        var m = wildMarkers[key];
        if (m) {
          if (m._iconKey !== iconKey) { m.setIcon(makeWildIcon(w)); m._iconKey = iconKey; }
        } else {
          m = wildMarkers[key] = L.marker([w.lat, w.lng], { icon: makeWildIcon(w), interactive: false, zIndexOffset: 90 }).addTo(map);
          m._iconKey = iconKey;
        }
      });
      Object.keys(wildMarkers).forEach(function (key) {
        if (!seen[key]) { map.removeLayer(wildMarkers[key]); delete wildMarkers[key]; }
      });
    }
    // Sits between wild (90) and the player's own plants (100) - sprinklers
    // are the player's too, but a tile can never hold both at once, so the
    // exact ordering only matters for the rare visual overlap at the edges.
    var sprinklerMarkers = {};
    function renderSprinklers() {
      var seen = {};
      var vc = viewportCellBounds(MARKER_VIEWPORT_PAD);
      Object.keys(state.sprinklers).forEach(function (key) {
        var s = state.sprinklers[key];
        if (!inMarkerViewport(vc, s.q, s.r)) return;
        seen[key] = true;
        var icon = makeSprinklerIcon();
        if (sprinklerMarkers[key]) sprinklerMarkers[key].setIcon(icon);
        else sprinklerMarkers[key] = L.marker([s.lat, s.lng], { icon: icon, interactive: false, zIndexOffset: 95 }).addTo(map);
      });
      Object.keys(sprinklerMarkers).forEach(function (key) {
        if (!seen[key]) { map.removeLayer(sprinklerMarkers[key]); delete sprinklerMarkers[key]; }
      });
    }
    // Sits below everything else (85) - a weed is the least important thing
    // that can occupy a tile, and in the vanishingly rare case one overlaps
    // scenery from an adjacent tile it should never hide a real flower.
    var weedMarkers = {};
    function renderWeeds() {
      var seen = {};
      var px = plantIconBase(), vc = viewportCellBounds(MARKER_VIEWPORT_PAD);
      Object.keys(state.weeds).forEach(function (key) {
        var w = state.weeds[key];
        if (!inMarkerViewport(vc, w.q, w.r)) return;
        seen[key] = true;
        // A weed's look never changes over its lifetime (see makeWeedIcon -
        // it's seeded purely off q,r), so px is the only thing that can ever
        // move this key - same "skip the rebuild when nothing changed"
        // reasoning as renderPlants/renderWild above.
        var iconKey = px + '';
        var m = weedMarkers[key];
        if (m) {
          if (m._iconKey !== iconKey) { m.setIcon(makeWeedIcon(w)); m._iconKey = iconKey; }
        } else {
          m = weedMarkers[key] = L.marker([w.lat, w.lng], { icon: makeWeedIcon(w), interactive: false, zIndexOffset: 85 }).addTo(map);
          m._iconKey = iconKey;
        }
      });
      Object.keys(weedMarkers).forEach(function (key) {
        if (!seen[key]) { map.removeLayer(weedMarkers[key]); delete weedMarkers[key]; }
      });
    }

    // Rebuilds every visible marker at the new zoom's icon size once a zoom
    // gesture settles (see plantIconBase()/makePlantIcon above for why this
    // is what actually makes zooming in grow the flowers instead of them
    // snapping back), and - together with 'moveend' - is also what brings
    // newly-panned-into-view markers to life / tears down ones that just
    // scrolled out (see the viewport-virtualization comment above
    // MARKER_VIEWPORT_PAD). RAF-debounced the same way scheduleGridRedraw
    // is, and bound to the same event list, since both are answering the
    // same "the viewport just changed" question.
    var _markerRenderPending = false;
    function scheduleMarkerRender() {
      if (_markerRenderPending) return;
      _markerRenderPending = true;
      requestAnimationFrame(function () {
        _markerRenderPending = false;
        renderPlants(); renderWild(); renderSprinklers(); renderWeeds(); renderRainRings();
      });
    }
    map.on('moveend zoomend viewreset resize', scheduleMarkerRender);

    // Live in-between-frames fix for the gap 'zoomend' alone leaves: CSS-scale
    // each marker's inner content div (never the marker element itself, which
    // carries Leaflet's own translate3d positioning transform and must not be
    // clobbered) on every 'zoom' event, which fires continuously through a
    // wheel/button zoom animation and a touch pinch alike. makePlantIcon and
    // makeWildIcon always emit exactly one wrapping div as the marker's whole
    // content, so firstElementChild is always that div. zoomend's real rebuild
    // then hands back fresh, untransformed DOM and updates _iconBuiltPx, so the
    // live scale falls back to identity on its own once the true size lands.
    var _iconRescalePending = false, _lastIconScale = 1;
    function rescalePlantIcons() {
      if (!_iconBuiltPx) return;
      var s = plantIconBase() / _iconBuiltPx;
      if (!(s > 0) || s === _lastIconScale) return;
      _lastIconScale = s;
      var t = s === 1 ? '' : 'scale(' + s + ')';
      function apply(markers) {
        Object.keys(markers).forEach(function (key) {
          var el = markers[key].getElement();
          var c = el && el.firstElementChild;
          if (c) c.style.transform = t;
        });
      }
      apply(plantMarkers);
      apply(wildMarkers);
      apply(sprinklerMarkers);
      apply(weedMarkers);
      // rainRingLayers isn't a flat key->marker map like the others (each
      // entry also carries its boundary polygon/lines/diamonds, which are
      // real lat/lng geometry and need no rescaling here at all - Leaflet
      // reprojects those on its own), so it gets its own one-line loop
      // instead of going through apply().
      Object.keys(rainRingLayers).forEach(function (key) {
        var el = rainRingLayers[key].marker.getElement();
        var c = el && el.firstElementChild;
        if (c) c.style.transform = t;
      });
    }
    map.on('zoom', function () {
      if (_iconRescalePending) return;
      _iconRescalePending = true;
      requestAnimationFrame(function () { _iconRescalePending = false; rescalePlantIcons(); });
    });

    // ---- Weeds (interaction) -----------------------------------------------
    // A quick pop-and-fade of the herb glyph plus a floating "+1" right where
    // the weed was standing - addFx (defined further down, in SCREEN-SPACE
    // EFFECTS) is a plain function declaration so it's already callable here
    // regardless of source order. Auto-removed after WEED_PLUCK_FX_MS, same
    // pattern as every other one-shot effect on this layer.
    var WEED_PLUCK_FX_MS = 650;
    function playWeedPluckFx(w) {
      addFx('<div class="weed-pluck-fx">\u{1F33F} +1 \u{1F338}</div>', w.lat, w.lng, '', WEED_PLUCK_FX_MS);
    }

    // The whole interaction, per the issue: tap it (from any of the three tap
    // entry points - see map.on('click'), resolveSeedTap, resolveToolTap),
    // it's gone, and you're 1 Petal richer. No hold-to-confirm (there's
    // nothing here worth protecting from an accidental tap the way selling a
    // grown flower is), no panel, no journal entry - callers are responsible
    // for the in-range check (same division of labor as pickUpSprinkler),
    // this just does the pluck itself.
    function pluckWeedAt(key) {
      var w = state.weeds[key];
      if (!w) return;
      delete state.weeds[key];
      state.currency += 1;
      saveState();
      renderWeeds();
      updateCurrencyPill();
      playWeedPluckFx(w);
      toast('\u{1F33F} Plucked a weed - +1 \u{1F338}');
      vibrate(15);
    }

    // Empty ground within range plants immediately, but only with a seed
    // already equipped from the pouch (see plantEquippedSeedAt) - a bare tap
    // never spends a seed on its own, it just points at the pouch. An
    // occupied tile opens its panel (from any distance - browsing your garden
    // from afar is fine, only *acting* on a plant requires being physically
    // close).
    // With a tool in hand every map tap belongs to the tool instead - see the
    // TOOLS section below, which drives itself off pointer events so it can
    // tell a tap from a press-and-hold.
    map.on('click', function (e) {
      // A tap anywhere else on the map while the tool fan is out is just a
      // "never mind" - it closes the fan instead of planting or opening a
      // panel underneath it. See onToolboxPointerUp for why the fan can be
      // left open after a plain tap on the toolbox.
      if (railOpen) { setRailOpen(false); return; }
      if (seedRailOpen) { closeSeedRail(); return; }
      if (activeTool) return;
      // An equipped seed now drives itself off pointer events too (see
      // resolveSeedTap in the TOOLS section) so it can tell a tap from a
      // press-and-hold-and-drag the same way a tool already does - this
      // handler would otherwise double-fire the plant right behind it.
      if (equippedSeed) return;
      var h = latLngToCell(e.latlng.lat, e.latlng.lng);
      var key = cellKey(h.q, h.r);
      if (state.plants[key]) { openPlantPanel(key); return; }
      if (state.wild[key]) { openPlantPanel(key, true); return; }
      if (!state.userPos) { toast('Waiting for GPS to lock on...'); return; }
      var tileInRange = inRange(h.q, h.r);
      // A weed just plucks on a plain tap in range - no panel, no tool, no
      // hold-and-confirm, exactly the "you just tap them" the issue asked
      // for. Checked ahead of the sprinkler/plant-a-seed branches below
      // since a weed tile is never also a sprinkler or empty ground.
      if (state.weeds[key]) {
        if (!tileInRange) { toast('Walk closer to reach this weed \u{1F6B6}'); return; }
        pluckWeedAt(key);
        return;
      }
      // A placed sprinkler always picks up on a tap, the same "act on what's
      // here" priority an occupied plant/wild tile already gets above -
      // moving it is an action, though, so it still needs the same walk-up
      // range every other action requires (unlike just opening a panel).
      if (state.sprinklers[key]) {
        if (!tileInRange) { toast('Walk closer to move this sprinkler \u{1F6B6}'); return; }
        pickUpSprinkler(key);
        return;
      }
      // A bare tap on empty, out-of-range ground does nothing by default, so
      // it stays silent here - only worth a word when a sprinkler is
      // actually equipped (the one action this handler can still take
      // out-of-range-gated, since placeSprinklerAt has no range check of its
      // own). An equipped seed never reaches this branch - see equippedSeed
      // above - and resolveSeedTap has its own, correct "walk closer" toast
      // for that case.
      if (!tileInRange) {
        if (equippedSprinkler) toast('Walk closer to place a sprinkler here \u{1F6B6}');
        return;
      }
      if (equippedSprinkler) { placeSprinklerAt(h.q, h.r); return; }
      // Nothing equipped - a bare tap on empty ground never does anything on
      // its own, in range or out of it (see the out-of-range branch above),
      // so stay quiet here too instead of nagging about seeds the player
      // hasn't chosen to use yet. Tapping the pouch itself still tells you
      // when you're out (see onSeedPointerDown) - that's a different tap.
    });

    // ---------------------------------------------------------------------
    //  TOOLS
    //  Three tools live behind a toolbox icon at the top-left: the watering
    //  can, the shears (extract seeds on the spot) and $ (sell). A fourth,
    //  fertilizer, joins them once a bag is actually owned (see .tool-btn.fert
    //  and syncFertTool below) - press-and-hold a flourishing flower with it
    //  out and it crosses with a random ready neighbour, the same worker
    //  (doBreed) the plant panel's "Cross with a neighbour" button already
    //  uses. Neither entry point ever lets you pick which neighbour - it is
    //  always a uniform random draw among the ready ones (see
    //  breedPartnersFor/openBreedPicker), so where you plant relative to
    //  your other flourishing flowers is the only lever over the outcome.
    //  Equipping any tool
    //  is a MODE - you tap every flower you want it applied to and then
    //  unequip it to put it away - which is what turns watering a whole bed
    //  into a row of taps rather than open-panel/tap-Water/close per flower.
    //
    //  Watering is a plain tap, because it is the routine action and it can't
    //  cost you anything. Extracting, selling and fertilizing take a
    //  one-second press and hold with a filling ring, because all three take
    //  something off the board for good (a flower, or a fertilizer bag plus
    //  both parents' next 12h) and there is no undo.
    //
    //  Picking a tool up is itself a two-stage gesture (see the RAIL section
    //  below): tap the toolbox to drop the tools down the left edge and tap
    //  the one you want, or press-and-hold the toolbox and drag straight
    //  down to it. Whichever one gets equipped replaces the toolbox icon in
    //  place; tapping it again unequips and the toolbox comes back.
    // ---------------------------------------------------------------------
    var HOLD_MS = 1000;      // press-and-hold to confirm an extraction or a sale
    var HOLD_MOVE_PX = 14;   // finger travel that turns a hold back into a pan
    var WATER_ANIM_MS = 1150; // matches the can-pour keyframes; growth lands after

    var TOOL_NAMES = { water: 'watering can', shear: 'shears', sell: '$', fert: 'fertilizer' };
    var TOOL_HUD = {
      water: '\u{1F4A7} Watering can out &bull; tap each flower to water it',
      shear: 'Shears out &bull; press and hold a flower to extract its seeds',
      sell: 'Selling &bull; press and hold a flower to sell it',
      fert: '\u{1F33E} Fertilizer out &bull; press and hold a flourishing flower to cross it with a neighbour'
    };

    // Tool artwork is drawn, not emoji, for the same reason the flowers are:
    // a glyph from a font we don't control can't be recolored to match the
    // tool's state, and looks different on every device.
    function canIconSVG(px) {
      return '<svg viewBox="0 0 32 28" width="' + px + '" height="' + Math.round(px * 28 / 32) + '">' +
        '<path d="M13 8 a5 4.5 0 0 1 9 0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>' +
        '<path d="M12 11 L3 6 L1 11 L3 13 L12 16 Z" fill="currentColor"/>' +
        '<path d="M11 9 h16 v9 a5 5 0 0 1 -5 5 h-6 a5 5 0 0 1 -5 -5 z" fill="currentColor"/>' +
        '</svg>';
    }
    function shearIconSVG(px) {
      return '<svg viewBox="0 0 32 32" width="' + px + '" height="' + px + '" fill="none" ' +
        'stroke="currentColor" stroke-width="2.6" stroke-linecap="round">' +
        '<circle cx="8" cy="25" r="4"/><circle cx="24" cy="25" r="4"/>' +
        '<path d="M10.7 21.6 L25 4"/><path d="M21.3 21.6 L7 4"/>' +
        '</svg>';
    }
    function toolIconHtml(tool, px) {
      if (tool === 'water') return canIconSVG(px);
      if (tool === 'shear') return shearIconSVG(px);
      // Same sheaf-of-rice glyph the shop's fertilizer sack already uses
      // (see .stand-fert-icon) - reused rather than hand-drawing a second
      // stroke-only icon for the same concept.
      if (tool === 'fert') return '<span class="tool-fert-glyph" style="font-size:' +
        Math.round(px * 1.05) + 'px">\u{1F33E}</span>';
      return '<span class="tool-sell-glyph" style="font-size:' + Math.round(px * 1.05) + 'px">$</span>';
    }
    // The toolbox itself: a handle, a lid seam and a latch, drawn stroke-only
    // like the shears so the set reads as one hand-drawn family.
    function toolboxIconSVG(px) {
      return '<svg viewBox="0 0 32 26" width="' + px + '" height="' + Math.round(px * 26 / 32) + '" ' +
        'fill="none" stroke="currentColor" stroke-linecap="round">' +
        '<path d="M9 9 a7 6.5 0 0 1 14 0" stroke-width="2.4"/>' +
        '<rect x="2" y="9" width="28" height="15" rx="3" stroke-width="2.4"/>' +
        '<line x1="2" y1="15.5" x2="30" y2="15.5" stroke-width="2.2"/>' +
        '<rect x="13" y="13" width="6" height="5" rx="1.2" stroke-width="2.2"/>' +
        '</svg>';
    }

    var activeTool = null;
    var TOOL_KEYS = ['water', 'shear', 'sell', 'fert'];

    function initToolRail() {
      TOOL_KEYS.forEach(function (t) {
        document.getElementById('tool-' + t).innerHTML = toolIconHtml(t, t === 'water' ? 27 : 24);
      });
      document.getElementById('tool-toggle').innerHTML = toolboxIconSVG(26);
      var toggle = document.getElementById('tool-toggle');
      toggle.addEventListener('pointerdown', onToolboxPointerDown);
      window.addEventListener('pointermove', onToolboxPointerMove);
      window.addEventListener('pointerup', onToolboxPointerUp);
      window.addEventListener('pointercancel', onToolboxPointerUp);
      syncFertTool();
    }
    // The fourth petal only shows up once there's actually a bag to spend -
    // an always-visible slot nobody without fertilizer could ever use would
    // just be dead weight the other three don't carry. Called at boot and
    // wherever state.fertilizer actually changes (buyFertilizer, doBreed),
    // rather than folded into updateHUD, which runs far more often than
    // fertilizer count does.
    function syncFertTool() {
      document.getElementById('tool-petals').classList.toggle('has-fert', state.fertilizer > 0);
    }
    // Uses classList.toggle rather than overwriting className wholesale, so a
    // pending tutorial .hint on the toggle button survives an equip/unequip.
    function renderToolRail() {
      var toggle = document.getElementById('tool-toggle');
      TOOL_KEYS.forEach(function (t) {
        document.getElementById('tool-' + t).classList.toggle('active', activeTool === t);
        toggle.classList.toggle(t, activeTool === t);
      });
      toggle.classList.toggle('active', !!activeTool);
      toggle.classList.toggle('toolbox', !activeTool);
      toggle.innerHTML = activeTool ? toolIconHtml(activeTool, activeTool === 'water' ? 27 : 24) : toolboxIconSVG(26);
      toggle.title = activeTool ? ('Put away the ' + TOOL_NAMES[activeTool]) : 'Tools';
      // Spring pop on every change so the icon swap reads as a physical
      // action. Removed and re-added to restart the animation even when the
      // class is already there from a previous swap.
      toggle.classList.remove('equip-pop');
      void toggle.offsetWidth;
      toggle.classList.add('equip-pop');
    }

    // The rail floats above the plant sheet on purpose - that sheet's hints
    // name these tools, so they have to stay tappable underneath it - but it
    // must never float above a full-screen panel: a toolbox stuck on top of
    // the scrapbook or the market stand reads as a rendering bug, and there
    // is nothing to tend in any of them. One check called wherever a
    // full-screen panel opens or closes, rather than a display toggle
    // duplicated across six functions.
    var FULLSCREEN_PANELS = ['shop-panel', 'journal-panel', 'milestones-panel', 'notes-panel', 'howto-panel',
      'greenhouse-panel'];
    function fullscreenPanelOpen() {
      return FULLSCREEN_PANELS.some(function (id) {
        return document.getElementById(id).classList.contains('open');
      });
    }
    function syncToolRail() {
      var covered = fullscreenPanelOpen();
      document.getElementById('tool-rail').style.display = covered ? 'none' : '';
      if (covered) setRailOpen(false); // don't come back with the fan stuck out
      syncSeedRail();
    }
    // The seed pouch hides for either of two independent reasons - a
    // full-screen panel covering the map (nothing to plant underneath it),
    // or the top-right ... menu being open (they share that same corner and
    // the dropdown would otherwise overlap it) - so this is its own function
    // rather than folded into syncToolRail's tool-rail-only "covered" check,
    // which the menu has no business affecting.
    function syncSeedRail() {
      var hide = fullscreenPanelOpen() || document.getElementById('menu-dropdown').classList.contains('open');
      document.getElementById('seed-rail').style.display = hide ? 'none' : '';
      if (hide && seedRailOpen) closeSeedRail();
    }
    // The tutorial's pointer at whichever tool it is asking for next; cleared
    // the moment that tool is equipped. A tool already in hand is never
    // pointed at - the player has plainly found it. Pulses the toolbox itself
    // (so it's visible while stowed) as well as the real petal underneath,
    // which starts pulsing the moment the fan is opened.
    function setToolHint(tool) {
      if (tool && tool === activeTool) tool = null;
      document.getElementById('tool-toggle').classList.toggle('hint', !!tool && !activeTool);
      TOOL_KEYS.forEach(function (t) {
        document.getElementById('tool-' + t).classList.toggle('hint', tool === t);
      });
    }

    // Same idea as setToolHint, but for the seed pouch - it lives outside the
    // tool rail (see #seed-toggle) so it needs its own on/off switch rather
    // than fitting the tool-keyed one above. Cleared the moment a seed is
    // actually equipped (see equipSeed), never toggled back on itself.
    function setSeedHint(on) {
      document.getElementById('seed-toggle').classList.toggle('hint', !!on);
    }

    function setActiveTool(tool) {
      cancelHold();
      activeTool = tool;
      if (tool) {
        setToolHint(null);
        closePlantPanel();  // both are ways of acting on a flower; only one at a time
        closeShop();
        // A tool and an equipped seed (or sprinkler) are different "what
        // does a tap do" modes - can't have more than one, so picking up a
        // tool puts the others away.
        if (equippedSeed) unequipSeed();
        if (equippedSprinkler) unequipSprinkler();
        vibrate(10);
      }
      renderToolRail();
      updateHUD();
      syncMapDragging();
    }

    // ---- The toolbox fan: open/close state and the tap-or-drag gesture ----
    var railOpen = false;
    var RAIL_HOVER_PAD = 10; // px of slop added around a petal's hit box for finger imprecision
    function setRailOpen(open) {
      railOpen = open;
      document.getElementById('tool-petals').classList.toggle('open', open);
      clearRailHover();
    }
    function clearRailHover() {
      if (!railPointer || !railPointer.hoverTool) return;
      document.getElementById('tool-' + railPointer.hoverTool).classList.remove('drag-hover');
      railPointer.hoverTool = null;
    }
    // Picking a tool selects it, closes the fan, and cancels any hover glow.
    function selectTool(tool) {
      setRailOpen(false);
      setActiveTool(tool);
    }
    // Equipped-state tap: fires as a normal click after pointerup, since
    // onToolboxPointerDown below does not preventDefault while a tool is
    // already active (there is nothing to fan out to).
    function onToolboxEquippedClick() {
      if (activeTool) setActiveTool(null);
    }

    function hitTestPetal(x, y) {
      for (var i = 0; i < TOOL_KEYS.length; i++) {
        var t = TOOL_KEYS[i];
        var el = document.getElementById('tool-' + t);
        // A hidden petal (fert with no fertilizer - see .tool-btn.fert)
        // collapses to a degenerate 0,0,0,0 rect at the viewport origin, not
        // to nothing - skip it explicitly rather than let a drag near the
        // literal top-left corner of the screen phantom-hit it.
        if (el.offsetParent === null) continue;
        var r = el.getBoundingClientRect();
        if (x >= r.left - RAIL_HOVER_PAD && x <= r.right + RAIL_HOVER_PAD &&
            y >= r.top - RAIL_HOVER_PAD && y <= r.bottom + RAIL_HOVER_PAD) return t;
      }
      return null;
    }

    var railPointer = null;
    function onToolboxPointerDown(ev) {
      // With a tool already equipped the toggle button is a plain unequip
      // tap (handled by onToolboxEquippedClick) - there is no fan to open.
      if (activeTool || railPointer) return;
      ev.preventDefault();
      railPointer = { id: ev.pointerId, startedOpen: railOpen, hoverTool: null };
      if (!railOpen) { setRailOpen(true); vibrate(10); }
    }
    function onToolboxPointerMove(ev) {
      if (!railPointer || ev.pointerId !== railPointer.id) return;
      var hit = hitTestPetal(ev.clientX, ev.clientY);
      if (hit === railPointer.hoverTool) return;
      if (railPointer.hoverTool) document.getElementById('tool-' + railPointer.hoverTool).classList.remove('drag-hover');
      railPointer.hoverTool = hit;
      if (hit) {
        document.getElementById('tool-' + hit).classList.add('drag-hover');
        vibrate(8);
      }
    }
    function onToolboxPointerUp(ev) {
      if (!railPointer || ev.pointerId !== railPointer.id) return;
      var rp = railPointer;
      railPointer = null;
      if (rp.hoverTool) {
        document.getElementById('tool-' + rp.hoverTool).classList.remove('drag-hover');
        selectTool(rp.hoverTool);
        return;
      }
      // Released over nothing. If the fan was already open when this press
      // started, this was a second deliberate tap on the toolbox - close it.
      // If this press is what opened the fan (a plain tap, or a hold that
      // never reached a petal), leave it open so a follow-up tap can pick one.
      if (rp.startedOpen) setRailOpen(false);
    }

    // ---- Screen-space effects over the map -------------------------------
    // Kept out of Leaflet entirely: these are transient, must never be tap
    // targets, and a divIcon would be thrown away by the next renderPlants().
    var fxItems = [];
    function positionFx(item) {
      var pt = map.latLngToContainerPoint([item.lat, item.lng]);
      item.el.style.left = pt.x + 'px';
      item.el.style.top = pt.y + 'px';
    }
    function addFx(html, lat, lng, cls, ms) {
      var el = document.createElement('div');
      el.className = 'fx-item ' + (cls || '');
      el.innerHTML = html;
      document.getElementById('fx-layer').appendChild(el);
      var item = { el: el, lat: lat, lng: lng };
      fxItems.push(item);
      positionFx(item);
      if (ms) setTimeout(function () { removeFx(item); }, ms);
      return item;
    }
    function removeFx(item) {
      var i = fxItems.indexOf(item);
      if (i >= 0) fxItems.splice(i, 1);
      if (item.el.parentNode) item.el.parentNode.removeChild(item.el);
    }
    map.on('move zoom', function () { fxItems.forEach(positionFx); });

    // ---- Watering animation ----------------------------------------------
    // waterPlant() is deliberately called at the END, so the flower grows once
    // the can has poured and left rather than the instant you tap. Guarded per
    // tile so a second tap during the pour can't water the same plant twice.
    var wateringKeys = {};
    function waterWithCan(key) {
      var p = state.plants[key];
      if (!p || wateringKeys[key]) return;
      // Reduced motion collapses every animation to 0.01ms, so the can would
      // never be seen - waiting out its duration would just be dead time.
      if (reduceMotion) { waterPlant(key); return; }

      wateringKeys[key] = true;
      var drops = '';
      for (var i = 0; i < 5; i++) {
        drops += '<div class="water-drop" style="left:' + (i * 4 - 1) + 'px;bottom:17px;' +
          'animation-delay:' + (350 + i * 85) + 'ms"></div>';
      }
      addFx('<div class="water-can pour">' + canIconSVG(30) + '</div>' + drops,
        p.lat, p.lng, 'water-fx', WATER_ANIM_MS + 140);
      setTimeout(function () {
        delete wateringKeys[key];
        if (state.plants[key]) waterPlant(key);
      }, WATER_ANIM_MS);
    }

    // ---- Press-and-hold confirmation --------------------------------------
    var RING_R = 22;
    var RING_C = 2 * Math.PI * RING_R;
    // Takes the icon's own markup rather than a tool name, so a range
    // selection (see RANGE SELECTION below) can hand it a seed's flower
    // chip instead of a tool glyph - the single-tile callers below just
    // wrap their tool name in toolIconHtml first.
    function holdRingHtml(iconHtml) {
      return '<svg width="56" height="56" viewBox="0 0 56 56">' +
        '<circle cx="28" cy="28" r="' + RING_R + '" fill="rgba(255,255,255,0.94)" ' +
        'stroke="rgba(60,40,20,0.14)" stroke-width="5"/>' +
        '<circle class="hold-arc" cx="28" cy="28" r="' + RING_R + '" fill="none" stroke="#bfe6cd" ' +
        'stroke-width="5" stroke-linecap="round" transform="rotate(-90 28 28)" ' +
        'stroke-dasharray="' + RING_C.toFixed(1) + '" stroke-dashoffset="' + RING_C.toFixed(1) + '"/>' +
        '</svg><div class="hold-ring-icon">' + iconHtml + '</div>';
    }

    var hold = null;
    function startHold(tool, target) {
      cancelHold();
      var o = target.obj;
      // One tile north of the flower itself, not on top of it - a finger
      // pressed down on the flower for a full second otherwise covers the
      // ring it's supposed to be watching fill. On a square grid, r+1 is
      // always due north (see cellCenter's math) - no direction-hunting
      // needed, unlike the old hex grid.
      var above = cellCenter(o.q, o.r + 1);
      var item = addFx(holdRingHtml(toolIconHtml(tool, 22)), above.lat, above.lng, 'hold-ring', 0);
      hold = {
        tool: tool, target: target, item: item, raf: null,
        arc: item.el.querySelector('.hold-arc'), start: performance.now()
      };
      vibrate(8);
      stepHold();
    }
    function stepHold() {
      if (!hold) return;
      var t = Math.min(1, (performance.now() - hold.start) / HOLD_MS);
      hold.arc.setAttribute('stroke-dashoffset', (RING_C * (1 - t)).toFixed(1));
      hold.arc.setAttribute('stroke', mixHex('#bfe6cd', '#4caf6d', t));
      if (t >= 1) { completeHold(); return; }
      hold.raf = requestAnimationFrame(stepHold);
    }
    function cancelHold() {
      if (!hold) return;
      if (hold.raf) cancelAnimationFrame(hold.raf);
      removeFx(hold.item);
      hold = null;
    }
    function completeHold() {
      var h = hold;
      cancelHold();
      // The finger is still down at this point, so the pointerup that follows
      // must not read as an aborted hold and nag about holding longer.
      if (pointerState) pointerState.completed = true;
      vibrate(30);
      applyToolAction(h.tool, h.target);
    }

    // ---- What a tool can act on ------------------------------------------
    // One shape for both kinds of flower, so every check below can work in
    // terms of `obj` (which always has q/r/lat/lng) and only branch on kind
    // where the two genuinely differ.
    function toolTargetAt(key) {
      if (state.plants[key]) return { kind: 'plant', key: key, obj: state.plants[key] };
      if (state.wild[key]) return { kind: 'wild', key: key, obj: state.wild[key] };
      return null;
    }

    // The reason this tool can't be used on this flower, or null if it can.
    // Checked before the hold ring starts (so you never hold for a second and
    // then get refused) and again on release (so the message is only spoken
    // for a genuine tap, never for a pan that happened to start on a flower).
    function toolBlockedReason(tool, target) {
      var o = target.obj;
      if (!state.userPos) return 'Waiting for GPS to lock on...';
      if (!inRange(o.q, o.r)) return 'Walk closer to reach this one \u{1F6B6}';

      if (tool === 'water') {
        if (target.kind === 'wild') return 'Wild flowers look after themselves - pick this one instead';
        var d = recomputePlant(o, Date.now());
        if (d.ready || d.wilted) return null;
        return d.stage >= MAX_STAGE
          ? 'Fully grown - the shears or $ take it from here'
          : 'Not thirsty yet - ready to grow in ' + formatDuration(d.readyIn);
      }
      if (tool === 'fert') {
        if (target.kind === 'wild') return 'Wild flowers can\'t be crossed - only your own';
        if (state.fertilizer <= 0) return "You're out of fertilizer - buy some from the Shop \u{1F338}";
        var pd = recomputePlant(o, Date.now());
        if (pd.stage < MAX_STAGE) return 'Not flourishing yet - it needs to fully grow first';
        if (Date.now() < (o.breedReadyAt || 0)) {
          return 'Still resting from its last cross - ready in ' + formatDuration(breedWaitMs(o));
        }
        if (!breedPartnersFor(target.key).length) return 'No flourishing neighbour of the same species ready to cross with';
        return null;
      }
      // Shears and $ both need something worth taking. Wild flowers always are.
      if (target.kind === 'wild') return null;
      if (recomputePlant(o, Date.now()).stage < 2) return 'Not in bloom yet - it needs more water first';
      return null;
    }

    function applyToolAction(tool, target) {
      if (tool === 'fert') {
        // toolBlockedReason already guarantees at least one ready neighbour
        // by this point (checked before the hold even starts, and again
        // here can't have changed mid-hold in a single-player game) - a
        // uniform random pick among them, same as the plant panel's own
        // "Cross with a neighbour" button (see openBreedPicker) - which
        // neighbour is never a choice, from either entry point. doBreed does
        // its own full re-validation and is the same worker the panel's
        // button already uses.
        var partners = breedPartnersFor(target.key);
        var partnerKey = partners[Math.floor(Math.random() * partners.length)];
        doBreed(target.key, partnerKey);
        return;
      }
      var mode = tool === 'sell' ? 'sell' : 'extract';
      if (target.kind === 'wild') pickWild(target.key, mode);
      else onHarvestClick(target.key, mode);  // via onHarvestClick so the tutorial still sees it
    }

    // ---- Pointer plumbing --------------------------------------------------
    // Tool taps can't ride on Leaflet's click event: a press-and-hold has to
    // start reacting while the finger is still down. Also drives an equipped
    // seed now (see the SEEDS section below for why the plain 'click'
    // handler bows out whenever equippedSeed is set) - both a tool and a
    // seed are "equipped, act on the map" modes, and both now support
    // dragging across tiles for a range selection (see RANGE SELECTION
    // below), so they share one pointer chain rather than two similar ones.
    var pointerState = null;
    // Which mode is currently claiming the map, or null if neither - the
    // one thing every gesture below branches on first.
    function equippedMapMode() {
      if (activeTool) return 'tool';
      if (equippedSeed) return 'seed';
      return null;
    }
    function onToolPointerDown(ev) {
      var mode = equippedMapMode();
      if (!mode || pointerState) return;
      if (ev.pointerType === 'mouse' && ev.button !== 0) return;
      var ll = map.mouseEventToLatLng(ev);
      var h = latLngToCell(ll.lat, ll.lng);
      var target = mode === 'tool' ? toolTargetAt(cellKey(h.q, h.r)) : null;
      pointerState = {
        id: ev.pointerId, x: ev.clientX, y: ev.clientY,
        cell: h, target: target, moved: false, completed: false, mode: mode
      };
      // Nothing starts sweeping for a tap-action tool, an empty tile, a
      // flower this tool can't be used on, or a seed (which always plants
      // on release, never on press) - those are all resolved on release,
      // unless a drag claims the gesture for a range selection first (see
      // onToolPointerMove).
      if (mode !== 'tool' || activeTool === 'water' || !target) return;
      if (!toolBlockedReason(activeTool, target)) startHold(activeTool, target);
    }
    function onToolPointerMove(ev) {
      if (!pointerState || ev.pointerId !== pointerState.id) return;
      // Range selection: only for tools that support it (not fertilizer -
      // see the RANGE SELECTION section) and always for a seed. A genuine
      // drag into a different tile claims the gesture, cancelling whatever
      // single-tile hold may have started under the finger on the way down.
      if (pointerState.mode === 'seed' || (pointerState.mode === 'tool' && RANGE_TOOLS[activeTool])) {
        var ll = map.mouseEventToLatLng(ev);
        var h = latLngToCell(ll.lat, ll.lng);
        if (h.q !== pointerState.cell.q || h.r !== pointerState.cell.r) {
          if (!pointerState.moved) { pointerState.moved = true; cancelHold(); }
          if (!rangeGesture) startRangeSelection(pointerState.mode, pointerState.cell);
          // Compared against rangeGesture.cur (the current drag tile), not
          // pointerState.cell (the original anchor) - the latter never
          // changes, so every pointermove event inside the same tile still
          // counted as "moved to a new cell" and restarted the hold-ring
          // (issue #9). Small touchscreen jitter fired this constantly,
          // resetting the fill before it could ever complete. Only an
          // actual move into a genuinely different tile should restart it.
          if (h.q !== rangeGesture.cur.q || h.r !== rangeGesture.cur.r) updateRangeSelection(h);
          return;
        }
      }
      if (Math.abs(ev.clientX - pointerState.x) > HOLD_MOVE_PX ||
          Math.abs(ev.clientY - pointerState.y) > HOLD_MOVE_PX) {
        pointerState.moved = true;
        cancelHold();
      }
    }
    function onToolPointerUp(ev) {
      if (!pointerState || ev.pointerId !== pointerState.id) return;
      var ps = pointerState;
      pointerState = null;
      cancelHold();
      // Lifted before the range hold-ring finished filling - just cancel,
      // same as releasing early on a single-tile hold loses nothing.
      if (rangeGesture) endRangeSelection();
      if (ps.moved || ps.completed) return;
      if (ps.mode === 'tool') resolveToolTap(ps); else resolveSeedTap(ps);
    }

    function resolveToolTap(ps) {
      // A weed plucks on a plain tap no matter what tool happens to be
      // equipped - toolTargetAt() only knows about plants/wild (see its own
      // comment), so a weed tile always falls through to ps.target === null
      // otherwise, and would land in the "empty ground" branch below with a
      // "put the tool away to plant here" message that makes no sense for a
      // tile that was never plantable to begin with.
      var weedKey = cellKey(ps.cell.q, ps.cell.r);
      if (state.weeds[weedKey]) {
        if (!state.userPos) { toast('Waiting for GPS to lock on...'); return; }
        if (!inRange(ps.cell.q, ps.cell.r)) { toast('Walk closer to reach this weed \u{1F6B6}'); return; }
        pluckWeedAt(weedKey);
        return;
      }
      if (!ps.target) {
        // Empty ground. Only worth a word inside planting range, where the tap
        // was probably meant to plant something - otherwise stay quiet.
        if (state.userPos && inRange(ps.cell.q, ps.cell.r)) {
          toast('Put the ' + TOOL_NAMES[activeTool] + ' away to plant here \u{1F331}');
        }
        return;
      }
      var reason = toolBlockedReason(activeTool, ps.target);
      if (reason) { toast(reason); return; }
      if (activeTool === 'water') { waterWithCan(ps.target.key); return; }
      toast('Press and hold to confirm');
    }

    // A plain (non-dragged) tap with a seed equipped - exactly what the map
    // 'click' handler used to do for this case (see the SEEDS section):
    // an occupied tile still opens its panel or picks up a sprinkler, only
    // genuinely empty ground plants. Kept as its own function, not folded
    // into the click handler, since a press-and-hold now has to react while
    // the finger is still down (for the range-selection case) the same way
    // a tool's hold already does.
    function resolveSeedTap(ps) {
      var key = cellKey(ps.cell.q, ps.cell.r);
      if (state.plants[key]) { openPlantPanel(key); return; }
      if (state.wild[key]) { openPlantPanel(key, true); return; }
      if (!state.userPos) { toast('Waiting for GPS to lock on...'); return; }
      var tileInRange = inRange(ps.cell.q, ps.cell.r);
      // A weed plucks the same way here as it does with nothing equipped -
      // an equipped seed only ever plants on genuinely empty ground, so a
      // weed tile is never a valid plant target anyway.
      if (state.weeds[key]) {
        if (!tileInRange) { toast('Walk closer to reach this weed \u{1F6B6}'); return; }
        pluckWeedAt(key);
        return;
      }
      if (state.sprinklers[key]) {
        if (!tileInRange) { toast('Walk closer to move this sprinkler \u{1F6B6}'); return; }
        pickUpSprinkler(key);
        return;
      }
      if (!tileInRange) { toast('Walk closer to plant a seed here \u{1F6B6}'); return; }
      plantEquippedSeedAt(ps.cell.q, ps.cell.r);
    }

    map.getContainer().addEventListener('pointerdown', onToolPointerDown);
    // Move and release go on the window: a mouse can leave the map mid-hold,
    // and a hold that was never cleaned up would keep its ring on screen.
    window.addEventListener('pointermove', onToolPointerMove);
    window.addEventListener('pointerup', onToolPointerUp);
    window.addEventListener('pointercancel', onToolPointerUp);

    // ---------------------------------------------------------------------
    //  RANGE SELECTION
    //  Press down on a tile with a tool (water/shear/sell - not fertilizer,
    //  which only ever acts on one flower plus a random neighbour and has
    //  no sensible bulk form) or a seed equipped, then drag without
    //  lifting: the tile you started on and wherever your finger currently
    //  is become the two opposite corners of a selection box - dragging
    //  straight across one row or column makes a line, dragging diagonally
    //  makes a rectangle, both the same mechanic. Holding still in place
    //  for HOLD_MS (same filling-ring confirm a single flower already uses)
    //  applies the action to every valid tile inside it. Releasing early,
    //  before the ring fills, cancels with nothing changed - exactly like
    //  releasing a single-tile hold early loses nothing.
    // ---------------------------------------------------------------------
    var RANGE_TOOLS = { water: true, shear: true, sell: true }; // fert deliberately excluded
    var rangeGesture = null;

    // Disables map panning for exactly as long as something range-capable
    // is equipped - a drag on the map means "select a range" for these, the
    // same way equipping any tool already claims what a plain tap means.
    // Fertilizer and "nothing equipped" are untouched, so the map still
    // pans normally in both.
    function syncMapDragging() {
      var capable = (activeTool && RANGE_TOOLS[activeTool]) || !!equippedSeed;
      if (capable) map.dragging.disable(); else map.dragging.enable();
    }

    function rangeBox(g) {
      return {
        minQ: Math.min(g.anchor.q, g.cur.q), maxQ: Math.max(g.anchor.q, g.cur.q),
        minR: Math.min(g.anchor.r, g.cur.r), maxR: Math.max(g.anchor.r, g.cur.r)
      };
    }
    // Same shape cellRingLatLngs already returns for the "in range" overlay,
    // generalized to an arbitrary (possibly non-square) box instead of a
    // fixed radius around one center.
    function cellBoxLatLngs(minQ, maxQ, minR, maxR) {
      var half = 0.5;
      return [
        [(minR - half) * CELL_LAT_DEG, (minQ - half) * CELL_LNG_DEG],
        [(minR - half) * CELL_LAT_DEG, (maxQ + half) * CELL_LNG_DEG],
        [(maxR + half) * CELL_LAT_DEG, (maxQ + half) * CELL_LNG_DEG],
        [(maxR + half) * CELL_LAT_DEG, (minQ - half) * CELL_LNG_DEG]
      ];
    }
    function rangeSelColor(mode) {
      if (mode === 'seed') return '#c9a565';
      if (activeTool === 'water') return '#4aa3ff';
      if (activeTool === 'sell') return '#f0a93a';
      return '#4caf6d'; // shear
    }
    function rangeRingIconHtml(g) {
      return g.mode === 'seed' ? variantChip(g.vk, 22) : toolIconHtml(g.tool, 22);
    }

    function startRangeSelection(mode, anchorCell) {
      var color = rangeSelColor(mode);
      var overlay = L.polygon(cellBoxLatLngs(anchorCell.q, anchorCell.q, anchorCell.r, anchorCell.r), {
        color: color, weight: 2, fillColor: color, fillOpacity: 0.18, interactive: false
      }).addTo(map);
      rangeGesture = {
        mode: mode, tool: activeTool, vk: equippedSeed,
        anchor: anchorCell, cur: anchorCell, overlay: overlay,
        ring: null, ringArc: null, ringStart: 0, raf: null
      };
      vibrate(8);
    }
    function updateRangeSelection(cell) {
      if (!rangeGesture) return;
      rangeGesture.cur = cell;
      var b = rangeBox(rangeGesture);
      rangeGesture.overlay.setLatLngs(cellBoxLatLngs(b.minQ, b.maxQ, b.minR, b.maxR));
      restartRangeHoldRing();
    }
    // Same filling-ring visual a single flower's hold already uses
    // (holdRingHtml), re-anchored to the current drag tile and reset on
    // every move - it only ever finishes counting once the finger has been
    // genuinely still for a full HOLD_MS, matching "once I'm done moving,
    // hold in that spot".
    function restartRangeHoldRing() {
      var g = rangeGesture;
      if (!g) return;
      if (g.raf) cancelAnimationFrame(g.raf);
      var c = cellCenter(g.cur.q, g.cur.r + 1); // one tile north, same reasoning startHold uses
      if (!g.ring) {
        g.ring = addFx(holdRingHtml(rangeRingIconHtml(g)), c.lat, c.lng, 'hold-ring', 0);
        g.ringArc = g.ring.el.querySelector('.hold-arc');
      } else {
        g.ring.lat = c.lat; g.ring.lng = c.lng;
        positionFx(g.ring);
      }
      g.ringStart = performance.now();
      stepRangeHold();
    }
    function stepRangeHold() {
      var g = rangeGesture;
      if (!g) return;
      var t = Math.min(1, (performance.now() - g.ringStart) / HOLD_MS);
      g.ringArc.setAttribute('stroke-dashoffset', (RING_C * (1 - t)).toFixed(1));
      g.ringArc.setAttribute('stroke', mixHex('#bfe6cd', '#4caf6d', t));
      if (t >= 1) { completeRangeSelection(); return; }
      g.raf = requestAnimationFrame(stepRangeHold);
    }
    function endRangeSelection() {
      if (!rangeGesture) return;
      if (rangeGesture.raf) cancelAnimationFrame(rangeGesture.raf);
      if (rangeGesture.ring) removeFx(rangeGesture.ring);
      map.removeLayer(rangeGesture.overlay);
      rangeGesture = null;
    }
    function completeRangeSelection() {
      var g = rangeGesture;
      var box = rangeBox(g);
      endRangeSelection();
      // The finger is still down at this point, same as a single-tile hold
      // completing - the pointerup that follows must not read as an
      // aborted gesture.
      if (pointerState) pointerState.completed = true;
      vibrate(30);
      if (g.mode === 'tool') applyRangeToolAction(g.tool, box);
      else applyRangeSeedAction(box, g.vk);
    }

    // Every tile in the box gets the same toolBlockedReason check a single
    // tap already runs (in range of the player - live OR today-accessible,
    // see inRange() - valid stage, etc.) - invalid ones are silently skipped
    // rather than toasted one by one, which would just be the exact
    // toast-pile-up problem a bulk action is supposed to avoid. No longer
    // clamped to a square around the player's live position: today-accessible
    // tiles can be scattered along a walking path rather than one contiguous
    // block, so the full dragged box is walked and toolBlockedReason's own
