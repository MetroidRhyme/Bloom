    // inRange() check (via toolTargetAt/inRange) is what filters each cell.
    function applyRangeToolAction(tool, box) {
      if (!state.userPos) { toast('Waiting for GPS to lock on...'); return; }
      var acted = 0;
      for (var q = box.minQ; q <= box.maxQ; q++) {
        for (var r = box.minR; r <= box.maxR; r++) {
          var target = toolTargetAt(cellKey(q, r));
          if (!target || toolBlockedReason(tool, target)) continue;
          if (tool === 'water') {
            waterWithCan(target.key);
          } else {
            var mode = tool === 'sell' ? 'sell' : 'extract';
            if (target.kind === 'wild') pickWild(target.key, mode);
            else onHarvestClick(target.key, mode);
          }
          acted++;
        }
      }
      if (acted === 0) toast('Nothing in range there for the ' + TOOL_NAMES[tool]);
    }

    // Same reasoning as applyRangeToolAction above - the full dragged box is
    // walked, and inRange(q, r) is the per-cell test rather than a clamp to
    // a square around the player's live position. Stops (not just skips)
    // the moment the pouch actually runs out mid-box, same as running out
    // mid-tap would.
    function applyRangeSeedAction(box, vk) {
      if (!state.userPos) { toast('Waiting for GPS to lock on...'); return; }
      var planted = 0;
      for (var q = box.minQ; q <= box.maxQ; q++) {
        for (var r = box.minR; r <= box.maxR; r++) {
          if (!inRange(q, r)) continue;
          if (!(state.seeds[vk] > 0)) {
            toast("You're out of that seed - open the Shop \u{1F338} to buy more");
            unequipSeed();
            return;
          }
          var key = cellKey(q, r);
          if (state.plants[key] || state.wild[key] || state.sprinklers[key]) continue;
          plantSeedAt(q, r, vk);
          planted++;
        }
      }
      if (planted === 0) { toast('Nothing to plant in that range'); return; }
      // The loop above only catches running out *mid*-box - a drag whose
      // last planted tile was also the last seed in the pouch runs the loop
      // to a normal finish instead of hitting that check, which used to
      // leave the packet equipped with nothing left in it (issue #14): the
      // toggle kept showing the now-empty variant selected with no way to
      // plant another. Same re-check plantEquippedSeedAt already does after
      // a single tap.
      if (!(state.seeds[vk] > 0)) {
        toast("You're out of that seed - open the Shop \u{1F338} to buy more");
        unequipSeed();
      } else {
        renderSeedToggle();
      }
    }

    // ---------------------------------------------------------------------
    //  SEEDS
    //  The seed packet at the top-right is the same idea as the toolbox,
    //  one level deeper: tap (or hold-and-drag) it and every species you
    //  hold at least one seed of drops down the right edge of the screen;
    //  tap a species row and its owned colors fly out to the LEFT of that
    //  row, alongside the column rather than replacing it - tap a different
    //  species and the flyout swaps to its colors instead. Tap a color and
    //  it equips, replacing the packet with that flower's own icon - exactly
    //  like a tool - and closes the whole thing. An equipped seed plants
    //  itself with a plain tap on empty ground (see plantEquippedSeedAt,
    //  wired into the map click handler below) and stays equipped across
    //  taps, so filling a bed with one color is a row of taps rather than a
    //  picker round-trip per tile.
    //
    //  Every icon carries a count badge: the packet shows the total seeds
    //  held, a species row shows that species' total, and a color petal
    //  (and the equipped toggle) show that exact variant's count. Species
    //  and colors with zero seeds never appear - "options should be limited
    //  to the seeds the player actually has" - so this is never a picker
    //  for things you can't plant, unlike the shop.
    // ---------------------------------------------------------------------
    // A torn-edge packet, like a real seed envelope: zigzags top and
    // bottom stand for the ripped paper, the rect between them is the
    // seam each zigzag tears away from - tall like a real packet, not
    // square - and a real flower (the same flowerSVG the journal draws)
    // sits printed in the middle, standing in for the picture on the
    // front of the packet. The outline stays stroke-only currentColor
    // like the tool icons; the flower carries its own real petal/center
    // colors, same as everywhere else it's drawn.
    function seedPacketIconSVG(px) {
      var fSize = 16, fx = 6, fy = 9;
      var flowerRaw = flowerSVG(speciesFor('tulip'), colorFor('red'), 100);
      var flowerInner = flowerRaw.replace(/^<svg[^>]*>/, '').replace(/<\/svg>\s*$/, '');
      var flowerMarkup = '<svg x="' + fx + '" y="' + fy + '" width="' + fSize + '" height="' + fSize +
        '" viewBox="0 0 100 100">' + flowerInner + '</svg>';
      return '<svg viewBox="0 0 28 34" width="' + px + '" height="' + Math.round(px * 34 / 28) + '" ' +
        'fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M3.5 6 L6.1 1 L8.8 6 L11.4 1 L14 6 L16.6 1 L19.2 6 L21.9 1 L24.5 6" stroke-width="1.5"/>' +
        '<path d="M3.5 28 L6.1 33 L8.8 28 L11.4 33 L14 28 L16.6 33 L19.2 28 L21.9 33 L24.5 28" stroke-width="1.5"/>' +
        '<rect x="3.5" y="6" width="21" height="22" stroke-width="1.5"/>' +
        flowerMarkup +
        '</svg>';
    }
    function seedCountBadgeHtml(n) {
      return n > 0 ? '<span class="seed-count-badge">' + n + '</span>' : '';
    }

    var equippedSeed = null;         // a variant key ("species:color"), or null
    var seedRailOpen = false;        // true while the species column is dropped down
    var seedColorSpecies = null;     // which species' colors are currently flown out to the left, or null

    // ---- What's actually in the pouch, grouped for the fan -----------------
    function ownedSeedVariantsOfSpecies(speciesKey) {
      return sortVariants(Object.keys(state.seeds).filter(function (vk) {
        return state.seeds[vk] > 0 && parseVariant(vk).species === speciesKey;
      }));
    }
    function ownedSpeciesKeys() {
      return SPECIES.map(function (s) { return s.key; })
        .filter(function (k) { return ownedSeedVariantsOfSpecies(k).length > 0; });
    }
    function totalSeedCount() {
      return Object.keys(state.seeds).reduce(function (n, vk) { return n + (state.seeds[vk] || 0); }, 0);
    }
    function speciesSeedCount(speciesKey) {
      return ownedSeedVariantsOfSpecies(speciesKey).reduce(function (n, vk) { return n + state.seeds[vk]; }, 0);
    }

    // ---- Rendering -----------------------------------------------------
    // Pure DOM sync, safe to call as often as needed - updateHUD() calls
    // this unconditionally on every state change AND on the 60s tick (see
    // tickPlants), so nothing in here may have a visible side effect beyond
    // reflecting current state. The spring-pop animation used to live here
    // and replayed on every one of those calls forever, even with nothing
    // equipped and nothing changing - see popSeedToggle() below, which is
    // what the actual equip/unequip transitions call instead.
    function renderSeedToggle() {
      var toggle = document.getElementById('seed-toggle');
      toggle.classList.toggle('seed-packet', !equippedSeed);
      toggle.classList.toggle('active', !!equippedSeed);
      if (equippedSeed) {
        // No fixed 3-way palette to key a CSS rule off like the tools have -
        // any of 98 variants can end up here, so the accent is resolved and
        // applied inline instead.
        var c = colorFor(parseVariant(equippedSeed).color);
        toggle.style.borderColor = c.line;
        toggle.style.color = c.ink;
      } else {
        toggle.style.borderColor = '';
        toggle.style.color = '';
      }
      toggle.innerHTML = (equippedSeed ? variantChip(equippedSeed, 26) : seedPacketIconSVG(24)) +
        seedCountBadgeHtml(equippedSeed ? (state.seeds[equippedSeed] || 0) : totalSeedCount());
      toggle.title = equippedSeed ? ('Put away the ' + variantName(equippedSeed) + ' seed') : 'Seeds';
    }
    // Small spring pop so an equip/unequip genuinely reads as a physical
    // action - called only by equipSeed()/unequipSeed() themselves, the two
    // places `equippedSeed` actually changes, never by the constant DOM-sync
    // above.
    function popSeedToggle() {
      var toggle = document.getElementById('seed-toggle');
      toggle.classList.remove('equip-pop');
      void toggle.offsetWidth;
      toggle.classList.add('equip-pop');
    }

    // Vertical spacing between species rows, dropping straight down the
    // right edge from the pouch - same pitch as the tool rail's rows so the
    // two columns read as one family. Colors fly out to the left of
    // whichever row is open, tighter-pitched since the petals themselves
    // are smaller (see .seed-petal).
    var SEED_ROW = 62;
    var SEED_COLOR_ROW = 48;
    // Flies a freshly-built container's petals from a shared origin out to
    // their final translate(dx,dy). Split into two rAFs: the first lets a
    // still-closed button actually paint before its transform changes, or
    // the browser can collapse both states into one frame and skip the
    // animation entirely. `slots` gives each child's target {dx,dy} in
    // order; `originDy` is where they all visually start from (0 for the
    // species column, the open species row's own dy for a color flyout, so
    // the colors read as emerging from the row you just tapped).
    function animatePetalsOpen(containerId, slots, originDy) {
      var container = document.getElementById(containerId);
      var petals = Array.prototype.slice.call(container.children);
      var originTransform = 'translate(0px,' + originDy.toFixed(1) + 'px) scale(0.3)';
      petals.forEach(function (el) { el.style.transform = originTransform; });
      container.classList.add('open');
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          petals.forEach(function (el, i) {
            el.style.transitionDelay = (i * 0.04) + 's, ' + (i * 0.04) + 's';
            el.style.transform = 'translate(' + slots[i].dx.toFixed(1) + 'px,' + slots[i].dy.toFixed(1) + 'px) scale(1)';
          });
        });
      });
    }
    // Rebuilds the species column. Called on open, and whenever the pouch's
    // species set could have changed while open - a fresh set of buttons
    // each time, not a morph, since owning/running out of a species is rare
    // enough not to need one.
    function renderSeedPetals() {
      var container = document.getElementById('seed-petals');
      var keys = ownedSpeciesKeys();
      var items = keys.map(function (sk) {
        var s = speciesFor(sk);
        var owned = ownedSeedVariantsOfSpecies(sk);
        // Rarest owned seed color of this species, same idea as the
        // journal's bookmark strip - a species you can plant six colors of
        // shows its rarest one, not always the base color.
        var repColor = owned.length ? parseVariant(owned[owned.length - 1]).color : s.base;
        return { key: sk, iconHtml: speciesChip(s, repColor, 26), count: speciesSeedCount(sk), title: s.name };
      });
      container.innerHTML = items.map(function (it) {
        return '<button class="tool-btn seed-petal' + (it.key === seedColorSpecies ? ' selected' : '') +
          '" data-key="' + it.key + '" title="' + it.title +
          '" onclick="onSeedPetalTap(\'' + it.key + '\')">' + it.iconHtml + seedCountBadgeHtml(it.count) + '</button>';
      }).join('');
      if (seedRailOpen) {
        var slots = keys.map(function (k, i) { return { dx: 0, dy: (i + 1) * SEED_ROW }; });
        animatePetalsOpen('seed-petals', slots, 0);
      }
    }
    // Rebuilds the color flyout for whichever species is open (seedColorSpecies),
    // or clears it. Anchored to that species' own row so the colors visibly
    // fly out to the left of the row you tapped, alongside the species
    // column rather than replacing it.
    function renderSeedColorPetals() {
      var container = document.getElementById('seed-color-petals');
      if (!seedColorSpecies) {
        Array.prototype.slice.call(container.children).forEach(function (el) {
          el.style.transform = ''; el.style.transitionDelay = '';
        });
        container.classList.remove('open');
        container.innerHTML = '';
        return;
      }
      var idx = ownedSpeciesKeys().indexOf(seedColorSpecies);
      if (idx < 0) { seedColorSpecies = null; renderSeedColorPetals(); return; } // stale - species ran out
      var rowDy = (idx + 1) * SEED_ROW;
      var s2 = speciesFor(seedColorSpecies);
      var vks = ownedSeedVariantsOfSpecies(seedColorSpecies);
      var items = vks.map(function (vk) {
        var v = parseVariant(vk);
        return { key: vk, iconHtml: speciesChip(s2, v.color, 26), count: state.seeds[vk] || 0, title: variantName(vk) };
      });
      container.innerHTML = items.map(function (it) {
        return '<button class="tool-btn seed-petal" data-key="' + it.key + '" title="' + it.title +
          '" onclick="onSeedPetalTap(\'' + it.key + '\')">' + it.iconHtml + seedCountBadgeHtml(it.count) + '</button>';
      }).join('');
      var slots = vks.map(function (k, i) { return { dx: -(i + 1) * SEED_COLOR_ROW, dy: rowDy }; });
      animatePetalsOpen('seed-color-petals', slots, rowDy);
    }

    // ---- Open/close and selection ------------------------------------------
    function openSeedRail() {
      seedRailOpen = true;
      seedColorSpecies = null;
      renderSeedPetals();
      renderSeedColorPetals(); // clears any stale flyout from a previous session
    }
    function closeSeedRail() {
      var container = document.getElementById('seed-petals');
      Array.prototype.slice.call(container.children).forEach(function (el) {
        el.style.transform = ''; el.style.transitionDelay = '';
      });
      container.classList.remove('open');
      seedRailOpen = false;
      seedColorSpecies = null;
      renderSeedColorPetals(); // retracts the color flyout too, if one was open
      clearSeedRailHover();
    }
    // A species row toggles its own color flyout open/closed without
    // equipping or closing the column - tapping a different species while
    // one is already open swaps which row's colors are showing. A color
    // petal equips and closes everything. Shared by both the tap-then-tap
    // path (each petal's own onclick) and the hold-and-drag release path
    // below. Species keys never contain a colon; variant keys always do
    // (see variantKey) - cheap enough to tell the two apart by that alone.
    function onSeedPetalTap(key) {
      if (key.indexOf(':') === -1) {
        seedColorSpecies = (seedColorSpecies === key) ? null : key;
        renderSeedPetals();       // to (un)highlight the tapped row
        renderSeedColorPetals();
        vibrate(10);
      } else {
        equipSeed(key);
      }
    }
    function equipSeed(vk) {
      closeSeedRail();
      if (!(state.seeds[vk] > 0)) return; // stale tap - already spent since the fan opened
      if (activeTool) setActiveTool(null); // a tool, a seed and a sprinkler are mutually exclusive modes
      if (equippedSprinkler) unequipSprinkler();
      closePlantPanel(); closeShop();
      equippedSeed = vk;
      setSeedHint(false); // the tutorial's pouch pointer, if any - the player just found it
      renderSeedToggle();
      popSeedToggle();
      updateHUD();
      syncMapDragging();
      vibrate(10);
    }
    function unequipSeed() {
      equippedSeed = null;
      renderSeedToggle();
      popSeedToggle();
      updateHUD();
      syncMapDragging();
    }
    function onSeedPacketEquippedClick() {
      if (equippedSeed) unequipSeed();
    }
    // Plants the equipped variant directly on an empty, in-range tile - no
    // picker, since equipping the seed already was the confirm step. Stays
    // equipped afterward (like a tool does) unless that was the last one.
    function plantEquippedSeedAt(q, r) {
      if (!(state.seeds[equippedSeed] > 0)) {
        toast("You're out of that seed - open the Shop \u{1F338} to buy more");
        unequipSeed();
        return;
      }
      plantSeedAt(q, r, equippedSeed);
      if (!(state.seeds[equippedSeed] > 0)) unequipSeed();
      else renderSeedToggle();
    }

    // ---- Pointer plumbing (tap-open-then-tap, or hold-and-drag-to-select) --
    var seedRailPointer = null;
    var SEED_HOVER_PAD = 10;
    // Color petals are checked first - they draw over the species column
    // they flew out from, so a finger resting where the two visually
    // overlap should hit whichever is actually on top.
    function hitTestInContainer(containerId, x, y) {
      var petals = document.getElementById(containerId).children;
      for (var i = 0; i < petals.length; i++) {
        var r = petals[i].getBoundingClientRect();
        if (x >= r.left - SEED_HOVER_PAD && x <= r.right + SEED_HOVER_PAD &&
            y >= r.top - SEED_HOVER_PAD && y <= r.bottom + SEED_HOVER_PAD) return petals[i].getAttribute('data-key');
      }
      return null;
    }
    function hitTestSeedPetal(x, y) {
      return hitTestInContainer('seed-color-petals', x, y) || hitTestInContainer('seed-petals', x, y);
    }
    function seedPetalEl(key) {
      return document.querySelector('#seed-color-petals [data-key="' + key + '"]') ||
        document.querySelector('#seed-petals [data-key="' + key + '"]');
    }
    function markSeedHoverOff(key) { var el = seedPetalEl(key); if (el) el.classList.remove('drag-hover'); }
    function clearSeedRailHover() {
      if (!seedRailPointer || !seedRailPointer.hoverKey) return;
      markSeedHoverOff(seedRailPointer.hoverKey);
      seedRailPointer.hoverKey = null;
    }
    function onSeedPointerDown(ev) {
      if (equippedSeed || seedRailPointer) return;
      if (!seedRailOpen && ownedSpeciesKeys().length === 0) {
        toast("You're out of seeds - open the Shop \u{1F338} to buy more");
        return;
      }
      ev.preventDefault();
      seedRailPointer = { id: ev.pointerId, startedOpen: seedRailOpen, hoverKey: null };
      if (!seedRailOpen) { openSeedRail(); vibrate(10); }
    }
    function onSeedPointerMove(ev) {
      if (!seedRailPointer || ev.pointerId !== seedRailPointer.id) return;
      var hit = hitTestSeedPetal(ev.clientX, ev.clientY);
      if (hit === seedRailPointer.hoverKey) return;
      if (seedRailPointer.hoverKey) markSeedHoverOff(seedRailPointer.hoverKey);
      seedRailPointer.hoverKey = hit;
      if (hit) {
        var el = seedPetalEl(hit);
        if (el) el.classList.add('drag-hover');
        vibrate(8);
      }
    }
    function onSeedPointerUp(ev) {
      if (!seedRailPointer || ev.pointerId !== seedRailPointer.id) return;
      var sp = seedRailPointer;
      seedRailPointer = null;
      if (sp.hoverKey) {
        markSeedHoverOff(sp.hoverKey);
        onSeedPetalTap(sp.hoverKey);
        return;
      }
      if (sp.startedOpen) closeSeedRail();
    }
    document.getElementById('seed-toggle').addEventListener('pointerdown', onSeedPointerDown);
    window.addEventListener('pointermove', onSeedPointerMove);
    window.addEventListener('pointerup', onSeedPointerUp);
    window.addEventListener('pointercancel', onSeedPointerUp);

    // ---------------------------------------------------------------------
    //  EQUIPMENT (sprinkler)
    //  One toggle button, bottom-left, mirroring the recenter button on the
    //  bottom-right - simpler than the tool rail or seed pouch since there is
    //  only ever one kind of equipment: no fan to open, just equip/unequip.
    //  Only shown once at least one sprinkler is owned unplaced (see
    //  renderSprinklerToggle), same "don't show a slot nobody can use yet"
    //  rule the fertilizer petal already follows.
    //
    //  Equipping it is the same "tap empty ground to place" gesture seeds
    //  use (see plantEquippedSeedAt/placeSprinklerAt), not the tools' "tap a
    //  flower to act on it" mode - a sprinkler is something you plant, not
    //  something you act with. Tapping an already-placed sprinkler on the
    //  map (see the click handler below) always picks it up and re-equips
    //  it immediately, so "pick it up" and "move it" are the same gesture.
    // ---------------------------------------------------------------------
    var equippedSprinkler = false;

    // The raw stroke-and-fill shapes, split out from sprinklerIconSVG below
    // so makeSprinklerIcon (map marker) can compose them into its own
    // viewBox alongside a dirt mound - see that function's comment. Local
    // coordinate space is a 32x32 square; callers that just want the icon
    // as-is (the toggle button, the shop stand) go through sprinklerIconSVG.
    function sprinklerGlyphMarkup() {
      return '<rect x="13.5" y="17" width="5" height="12" rx="1.5" fill="#8a8f98"/>' +
        '<circle cx="16" cy="15" r="4.5" fill="#5b6b7a"/>' +
        '<g fill="none" stroke="#6ec6ff" stroke-width="2.2" stroke-linecap="round">' +
        '<path d="M16 11 C10 5 6 5 3 8"/>' +
        '<path d="M16 10 C16 3 16 3 16 2"/>' +
        '<path d="M16 11 C22 5 26 5 29 8"/>' +
        '</g>';
    }

    // Drawn stroke-and-fill like the tool icons, reused as-is for this
    // toggle button and the shop's stand icon - one artwork, two places,
    // like the watering can icon already is. The map marker (makeSprinklerIcon)
    // uses sprinklerGlyphMarkup() directly instead, so it can share a
    // viewBox with its own dirt mound rather than wrapping this fixed
    // 32x32 square.
    function sprinklerIconSVG(px) {
      return '<svg viewBox="0 0 32 32" width="' + px + '" height="' + px + '">' +
        sprinklerGlyphMarkup() + '</svg>';
    }

    function renderSprinklerToggle() {
      var btn = document.getElementById('sprinkler-toggle');
      btn.classList.toggle('show', state.sprinklerInventory > 0 || equippedSprinkler);
      btn.classList.toggle('active', equippedSprinkler);
      btn.innerHTML = sprinklerIconSVG(24) + seedCountBadgeHtml(state.sprinklerInventory);
      btn.title = equippedSprinkler ? 'Put away the sprinkler' : 'Sprinkler';
    }

    function equipSprinkler() {
      if (!(state.sprinklerInventory > 0)) return;
      if (activeTool) setActiveTool(null);   // a tool and equipment are mutually exclusive modes
      if (equippedSeed) unequipSeed();
      closePlantPanel(); closeShop();
      equippedSprinkler = true;
      renderSprinklerToggle();
      popSprinklerToggle();
      updateHUD();
      vibrate(10);
    }
    function unequipSprinkler() {
      equippedSprinkler = false;
      renderSprinklerToggle();
      popSprinklerToggle();
      updateHUD();
    }
    function onSprinklerToggleClick() {
      if (equippedSprinkler) { unequipSprinkler(); return; }
      equipSprinkler();
    }
    // Reuses the tool rail's own spring-pop keyframe (.equip-pop) - the
    // button already shares the .tool-btn base class, so no new CSS is
    // needed for the animation itself.
    function popSprinklerToggle() {
      var btn = document.getElementById('sprinkler-toggle');
      btn.classList.remove('equip-pop');
      void btn.offsetWidth;
      btn.classList.add('equip-pop');
    }

    // Places the equipped sprinkler on an empty, in-range tile - no picker,
    // same reasoning as plantEquippedSeedAt. Stays equipped afterward if
    // there is another one left to place, otherwise puts itself away.
    function placeSprinklerAt(q, r) {
      var key = cellKey(q, r);
      if (state.plants[key] || state.wild[key] || state.sprinklers[key]) {
        toast('Something is already there');
        return;
      }
      if (!(state.sprinklerInventory > 0)) {
        toast("You're out of sprinklers - open the Shop \u{1F338} to buy more");
        unequipSprinkler();
        return;
      }
      state.sprinklerInventory--;
      var c = cellCenter(q, r);
      state.sprinklers[key] = { q: q, r: r, lat: c.lat, lng: c.lng, placedAt: Date.now() };
      saveState();
      renderSprinklers();
      tickSprinklers(); // an adjacent plant may already be ready/wilted - catch it up right away
      updateHUD();
      toast('\u{1F4A6} Sprinkler placed - it waters every flower next to it automatically');
      vibrate(20);
      if (!(state.sprinklerInventory > 0)) unequipSprinkler(); else renderSprinklerToggle();
    }

    // Tapping a placed sprinkler always picks it up (see the map click
    // handler) - there is no separate panel for equipment, unlike flowers.
    // Auto-equips on the way out so the very next tap can drop it somewhere
    // else - "tap it and pick it back up to move it" is meant to feel like
    // one continuous gesture, not two unrelated ones.
    function pickUpSprinkler(key) {
      var s = state.sprinklers[key];
      if (!s) return;
      delete state.sprinklers[key];
      state.sprinklerInventory++;
      saveState();
      renderSprinklers();
      equipSprinkler(); // also vibrates - the one buzz covers both "picked up" and "equipped"
      toast('Picked up the sprinkler \u{1F4A6} - tap a spot to move it');
    }

    document.getElementById('sprinkler-toggle').addEventListener('click', onSprinklerToggleClick);

    // ---------------------------------------------------------------------
    //  GPS
    // ---------------------------------------------------------------------
    // No player marker - only the translucent range shape marks the player,
    // so it never sits on top of (and hides) a flower planted right next to
    // them. userCellQ/userCellR is the tile it's currently snapped to. The
    // shape itself is the exact union of every tile within PLANT_RANGE (see
    // cellRingLatLngs) rather than a circle standing in for it, so what's
    // highlighted matches what actually counts as "in range" tile-for-tile.
    var rangeArea = null, viewingKey = null, viewingWild = false;
    var userCellQ = null, userCellR = null;
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Battery: pause every ambient CSS animation (wind sway, wild-flower
    // pulse, signature-color glow) the instant the tab/app is backgrounded -
    // see the .bg-paused rule up in ANIMATIONS. Nothing it affects is ever
    // visible while hidden, so this is pure savings, not a tradeoff: it just
    // stops the compositor from doing continuous work for a screen nobody
    // can see.
    if (document.hidden) document.body.classList.add('bg-paused');
    document.addEventListener('visibilitychange', function () {
      document.body.classList.toggle('bg-paused', document.hidden);
    });

    // -----------------------------------------------------------------------
    //  WELCOME-BACK TOUR
    //  A short, skippable camera tour offering a status check-in whenever the
    //  player is "back" - either a fresh page load once onboarding/tutorial/
    //  fertilizer-unlock are all already done (see onGpsLocked), or the tab
    //  becoming visible again after a real gap (see the visibilitychange
    //  listener below, for the common case of backgrounding/minimizing
    //  rather than fully closing the tab - the JS keeps running and
    //  onGpsLocked never fires again on its own). Every stop is derived from
    //  timestamps the plant/wild objects already carry (readyAt,
    //  lastWateredAt, spawnedAt) - new wild flowers and vanished wild
    //  flowers are diffed against state.lastSeenAt (a one-off event only
    //  worth mentioning once), but a ready or wilted plant is reported by
    //  its CURRENT state regardless of when it first became that way - it's
    //  still true and still actionable, so a flower that was already ready
    //  before the player last left is exactly the kind of thing a "here's
    //  what needs you" check-in should surface, not silently omit for being
    //  old news. Purely a presentation layer: it never changes game state
    //  itself (aside from advancing the checkpoint), so skipping it early
    //  costs nothing and loses no information - the plant or wild flower it
    //  would have shown you is still sitting on the map exactly where it was.
    // -----------------------------------------------------------------------
    var wbTour = { active: false, stops: [], index: -1, timer: null, marker: null };
    var WB_TOUR_MAX_STOPS = 6;   // caps a long absence at a highlight reel, not a slog
    var WB_TOUR_DWELL_MS = 1600; // "a quick 1 or 2 second focus on each thing"
    var WB_TOUR_ZOOM = 17;       // comfortable close-up zoom for each stop and the fly-back home
    // How long the tab has to have been hidden before becoming visible again
    // counts as "away" - keeps a quick alt-tab from retriggering the tour on
    // every single switch. Only gates the visibilitychange path; a fresh
    // page load (onGpsLocked) always checks, same as before.
    var WB_TOUR_MIN_AWAY_MS = 5 * 60 * 1000;

    // Wild flowers that finished vanishing while the game was closed. Has to
    // be captured before tickPlants() sweeps them out of state.wild - by the
    // time buildWelcomeBackTour would otherwise look, they're already gone
    // and unrecoverable, since nothing else remembers a wild flower once
    // it's swept.
    function collectGoneWild(now) {
      return Object.keys(state.wild)
        .filter(function (key) { return wildDerived(state.wild[key], now).gone; })
        .map(function (key) { return state.wild[key]; });
    }

    // lastSeen is the checkpoint from BEFORE this session (captured in
    // onGpsLocked before state.lastSeenAt is advanced to now); goneWild is
    // collectGoneWild()'s pre-sweep snapshot. Returns nothing - starts the
    // tour itself if there is anything worth showing.
    function buildAndStartWelcomeBackTour(lastSeen, goneWild) {
      if (!lastSeen) return; // no prior checkpoint yet - nothing to diff against
      var now = Date.now();
      var stops = [];

      Object.keys(state.plants).forEach(function (key) {
        var p = state.plants[key];
        var d = recomputePlant(p, now);
        var vk = variantKey(p.species, colorOfPlant(p));
        // Current state, not "became true since lastSeen" - a flower that
        // was already ready or wilted before the player last left is still
        // exactly as actionable as one that turned that way in between, so
        // it stays a stop rather than being silently swallowed for being
        // old news (see the section comment above). Readiness outranks wilt
        // everywhere else in the UI (map badge, HUD, panel) - one stop per
        // plant here too, rather than two competing messages about the same
        // flower.
        if (d.ready) {
          stops.push({ type: 'ready', lat: p.lat, lng: p.lng,
            text: variantName(vk) + ' is ready to water \u{1F4A7}' });
        } else if (d.wilted) {
          stops.push({ type: 'wilted', lat: p.lat, lng: p.lng,
            text: variantName(vk) + ' is looking a little wilted' });
        }
      });

      Object.keys(state.wild).forEach(function (key) {
        var w = state.wild[key];
        if (w.spawnedAt > lastSeen) {
          stops.push({ type: 'wildNew', lat: w.lat, lng: w.lng,
            text: 'A wild ' + variantName(variantKey(w.species, w.color)) + ' appeared nearby \u{1F33C}' });
        }
      });
      goneWild.forEach(function (w) {
        stops.push({ type: 'wildGone', lat: w.lat, lng: w.lng,
          text: 'A wild ' + variantName(variantKey(w.species, w.color)) + ' slipped away' });
      });

      if (!stops.length) return;

      // Lead with the good news - ready plants and fresh wild flowers first,
      // the merely cosmetic/informational stops last.
      var order = { ready: 0, wildNew: 1, wilted: 2, wildGone: 3 };
      stops.sort(function (a, b) { return order[a.type] - order[b.type]; });
      if (stops.length > WB_TOUR_MAX_STOPS) stops = stops.slice(0, WB_TOUR_MAX_STOPS);

      wbTour.active = true;
      wbTour.stops = stops;
      wbTour.index = -1;
      document.getElementById('wb-tour-banner').classList.add('open');
      advanceWelcomeBackTour();
    }

    function advanceWelcomeBackTour() {
      if (wbTour.marker) { map.removeLayer(wbTour.marker); wbTour.marker = null; }
      wbTour.index++;
      if (wbTour.index >= wbTour.stops.length) { endWelcomeBackTour(); return; }
      var stop = wbTour.stops[wbTour.index];

      document.getElementById('wb-tour-progress').textContent =
        (wbTour.index + 1) + ' of ' + wbTour.stops.length;
      document.getElementById('wb-tour-text').textContent = stop.text;

      if (reduceMotion) map.setView([stop.lat, stop.lng], WB_TOUR_ZOOM);
      else map.flyTo([stop.lat, stop.lng], WB_TOUR_ZOOM, { duration: 0.7 });

      wbTour.marker = L.marker([stop.lat, stop.lng], {
        icon: L.divIcon({ html: '<div class="wb-tour-ping ' + stop.type + '"></div>',
          iconSize: [46, 46], iconAnchor: [23, 23], className: '' }),
        interactive: false, zIndexOffset: 500
      }).addTo(map);

      wbTour.timer = setTimeout(advanceWelcomeBackTour, WB_TOUR_DWELL_MS);
    }

    function endWelcomeBackTour() {
      clearTimeout(wbTour.timer);
      if (wbTour.marker) { map.removeLayer(wbTour.marker); wbTour.marker = null; }
      wbTour.active = false;
      document.getElementById('wb-tour-banner').classList.remove('open');
      // Return to the player's own position regardless of state.following -
      // the tour deliberately overrode the camera to get here, so it should
      // deliberately hand it back, the same way it took it.
      if (userCellQ !== null && userCellR !== null) {
        var back = cellCenter(userCellQ, userCellR);
        if (reduceMotion) map.setView([back.lat, back.lng], WB_TOUR_ZOOM);
        else map.flyTo([back.lat, back.lng], WB_TOUR_ZOOM, { duration: 0.7 });
      }
    }

    function skipWelcomeBackTour() { endWelcomeBackTour(); }

    // The other half of "what triggers the welcome-back tour": onGpsLocked
    // only ever runs once, the moment the page first gets a GPS fix, so a
    // full tab close+reopen (a real page load) is the only thing that used
    // to reach it - backgrounding or minimizing a still-alive tab, by far
    // the more common way a phone browser is "closed and reopened", left
    // the page running with nothing to notice the player had ever left.
    // Page Visibility firing 'visible' again is that actual moment.
    //
    // Deliberately narrower than onGpsLocked's own resume chain: this only
    // ever offers the welcome-back tour, never onboarding/tutorial/
    // fertilizer-unlock - those have their own state machines (startTutorial
    // in particular RESETS tutorial.step back to 'plant' if called again
    // mid-flight) that are only safe to re-enter from a real page load, not
    // an arbitrary tab-visibility flicker, so this backs off entirely
    // (shows nothing) if any of them isn't already resolved.
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState !== 'visible') return;
      if (!rangeArea) return; // GPS never locked yet this session - nothing to diff against
      if (wbTour.active || document.getElementById('modal-overlay').classList.contains('open')) return;
      if (!state.seenWelcome || !state.tutorialDone || (state.fertReady && !state.fertUnlocked)) return;
      var lastSeen = state.lastSeenAt;
      if (!lastSeen || Date.now() - lastSeen < WB_TOUR_MIN_AWAY_MS) return;
      var goneWild = collectGoneWild(Date.now()); // must run before tickPlants() sweeps its answer away
      // Full offline catch-up first, before tickPlants()/buildAndStartWelcomeBackTour
      // read any plant state below - see catchUpSprinklersOffline's own comment.
      // Rain-ring catch-up runs right after: it needs `rainRings` to already
      // reflect anything a sprinkler just grew into a completed ring during
      // this same gap.
      catchUpSprinklersOffline();
      catchUpRainRingsOffline();
      tickPlants();
      maybeSpawnWild();
      buildAndStartWelcomeBackTour(lastSeen, goneWild);
      state.lastSeenAt = Date.now();
      saveState();
    });

    // Battery: polled on an interval rather than a continuous
    // watchPosition() subscription. watchPosition asks the OS to keep the
    // GPS radio in a continuously-active high-accuracy session for as long
    // as it's open - on a walking game left running for hours that's one of
    // the single biggest battery/heat costs on the phone. A plain fix every
    // GPS_POLL_MS instead lets the radio power back down between polls the
    // same way any other on-demand location request does, at the cost of
    // noticing a tile change up to GPS_POLL_MS late - a real tradeoff, but
    // one a walking pace (a tile is CELL_LAT_DEG/CELL_LNG_DEG wide, well
    // over the ~10-15m a person covers in 5s at a stroll) doesn't actually
    // feel.
    var GPS_POLL_MS = 5000;
    var _gpsPollTimer = null, _gpsStarted = false;
    function pollLocation() {
      navigator.geolocation.getCurrentPosition(onLocationUpdate, onLocationError, {
        enableHighAccuracy: true, maximumAge: 3000, timeout: 15000
      });
    }
    // The actual permission request - split out so both the normal startup
    // path and the primer's "Allow Location" button (see openGpsPrimer) and
    // retryLocation() can all trigger it the same way. Clears any prior
    // timer first so a retry (permission granted after an initial denial)
    // can never stack a second interval on top of the first.
    function requestLocation() {
      _gpsStarted = true;
      if (_gpsPollTimer) clearInterval(_gpsPollTimer);
      pollLocation(); // don't make the very first lock wait out a full interval
      if (!document.hidden) _gpsPollTimer = setInterval(pollLocation, GPS_POLL_MS);
    }
    // Nothing GPS-driven is visible while the tab/app is backgrounded (same
    // reasoning as the CSS .bg-paused rule above), so polling stops
    // entirely rather than just continuing to spend battery unseen - and
    // picks back up with one immediate fix, not a stale position left over
    // from before, the moment it's visible again.
    document.addEventListener('visibilitychange', function () {
      if (!_gpsStarted) return; // still on the GPS primer, or geolocation unsupported
      if (document.hidden) {
        if (_gpsPollTimer) { clearInterval(_gpsPollTimer); _gpsPollTimer = null; }
      } else if (!_gpsPollTimer) {
        pollLocation();
        _gpsPollTimer = setInterval(pollLocation, GPS_POLL_MS);
      }
    });

    if (!navigator.geolocation) {
      document.getElementById('gps-status').textContent = 'NO GPS';
      document.getElementById('hud-status-line').textContent = 'Geolocation is not supported on this device.';
    } else if (!state.gpsPrimerSeen) {
      // Brand-new device: explain why Bloom wants location before the
      // browser's own permission dialog fires, rather than surprising a
      // total stranger with a native prompt they have no context for.
      // Existing saves always come back from loadState() with
      // gpsPrimerSeen already true, so returning players never see this.
      openGpsPrimer();
    } else {
      requestLocation();
    }

    // Eases the range shape from one tile center to the next over ~450ms
    // instead of jumping. Only runs on an actual tile change (see
    // onLocationUpdate), so ordinary GPS jitter within the same tile never
    // moves it at all - that's the real fix for the twitchiness, this
    // animation just makes real tile-to-tile steps read as movement rather
    // than a teleport. fromRing/toRing are two cellRingLatLngs() outputs -
    // congruent, same vertex count and order, purely translated relative to
    // each other - so a per-vertex lerp is enough; no reshaping needed.
    var _circleAnimRAF = null;
    function animateRangeTo(fromRing, toRing) {
      if (_circleAnimRAF) cancelAnimationFrame(_circleAnimRAF);
      if (reduceMotion) { rangeArea.setLatLngs(toRing); return; }
      var start = performance.now(), dur = 450;
      function step(now) {
        var t = Math.min(1, (now - start) / dur);
        var e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; // ease-in-out-quad
        var frame = fromRing.map(function (p, i) {
          var tp = toRing[i];
          return [p[0] + (tp[0] - p[0]) * e, p[1] + (tp[1] - p[1]) * e];
        });
        rangeArea.setLatLngs(frame);
        _circleAnimRAF = (t < 1) ? requestAnimationFrame(step) : null;
      }
      _circleAnimRAF = requestAnimationFrame(step);
    }

    // Issue #17: "it's hard because I need to scroll all the way down to
    // where my house is on the map" - on the very first GPS lock of a
    // session, a player whose flowers are nowhere near wherever they
    // happen to be standing right now (out running errands, say) used to
    // always get dropped on their own position and have to go hunt the
    // garden down by hand. If they're not within PLANT_RANGE of any of
    // their own planted flowers right now, land the initial view on a
    // randomly-picked one of those flowers instead - still findable at a
    // glance - falling back to the player's own position when they have no
    // flowers planted yet, or when they're already standing near one (a
    // player working their own garden sees exactly the old behavior).
    // Deliberately only affects this one first-lock framing; every GPS fix
    // after this still follows the player as usual (see the
    // state.following branch below/onRecenter) - it's the "where do I open
    // to" decision, not a standing "show my flowers" mode.
    function pickInitialCameraTarget(q, r, playerLatLng) {
      var keys = Object.keys(state.plants);
      if (!keys.length) return { lat: playerLatLng.lat, lng: playerLatLng.lng, onFlower: false };
      var nearOwnFlower = keys.some(function (k) {
        var p = state.plants[k];
        return cellDist(q, r, p.q, p.r) <= PLANT_RANGE;
      });
      if (nearOwnFlower) return { lat: playerLatLng.lat, lng: playerLatLng.lng, onFlower: false };
      var pick = state.plants[keys[Math.floor(Math.random() * keys.length)]];
      return { lat: pick.lat, lng: pick.lng, onFlower: true };
    }

    function onLocationUpdate(pos) {
      document.getElementById('gps-denied-banner').classList.remove('open'); // any fix clears a prior denial
      var lat = pos.coords.latitude, lng = pos.coords.longitude;
      state.userPos = { lat: lat, lng: lng };

      // Snap the displayed position to the current tile's center rather than
      // following raw GPS - range checks elsewhere already work in tile
      // distance (cellDist), not raw lat/lng, so this changes nothing about
      // what counts as "in range", only how steady the shape looks.
      var h = latLngToCell(lat, lng);
      var c = cellCenter(h.q, h.r);

      if (!rangeArea) {
        userCellQ = h.q; userCellR = h.r;
        markAccessible(h.q, h.r);
        markAccessibleToday(h.q, h.r);
        rangeArea = L.polygon(cellRingLatLngs(h.q, h.r, PLANT_RANGE), {
          color: '#4caf6d', weight: 1.5,
          fillColor: '#4caf6d', fillOpacity: 0.08, interactive: false
        }).addTo(map);
        var initialTarget = pickInitialCameraTarget(h.q, h.r, c);
        map.setView([initialTarget.lat, initialTarget.lng], 17);
        // Landed on a flower instead of the player - same reasoning as
        // panMapToPlant: leave state.following false so the very next GPS
        // fix doesn't immediately yank the view back to the player and
        // undo the point of centering here in the first place.
        if (initialTarget.onFlower) { state.following = false; saveState(); }
        onGpsLocked();
      } else if (h.q !== userCellQ || h.r !== userCellR) {
        var fromRing = cellRingLatLngs(userCellQ, userCellR, PLANT_RANGE);
        userCellQ = h.q; userCellR = h.r;
        markAccessible(h.q, h.r);
        markAccessibleToday(h.q, h.r);
        animateRangeTo(fromRing, cellRingLatLngs(h.q, h.r, PLANT_RANGE));
        // Suppressed mid-tour - the welcome-back tour is deliberately
        // showing the player somewhere else on the map for a moment, and an
        // ordinary GPS-follow pan firing underneath it would fight that.
        if (state.following && !wbTour.active) map.panTo([c.lat, c.lng], { animate: true, duration: 0.4 });
      }
      if (viewingKey) renderPlantPanel(viewingKey); // range may have just changed
      updateHUD();
    }

    function onLocationError(err) {
      var msgs = { 1: 'Location permission denied.', 2: 'Position unavailable.', 3: 'GPS timed out, retrying...' };
      var badge = document.getElementById('gps-status');
      badge.textContent = 'NO GPS'; badge.className = 'err';
      document.getElementById('hud-status-line').textContent = msgs[err.code] || err.message;
      // code 1 = permission denied is the one case with no automatic
      // recovery - codes 2/3 (position unavailable / timeout) resolve on
      // their own as the next poll comes around (see pollLocation's
      // interval), so only 1 needs a way back in. See retryLocation()/
      // onLocationUpdate for how this clears.
      if (err.code === 1) document.getElementById('gps-denied-banner').classList.add('open');
    }

    // "Try Again" on the denial banner. This only actually helps if the
    // player changed the permission in their browser/OS settings first -
    // re-requesting after a hard denial with nothing changed just denies
    // again - but it's a real recovery path for the common case (accidental
    // "Don't Allow", or granting it after the fact) instead of a dead end.
    function retryLocation() {
      document.getElementById('gps-denied-banner').classList.remove('open');
      var badge = document.getElementById('gps-status');
      badge.textContent = 'LOCATING...'; badge.className = 'pending'; badge.style.display = '';
      requestLocation();
    }

    function onGpsLocked() {
      var badge = document.getElementById('gps-status');
      badge.textContent = 'GPS LOCKED';
      badge.className = 'locked';
      setTimeout(function () { badge.style.display = 'none'; }, 3000);
      // Longitude scale depends on latitude - lock it once so tiles stay
      // visually square near where the player actually is.
      if (!localStorage.getItem('bloom_cell_lng')) {
        CELL_LNG_DEG = CELL_LAT_DEG / Math.cos(state.userPos.lat * Math.PI / 180);
        localStorage.setItem('bloom_cell_lng', CELL_LNG_DEG);
        // rangeArea was built (in onLocationUpdate, just before this call)
        // using the uncorrected CELL_LNG_DEG - rebuild it now with the fixed
        // value so the very first shape isn't stretched either. userCellQ/R
        // must be re-derived from the real lat/lng too, not just reused:
        // they were computed under the old CELL_LNG_DEG, and pairing a tile
        // index from one longitude scale with corners built at another
        // scale produces a wildly wrong shape, not just a stretched one.
        if (rangeArea) {
          var hh = latLngToCell(state.userPos.lat, state.userPos.lng);
          userCellQ = hh.q; userCellR = hh.r;
          rangeArea.setLatLngs(cellRingLatLngs(userCellQ, userCellR, PLANT_RANGE));
        }
      }
      // The map.setView() a moment ago in onLocationUpdate already fired
      // 'moveend' (and so a grid redraw) before CELL_LNG_DEG was corrected
      // above - redraw once more now so the very first mesh isn't stretched.
      scheduleGridRedraw();
      vibrate(30);

      // Both captured before tickPlants()/maybeSpawnWild() run below: the
      // checkpoint (lastSeen) is about to be overwritten for next time, and
      // collectGoneWild() has to run before tickPlants() sweeps its answer
      // away. See buildAndStartWelcomeBackTour().
      var lastSeen = state.lastSeenAt;
      var goneWild = collectGoneWild(Date.now());

      // Full offline catch-up first, before tickPlants()/buildAndStartWelcomeBackTour
      // read any plant state below - see catchUpSprinklersOffline's own comment.
      catchUpSprinklersOffline();
      catchUpRainRingsOffline();
      tickPlants();
      // Needs a real fix before it can ask "what paths are near here?", so it
      // hangs off the lock rather than off init. No-ops if today already ran.
      maybeSpawnWild();
      // Brand-new player: show the welcome modal, then the tutorial starts
      // once they dismiss it (see openWelcome). Returning to a save where the
      // tutorial was started but never finished/skipped (app closed mid-way)
      // skips straight to resuming it, since they've already seen Welcome.
      // Only once both are already done does a returning player get the
      // welcome-back tour instead - it would otherwise compete with either.
      // A fertilizer modal left unanswered (see maybeStartFertTutorial) resumes
      // here too, ahead of the welcome-back tour, for the same reason as the
      // tutorialDone branch above it - it would otherwise compete with it.
      // The "What's New" popup (see maybeShowWhatsNew) is checked last,
      // after every onboarding step is actually done, so a returning player
      // never sees a changelog before they have even planted a seed; it
      // only ever wins this lock's modal slot over the welcome-back tour
      // when there is actually something new to show.
      if (!state.seenWelcome) openWelcome();
      else if (!state.tutorialDone) startTutorial();
      else if (state.fertReady && !state.fertUnlocked) openFertTutorial();
      else if (!maybeShowWhatsNew()) buildAndStartWelcomeBackTour(lastSeen, goneWild);

      // Advance the checkpoint on every lock, regardless of which branch
      // above ran - a brand-new save's very first lock needs this too, or
      // it never gets a real checkpoint to diff against on visit two.
      state.lastSeenAt = Date.now();
      saveState();
    }

    // ---------------------------------------------------------------------
    //  PLANT PANEL
    // ---------------------------------------------------------------------
    function formatAgo(ts) {
      var min = Math.floor((Date.now() - ts) / 60000);
      if (min < 1) return 'just now';
      if (min < 60) return min + (min === 1 ? ' minute ago' : ' minutes ago');
      var hr = Math.floor(min / 60);
      if (hr < 24) return hr + (hr === 1 ? ' hour ago' : ' hours ago');
      var day = Math.floor(hr / 24);
      return day + (day === 1 ? ' day ago' : ' days ago');
    }

    // Forward-looking counterpart to formatAgo, for the ready-to-water wait.
    // Rounds up so a plant never reads "0m" while still counting down.
    function formatDuration(ms) {
      var min = Math.ceil(ms / 60000);
      if (min < 60) return min + 'm';
      var hr = Math.floor(min / 60), rem = min % 60;
      return rem > 0 ? hr + 'h ' + rem + 'm' : hr + 'h';
    }

    function openPlantPanel(key, isWild) {
      closeShop(); closeJournal(); closeCrossNotes(); closeGreenhouse(); // only one full-screen/bottom-sheet panel open at a time
      viewingKey = key;
      viewingWild = !!isWild;
      renderPlantPanel(key);
      document.getElementById('plant-panel').classList.add('open');
    }
    function closePlantPanel() {
      viewingKey = null;
      viewingWild = false;
      syncPlantCycleArrows();
      document.getElementById('plant-panel').classList.remove('open');
    }

    // A wild flower reuses the same sheet, minus everything that only applies
    // to something you planted: no growth bar (it never grows) and no water
    // button (it can't be tended). All that's left is picking it.
    function renderWildPanel(key) {
      var w = state.wild[key];
      if (!w) { closePlantPanel(); return; }
      var species = speciesFor(w.species);
      var d = wildDerived(w, Date.now());

      var v = buildPlantVisual(species, paletteOf(w), 2, d.wilted, 88, w.q, w.r);
      var iconEl = document.getElementById('plant-icon-big');
      iconEl.innerHTML = v.html;
      iconEl.style.width = v.w + 'px';
      iconEl.style.height = v.h + 'px';

      document.getElementById('plant-title').textContent =
        'Wild ' + variantName(variantKey(w.species, w.color || baseColorOf(w.species)));
      document.getElementById('plant-meta').textContent = 'Found growing wild \u{1F33C} ' + formatAgo(w.spawnedAt);

      // The growth bar is reused as a life bar here - a wild flower doesn't
      // grow, it runs down. Amber rather than green so an emptying bar never
      // reads as progress.
      var track = document.getElementById('growth-bar-track');
      var fill = document.getElementById('growth-bar-fill');
      var barLabel = document.getElementById('growth-bar-label');
      track.style.display = '';
      barLabel.style.display = '';
      fill.classList.add('fading');
      fill.style.width = Math.round(d.lifeFrac * 100) + '%';
      barLabel.textContent = 'Fades in ' + formatDuration(d.goneIn);

      // Wild flowers can't be crossed - they aren't yours and never flourish.
      var breedBtn = document.getElementById('breed-btn');
      breedBtn.style.display = 'none';
      breedBtn.onclick = null;

      var tileInRange = inRange(w.q, w.r);

      var statusEl = document.getElementById('plant-status-line');
      if (!tileInRange) { statusEl.textContent = 'Walk over to pick it'; statusEl.className = 'status-wilt'; }
      else if (d.wilted) { statusEl.textContent = 'Wilting - pick it before it fades'; statusEl.className = 'status-wilt'; }
      else { statusEl.textContent = 'Ready to pick - it\'s yours if you want it'; statusEl.className = 'status-good'; }

      document.getElementById('panel-hint').innerHTML = tileInRange
        ? hintTool('shear') + ' to extract 1-2 seeds, or ' + hintTool('sell') + ' to sell it for ' +
          SELL_SINGLE + ' \u{1F338}'
        : 'Walk over to pick it.';
      syncPlantCycleArrows(); // always hides for a wild panel - see the !viewingWild check above
    }

    // Names a tool inline, with its own icon, so a hint in the panel points at
    // something the player can actually see on the rail.
    function hintTool(tool) {
      var label = tool === 'water' ? 'watering can' : tool === 'shear' ? 'shears' : 'sell';
      return '<span class="hint-tool"><span class="hint-icon">' + toolIconHtml(tool, 14) +
        '</span>' + label + '</span>';
    }

    // Wild flowers are free, so picking one is pure upside either way -
    // Extract pulls 1-2 seeds of exactly this variant for free, Sell pays the
    // single-bloom rate. Either way the tile clears, which is also what makes
    // room for the next daily spawn, and this variant's lifetime grown tally
    // (see recordGrown) goes up by one regardless of which you pick.
    function pickWild(key, mode) {
      var w = state.wild[key];
      if (!w) return;
      var vk = variantKey(w.species, w.color || baseColorOf(w.species));
      delete state.wild[key];
      recordGrown(vk);

      if (mode === 'sell') {
        state.currency += SELL_SINGLE;
        state.stats.sold++;
        state.stats.earned += SELL_SINGLE;
        toast('Sold a wild ' + variantName(vk) + ' for ' + SELL_SINGLE + ' \u{1F338}');
      } else {
        var gained = rollWeighted(SEED_YIELD_SINGLE); // wild blooms are always single-stage
        state.seeds[vk] = (state.seeds[vk] || 0) + gained;
        state.stats.extracted += gained;
        state.stats.extractedFlowers++;
        toast('\u{1F331} Got ' + gained + ' seed' + (gained === 1 ? '' : 's') + ' from a wild ' +
          variantName(vk));
      }

      saveState();
      renderWild();
      updateHUD();
      updateCurrencyPill();
      closePlantPanel();
      vibrate(20);
      checkSprinklerUnlock();
      checkGreenhouseTeaser();
    }

    function renderPlantPanel(key) {
      if (viewingWild) { renderWildPanel(key); return; }
      var p = state.plants[key];
      if (!p) { closePlantPanel(); return; }
      // Undo whatever the wild variant may have changed last time round.
      document.getElementById('growth-bar-track').style.display = '';
      document.getElementById('growth-bar-label').style.display = '';
      document.getElementById('growth-bar-fill').classList.remove('fading');
      var d = recomputePlant(p, Date.now());
      var species = speciesFor(p.species);

      var v = buildPlantVisual(species, paletteOf(p), d.stage, d.wilted, 88, p.q, p.r);
      var iconEl = document.getElementById('plant-icon-big');
      iconEl.innerHTML = v.html;
      iconEl.style.width = v.w + 'px';
      iconEl.style.height = v.h + 'px';

      // A bred seedling keeps its color secret until it blooms - the seed and
      // sprout artwork is colorless anyway, so the title is the only thing
      // that would give it away.
      document.getElementById('plant-title').textContent = p.mystery
        ? 'Mystery Seedling - ' + STAGE_LABELS[d.stage]
        : variantName(variantKey(p.species, p.color || baseColorOf(p.species))) +
          ' - ' + STAGE_LABELS[d.stage];
      document.getElementById('plant-meta').textContent = p.mystery
        ? 'A cross, sown ' + formatAgo(p.plantedAt) + ' - water it to see what it is'
        : 'Planted ' + formatAgo(p.plantedAt);

      // The bar fills across the readiness wait, so it reads as "this plant is
      // getting there" rather than "this plant is running out of something".
      var growthPct = d.stage >= MAX_STAGE
        ? 100
        : Math.max(0, Math.min(100, Math.round((1 - d.readyIn / stageReadyMs()) * 100)));
      document.getElementById('growth-bar-fill').style.width = growthPct + '%';
      document.getElementById('growth-bar-label').textContent =
        d.stage >= MAX_STAGE ? 'Fully grown' :
        d.ready ? 'Ready to grow now!' :
        'Ready to grow in ' + formatDuration(d.readyIn);

      // Status line says how the plant is doing; the bar above says when it
      // next needs you. Readiness leads because it is the only state a visit
      // converts into progress - wilt is cosmetic, so it ranks below it.
      var statusEl = document.getElementById('plant-status-line');
      if (d.ready) { statusEl.textContent = 'Ready to grow - give it a drink!'; statusEl.className = 'status-good'; }
      else if (d.wilted) { statusEl.textContent = 'Looking wilted - a drink will perk it back up'; statusEl.className = 'status-wilt'; }
      else if (d.stage >= MAX_STAGE) { statusEl.textContent = 'Fully grown - extract its seeds or sell it'; statusEl.className = 'status-good'; }
      else { statusEl.textContent = 'Thriving'; statusEl.className = 'status-good'; }

      var tileInRange = inRange(p.q, p.r);

      // The panel is a read-out now, not a control surface - tending happens
      // with the tools on the rail. So instead of a Water button and an
      // Extract/Sell row, it names whichever tools would do something to this
      // flower right now, and says nothing where nothing applies. Watering is
      // only worth mentioning when it would advance a stage or clear a wilt;
      // a mid-wait plant has no action to take at all.
      var hints = [];
      if (d.ready || d.wilted) {
        hints.push(hintTool('water') + ' to ' + (d.ready ? 'water and grow it' : 'perk it back up'));
      }
      if (d.stage >= 2) {
        var yieldText = d.stage >= MAX_STAGE ? '2-4 seeds' : '1-2 seeds';
        hints.push(hintTool('shear') + ' to extract ' + yieldText + ', or ' + hintTool('sell') + ' to sell for ' +
          harvestValue(p, d.stage) + ' \u{1F338}');
      }
      document.getElementById('panel-hint').innerHTML =
        !hints.length ? 'Nothing to do here yet - it is still growing.' :
        !tileInRange ? 'Walk closer to tend it.' : hints.join('<br>');

      renderBreedButton(key, p, d, tileInRange);
      syncPlantCycleArrows();
    }

    // The Cross button only appears when a cross is actually possible, and
    // otherwise says which part is missing rather than sitting there greyed
    // out with no explanation. A flourishing plant with no flourishing
    // neighbour shows nothing at all - there is no cross to hint at.
    function renderBreedButton(key, p, d, inRange) {
      var btn = document.getElementById('breed-btn');
      btn.onclick = null;

      var waiting = breedWaitMs(p);
      var partners = (d.stage >= MAX_STAGE && !waiting) ? breedPartnersFor(key) : [];
      var neighborWaiting = false;
      if (d.stage >= MAX_STAGE && !waiting && !partners.length) {
        // Same species only, same as breedPartnersFor - a flourishing
        // neighbour of a different species is not "resting", it's simply
        // never going to be a partner, and saying otherwise would be wrong.
        neighborWaiting = neighborsOf(p.q, p.r).some(function (h) {
          var o = state.plants[cellKey(h.q, h.r)];
          return o && o.species === p.species && recomputePlant(o, Date.now()).stage >= MAX_STAGE;
        });
      }

      if (d.stage < MAX_STAGE || (!partners.length && !waiting && !neighborWaiting)) {
        btn.style.display = 'none';
        return;
      }
      btn.style.display = '';

      if (waiting) {
        btn.disabled = true;
        btn.textContent = 'Can cross again in ' + formatDuration(waiting);
      } else if (neighborWaiting) {
        btn.disabled = true;
        btn.textContent = 'Neighbour is still resting';
      } else if (!inRange) {
        btn.disabled = true;
        btn.textContent = 'Walk closer to cross';
      } else if (state.fertilizer <= 0) {
        btn.disabled = true;
        btn.textContent = 'Needs fertilizer - buy a bag';
      } else {
        btn.disabled = false;
        btn.textContent = 'Cross with a neighbour \u{1F331}';
        btn.onclick = function () { openBreedPicker(key); };
      }
    }

    // Thin wrapper so the tutorial (see TUTORIAL section) can observe a real
    // harvest without renderPlantPanel needing to know it exists.
    function onHarvestClick(key, mode) {
      var value = harvestPlant(key, mode);
      tutorialOnHarvest(key, mode, value);
    }

    // ---------------------------------------------------------------------
    //  BREEDING
    // ---------------------------------------------------------------------
    function neighborsOf(q, r) {
      return CELL_NEIGHBORS.map(function (d) { return { q: q + d[0], r: r + d[1] }; });
    }
    // Free means nothing of yours, no wild flower, and no placed sprinkler -
    // a bred seedling must never land on top of something already there.
    function cellFree(q, r) {
      var k = cellKey(q, r);
      return !state.plants[k] && !state.wild[k] && !state.sprinklers[k];
    }
    function colorOfPlant(p) { return p.color || baseColorOf(p.species); }

    // A parent must be fully grown and off its cooldown. Both halves matter:
    // flourishing is what makes breeding the end of the watering loop rather
    // than a way around it.
    function breedReady(p) {
      return recomputePlant(p, Date.now()).stage >= MAX_STAGE &&
             Date.now() >= (p.breedReadyAt || 0);
    }
    function breedWaitMs(p) { return Math.max(0, (p.breedReadyAt || 0) - Date.now()); }

    // Adjacent plants of yours that could cross with this one right now.
    // Same species only - crossing across species used to be the norm (the
    // color roll and the species coin-flip didn't care), but that let any
    // two flourishing neighbours pair up regardless of shape. Restricting to
    // matching species here is the single choke point both entry points
    // (the plant panel's button and the fert tool) share, so neither needs
    // its own copy of the rule.
    function breedPartnersFor(key) {
      var p = state.plants[key];
      if (!p || !breedReady(p)) return [];
      return neighborsOf(p.q, p.r).map(function (h) { return cellKey(h.q, h.r); })
        .filter(function (k) {
          var o = state.plants[k];
          return o && breedReady(o) && o.species === p.species;
        });
    }

    // "Between them" where possible: two adjacent tiles share at least one
    // common neighbour, so a seedling lands in the gap the parents make.
    // Only if none of those are free does it fall back to any free
    // neighbour of either parent.
    function breedSpotFor(a, b) {
      var shared = neighborsOf(a.q, a.r).filter(function (h) {
        return cellDist(h.q, h.r, b.q, b.r) === 1 && cellFree(h.q, h.r);
      });
      var pool = shared;
      if (!pool.length) {
        var seen = {};
        pool = neighborsOf(a.q, a.r).concat(neighborsOf(b.q, b.r)).filter(function (h) {
          var k = cellKey(h.q, h.r);
          if (seen[k] || !cellFree(h.q, h.r)) return false;
          seen[k] = 1;
          return true;
        });
      }
      if (!pool.length) return null;
      return pool[Math.floor(Math.random() * pool.length)];
    }

    // Records that this pairing produced this color, so the Crossing Notes
    // screen can show what you have actually seen rather than the whole
    // table. Called from waterPlant() at the actual reveal moment (stage
    // reaching 2 on a mystery seedling), not from doBreed() when the cross
    // is started - recording it that early would let this screen spoil a
    // still-mystery seedling before its own reveal ever happens.
    function recordCross(ca, cb, result) {
      var k = crossKey(ca, cb);
      if (!state.crosses[k]) state.crosses[k] = {};
      state.crosses[k][result] = (state.crosses[k][result] || 0) + 1;
    }

    function doBreed(keyA, keyB) {
      var a = state.plants[keyA], b = state.plants[keyB];
      if (!a || !b) { closePlantPanel(); return; }
      if (!breedReady(a) || !breedReady(b)) { toast('Those two are not both ready.'); return; }
      if (a.species !== b.species) { toast('Only the same kind of flower can cross.'); return; }
      if (state.fertilizer <= 0) {
        toast('You are out of fertilizer - buy a bag in the Shop \u{1F338}');
        return;
      }
      var spot = breedSpotFor(a, b);
      if (!spot) { toast('No free ground next to them for a seedling.'); return; }

      state.fertilizer--;
      var now = Date.now();
      a.breedReadyAt = now + BREED_COOLDOWN_MS;
      b.breedReadyAt = now + BREED_COOLDOWN_MS;

      var ca = colorOfPlant(a), cb = colorOfPlant(b);
      // Parents are always the same species now (breedPartnersFor only offers
      // same-species neighbours, and the guard above rejects anything else),
      // so the seedling's shape is simply theirs - no coin flip needed.
      var color = crossColor(ca, cb, a.species);
      var species = a.species;
      // A signature color has exactly one shape it can wear regardless of
      // what the parents were - enforced here rather than trusted to every
      // table entry. There is no such thing as an Ember Daisy.
      var lock = exclusiveSpeciesOf(color);
      if (lock) species = lock;
      // NOT recordCross(ca, cb, color) here - the Crossing Notes screen
      // reads state.crosses directly, so recording the result the instant
      // the cross is started would spoil a still-mystery seedling before
      // its own reveal ever happens. parentColors carries what's needed to
      // record it at the actual reveal moment instead (see waterPlant).

      var c = cellCenter(spot.q, spot.r);
      var key = cellKey(spot.q, spot.r);
      state.plants[key] = {
        q: spot.q, r: spot.r, lat: c.lat, lng: c.lng, species: species, color: color,
        plantedAt: now, lastWateredAt: now, stage: 0, readyAt: now + stageReadyMs(),
        reachedBloom: false, reachedFlourish: false, grownCredited: false,
        // The color is decided now but stays hidden until it blooms. Seed and
        // sprout artwork is colorless anyway, so nothing leaks, and the
        // reveal is the payoff the whole feature is built around.
        mystery: true, parentColors: [ca, cb]
      };
      state.stats.planted++;
      state.stats.bred++;
      // Same reasoning as plantSeedAt's own hook - a seedling planted
      // straight onto a currently-active ring's empty center breaks it, and
      // (unlike plantSeedAt) that's the only way this new tile can matter to
      // a ring, since it starts at stage 0 either way.
      refreshRainRingCandidates(candidateRingCentersAround(spot.q, spot.r));

      saveState();
      renderPlants();
      updateHUD();
      syncFertTool(); // fertilizer just dropped by one - the toolbox petal may need to disappear
      closePlantPanel();
      toast('\u{1F331} A seedling came up between them! Water it to see what it is.');
      vibrate(30);
    }

    // Confirms the cross, and always names the fertilizer cost and the
    // cooldown before it is spent - a timed cost the player only discovers
    // afterwards is exactly the kind of surprise this game avoids.
    function openBreedConfirm(keyA, keyB) {
      var a = state.plants[keyA], b = state.plants[keyB];
      if (!a || !b) return;
      var ca = colorOfPlant(a), cb = colorOfPlant(b);
      var vkA = variantKey(a.species, ca), vkB = variantKey(b.species, cb);

      resetModalChrome();
      document.getElementById('modal-title').textContent = 'Cross these two?';

      var html = '<div class="breed-pair">' +
        '<div class="breed-parent">' + variantChip(vkA, 34) + '<span>' + variantName(vkA) + '</span></div>' +
        '<div class="breed-plus">+</div>' +
        '<div class="breed-parent">' + variantChip(vkB, 34) + '<span>' + variantName(vkB) + '</span></div>' +
        '</div>';

      // Show what this pairing has produced before, if anything - the notes
      // you have earned, never the underlying table.
      var known = state.crosses[crossKey(ca, cb)];
      if (known) {
        var seen = Object.keys(known).sort(function (x, y) { return known[y] - known[x]; });
        html += '<p>You have crossed these before and got ' +
          seen.map(function (id) {
            return '<b>' + colorFor(id).name + '</b>' +
              (known[id] > 1 ? ' (x' + known[id] + ')' : '');
          }).join(', ') + '.</p>';
      } else {
        html += '<p>You have not tried this pairing before.</p>';
      }

      html += '<p style="color:var(--text-dim)">Costs <b>1 bag of fertilizer</b> (you have ' +
        state.fertilizer + '). A seedling comes up on free ground next to them, and its color ' +
        'stays a mystery until it blooms. Both parents then need <b>' +
        formatDuration(BREED_COOLDOWN_MS) + '</b> before they can be crossed again.</p>';

      document.getElementById('modal-body').innerHTML = html;
      var ok = document.getElementById('modal-ok-btn');
      ok.textContent = 'Cross them \u{1F331}';
      ok.onclick = function () { closeModal(); doBreed(keyA, keyB); };
      document.getElementById('modal-overlay').classList.add('open');
    }

    // Which neighbour a cross lands on is never a choice, from the panel any
    // more than from the fertilizer tool's press-and-hold (see
    // applyToolAction) - both draw a uniform random partner from the same
    // breedPartnersFor() list. That randomness is deliberate: it is what
    // makes WHERE you plant relative to your other flourishing flowers
    // matter, rather than planting anywhere and cherry-picking the pairing
    // afterwards. Used to open a "Cross with which one?" picker when there
    // were several candidates; that picker is gone along with the choice it
    // offered.
    function openBreedPicker(key) {
      var partners = breedPartnersFor(key);
      if (!partners.length) return;
      var partnerKey = partners[Math.floor(Math.random() * partners.length)];
      openBreedConfirm(key, partnerKey);
    }

    // ---------------------------------------------------------------------
    //  HUD / MENU / MODAL / TOAST
    // ---------------------------------------------------------------------
    function updateHUD() {
      // The seed packet's own badge (and the equipped icon's, if any) needs
      // to stay current after every state change, not just while its fan is
      // open - updateHUD is already the one function called after every
      // action that could touch state.seeds, so it's the natural hook
      // rather than chasing every buySeed/harvestPlant/plantSeedAt call site.
      renderSeedToggle();
      renderSprinklerToggle(); // same reasoning - its badge needs to track state.sprinklerInventory
      syncPlantCycleArrows(); // same reasoning again - the panel's arrows track state.plants too
      // A tool in hand takes over the status line entirely: while you're in a
      // mode, what that mode does is the only thing worth saying.
      if (activeTool) {
        document.getElementById('hud-status-line').innerHTML = TOOL_HUD[activeTool];
        return;
      }
      if (equippedSeed) {
        document.getElementById('hud-status-line').innerHTML =
          'Tap empty ground in range to plant a ' + variantName(equippedSeed) + ' \u{1F331}';
        return;
      }
      if (equippedSprinkler) {
        document.getElementById('hud-status-line').innerHTML =
          'Tap empty ground in range to place the sprinkler \u{1F4A6}';
        return;
      }
      var keys = Object.keys(state.plants);
      var total = keys.length;
      var wilted = keys.filter(function (k) {
        var d = state.plants[k]._d;
        return d && d.wilted;
      }).length;
      // state.stats.bloomed is a lifetime "ever reached bloom" counter (it
      // never decrements, even after that plant is harvested) - that's right
      // for the How to Play footer, but wrong here: "N in bloom" needs to
      // count what's actually blooming right now, so a harvested flower
      // stops being counted immediately instead of lingering forever.
      var blooming = keys.filter(function (k) {
        var d = state.plants[k]._d;
        return d && d.stage >= 2;
      }).length;

      // Ready-to-grow outranks merely wilted: it is the one line that sends
      // the player out the door, and it is the only status that a watering
      // visit converts into actual progress.
      var ready = keys.filter(function (k) {
        var d = state.plants[k]._d;
        return d && d.ready;
      }).length;

      // Wild flowers are a standing "there's something out there to find", so
      // they get a tail on every line rather than competing for the whole one.
      var wildCount = Object.keys(state.wild).length;
      var wildTail = wildCount > 0
        ? ' &bull; \u{1F33C} ' + wildCount + ' wild to find'
        : '';

      var line;
      if (total === 0) {
        line = 'Tap the map near you to plant your first seed \u{1F331}' + wildTail;
        document.getElementById('hud-status-line').innerHTML = line;
        return;
      }
      if (ready > 0) {
        line = '\u{1F4A7} ' + ready + (ready === 1 ? ' flower is' : ' flowers are') +
          ' ready to grow &bull; go water ' + (ready === 1 ? 'it' : 'them') + '!';
      } else if (wilted > 0) {
        line = wilted + (wilted === 1 ? ' flower is' : ' flowers are') + ' looking wilted \u{1F4A7} &bull; ' +
          blooming + ' in bloom';
      } else {
        // No "all watered" tail here any more - watering stopped being upkeep
        // when it became the thing that grows a plant, so there is nothing to
        // reassure the player about, and the line needs room for wildTail.
        line = '\u{1F338} ' + total + ' growing &bull; ' + blooming + ' in bloom';
      }
      document.getElementById('hud-status-line').innerHTML = line + wildTail;
    }

    function toggleMenu() {
      document.getElementById('menu-dropdown').classList.toggle('open');
      syncSeedRail();
    }
    document.addEventListener('click', function (e) {
      var menu = document.getElementById('menu-dropdown'), btn = document.getElementById('top-menu-btn');
      if (menu.classList.contains('open') && !menu.contains(e.target) && e.target !== btn) {
        menu.classList.remove('open');
        syncSeedRail();
      }
      // Any tap outside the toolbox fan closes it without picking a tool -
      // the map's own click handler does the equivalent for taps on the map
      // itself (and stops them from also planting/opening a panel).
      var rail = document.getElementById('tool-rail');
      if (railOpen && !rail.contains(e.target)) setRailOpen(false);
      // composedPath(), not contains(e.target): tapping a species petal
      // rebuilds #seed-petals' innerHTML (to redraw its selected highlight)
      // from inside that same click's own bubble phase, which detaches the
      // clicked node before this listener runs - contains() would then see
      // a node that is no longer anywhere in the document and wrongly close
      // the column it just opened a color flyout on. composedPath() is
      // captured at dispatch time, before any handler had a chance to
      // mutate the DOM.
      var srail = document.getElementById('seed-rail');
      var path = e.composedPath ? e.composedPath() : [e.target];
      if (seedRailOpen && path.indexOf(srail) === -1) closeSeedRail();
    });

    function onRecenter() {
      state.following = true;
      saveState();
      // Pan to the snapped tile center (where the range circle actually is),
      // not raw GPS - otherwise recenter can land slightly off from the
      // visible circle.
      if (userCellQ !== null) {
        var c = cellCenter(userCellQ, userCellR);
        map.panTo([c.lat, c.lng], { animate: true });
      }
    }

    // ---------------------------------------------------------------------
    //  FLOWER PANEL CYCLING  (issue #15)
    //  Originally a standalone map button that jumped the camera to each
    //  planted flower in turn (see the v2.18.0 CHANGELOG entry above) - that
    //  worked the camera but never opened anything, so you still couldn't
    //  see the flower's own details without a second tap. Folded into the
    //  plant panel itself instead: the panel already shows one flower's
    //  details, so left/right arrows on it step to the previous/next flower
    //  in place, updating both the panel content and the camera together.
    // ---------------------------------------------------------------------

    // Object.keys() order is an implementation detail that can shift as
    // entries are added and removed, so the cycle order is pinned
    // explicitly: oldest-planted first (falling back to the cell key
    // itself as a tiebreaker, which also covers it for any legacy save
    // whose plants predate plantedAt). That gives "the order you planted
    // them in" as the cycle order, which is at least an order the player
    // can predict, rather than an arbitrary shuffle of "q,r" strings.
    function sortedPlantKeys() {
      return Object.keys(state.plants).sort(function (a, b) {
        var pa = state.plants[a], pb = state.plants[b];
        return (pa.plantedAt || 0) - (pb.plantedAt || 0) || (a < b ? -1 : a > b ? 1 : 0);
      });
    }

    // Shown only while the panel is open on an owned flower (never a wild
    // pickup - see openPlantPanel) and only when there is actually more
    // than one to step between. Called from renderPlantPanel every time the
    // panel's content changes and from updateHUD (alongside
    // renderSprinklerToggle) so a flower harvested elsewhere while the
    // panel happens to be open still hides the arrows correctly.
    function syncPlantCycleArrows() {
