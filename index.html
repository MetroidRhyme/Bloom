      var show = viewingKey !== null && !viewingWild && sortedPlantKeys().length > 1;
      document.getElementById('plant-cycle-prev').classList.toggle('show', show);
      document.getElementById('plant-cycle-next').classList.toggle('show', show);
    }

    // Offsets the pan target upward by half the sheet's own height before
    // panning, rather than centering the flower on its raw lat/lng - dead
    // center would land it right behind the bottom sheet that's showing its
    // details, defeating the point of moving cycling into the panel in the
    // first place (issue #15: "I should be able to see the flower on the
    // main map that I'm looking at in the details page"). Container-point
    // math rather than map.project/unproject, since it needs to stay
    // correct relative to the *current* view regardless of zoom.
    function panMapToPlant(p) {
      // Adding (not subtracting) half the sheet's height here is the part
      // worth double-checking if this ever needs touching again: the point
      // fed to panTo becomes the new viewport *center*, so to land the
      // flower above that center once the sheet covers the bottom, the
      // pre-pan target has to sit *below* the flower on screen right now -
      // add pushes it there. Centers the flower in whatever vertical strip
      // is left uncovered above the sheet, regardless of viewport height.
      var sheetPx = document.getElementById('plant-panel').offsetHeight || 0;
      var target = map.containerPointToLatLng(
        map.latLngToContainerPoint([p.lat, p.lng]).add([0, sheetPx / 2]));
      // Same reasoning as map.on('dragstart') above: this is the player
      // reaching for the camera themselves, so stop auto-following their
      // GPS fix - otherwise the very next location update would yank the
      // view right back to the player, undoing the jump before they even
      // get a look at the flower. Left following-false is also what keeps
      // the map sitting on the last flower viewed once the panel closes,
      // rather than snapping back to the player.
      state.following = false;
      saveState();
      map.panTo(target, { animate: true });
    }

    // One arrow tap = advance to the previous/next owned flower, wrapping
    // around both ends, updating the panel in place and panning the camera
    // there - see panMapToPlant above for why "there" isn't the flower's
    // raw coordinates. If the flower being viewed was harvested by some
    // other means while its panel was open (indexOf returns -1 below),
    // resume from the start of the list rather than erroring.
    function cyclePlantPanel(dir) {
      var keys = sortedPlantKeys();
      if (!keys.length) return;
      var idx = keys.indexOf(viewingKey);
      idx = idx === -1 ? 0 : (idx + dir + keys.length) % keys.length;
      viewingKey = keys[idx];
      panMapToPlant(state.plants[viewingKey]);
      renderPlantPanel(viewingKey);
      vibrate(10);
    }

    // Wipes the whole save (garden, seeds, Petals, stats, and the welcome/
    // tutorial flags) and reloads, rather than resetting each state field by
    // hand - that way a full reset can never drift out of sync as new state
    // fields get added later (it always matches whatever loadState()'s
    // defaults are, since a reload with no saved key runs the exact same
    // brand-new-player path, tutorial included).
    function onResetSave() {
      toggleMenu();
      if (!confirm('Erase your save completely - garden, seeds, Petals, and all progress? This cannot be undone.')) return;
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    }

    // Shown once, before requestLocation() ever runs on a brand-new device -
    // see the gpsPrimerSeen gate above. Its only job is to give the native
    // permission dialog some context before it appears, since a bare OS
    // prompt with zero explanation is exactly the kind of thing a stranger
    // reflexively taps "Don't Allow" on.
    function openGpsPrimer() {
      resetModalChrome();
      document.getElementById('modal-title').textContent = 'Before we start';
      document.getElementById('modal-body').innerHTML =
        '<p>Bloom grows flowers where you actually walk, so it needs to know which tile you\'re ' +
        'standing on. That\'s the only thing your location is used for - it stays on this device and ' +
        'is never sent anywhere.</p>' +
        '<p>Your browser is about to ask permission. Allow it to start planting.</p>';
      document.getElementById('modal-ok-btn').textContent = 'Allow Location';
      document.getElementById('modal-ok-btn').onclick = function () {
        state.gpsPrimerSeen = true; saveState();
        requestLocation();
        // Welcome doesn't need a GPS fix to read, and a fix can take a few
        // seconds - show it right away rather than leaving a brand-new
        // player staring at a blank map while it resolves. openWelcome()
        // reuses this same overlay (resetModalChrome + swap content), so
        // this never actually closes and reopens - no flicker. If somehow
        // seenWelcome is already true here (shouldn't happen for a save
        // that still needed the primer), just drop back to the map.
        if (!state.seenWelcome) openWelcome(); else closeModal();
      };
      document.getElementById('modal-overlay').classList.add('open');
    }

    function openWelcome() {
      resetModalChrome();
      document.getElementById('modal-title').textContent = 'Welcome to Bloom';
      document.getElementById('modal-body').innerHTML =
        '<p>Bloom gives you a gentle reason to get out and walk. Plant one of your starter seeds in the ' +
        'ground near you, then swing back by to water it.</p>' +
        '<p>Watering is what makes it grow. About every 90 minutes a plant is ready for a drink, and each ' +
        'visit moves it up a stage - seed to sprout to bloom to a full flourishing cluster. Three walks ' +
        'back, three stages.</p>' +
        '<p>Your tools live in the toolbox, top left: the watering can, the shears for extracting seeds, ' +
        'and $ for selling. Tap it and the three drop down the left edge - tap the one you want, or hold ' +
        'the toolbox down and drag straight to it. Use it on as many flowers as you like, then tap it ' +
        'again to put it away.</p>' +
        '<p>Once it\'s fully grown, shear it for free seeds of that exact flower, or sell it to the shop ' +
        'for Petals \u{1F338} to spend on new ones. Every flower costs and sells for the same, so plant ' +
        'whichever ones you like the look of.</p>' +
        '<p>Nothing here can be lost. Go a couple of days without watering and a flower just looks a bit ' +
        'wilted until your next visit - it never dies, and it never stops being ready to grow. No score, ' +
        'no clock, no rush.</p>';
      document.getElementById('modal-ok-btn').textContent = "Let's grow! \u{1F331}";
      document.getElementById('modal-ok-btn').onclick = function () {
        state.seenWelcome = true; saveState(); closeModal();
        if (!state.tutorialDone) startTutorial();
      };
      document.getElementById('modal-overlay').classList.add('open');
    }

    // Full-screen and scrollable like the journal/notes panels (see the HOW
    // TO PLAY PANEL CSS above) rather than the small centered modal this
    // used to be - eleven paragraphs plus the stats line ran well past a
    // phone's viewport in the old modal, which had no scroll of its own.
    function openHowToPlay() {
      toggleMenu();
      closeShop(); closePlantPanel(); closeCrossNotes(); closeJournal(); closeGreenhouse(); // only one full-screen panel at a time
      var s = state.stats;
      document.getElementById('howto-body').innerHTML =
        '<p><b>Plant</b> - tap the seed pouch (top right) and every species you hold seeds of drops down ' +

        '<p><b>Your tools</b> - tap the toolbox (top left) and the watering can, shears (extract seeds) ' +

        '<p><b>Water</b> - pick up the watering can and tap each flower you want watered. You have to be ' +

        '<p><b>Grow</b> - watering is what grows a plant, not just time. Every 90 minutes or so it becomes ' +

        'only ones the shop sells or wild flowers grow in. The rest have to be bred.</p>' +
        '<p><b>Signature colors</b> - past all of those, each species has <b>two colors of its own</b> ' +
        'that no other flower can wear. They shimmer and glow, and the only way to reach one is to ' +
        'cross two flowers <b>of the same species</b> deep in the Gold line.</p>' +
        '<p><b>Crossing</b> \u{1F331} - grow two flowers of the <b>same species</b> to flourishing on tiles ' +
        'next to each other and buy a bag of fertilizer. Press and hold either one with the fertilizer ' +
        'tool, or open its details and tap <b>Cross with a neighbour</b> - either way crosses it with a ' +
        '<b>random</b> flourishing neighbour of the same species, never one you pick. A flower with two or ' +
        'three same-species flourishing neighbours could cross with any of them, so where you plant ' +
        'relative to your other flowers is worth thinking about. A seedling comes up in the gap between ' +
        'them, in that same species, and its color stays a mystery until you water it into bloom. ' +
        'Crossing two of the four standards always gives the same result - six pairs, six new ' +
        'colors - and those in turn cross into the rarer ones. Both parents rest for ' +
        formatDuration(BREED_COOLDOWN_MS) + ' afterwards, and they stay right where they are. Your ' +
        'Crossing Notes in the menu remember every pairing you\'ve tried.</p>' +
        '<p><b>Shop</b> - tap your Petals total (top right) to buy seeds, one swatch per standard color, ' +
        'and fertilizer. Every seed costs the same and every flower sells for the same, so pick by looks, ' +
        'not by value.</p>' +
        '<p><b>Sprinkler</b> \u{1F4A6} - grow and harvest ' + SPRINKLER_UNLOCK_FLOWERS + ' flowers and it ' +
        'unlocks in the Shop, starting at ' + SPRINKLER_COST + ' Petals - each one you buy costs ' +
        SPRINKLER_COST_STEP + ' more than the last. Once bought, tap the sprinkler button (bottom left) ' +
        'and tap empty ground to place it - it waters every flower on the eight tiles around it ' +
        'automatically from then on, no walk-up visit needed. Tap a placed one any time to pick it back ' +
        'up and move it.</p>' +
        '<p><b>Greenhouse</b> \u{1F3E1} - grow and harvest ' + GREENHOUSE_UNLOCK_FLOWERS + ' flowers and it ' +
        'unlocks in the Shop for ' + GREENHOUSE_COST + ' Petals, once. Twelve pots under glass - three ready ' +
        'to plant right away, the other nine broken and fixed one at a time, each its own price. Tap a pot ' +
        'to plant, water, extract seeds from, or sell whatever\'s growing in it - the same loop as the map, ' +
        'just no walking required. The one thing a pot can\'t do is cross: there\'s no neighbour to cross ' +
        'with in a pot of its own.</p>' +
        '<p><b>Wild flowers</b> \u{1F33C} - each day you open Bloom, up to ten wild blooms are scattered ' +
        'around you, marked with a soft glow. They cost nothing - just walk over and pick one. Unlike your ' +
        'own flowers they don\'t last: a wild bloom wilts after 12 hours and is gone 6 hours later, so ' +
        'they\'re worth going out for today. Once in a while one turns up in a rare color you\'d ' +
        'otherwise have to breed - a bonus, not a shortcut around breeding, since which color and which ' +
        'flower is entirely down to chance.</p>' +
        '<p><b>Weeds</b> \u{1F33F} - plenty turn up around you too, topping back up every couple hours. ' +
        'Tap one while you\'re close enough and it\'s plucked on the spot for 1 Petal - no walk required ' +
        'to notice them, just something to clear as you pass.</p>' +
        '<p><b>No pressure</b> - after a couple of days without water a flower starts to look wilted, and ' +
        'that\'s all it is: a look. Flowers never die, never get removed, and keep becoming ready to grow ' +
        'no matter how long you\'ve been away. One drink perks a wilted one right back up.</p>' +
        '<p style="color:var(--text-dim)">So far: ' + s.planted + ' planted &bull; ' +
        s.bloomed + ' bloomed &bull; ' + s.flourished + ' flourished &bull; ' + s.sold + ' sold for ' +
        s.earned + ' Petals &bull; ' + s.extractedFlowers + ' extracted for seeds</p>';
      document.getElementById('howto-panel').classList.add('open');
      syncToolRail();
    }
    function closeHowToPlay() {
      document.getElementById('howto-panel').classList.remove('open');
      syncToolRail();
    }

    // How many times this exact variant has ever been grown - extracted or
    // sold, owned plant or wild pick (see recordGrown). 0 for a variant
    // that's only ever been seen blooming, never actually harvested.
    function grownCountOf(vk) {
      var e = state.inventory[vk];
      return (e && e.count) || 0;
    }
    // Every variant of one species that has ever been discovered, rarest last.
    function discoveredColorsOf(speciesKey) {
      return sortVariants(Object.keys(state.inventory).filter(function (vk) {
        return parseVariant(vk).species === speciesKey;
      }));
    }
    // Total times any color of this species has been grown, summed across
    // every discovered variant - what the bookmark badge shows.
    function grownCountOfSpecies(speciesKey) {
      return discoveredColorsOf(speciesKey).reduce(function (n, vk) {
        return n + grownCountOf(vk);
      }, 0);
    }
    // Not SPECIES * COLORS any more: a signature color counts once, on the one
    // species that can wear it.
    var TOTAL_VARIANTS = SPECIES.reduce(function (n, s) {
      return n + colorsForSpecies(s.key).length;
    }, 0);

    // A tally of every flower you've ever grown, kept as a journal: one page
    // per species, with a spot for each of the fourteen colors and a row of
    // bookmarks along the top to switch between them. All seven bookmarks and
    // all fourteen spots are always drawn, so a gap reads as "still to breed"
    // rather than as a list that happens to be short.
    //
    // There was a contents page in front of this. It was removed because it
    // had one job - pick a species - and the bookmarks do that from anywhere,
    // so it had become a screen you tapped through on the way to the journal.
    var journalSpecies = null;  // which page is open
    var journalPick = null;     // which spot on it is selected, if any

    // Opening the journal cold lands on a page with something on it rather
    // than always on Sunflower, which may well be blank.
    function defaultJournalSpecies() {
      for (var i = 0; i < SPECIES.length; i++) {
        if (grownCountOfSpecies(SPECIES[i].key) > 0) return SPECIES[i].key;
      }
      for (var j = 0; j < SPECIES.length; j++) {
        if (discoveredColorsOf(SPECIES[j].key).length) return SPECIES[j].key;
      }
      return SPECIES[0].key;
    }

    function openInventory() {
      toggleMenu();
      closeShop(); closePlantPanel(); closeCrossNotes(); closeGreenhouse(); // only one full-screen/bottom-sheet panel open at a time
      // journalSpecies persists for the session, so re-opening the journal
      // returns to the page you were last reading.
      openJournalPage(journalSpecies || defaultJournalSpecies());
      document.getElementById('journal-panel').classList.add('open');
      syncToolRail();
    }
    function closeJournal() {
      document.getElementById('journal-panel').classList.remove('open');
      syncToolRail();
    }

    // The bookmark strip: the species' flower, in the rarest color of it you
    // own, with a superscript count of how many you've grown across every
    // color of it.
    function journalTabsHtml(activeKey) {
      return '<div class="journal-tabs">' + SPECIES.map(function (s) {
        var found = discoveredColorsOf(s.key);
        var grown = grownCountOfSpecies(s.key);
        var color = found.length ? parseVariant(found[found.length - 1]).color : s.base;
        return '<button class="journal-tab' + (s.key === activeKey ? ' active' : '') +
          (found.length ? '' : ' blank') + '" title="' + s.name +
          '" onclick="openJournalPage(\'' + s.key + '\')">' +
          (grown > 0 ? '<span class="journal-tab-count">' + grown + '</span>' : '') +
          speciesChip(s, color, 26) + '</button>';
      }).join('') + '</div>';
    }

    // Opening a page picks the spot for you when there is only one thing on
    // it to show - with a single color discovered, making you tap it first
    // would be a step with no decision in it.
    function openJournalPage(speciesKey) {
      var found = discoveredColorsOf(speciesKey);
      journalPick = found.length === 1 ? found[0] : null;
      renderJournalPage(speciesKey);
    }
    function pickJournalSpot(vk) {
      // Tapping the open spot again closes it, so the page can go back to
      // being just the album.
      journalPick = (journalPick === vk) ? null : vk;
      renderJournalPage(parseVariant(vk).species);
    }

    function renderJournalPage(speciesKey) {
      var s = speciesFor(speciesKey);
      journalSpecies = speciesKey;

      var found = discoveredColorsOf(speciesKey);
      // Title and bookmark show the same flower in the same color - the
      // rarest of this species you own - so they don't read as two things.
      var headColor = found.length ? parseVariant(found[found.length - 1]).color : s.base;
      // innerHTML, not textContent - the chip is inline SVG markup.
      document.getElementById('journal-heading').innerHTML =
        speciesChip(s, headColor, 22) + ' ' + s.name;

      // Resolved before the grid is drawn: a spot with nothing behind it any
      // more (should the species change under it) can't stay highlighted
      // with no detail left to show.
      if (journalPick && parseVariant(journalPick).species !== speciesKey) {
        journalPick = null;
      }

      // The shared palette plus this species' two signatures - a page never
      // shows a spot that species could not possibly fill.
      var palette = colorsForSpecies(speciesKey);
      var html = journalTabsHtml(speciesKey) +
        '<p class="journal-caption"><b>' + found.length + ' of ' + palette.length + '</b> ' +
        s.name + ' colors &bull; <b>' + Object.keys(state.inventory).length + ' of ' +
        TOTAL_VARIANTS + '</b> flowers found</p>';

      // A spot for every color, always. An empty spot is the point of the
      // page: it is what you have left to breed. The badge is how many
      // you've grown, which is a different thing from having found it - a
      // color you found while it was blooming but never harvested still
      // keeps its spot filled in, just with a badge of 0.
      html += '<div class="color-grid scrapbook-grid">' + palette.map(function (c) {
        var vk = variantKey(speciesKey, c.id);
        var discovered = !!state.inventory[vk];
        var n = grownCountOf(vk);
        // The four standards are unlocked on every page by default,
        // discovered or not - they're sold in the Shop for any species
        // already, so there was never really a mystery to preserve there.
        // Everything past a standard still has to be bred and grown to
        // reveal its name, tracked per species (not globally - finding
        // White on a Sunflower used to reveal the name "White" on every
        // other species' still-empty spot too).
        var isStandard = STANDARD_COLORS.indexOf(c.id) >= 0;
        var unlocked = discovered || isStandard;
        var label = unlocked ? c.name : '?';
        // A starter color's card is never a mystery pocket - it's sold in
        // the Shop already, so there's nothing to reveal by growing one -
        // but showing it in full color before the player ever actually has
        // grown one overstates progress that hasn't happened yet. Dimmed
        // instead of blanked, same idea as .color-cell.missing elsewhere,
        // until n (grown count) is above 0.
        var cls = 'color-cell slot' + (unlocked ? '' : ' blank') + (n > 0 ? ' held' : '') +
          (isStandard && n === 0 ? ' notgrown' : '') +
          (vk === journalPick ? ' picked' : '');
        return '<div class="' + cls + '" title="' + (unlocked ? label : 'Not found yet') + '"' +
          (discovered ? ' onclick="pickJournalSpot(\'' + vk + '\')"' : '') + '>' +
          (unlocked ? speciesChip(s, c.id, 30) : '<span class="slot-unknown">?</span>') +
          '<span class="slot-line"><span class="slot-label">' + label + '</span>' +
          (unlocked ? '<span class="slot-note' + (n > 0 ? ' some' : '') + '">' + n + '</span>' : '') +
          '</span></div>';
      }).join('') + '</div>';

      // The picked spot's detail, in one block under the album rather than a
      // stack of every color at once - a full page of found colors used to
      // run well past the bottom of a phone.
      if (journalPick) {
        var c = colorFor(parseVariant(journalPick).color);
        var entry = state.inventory[journalPick];
        var count = entry.count || 0;
        var seeds = state.seeds[journalPick] || 0;
        html += '<div class="inv-variant" style="border-color:' + c.line + '">' +
          '<div class="inv-variant-name" style="color:' + c.ink + '">' + variantChip(journalPick, 20) +
          ' ' + variantName(journalPick) + '</div>' +
          '<div class="inv-grown-count">Grown <b>' + count + '</b> time' + (count === 1 ? '' : 's') +
          '</div>' +
          '<div class="inv-meta">' +
          (count > 0 ? 'First grown ' + formatAgo(entry.firstAt) : 'Seen blooming, not harvested yet') +
          (seeds > 0 ? ' &bull; ' + seeds + ' seed' + (seeds === 1 ? '' : 's') + ' in your pouch' : '') +
          '</div></div>';
      } else if (found.length > 0) {
        html += '<p class="journal-hint">Tap a flower you\'ve grown to see the count.</p>';
      }

      // The lifetime tally (issue #11) used to sit here as its own block -
      // removed per the issue; each species page's own "found N of M
      // colors" caption up top is the count that actually matters while
      // you're looking at one species.
      document.getElementById('journal-body').innerHTML = html;
    }

    // ---------------------------------------------------------------------
    //  MILESTONES (STICKER BOOK)
    //  A second, permanent collection screen next to the Flower Journal -
    //  every sticker is read straight off state.stats (already tracked for
    //  the Journal's own lifetime tally) plus state.inventory for the two
    //  collection-themed tracks. Nothing new is written to state anywhere
    //  in this section - it is a pure render over data that already
    //  exists, so there is no save-format migration and nothing here can
    //  ever regress: once a tier's threshold is met the sticker renders as
    //  earned on every future render, forever, the same "nothing here can
    //  be lost" guarantee as the rest of the game. Deliberately no economy
    //  hook of any kind - a sticker never grants Petals, seeds, or
    //  anything spendable, so this can't turn into a second progression
    //  currency and can't recreate the old seed-tier problem (see SEED_COST
    //  section) where one axis quietly outclasses another.
    // ---------------------------------------------------------------------

    // Reuses the plant-stage vocabulary (seed -> sprout -> bloom -> cluster)
    // as the four tier names rather than inventing a bronze/silver/gold
    // ladder - every player already knows this progression from growing a
    // single flower, so it needs no separate explanation here.
    var TIER_NAMES = ['Seed', 'Sprout', 'Bloom', 'Cluster'];
    var TIER_COLOR_VARS = ['var(--green)', 'var(--blue)', 'var(--amber)', 'var(--pink)'];

    function speciesDiscoveredCount() {
      var seen = {};
      Object.keys(state.inventory).forEach(function (vk) { seen[parseVariant(vk).species] = true; });
      return Object.keys(seen).length;
    }
    // exclusiveSpeciesOf(colorId) is truthy only for the 14 signature
    // colors (2 per species) - see the COLORS section. Counts distinct
    // signature colors found, not how many species they span.
    function signatureColorsDiscoveredCount() {
      var seen = {};
      Object.keys(state.inventory).forEach(function (vk) {
        var color = parseVariant(vk).color;
        if (exclusiveSpeciesOf(color)) seen[color] = true;
      });
      return Object.keys(seen).length;
    }

    // Each track's top tier is deliberately sized to its own natural
    // ceiling where one exists (7 species, TOTAL_VARIANTS flowers, all 14
    // signatures) so completing that track IS full completion of that part
    // of the Journal - the last sticker doubles as proof, not a separate
    // number to eyeball against it.
    var MILESTONE_TRACKS = [
      { key: 'planted', icon: '\u{1F331}', label: 'Planter', blurb: 'Seeds planted',
        tiers: [1, 10, 30, 75], valueFn: function (st) { return st.planted; } },
      { key: 'bloomed', icon: '\u{1F4A7}', label: 'Grower', blurb: 'Plants brought into bloom',
        tiers: [1, 10, 30, 75], valueFn: function (st) { return st.bloomed; } },
      { key: 'flourished', icon: '\u{2728}', label: 'Flourisher', blurb: 'Plants grown to a full cluster',
        tiers: [1, 10, 30, 75], valueFn: function (st) { return st.flourished; } },
      { key: 'harvested', icon: '\u{1F9FA}', label: 'Harvester', blurb: 'Flowers extracted or sold',
        tiers: [1, 15, 50, 100], valueFn: function (st) { return st.grown; } },
      { key: 'earned', icon: '\u{1F338}', label: 'Trader', blurb: 'Lifetime Petals earned',
        tiers: [50, 250, 1000, 3000], valueFn: function (st) { return st.earned; } },
      { key: 'bred', icon: '\u{1F98B}', label: 'Breeder', blurb: 'Successful crossings',
        tiers: [1, 5, 15, 30], valueFn: function (st) { return st.bred; } },
      { key: 'species', icon: '\u{1F4D6}', label: 'Botanist', blurb: 'Species discovered',
        tiers: [1, 3, 5, SPECIES.length], valueFn: function () { return speciesDiscoveredCount(); } },
      { key: 'variants', icon: '\u{1F3A8}', label: 'Colorist', blurb: 'Flowers found in the Journal',
        tiers: [10, 30, 60, TOTAL_VARIANTS],
        valueFn: function () { return Object.keys(state.inventory).length; } },
      { key: 'signatures', icon: '\u{1F48E}', label: 'Alchemist', blurb: 'Signature colors found',
        tiers: [1, 4, 8, 14], valueFn: function () { return signatureColorsDiscoveredCount(); } },
      { key: 'extracted', icon: '\u{2697}', label: 'Extractor', blurb: 'Seeds pulled from extraction',
        tiers: [5, 25, 75, 150], valueFn: function (st) { return st.extracted; } }
    ];

    function totalStickersEarned() {
      var st = state.stats, n = 0;
      MILESTONE_TRACKS.forEach(function (t) {
        var v = t.valueFn(st);
        t.tiers.forEach(function (need) { if (v >= need) n++; });
      });
      return n;
    }
    function totalStickersPossible() { return MILESTONE_TRACKS.length * TIER_NAMES.length; }

    function openMilestones() {
      toggleMenu();
      // Closes every other full-screen panel, same as openHowToPlay() -
      // see that function's own comment for why this list (rather than the
      // shorter one on openInventory/openCrossNotes/openShop) is the
      // complete one to copy for a screen reachable from the same menu.
      closeShop(); closePlantPanel(); closeCrossNotes(); closeJournal(); closeHowToPlay(); closeGreenhouse();
      renderMilestonesPage();
      document.getElementById('milestones-panel').classList.add('open');
      syncToolRail();
    }
    function closeMilestones() {
      document.getElementById('milestones-panel').classList.remove('open');
      syncToolRail();
    }

    function renderMilestonesPage() {
      var st = state.stats;
      var html = '<p class="journal-caption"><b>' + totalStickersEarned() + ' of ' +
        totalStickersPossible() + '</b> stickers earned</p>';

      html += MILESTONE_TRACKS.map(function (t) {
        var v = t.valueFn(st);
        var cells = t.tiers.map(function (need, i) {
          var got = v >= need;
          return '<div class="sticker-cell' + (got ? '' : ' blank') + '" title="' +
            TIER_NAMES[i] + ' - ' + need + '">' +
            (got ? '<span class="sticker-icon" style="background:' + TIER_COLOR_VARS[i] + '">' +
              t.icon + '</span>' : '<span class="slot-unknown">?</span>') +
            '<span class="slot-line"><span class="slot-label">' + TIER_NAMES[i] + '</span>' +
            '<span class="slot-note' + (got ? ' some' : '') + '">' + need + '</span></span></div>';
        }).join('');
        return '<div class="sticker-track"><div class="sticker-track-head">' + t.icon + ' <b>' +
          t.label + '</b> <span class="text-dim">- ' + t.blurb + '</span></div>' +
          '<div class="sticker-grid">' + cells + '</div></div>';
      }).join('');

      document.getElementById('milestones-body').innerHTML = html;
    }

    // ---------------------------------------------------------------------
    //  CROSSING NOTES (BREEDING TREE)
    //  The player's own notebook of crossings, drawn as a family tree
    //  instead of a list. It deliberately shows only what has actually
    //  been seen, never BREED_TABLE/SIGNATURE_TABLE themselves - every
    //  node and every line comes from state.crosses (see
    //  crossResultDiscovered/computeCrossEdges below), so nothing here
    //  spoils a pairing the player hasn't actually tried.
    // ---------------------------------------------------------------------
    var notesSpecies = null; // which species tab is open, for the signature row

    // A color counts as "discovered" for the tree once it has actually come
    // out of a cross as something other than the pair fed in - the same
    // event the old list screen recorded, just read back out per-color
    // instead of per-pair. Standards are always discovered; nothing crosses
    // INTO them, they're just what you start with.
    function crossResultDiscovered(colorId) {
      return STANDARD_COLORS.indexOf(colorId) >= 0 || crossResultCount(colorId) > 0;
    }
    // Lifetime count of a color as a genuine cross result. Pairs that fall
    // back to one of their own parents (a tier-2+ attempt that "failed")
    // are excluded by the parts[0]/parts[1] check - that's not a discovery
    // of anything, so it shouldn't inflate the count or light up a node.
    function crossResultCount(colorId) {
      var total = 0;
      Object.keys(state.crosses).forEach(function (k) {
        var parts = k.split('+');
        if (parts[0] === colorId || parts[1] === colorId) return;
        total += state.crosses[k][colorId] || 0;
      });
      return total;
    }
    // Every recorded pairing that produced a genuinely new color, as
    // { a, b, child } triples - the tree's edges, one per discovery. Same
    // exclusion as crossResultCount, for the same reason.
    function computeCrossEdges() {
      var edges = [];
      Object.keys(state.crosses).forEach(function (k) {
        var parts = k.split('+'), got = state.crosses[k];
        Object.keys(got).forEach(function (id) {
          if (got[id] > 0 && id !== parts[0] && id !== parts[1]) {
            edges.push({ a: parts[0], b: parts[1], child: id });
          }
        });
      });
      return edges;
    }
    // The shared (non-species-locked) colors at one breeding tier, in a
    // fixed COLORS-array order - always all of them, discovered or not,
    // same "the gap is the point" logic as the journal's palette grid.
    function tierColors(tier) {
      return COLORS.filter(function (c) { return c.tier === tier && !c.species; });
    }

    // One card per tab, mirroring journalTabsHtml but pointed at the tree
    // instead of a journal page.
    function notesTabsHtml(activeKey) {
      return '<div class="journal-tabs">' + SPECIES.map(function (s) {
        var found = discoveredColorsOf(s.key);
        var color = found.length ? parseVariant(found[found.length - 1]).color : s.base;
        return '<button class="journal-tab' + (s.key === activeKey ? ' active' : '') +
          (found.length ? '' : ' blank') + '" title="' + s.name +
          '" onclick="openCrossPage(\'' + s.key + '\')">' + speciesChip(s, color, 26) + '</button>';
      }).join('') + '</div>';
    }

    // One tree node - the exact same taped-photo/dashed-pocket card the
    // journal uses (.color-cell.slot), so "the items with the lines between
    // them" read as the same object as everything else in the game.
    // showCount is off for the root row - nothing crosses into a standard,
    // so a count there would only ever read "0".
    // Picture only, to save space - no name or count underneath (compare
    // the journal's cards, which show both). The name and how many times
    // it's been bred move into the title tooltip instead of disappearing
    // outright, so a long-press/hover still gives the detail back.
    function crossNodeCard(colorId, speciesKey, showCount) {
      var c = colorFor(colorId);
      var discovered = crossResultDiscovered(colorId);
      // Drawn on a real flower rather than an abstract dot. A signature
      // color must use the one species that can wear it; a shared color
      // just borrows whichever species' page is open, so switching tabs
      // reflavors the whole tree instead of only its bottom row.
      var on = speciesFor(c.species || speciesKey);
      var n = showCount ? crossResultCount(colorId) : 0;
      var title = discovered ?
        (c.name + (showCount ? ' - crossed ' + n + ' time' + (n === 1 ? '' : 's') : '')) :
        'Not found yet';
      var cls = 'color-cell slot' + (discovered ? '' : ' blank');
      return '<div class="' + cls + '" data-color="' + colorId + '" title="' + title + '">' +
        (discovered ? speciesChip(on, colorId, 28) : '<span class="slot-unknown">?</span>') +
        '</div>';
    }

    function openCrossPage(speciesKey) { renderCrossTree(speciesKey); }

    function renderCrossTree(speciesKey) {
      notesSpecies = speciesKey;

      // Global, not per-species - the shared rows (standards through Gold)
      // are identical on every tab, so "how much of the whole tree have I
      // found" only makes sense counted once, not per page.
      var nFound = COLORS.filter(function (c) { return crossResultDiscovered(c.id); }).length;
      var html = notesTabsHtml(speciesKey) +
        '<p class="tree-caption"><b>' + nFound + ' of ' + COLORS.length + '</b> colors found &bull; <b>' +
        state.stats.bred + '</b> crossing' + (state.stats.bred === 1 ? '' : 's') + ' made</p>';

      if (!Object.keys(state.crosses).length) {
        html += '<p class="tree-hint">Grow two flowers to <b>flourishing</b> on neighbouring tiles and buy ' +
          'a bag of fertilizer in the Shop. Then equip the fertilizer tool from the toolbox and press and ' +
          'hold either one, or open its details and tap <b>Cross with a neighbour</b> - either way crosses ' +
          'it with a <b>random</b> flourishing neighbour, so which flowers you plant next to each other is ' +
          'part of the plan. That starts filling this in.</p>';
      }

      var rows = [
        { colors: tierColors(0), showCount: false },
        { colors: tierColors(1), showCount: true },
        { colors: tierColors(2), showCount: true },
        { colors: tierColors(3), showCount: true },
        { colors: signatureColorsOf(speciesKey), showCount: true }
      ];
      html += '<div id="tree-scroll"><div id="tree-wrap"><svg id="tree-svg" class="tree-svg"></svg>' +
        rows.map(function (row) {
          return '<div class="tree-row">' + row.colors.map(function (c) {
            return crossNodeCard(c.id, speciesKey, row.showCount);
          }).join('') + '</div>';
        }).join('') + '</div></div>';

      document.getElementById('notes-body').innerHTML = html;
      // Needs a layout pass before getBoundingClientRect is trustworthy -
      // one frame is enough, and drawTreeEdges no-ops harmlessly if the
      // panel has since closed before it fires.
      requestAnimationFrame(drawTreeEdges);
    }

    // A gentle S-curve rather than a straight line - two of these, mirrored,
    // converging on the same child is what actually reads as a family tree
    // branch rather than a wiring diagram.
    function treeEdgePath(p1, p2) {
      var midY = (p1.y + p2.y) / 2;
      return '<path class="tree-edge" d="M' + p1.x.toFixed(1) + ' ' + p1.y.toFixed(1) +
        ' C ' + p1.x.toFixed(1) + ' ' + midY.toFixed(1) + ', ' +
        p2.x.toFixed(1) + ' ' + midY.toFixed(1) + ', ' +
        p2.x.toFixed(1) + ' ' + p2.y.toFixed(1) + '"/>';
    }
    function treeNodeCenter(el, wrapRect) {
      var r = el.getBoundingClientRect();
      return { x: r.left + r.width / 2 - wrapRect.left, y: r.top + r.height / 2 - wrapRect.top };
    }
    // Measures the actually-rendered card positions and draws a line from
    // each parent to each discovered child - deliberately not a fixed
    // coordinate table, so the tree stays correct however a row happens to
    // wrap or space out on a given phone width.
    function drawTreeEdges() {
      var svg = document.getElementById('tree-svg');
      var wrap = document.getElementById('tree-wrap');
      if (!svg || !wrap) return;
      var wr = wrap.getBoundingClientRect();
      svg.setAttribute('width', wr.width);
      svg.setAttribute('height', wr.height);
      svg.innerHTML = computeCrossEdges().map(function (e) {
        var elA = wrap.querySelector('[data-color="' + e.a + '"]');
        var elB = wrap.querySelector('[data-color="' + e.b + '"]');
        var elC = wrap.querySelector('[data-color="' + e.child + '"]');
        // A signature edge for a species other than the open tab has no
        // matching child node this render - skip it rather than draw to
        // nothing.
        if (!elA || !elB || !elC) return '';
        var pc = treeNodeCenter(elC, wr);
        return treeEdgePath(treeNodeCenter(elA, wr), pc) + treeEdgePath(treeNodeCenter(elB, wr), pc);
      }).join('');
    }
    // Line positions are measured pixels, not something CSS keeps in sync
    // on its own - a width change (rotating the phone, a browser chrome
    // resize) needs a redraw, but only while the tree is actually on screen.
    window.addEventListener('resize', function () {
      var np = document.getElementById('notes-panel');
      if (np && np.classList.contains('open')) drawTreeEdges();
    });

    function openCrossNotes() {
      toggleMenu();
      closeShop(); closePlantPanel(); closeJournal(); closeGreenhouse(); // only one full-screen/bottom-sheet panel open at a time
      renderCrossTree(notesSpecies || defaultJournalSpecies());
      document.getElementById('notes-panel').classList.add('open');
      syncToolRail();
    }
    function closeCrossNotes() {
      document.getElementById('notes-panel').classList.remove('open');
      syncToolRail();
    }

    // Modals normally show one full-width OK button; the breed picker hides it
    // in favor of its own buttons. Called at the top of every other opener so
    // that state doesn't leak between modal uses.
    function resetModalChrome() { document.getElementById('modal-ok-btn').style.display = ''; }

    function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
    // Tapping the dimmed backdrop (not the card itself) closes whatever
    // modal is open - mainly so the breed picker has a way to back out
    // without crossing, since it hides the usual OK/close button.
    document.getElementById('modal-overlay').addEventListener('click', function (e) {
      if (e.target.id === 'modal-overlay') closeModal();
    });

    // ---------------------------------------------------------------------
    //  SHOP
    // ---------------------------------------------------------------------

    // Cheat Mode: a dev/testing shortcut, not a real game feature - unlimited
    // Petals and a 15s stage-readiness time instead of 1.5h. Currency isn't a
    // true sentinel "infinite" value, just topped up to CHEAT_CURRENCY (see
    // buySeed/buyFertilizer, which re-apply the top-up after every spend so
    // it never actually runs down). Turning it off doesn't claw anything
    // back - whatever Petals or grown plants you ended up with stay, only
    // future costs/timing go back to normal, same as any other toggle in
    // this game (nothing here is ever taken away from the player).
    function setCheatMode(on) {
      state.cheatMode = on;
      if (on) {
        state.currency = Math.max(state.currency, CHEAT_CURRENCY);
        // Retroactively shortens whatever's left of the CURRENT wait for
        // anything still growing, so turning the toggle on is useful right
        // away instead of only affecting plants watered after this point.
        // Never lengthens a wait that was already shorter than 15s.
        var now = Date.now();
        Object.keys(state.plants).forEach(function (key) {
          var p = state.plants[key];
          if (p.stage < MAX_STAGE) p.readyAt = Math.min(p.readyAt, now + CHEAT_STAGE_MS);
        });
      }
      saveState();
      renderCheatToggle();
      renderShopRows();
      updateCurrencyPill();
      // renderPlants() before updateHUD(): it's what actually recomputes each
      // plant's cached _d (see makePlantIcon -> recomputePlant) from the
      // readyAt values just changed above - updateHUD only ever reads that
      // cache, so calling it first would still see the pre-toggle numbers.
      renderPlants();
      updateHUD();
      toast(on ? 'Cheat Mode on - unlimited Petals, 15s growth \u{1F31F}' : 'Cheat Mode off');
    }
    function toggleCheatMode() { setCheatMode(!state.cheatMode); }
    function renderCheatToggle() {
      var btn = document.getElementById('cheat-toggle-btn');
      btn.textContent = 'Cheat Mode: ' + (state.cheatMode ? 'On' : 'Off');
      btn.classList.toggle('on', !!state.cheatMode);
    }

    function updateCurrencyPill() {
      document.getElementById('currency-pill').innerHTML = '\u{1F338} ' +
        (state.cheatMode ? 'Unlimited' : state.currency);
    }

    // A farmer's-market stand rather than a catalogue: one crate per species
    // sits out on the counter, restocked once a day (see dailyStock above),
    // each wearing whichever STANDARD color today's shuffle gave it. Every
    // crate is the same price, so the stand is a pick-a-favourite display,
    // not a power ladder - and since it only ever shows STANDARD colors,
    // breeding stays the only route to everything past tier 0.
    function renderShopRows() {
      // The basket tag carries the one number that matters here; everything
      // else that used to be a sentence above the stand (sell price range,
      // "one of each flower") lives elsewhere (the sell screen, the crates
      // themselves) rather than crowding this screen with text.
      document.getElementById('basket-tag').textContent =
        (state.cheatMode ? 'Unlimited' : state.currency) + ' \u{1F338}';
      document.getElementById('stand-sign').innerHTML = 'ALL ITEMS<br>' + SEED_COST + ' \u{1F338}';
      var afford = state.currency >= SEED_COST;

      var crates = dailyStock().map(function (vk) {
        var v = parseVariant(vk), s = speciesFor(v.species), c = colorFor(v.color);
        var owned = state.seeds[vk] || 0;
        return '<button class="stand-item"' + (afford ? '' : ' disabled') +
          ' title="' + c.name + ' ' + s.name + ' - ' + SEED_COST + ' Petals"' +
          ' onclick="confirmBuySeed(\'' + vk + '\')">' +
          speciesChip(s, v.color, 34) +
          '<span class="stand-item-name">' + c.name + '<br>' + s.name + '</span>' +
          '<span class="stand-item-price">' + SEED_COST + ' \u{1F338}</span>' +
          (owned > 0 ? '<span class="stand-item-owned">have ' + owned + '</span>' : '') +
          '</button>';
      });

      // Fertilizer is the only non-seed thing for sale, and the only way
      // into the colors the stand never stocks - so it gets its own sack
      // rather than blending into the crate rows. Species come seven to a
      // day (see dailyStock), three per row, so the seventh always ends up
      // alone; rather than leave it stranded on its own row, it shares the
      // last row with the sack instead (see .stand-row-last).
      // Empty (not disabled) until state.fertUnlocked - see the FERTILIZER
      // UNLOCK section. Before the player has ever grown a flower to
      // flourishing there's nothing to sell them: a visible-but-disabled
      // sack would just be a locked item nobody yet knows the reason for.
      var fert = state.fertUnlocked ?
        '<button class="stand-fert-btn"' + (state.currency >= FERTILIZER_COST ? '' : ' disabled') +
        ' title="Fertilizer - ' + FERTILIZER_COST + ' Petals" onclick="confirmBuyFertilizer()">' +
        '<span class="stand-fert-icon">\u{1F33E}</span>' +
        '<span class="stand-fert-label">Fertilizer</span>' +
        '<span class="stand-fert-price">' + FERTILIZER_COST + ' \u{1F338}</span>' +
        '<span class="stand-fert-owned">have ' + state.fertilizer + '</span>' +
        '</button>' : '';

      document.getElementById('stand-row-1').innerHTML = crates.slice(0, 3).join('');
      document.getElementById('stand-row-2').innerHTML = crates.slice(3, 6).join('');
      document.getElementById('stand-row-3').innerHTML = crates.slice(6, 7).join('') + fert;

      // The Sprinkler and Greenhouse share one row (stand-row-4) instead of
      // each getting its own stacked row - both are non-flower purchasable
      // items, so they sit side by side the same way the 7th crate and the
      // fertilizer sack share stand-row-3 above (see GitHub issue #3).
      // Unlike fertilizer (always for sale), the sprinkler is a locked
      // teaser beforehand so a player working toward it can see what's
      // coming and how close they are, the same transparency
      // toolBlockedReason already gives every other "not yet" moment in the
      // game.
      var sprinklerTile;
      if (!sprinklerUnlocked()) {
        var need = Math.max(0, SPRINKLER_UNLOCK_FLOWERS - state.stats.grown);
        sprinklerTile =
          '<button class="stand-sprinkler-btn" disabled title="Grow and harvest ' + SPRINKLER_UNLOCK_FLOWERS +
          ' flowers to unlock">' +
          '<span class="stand-sprinkler-icon">' + sprinklerIconSVG(26) + '</span>' +
          '<span class="stand-sprinkler-label">Sprinkler</span>' +
          '<span class="stand-sprinkler-price">Locked</span>' +
          '<span class="stand-sprinkler-owned">' + need + ' more flower' + (need === 1 ? '' : 's') +
          '</span></button>';
      } else {
        var sprinklerCost = nextSprinklerCost();
        sprinklerTile =
          '<button class="stand-sprinkler-btn"' + (state.currency >= sprinklerCost ? '' : ' disabled') +
          ' title="Sprinkler - ' + sprinklerCost + ' Petals" onclick="confirmBuySprinkler()">' +
          '<span class="stand-sprinkler-icon">' + sprinklerIconSVG(26) + '</span>' +
          '<span class="stand-sprinkler-label">Sprinkler</span>' +
          '<span class="stand-sprinkler-price">' + sprinklerCost + ' \u{1F338}</span>' +
          '<span class="stand-sprinkler-owned">have ' + state.sprinklerInventory + '</span>' +
          '</button>';
      }

      // The Greenhouse: same locked-teaser-then-buyable shape as the
      // Sprinkler tile above, but a one-time purchase, not a repeating one -
      // once bought it disappears from the stand entirely (the menu entry
      // is where it lives from then on, same as the sprinkler moving to its
      // own equipment toggle once owned), leaving the Sprinkler tile alone
      // in the shared row.
      var greenhouseTile;
      if (state.greenhouseUnlocked) {
        greenhouseTile = '';
      } else if (!greenhouseAvailableForPurchase()) {
        var greenhouseNeed = Math.max(0, GREENHOUSE_UNLOCK_FLOWERS - state.stats.grown);
        greenhouseTile =
          '<button class="stand-greenhouse-btn" disabled title="Grow and harvest ' + GREENHOUSE_UNLOCK_FLOWERS +
          ' flowers to unlock">' +
          '<span class="stand-greenhouse-icon">\u{1F3E1}</span>' +
          '<span class="stand-greenhouse-label">Greenhouse</span>' +
          '<span class="stand-greenhouse-price">Locked</span>' +
          '<span class="stand-greenhouse-owned">' + greenhouseNeed + ' more flower' +
          (greenhouseNeed === 1 ? '' : 's') + '</span></button>';
      } else {
        greenhouseTile =
          '<button class="stand-greenhouse-btn"' + (state.currency >= GREENHOUSE_COST ? '' : ' disabled') +
          ' title="Greenhouse - ' + GREENHOUSE_COST + ' Petals" onclick="confirmBuyGreenhouse()">' +
          '<span class="stand-greenhouse-icon">\u{1F3E1}</span>' +
          '<span class="stand-greenhouse-label">Greenhouse</span>' +
          '<span class="stand-greenhouse-price">' + GREENHOUSE_COST + ' \u{1F338}</span>' +
          '</button>';
      }

      document.getElementById('stand-row-4').innerHTML = sprinklerTile + greenhouseTile;
    }

    // Nothing in the shop spends Petals on a single tap. The buy controls are
    // small - four 38px swatches per species row on a phone - and a mis-tap
    // used to cost 20 Petals with only a toast to show for it, and no undo.
    // Same reasoning as the seed picker on every plant attempt: the confirm
    // is cheap, the mistake isn't. Costs and the balance you'd be left with
    // are both stated before the button, not after.
    function openPurchaseConfirm(opts) {
      if (state.currency < opts.cost) return;
      resetModalChrome();
      document.getElementById('modal-title').textContent = opts.title;
      document.getElementById('modal-body').innerHTML = opts.preview +
        '<p style="color:var(--text-dim)">Costs <b>' + opts.cost + ' \u{1F338} Petals</b>. ' +
        (state.cheatMode ? 'Cheat Mode is on, so this is free.' :
          'You have ' + state.currency + ' and would be left with <b>' +
          (state.currency - opts.cost) + '</b>.') + '</p>';
      var ok = document.getElementById('modal-ok-btn');
      ok.textContent = opts.okText;
      // Close first: the shop sheet sits underneath and stays open, so the
      // purchase lands back on a shop that re-renders with the new balance.
      ok.onclick = function () { closeModal(); opts.onOk(); };
      document.getElementById('modal-overlay').classList.add('open');
    }

    function confirmBuySeed(vk) {
      if (STANDARD_COLORS.indexOf(parseVariant(vk).color) < 0) return;
      var c = colorFor(parseVariant(vk).color);
      var have = state.seeds[vk] || 0;
      openPurchaseConfirm({
        title: 'Buy this seed?',
        preview: '<div class="buy-preview" style="border-color:' + c.line + '">' +
          variantChip(vk, 40) + '<span style="color:' + c.ink + '">' + variantName(vk) +
          ' seed</span></div>' +
          '<p>You have <b>' + have + '</b> of these in your pouch.</p>',
        cost: SEED_COST,
        okText: 'Buy it \u{1F331}',
        onOk: function () { buySeed(vk); }
      });
    }

    function confirmBuyFertilizer() {
      openPurchaseConfirm({
        title: 'Buy fertilizer?',
        preview: '<p>One bag of fertilizer crosses two <b>flourishing</b> flowers standing on ' +
          'neighbouring tiles, and a seedling comes up in the gap between them.</p>' +
          '<p>You have <b>' + state.fertilizer + '</b> bag' +
          (state.fertilizer === 1 ? '' : 's') + '.</p>',
        cost: FERTILIZER_COST,
        okText: 'Buy it \u{1F331}',
        onOk: buyFertilizer
      });
    }

    function buySeed(vk) {
      if (state.currency < SEED_COST) return;
      // Guard the shop's own rule at the point of purchase, not just in the
      // markup that renders it.
      if (STANDARD_COLORS.indexOf(parseVariant(vk).color) < 0) return;
      state.currency -= SEED_COST;
      if (state.cheatMode) state.currency = CHEAT_CURRENCY; // never actually runs down
      state.seeds[vk] = (state.seeds[vk] || 0) + 1;
      saveState();
      renderShopRows();
      updateCurrencyPill();
      toast('Bought a ' + variantName(vk) + ' seed \u{1F331}');
      vibrate(15);
      tutorialOnBuy();
    }

    function buyFertilizer() {
      if (state.currency < FERTILIZER_COST) return;
      state.currency -= FERTILIZER_COST;
      if (state.cheatMode) state.currency = CHEAT_CURRENCY; // never actually runs down
      state.fertilizer++;
      saveState();
      renderShopRows();
      updateCurrencyPill();
      syncFertTool(); // first bag ever bought - the toolbox petal can show up now
      toast('Bought a bag of fertilizer \u{1F331}');
      vibrate(15);
    }

    function confirmBuySprinkler() {
      if (!sprinklerUnlocked()) return;
      openPurchaseConfirm({
        title: 'Buy a sprinkler?',
        preview: '<p>Place it on an empty tile and it automatically waters every flower on the eight ' +
          'tiles around it - no walk-up visit needed. Tap a placed sprinkler any time to pick it back up ' +
          'and move it somewhere else.</p>' +
          '<p>You have <b>' + state.sprinklerInventory + '</b> unplaced. Each one costs ' +
          SPRINKLER_COST_STEP + ' \u{1F338} more than the last.</p>',
        cost: nextSprinklerCost(),
        okText: 'Buy it \u{1F4A6}',
        onOk: buySprinkler
      });
    }

    function buySprinkler() {
      if (!sprinklerUnlocked()) return;
      // Recomputed here rather than reusing whatever confirmBuySprinkler
      // showed - it's the same live formula (see nextSprinklerCost), so
      // there's nothing to drift, and this way the deduction can never fall
      // out of sync with sprinklerOwnedCount at the actual moment of purchase.
      var cost = nextSprinklerCost();
      if (state.currency < cost) return;
      state.currency -= cost;
      if (state.cheatMode) state.currency = CHEAT_CURRENCY; // never actually runs down
      state.sprinklerInventory++;
      saveState();
      renderShopRows();
      updateCurrencyPill();
      updateHUD(); // the equipment toggle can show up now, same as syncFertTool above
      toast('Bought a sprinkler for ' + cost + ' \u{1F338}');
      vibrate(15);
    }

    // Opened both from the menu ("Seed Shop") and by tapping the currency
    // pill directly - callers handle closing the menu dropdown themselves
    // (see the menu button's onclick) so this doesn't force it open/closed.
    function openShop() {
      closePlantPanel(); closeJournal(); closeCrossNotes(); closeGreenhouse(); // only one full-screen/bottom-sheet panel open at a time
      if (activeTool) setActiveTool(null); // shopping is not tending; don't leave a tool armed behind the sheet
      renderShopRows();
      renderCheatToggle();
      document.getElementById('shop-panel').classList.add('open');
      syncToolRail();
    }
    function closeShop() {
      document.getElementById('shop-panel').classList.remove('open');
      syncToolRail();
    }

    // Capped so a burst of actions (watering or harvesting several flowers
    // in a row) can't stack into a column tall enough to cover the map -
    // only the newest MAX_VISIBLE_TOASTS stay up. Older ones are dropped
    // outright rather than queued: by the time a 3rd action has happened,
    // waiting to show the 1st one's news would just be stale.
    var MAX_VISIBLE_TOASTS = 2;
    function toast(msg) {
      var c = document.getElementById('toast-container');
      var existing = c.querySelectorAll('.toast');
      for (var i = 0; i <= existing.length - MAX_VISIBLE_TOASTS; i++) existing[i].remove();
      var t = document.createElement('div');
      t.className = 'toast';
      t.textContent = msg;
      c.appendChild(t);
      requestAnimationFrame(function () { t.classList.add('show'); });
      setTimeout(function () {
        t.classList.remove('show');
        setTimeout(function () { t.remove(); }, 300);
      }, 2600);
    }

    function vibrate(ms) {
      if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} }
    }

    // ---------------------------------------------------------------------
    //  GREENHOUSE
    //  A mid-late-game upgrade (see the GREENHOUSE_* constants) - twelve
    //  fixed pot slots, three shelves of four, for growing indoors with no
    //  walk-up visit needed. Reuses the growth engine verbatim
    //  (recomputePlant/applyWatering take a plain plant object, with no map
    //  dependency baked into either) and the same extract-or-sell split the
    //  outdoor harvest loop uses (see harvestPlant) - a potted harvest
    //  credits the same lifetime grown tally (recordGrown) and the same
    //  stats every outdoor one does. The real differences: no wind/grass in
    //  the art (see buildPottedVisual, POTTED PLANT ART section), no
    //  crossbreeding (there is no grid here, so no adjacent-neighbour
    //  concept to cross with), and real tap-to-act buttons in the pot detail
    //  view in place of the map's equip-a-tool gesture, since there is no
    //  tool rail indoors.
    // ---------------------------------------------------------------------

    // Whether the Shop's Greenhouse row should offer a real purchase yet -
    // purely a read, recomputed live, same shape as sprinklerUnlocked().
    function greenhouseAvailableForPurchase() {
      return !state.greenhouseUnlocked && state.stats.grown >= GREENHOUSE_UNLOCK_FLOWERS;
    }
    // Fires the one-time "you can buy this now" toast - same pattern and
    // same reasoning as checkSprinklerUnlock, called from the same harvest
    // sites (see harvestPlant/pickWild/harvestPottedPlant).
    function checkGreenhouseTeaser() {
      if (state.greenhouseTeaserAnnounced || !greenhouseAvailableForPurchase()) return;
      state.greenhouseTeaserAnnounced = true;
      saveState();
      toast('\u{1F331} The Greenhouse is available in the Shop!');
    }

    // Slots [0, GREENHOUSE_STARTER_POTS) start clean and empty - yours from
    // the purchase, ready to plant right away. The rest start broken - see
    // brokenVariantFor/fixCostFor below for what each one looks like and
    // costs to fix.
    function buildInitialPots() {
      var pots = [];
      for (var i = 0; i < GREENHOUSE_POT_COUNT; i++) {
        pots.push({ fixed: i < GREENHOUSE_STARTER_POTS, plant: null });
      }
      return pots;
    }

    function confirmBuyGreenhouse() {
      openPurchaseConfirm({
        title: 'Buy the Greenhouse?',
        preview: '<p>Twelve pots under glass - three ready to plant right away, the other nine ' +
          'broken and needing to be fixed one at a time. Grow indoors without walking back, though ' +
          'nothing planted in a pot can be crossed - there\'s no neighbour there to cross it with.</p>',
        cost: GREENHOUSE_COST,
        okText: 'Buy it \u{1F331}',
        onOk: buyGreenhouse
      });
    }
    function buyGreenhouse() {
      if (state.currency < GREENHOUSE_COST) return;
      state.currency -= GREENHOUSE_COST;
      if (state.cheatMode) state.currency = CHEAT_CURRENCY;
      state.greenhouseUnlocked = true;
      state.greenhouse.pots = buildInitialPots();
      saveState();
      renderShopRows();
      updateCurrencyPill();
      syncGreenhouseUnlockUI();
      toast('\u{1F331} Greenhouse unlocked! Find it in the menu.');
      vibrate(20);
    }

    // Reveals the Greenhouse menu entry - see syncFertUnlockUI for the same
    // pattern. Called once at boot (in case a returning player already
    // bought it) and again the moment buyGreenhouse succeeds.
    function syncGreenhouseUnlockUI() {
      document.body.classList.toggle('greenhouse-unlocked', state.greenhouseUnlocked);
      updateGreenhouseMenuBadge();
    }

    function openGreenhouse() {
      toggleMenu();
      // The complete close-list, same as openMilestones() - see that
      // function's own comment for why this is the one to copy for a
      // screen reachable from the menu.
      closeShop(); closePlantPanel(); closeCrossNotes(); closeJournal(); closeHowToPlay(); closeMilestones();
      renderGreenhouse();
      document.getElementById('greenhouse-panel').classList.add('open');
      syncToolRail();
    }
    function closeGreenhouse() {
      document.getElementById('greenhouse-panel').classList.remove('open');
      syncToolRail();
    }

    // Which of the three broken-pot art variants a slot shows, and what
    // fixing it costs - both purely a function of its position among the
    // nine non-starter slots, never stored, so GREENHOUSE_FIX_COSTS can be
    // retuned later without a migration.
    function brokenVariantFor(slotIndex) { return (slotIndex - GREENHOUSE_STARTER_POTS) % 3; }
    function fixCostFor(slotIndex) { return GREENHOUSE_FIX_COSTS[slotIndex - GREENHOUSE_STARTER_POTS]; }

    // A warm sun with radiating beams - the glasshouse's own light source,
    // replacing the earlier scattered background flowers (those read as
    // extra unowned plants rather than scenery). Static, no motion, drawn
    // once and reused - it never changes, so there's nothing here worth
    // rebuilding per render the way the pots below are.
    var GREENHOUSE_SUN_HTML = (function () {
      var beams = '', beamCount = 10;
      for (var i = 0; i < beamCount; i++) {
        var angle = (360 / beamCount) * i;
        beams += '<rect x="47.5" y="6" width="5" height="26" rx="2.5" fill="url(#ghBeamFade)" ' +
          'transform="rotate(' + angle.toFixed(1) + ' 50 50)"/>';
      }
      return '<svg viewBox="0 0 100 100" width="100" height="100">' +
        '<defs>' +
        '<radialGradient id="ghSunGlow" cx="50%" cy="50%" r="50%">' +
        '<stop offset="0%" stop-color="#fff6d0" stop-opacity="0.85"/>' +
        '<stop offset="55%" stop-color="#ffd45e" stop-opacity="0.3"/>' +
        '<stop offset="100%" stop-color="#ffd45e" stop-opacity="0"/></radialGradient>' +
        '<linearGradient id="ghBeamFade" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" stop-color="#ffd45e" stop-opacity="0.75"/>' +
        '<stop offset="100%" stop-color="#ffd45e" stop-opacity="0"/></linearGradient>' +
        '<radialGradient id="ghSunCore" cx="36%" cy="32%" r="70%">' +
        '<stop offset="0%" stop-color="#fff6d0"/>' +
        '<stop offset="55%" stop-color="#ffd45e"/>' +
        '<stop offset="100%" stop-color="#f5b93a"/></radialGradient>' +
        '</defs>' +
        '<circle cx="50" cy="50" r="48" fill="url(#ghSunGlow)"/>' +
        beams +
        '<circle cx="50" cy="50" r="19" fill="url(#ghSunCore)" stroke="#e8a91c" stroke-width="1.4"/>' +
        '</svg>';
    })();

    // One slot's whole tile: a broken pot with its fix price, an empty
    // usable pot, or whatever's actually growing in it - see onPotTap for
    // what tapping each of the three does. A pot that's ready to grow or
    // wilted also gets a water-drop badge next to it (see .pot-water-badge)
    // for a one-tap water that never opens the detail view at all -
    // quickWaterPot stops the tap from also falling through to onPotTap
    // underneath it.
    function potSlotHtml(slotIndex, px) {
      var pot = state.greenhouse.pots[slotIndex];
      if (!pot.fixed) {
        var cost = fixCostFor(slotIndex);
        var vBroken = buildBrokenVisual(brokenVariantFor(slotIndex), px);
        var cls = 'pot-slot' + (state.currency >= cost ? '' : ' unaffordable');
        return '<div class="' + cls + '" onclick="onPotTap(' + slotIndex + ')">' +
          '<div class="pot-icon" style="width:' + vBroken.w + 'px;height:' + vBroken.h + 'px">' +
          '<div class="pot-icon-art">' + vBroken.html + '</div></div>' +
          '<div class="pot-price-tag">Fix - ' + cost + ' \u{1F338}</div></div>';
      }
      if (!pot.plant) {
        // Species/color are irrelevant at stage 0 (pot + soil only, nothing
        // colored drawn yet) - SPECIES[0] here is just a harmless stand-in.
        var vEmpty = buildPottedVisual(SPECIES[0], colorFor(SPECIES[0].base), 0, px);
        return '<div class="pot-slot" onclick="onPotTap(' + slotIndex + ')">' +
          '<div class="pot-icon" style="width:' + vEmpty.w + 'px;height:' + vEmpty.h + 'px">' +
          '<div class="pot-icon-art">' + vEmpty.html + '</div></div></div>';
      }
      var p = pot.plant;
      var d = recomputePlant(p, Date.now());
      var vPlant = buildPottedVisual(speciesFor(p.species), paletteOf(p), d.stage, px);
      // Wilted layers grayscale+fade onto the same filter the CSS class
      // already sets (drop-shadow) rather than an extra wrapper div -
      // inline style only overrides the one property it names, so the
      // class's transform:scaleY (see .pot-icon-art) still applies.
      var artStyle = d.wilted
        ? ' style="filter:drop-shadow(0 3px 3px rgba(0,0,0,0.4)) grayscale(55%) opacity(0.7)"' : '';
      var waterBadge = (d.ready || d.wilted)
        ? '<button class="pot-water-badge" onclick="event.stopPropagation(); quickWaterPot(' + slotIndex +
          ')" title="Water">\u{1F4A7}</button>'
        : '';
      return '<div class="pot-slot" onclick="onPotTap(' + slotIndex + ')">' +
        '<div class="pot-icon" style="width:' + vPlant.w + 'px;height:' + vPlant.h + 'px">' +
        '<div class="pot-icon-art"' + artStyle + '>' + vPlant.html + '</div>' + waterBadge + '</div></div>';
    }

    function renderGreenhouse() {
      document.getElementById('greenhouse-rows').innerHTML =
        '<div class="gh-sun-wrap">' + GREENHOUSE_SUN_HTML + '</div>';

      var potPx = 112;
      var html = '';
      for (var shelf = 0; shelf < 3; shelf++) {
        html += '<div class="gh-shelf"><div class="gh-plank"></div><div class="gh-pots">';
        for (var col = 0; col < 4; col++) {
          html += potSlotHtml(shelf * 4 + col, potPx);
        }
        html += '</div></div>';
      }
      document.getElementById('greenhouse-shelves').innerHTML = html;
      updateGreenhouseMenuBadge();
    }

    // How many potted plants would actually respond to a watering can right
    // now - ready to advance a stage, or wilted (both, same as the map's
    // own green droplet badge covers implicitly, since in practice a plant
    // wilted long enough has almost always long since become ready too -
    // see recomputePlant). Drives both the menu's count badge and (per
    // pot) the water-drop badge in potSlotHtml.
    function greenhouseReadyCount() {
      if (!state.greenhouseUnlocked) return 0;
      var now = Date.now(), n = 0;
      state.greenhouse.pots.forEach(function (pot) {
        if (!pot.plant) return;
        var d = recomputePlant(pot.plant, now);
        if (d.ready || d.wilted) n++;
      });
      return n;
    }
    // The Greenhouse menu row's own count badge - same filled-pill idea as
    // the seed pouch's (see seedCountBadgeHtml), just for "pots waiting on
    // you" instead of "seeds in your pouch". Called wherever the count
    // could have changed: after any render of the greenhouse itself, every
    // tickPlants pass, and once at boot.
    function updateGreenhouseMenuBadge() {
      var btn = document.getElementById('menu-greenhouse-btn');
      if (!btn) return;
      var n = greenhouseReadyCount();
      var existing = btn.querySelector('.menu-item-badge');
      if (existing) existing.remove();
      if (n > 0) {
        var badge = document.createElement('span');
        badge.className = 'menu-item-badge';
        badge.textContent = n;
        btn.appendChild(badge);
      }
    }

    // Every seed you own, any species, sorted the same way a journal page
    // sorts its colors - rarer things sink toward the bottom of the list.
    function allOwnedSeedVariants() {
      return sortVariants(Object.keys(state.seeds).filter(function (vk) { return state.seeds[vk] > 0; }));
    }

    // Routes a tap on a pot to whichever of the three things it can mean
    // right now - fix it, plant something in it, or look at what's already
    // growing.
    function onPotTap(slotIndex) {
      var pot = state.greenhouse.pots[slotIndex];
      if (!pot) return;
      if (!pot.fixed) { openFixPotConfirm(slotIndex); return; }
      if (!pot.plant) { openPotSeedPicker(slotIndex); return; }
      openPotDetail(slotIndex);
    }

    function openFixPotConfirm(slotIndex) {
      openPurchaseConfirm({
        title: 'Fix this pot?',
        preview: '<p>However it broke, a fresh pot and a scoop of soil puts it back to work.</p>',
        cost: fixCostFor(slotIndex),
        okText: 'Fix it \u{1F331}',
        onOk: function () { fixPot(slotIndex); }
      });
    }
    function fixPot(slotIndex) {
      var pot = state.greenhouse.pots[slotIndex];
      if (!pot || pot.fixed) return;
      var cost = fixCostFor(slotIndex);
      if (state.currency < cost) return;
      state.currency -= cost;
      if (state.cheatMode) state.currency = CHEAT_CURRENCY;
      pot.fixed = true;
      saveState();
      updateCurrencyPill();
      renderGreenhouse();
      toast('Pot fixed \u{1F331}');
      vibrate(20);
    }

    // The empty-pot picker: every seed you own, any species, one tap plants
    // it - there is no equip-then-tap-the-ground step here the way the map
    // has one, since the pot IS the target and there's only ever one to
    // choose.
    function openPotSeedPicker(slotIndex) {
      var variants = allOwnedSeedVariants();
      resetModalChrome();
      document.getElementById('modal-title').textContent = 'Plant a seed';
      var body = !variants.length
        ? '<p>You\'re out of seeds - the Shop sells the four standard colors.</p>'
        : variants.map(function (vk) {
            var c = colorFor(parseVariant(vk).color);
            return '<div class="pot-seed-row" style="border-color:' + c.line + '" ' +
              'onclick="plantInPot(' + slotIndex + ',\'' + vk + '\')">' +
              variantChip(vk, 28) +
              '<span class="pot-seed-row-name" style="color:' + c.ink + '">' + variantName(vk) + '</span>' +
              '<span class="pot-seed-row-count">x' + state.seeds[vk] + '</span></div>';
          }).join('');
      document.getElementById('modal-body').innerHTML = body;
      // No single "OK" action here - each row above IS the action, and the
      // backdrop-tap-to-close handler (see the modal-overlay listener) is
      // how you back out without planting anything.
      document.getElementById('modal-ok-btn').style.display = 'none';
      document.getElementById('modal-ok-btn').onclick = null; // no stale purchase-confirm handler lingering under a hidden button
      document.getElementById('modal-overlay').classList.add('open');
    }
    function plantInPot(slotIndex, vk) {
      if (!(state.seeds[vk] > 0)) return; // stale tap - already spent since the picker opened
      var pot = state.greenhouse.pots[slotIndex];
      if (!pot || !pot.fixed || pot.plant) return;
      state.seeds[vk]--;
      if (state.seeds[vk] <= 0) delete state.seeds[vk];
      var v = parseVariant(vk);
      var now = Date.now();
      pot.plant = {
        species: v.species, color: v.color,
        plantedAt: now, lastWateredAt: now, stage: 0, readyAt: now + stageReadyMs(),
        reachedBloom: false, reachedFlourish: false, grownCredited: false
      };
      state.stats.planted++;
      saveState();
      closeModal();
      renderGreenhouse();
      updateHUD();
      toast('\u{1F331} ' + variantName(vk) + ' planted! It will be ready for water in ' +
        formatDuration(stageReadyMs()) + '.');
      vibrate(20);
    }

    // The planted-pot detail: icon, status, then whichever action buttons
    // actually apply right now. A pot has no map tool rail to point at like
    // the outdoor plant panel's hints do, so these are real, tappable
    // buttons instead - see waterPottedPlant/extractPottedPlant/
    // sellPottedPlant just below.
    function openPotDetail(slotIndex) {
      var pot = state.greenhouse.pots[slotIndex];
      if (!pot || !pot.plant) { closeModal(); return; }
      var p = pot.plant;
      var d = recomputePlant(p, Date.now());
      var vk = variantKey(p.species, p.color);

      resetModalChrome();
      document.getElementById('modal-title').textContent = variantName(vk) + ' - ' + STAGE_LABELS[d.stage];
      document.getElementById('modal-ok-btn').style.display = 'none';
      document.getElementById('modal-ok-btn').onclick = null; // no stale purchase-confirm handler lingering under a hidden button

      var v = buildPottedVisual(speciesFor(p.species), paletteOf(p), d.stage, 88);
      var status;
      if (d.ready) status = 'Ready to grow - give it a drink!';
      else if (d.wilted) status = 'Looking wilted - a drink will perk it back up';
      else if (d.stage >= MAX_STAGE) status = 'Fully grown';
      else status = 'Thriving - ready to grow in ' + formatDuration(d.readyIn);

      var buttons = '';
      if (d.ready || d.wilted) {
        buttons += '<button class="pot-action-btn water" onclick="waterPottedPlant(' + slotIndex +
          ')">Water \u{1F4A7}</button>';
      }
      if (d.stage >= 2) {
        var yieldText = d.stage >= MAX_STAGE ? '2-4 seeds' : '1-2 seeds';
        buttons += '<button class="pot-action-btn extract" onclick="extractPottedPlant(' + slotIndex +
          ')">Extract ' + yieldText + '</button>';
        buttons += '<button class="pot-action-btn sell" onclick="sellPottedPlant(' + slotIndex +
          ')">Sell for ' + harvestValue(p, d.stage) + ' \u{1F338}</button>';
      }

      document.getElementById('modal-body').innerHTML =
        '<div class="pot-detail-icon"><div style="width:' + v.w + 'px;height:' + v.h + 'px">' + v.html + '</div></div>' +
        '<p class="pot-detail-status">' + status + '</p>' +
        (buttons ? '<div class="pot-action-row">' + buttons + '</div>' : '');
      document.getElementById('modal-overlay').classList.add('open');
    }

    // The actual watering mutation, shared by both entry points below - the
    // detail view's Water button and the one-tap water-drop badge right on
    // the shelf (see potSlotHtml). Returns what applyWatering returned, so
    // each caller can react its own way.
    function doWaterPot(slotIndex) {
      var pot = state.greenhouse.pots[slotIndex];
      if (!pot || !pot.plant) return null;
      var p = pot.plant;
      var now = Date.now();
      var res = applyWatering(p, now);
      recomputePlant(p, now);
      saveState();
      renderGreenhouse();
      if (res.revealed) {
        toast('\u{1F338} Your cross opened - it\'s a ' + variantName(res.revealed) + '!');
      } else if (res.grew) {
        toast('\u{1F4A7} ' + GROWTH_MESSAGES[p.stage]);
      }
      vibrate(res.grew ? 30 : 15);
      return res;
    }
    // From the detail view's Water button - re-renders the detail in place
    // (rather than closing) so the new stage/status shows immediately,
    // since unlike a harvest, watering isn't a terminal action and there's
    // usually more to do with the same pot right after.
    function waterPottedPlant(slotIndex) {
      if (!doWaterPot(slotIndex)) return;
      openPotDetail(slotIndex);
    }
    // From the water-drop badge right on the shelf - a single tap, no
    // detail view involved at all. Stays on the shelf screen; the badge
    // itself disappears on the next render once the pot's no longer ready
    // or wilted.
    function quickWaterPot(slotIndex) {
      doWaterPot(slotIndex);
    }

    // Mirrors harvestPlant's extract/sell split verbatim (see its own
    // comment) - same seed odds, same stats, same lifetime grown credit,
    // just clearing a pot slot instead of a map tile.
    function harvestPottedPlant(slotIndex, mode) {
      var pot = state.greenhouse.pots[slotIndex];
      if (!pot || !pot.plant) return;
      var p = pot.plant;
      var d = recomputePlant(p, Date.now());
      var isCluster = d.stage >= MAX_STAGE;
      var vk = variantKey(p.species, p.color);
      var label = variantName(vk) + (isCluster ? ' cluster' : '');
      pot.plant = null;
      if (!p.grownCredited) recordGrown(vk);

      if (mode === 'sell') {
        var value = harvestValue(p, d.stage);
        state.currency += value;
        state.stats.sold++;
        state.stats.earned += value;
        toast('Sold your potted ' + label + ' for ' + value + ' \u{1F338}');
      } else {
        var gained = rollWeighted(isCluster ? SEED_YIELD_CLUSTER : SEED_YIELD_SINGLE);
        state.seeds[vk] = (state.seeds[vk] || 0) + gained;
        state.stats.extracted += gained;
        state.stats.extractedFlowers++;
        toast('\u{1F331} Got ' + gained + ' seed' + (gained === 1 ? '' : 's') + ' from your potted ' + label);
      }

      saveState();
      closeModal();
      renderGreenhouse();
      updateHUD();
      updateCurrencyPill();
      vibrate(20);
      checkSprinklerUnlock();
      checkGreenhouseTeaser();
    }
    function extractPottedPlant(slotIndex) { harvestPottedPlant(slotIndex, 'extract'); }
    function sellPottedPlant(slotIndex) { harvestPottedPlant(slotIndex, 'sell'); }

    // ---------------------------------------------------------------------
    //  TUTORIAL (first run only)
    //  A brand-new save (see loadState's tutorialDone default) walks through
    //  one real plant -> water -> water -> water -> harvest -> shop cycle, i.e.
    //  the exact three-visit shape of the real game. The 1.5-hour readiness
    //  waits are simulated (tutorialMakeReady clears the ONE tutorial plant's
    //  readyAt, not a global time multiplier - recomputePlant treats that
    //  plant no differently from any other on every later call), so a new
    //  player sees the whole loop in under a minute instead of several hours.
    //  Every other step - actually planting, actually tapping Water,
    //  actually harvesting, actually buying - is a real action the player
    //  performs; nothing is auto-clicked for them. Always skippable via the
    //  banner's persistent link.
    // ---------------------------------------------------------------------
    var tutorial = { active: false, step: null, plantKey: null };

    function showTutorialBanner(html) {
      document.getElementById('tutorial-text').innerHTML = html;
      document.getElementById('tutorial-banner').classList.add('open');
    }
    function hideTutorialBanner() { document.getElementById('tutorial-banner').classList.remove('open'); }

    function startTutorial() {
      tutorial.active = true;
      tutorial.step = 'plant';
      tutorial.plantKey = null;
      setSeedHint(true);
      showTutorialBanner('Let\'s plant your first seed - tap the seed pouch (top right), pick a species, ' +
        'then a color, then tap the ground within the green square \u{1F331}');
    }

    function skipTutorial() {
      tutorial.active = false;
      state.tutorialDone = true;
      saveState();
      setToolHint(null);
      setSeedHint(false);
      hideTutorialBanner();
      maybeStartFertTutorial(); // in case the tutorial plant flourished before it was skipped
    }

    function finishTutorial() {
      tutorial.active = false;
      state.tutorialDone = true;
      saveState();
      setToolHint(null);
      setSeedHint(false);
      showTutorialBanner('You\'ve got the hang of it! Plant, water, harvest, and shop for better seeds ' +
