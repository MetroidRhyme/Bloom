<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>BLOOM</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <style>
    :root {
      --hud-top-h: 74px;
      --bg: #eaf6ee;
      --panel-bg: rgba(255,255,255,0.94);
      --panel-border: rgba(60,40,20,0.08);
      --text: #332e28;
      --text-dim: #8a8478;
      --green: #4caf6d;
      --green-dark: #3d8f57;
      --blue: #4aa3ff;
      --pink: #ff6fa0;
      --amber: #f0a93a;
      --shadow: 0 6px 24px rgba(60,40,20,0.16);
      --shadow-sm: 0 2px 10px rgba(60,40,20,0.14);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bg); }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--text); }
    button { font-family: inherit; }

    #map { position: fixed; inset: 0; background: var(--bg); }
    .leaflet-container { background: var(--bg); }

    /* ================= TOP BAR ================= */
    #hud-top {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(255,255,255,0.86));
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 14px 16px 10px;
      display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
      box-shadow: var(--shadow-sm);
      border-radius: 0 0 22px 22px;
    }
    #title-wrap { display: flex; flex-direction: column; line-height: 1.1; }
    #game-title {
      font-weight: 800; font-size: 23px; letter-spacing: 1.5px;
      background: linear-gradient(90deg, #ff6fa0, #f0a93a, #4caf6d, #4aa3ff);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    #game-version { font-size: 10px; color: var(--text-dim); font-weight: 600; letter-spacing: 0.4px; margin-top: 2px; }

    #top-right { display: flex; align-items: center; gap: 8px; }
    #gps-status {
      font-size: 10px; font-weight: 700; letter-spacing: 0.5px; padding: 5px 10px;
      border-radius: 999px; background: rgba(240,169,58,0.16); color: #a06a00;
      white-space: nowrap;
    }
    #gps-status.pending { animation: pulse 1.6s ease-in-out infinite; }
    #gps-status.locked { background: rgba(76,175,109,0.16); color: var(--green-dark); }
    #gps-status.err { background: rgba(240,169,58,0.22); color: #a06a00; }

    #currency-pill {
      font-size: 11px; font-weight: 800; letter-spacing: 0.3px; padding: 5px 10px;
      border-radius: 999px; background: rgba(240,169,58,0.16); color: #a06a00;
      white-space: nowrap; cursor: pointer;
    }
    #currency-pill:active { background: rgba(240,169,58,0.26); }

    #top-menu-btn {
      width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--panel-border);
      background: rgba(255,255,255,0.9); color: var(--text); font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-sm);
    }
    #top-menu-btn:active { background: rgba(0,0,0,0.06); }

    #menu-dropdown {
      position: fixed; top: 68px; right: 16px; z-index: 1001;
      background: var(--panel-bg); border-radius: 16px; box-shadow: var(--shadow);
      border: 1px solid var(--panel-border); overflow: hidden;
      display: none; min-width: 190px;
    }
    #menu-dropdown.open { display: block; }
    #menu-dropdown button {
      display: block; width: 100%; text-align: left; padding: 13px 16px; border: none;
      background: none; font-size: 14px; color: var(--text); cursor: pointer;
      border-bottom: 1px solid var(--panel-border);
    }
    #menu-dropdown button:last-child { border-bottom: none; }
    #menu-dropdown button:active { background: rgba(0,0,0,0.05); }
    #menu-dropdown button.danger { color: #c0554a; }

    /* ================= BOTTOM HUD ================= */
    #hud-bottom {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 900;
      background: linear-gradient(0deg, rgba(255,255,255,0.97), rgba(255,255,255,0.88));
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 14px 18px calc(14px + env(safe-area-inset-bottom, 0px));
      border-radius: 22px 22px 0 0;
      box-shadow: var(--shadow-sm);
      text-align: center;
    }
    #hud-status-line { font-size: 13.5px; color: var(--text); font-weight: 600; }

    #recenter-btn {
      position: fixed; right: 16px; bottom: 96px; z-index: 900;
      width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--panel-border);
      background: var(--panel-bg); box-shadow: var(--shadow); font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    #recenter-btn:active { background: rgba(0,0,0,0.06); }

    /* ================= TUTORIAL BANNER ================= */
    /* First-run only (see the TUTORIAL section in the script). Sits just
       below the top bar, using --hud-top-h so it never overlaps it. */
    #tutorial-banner {
      position: fixed; left: 12px; right: 12px; top: calc(var(--hud-top-h) + 10px); z-index: 950;
      background: linear-gradient(135deg, #fff6e0, #ffffff);
      border: 2px solid var(--amber); border-radius: 16px; box-shadow: var(--shadow);
      padding: 12px 16px; text-align: center; display: none;
    }
    #tutorial-banner.open { display: block; }
    #tutorial-text { font-size: 13.5px; font-weight: 700; line-height: 1.4; }
    #tutorial-skip-link {
      display: inline-block; margin-top: 6px; font-size: 11px; font-weight: 700;
      color: var(--text-dim); text-decoration: underline; cursor: pointer;
    }

    /* ================= PLANT PANEL ================= */
    #plant-panel {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 1100;
      background: var(--panel-bg); border-radius: 24px 24px 0 0; box-shadow: var(--shadow);
      padding: 10px 22px calc(22px + env(safe-area-inset-bottom, 0px));
      transform: translateY(105%);
      transition: transform 0.28s ease;
    }
    #plant-panel.open { transform: translateY(0); }
    .panel-handle { width: 40px; height: 4px; border-radius: 2px; background: var(--panel-border); margin: 4px auto 10px; }
    #panel-close-btn {
      position: absolute; top: 14px; right: 16px; width: 30px; height: 30px; border-radius: 50%;
      border: none; background: rgba(0,0,0,0.05); font-size: 17px; color: var(--text-dim); cursor: pointer;
    }
    #plant-icon-big { display: flex; align-items: center; justify-content: center; margin: 4px auto 8px; }
    #plant-title { text-align: center; font-size: 18px; font-weight: 800; margin-bottom: 2px; }
    #plant-meta { text-align: center; font-size: 12.5px; color: var(--text-dim); margin-bottom: 12px; }

    /* Progress toward the next stage, i.e. how long until this plant is ready
       for its next watering visit. There is no water-level bar any more -
       water is not a resource that meters down, it is just the action that
       advances a stage (or clears a cosmetic wilt). */
    .growth-bar-track { width: 100%; height: 10px; background: rgba(0,0,0,0.07); border-radius: 999px; overflow: hidden; }
    #growth-bar-fill { height: 100%; background: linear-gradient(90deg, var(--green), #8fd9a8); border-radius: 999px; transition: width 0.4s ease; }
    /* Wild flowers reuse the same bar as a life bar - amber, so an emptying
       bar is never mistaken for growth. */
    #growth-bar-fill.fading { background: linear-gradient(90deg, var(--amber), #f5c169); }
    #growth-bar-label { text-align: center; font-size: 11.5px; color: var(--text-dim); margin-top: 5px; margin-bottom: 10px; }

    #plant-status-line { text-align: center; font-size: 13.5px; font-weight: 700; margin-bottom: 14px; }
    .status-good { color: var(--green-dark); }
    .status-wilt { color: var(--blue); }

    #plant-action-btn {
      display: block; width: 100%; padding: 14px; border: none; border-radius: 16px;
      font-size: 15px; font-weight: 800; letter-spacing: 0.3px; cursor: pointer;
      background: linear-gradient(90deg, var(--blue), #7ec8ff); color: #fff; box-shadow: var(--shadow-sm);
    }
    #plant-action-btn:disabled { background: #d8d4c8; color: #948e80; box-shadow: none; cursor: default; }

    /* Hidden by default - renderBreedButton shows it only when this plant is
       flourishing and has a flourishing neighbour, so it never advertises a
       cross that isn't there. Green rather than blue: watering is the routine
       action, crossing is the deliberate one. */
    #breed-btn {
      display: none; width: 100%; padding: 13px; border: 2px solid var(--green);
      border-radius: 16px; margin-top: 10px; font-size: 14.5px; font-weight: 800;
      cursor: pointer; background: #fff; color: var(--green-dark); box-shadow: var(--shadow-sm);
    }
    #breed-btn:disabled {
      border-color: #d8d4c8; background: #f0ede4; color: #948e80;
      box-shadow: none; cursor: default;
    }

    /* The two parents of a proposed cross, side by side with a plus between,
       so the pairing reads as an equation rather than a list. */
    .breed-pair {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      margin-bottom: 12px;
    }
    .breed-parent {
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      font-size: 12px; font-weight: 700; text-align: center; flex: 1;
    }
    .breed-plus { font-size: 20px; font-weight: 800; color: var(--text-dim); flex-shrink: 0; }

    /* Hidden by default - renderPlantPanel shows this only once a plant has
       reached single-bloom or flourishing stage and the player is in range. */
    #harvest-row { display: none; gap: 10px; margin-top: 10px; }
    .harvest-btn {
      flex: 1; padding: 13px; border-radius: 14px; font-size: 14px; font-weight: 800;
      cursor: pointer; box-shadow: var(--shadow-sm);
    }
    .keep-btn { background: #fff; color: var(--green-dark); border: 2px solid var(--green); }
    .sell-btn { background: linear-gradient(90deg, var(--amber), #f5c169); color: #fff; border: none; }

    /* ================= SHOP PANEL ================= */
    /* Full-screen takeover rather than a bottom sheet - stepping up to the
       stand should feel like leaving the map for a moment, not peeking at a
       drawer over it. Still slides up like every other panel; it just now
       covers the whole viewport when open. Laid out as one flex column
       (basket, then the stand) sized to fit a phone screen with no
       scrolling of its own - see stand-counter below for the one internal
       scroll left as a safety net for unusually short screens. */
    #shop-panel {
      position: fixed; inset: 0; z-index: 1100;
      /* Opaque, not var(--panel-bg) - that's a translucent white meant to
         float a sheet over the map, and at full-screen size the HUD bar
         ghosted through the top of it. */
      background: #fdfbf5;
      padding: calc(14px + env(safe-area-inset-top, 0px)) 22px calc(16px + env(safe-area-inset-bottom, 0px));
      display: flex; flex-direction: column;
      transform: translateY(105%);
      transition: transform 0.28s ease;
    }
    #shop-panel.open { transform: translateY(0); }
    #shop-close-btn {
      position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: 16px;
      width: 32px; height: 32px; border-radius: 50%; z-index: 2;
      border: none; background: rgba(0,0,0,0.06); font-size: 18px; color: var(--text-dim); cursor: pointer;
    }
    /* The petal basket: how much you have to spend, front and center instead
       of a sentence of stats. A woven basket (repeating gradients, same
       trick as the stand counter) with a handle arc, flowers spilling over
       the rim, and a hanging tag carrying the actual number - "a basket
       with petals in it that has a number on it". */
    #shop-basket { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; margin: 6px 0 10px; }
    #basket-handle {
      width: 60px; height: 30px; margin-bottom: -15px;
      border: 5px solid #6b4423; border-bottom: none; border-radius: 60px 60px 0 0;
    }
    #basket-body {
      position: relative; width: 132px; height: 58px;
      background:
        repeating-linear-gradient(45deg, rgba(107,68,35,0.32) 0 6px, transparent 6px 12px),
        repeating-linear-gradient(180deg, #caa06a 0 11px, #ad7f48 11px 13px);
      border: 3px solid #6b4423; border-radius: 12px 12px 34px 34px; box-shadow: var(--shadow-sm);
    }
    #basket-petals {
      position: absolute; top: -22px; left: 0; right: 0; text-align: center;
      font-size: 22px; letter-spacing: -5px;
    }
    /* Anchored to basket-body (not shop-basket) so the offset is relative to
       the basket itself, not the whole full-screen panel. */
    #basket-tag {
      position: absolute; top: -10px; right: -20px; transform: rotate(7deg);
      background: #fff6e0; border: 2px solid #6b4423; color: #5a3d22; border-radius: 10px;
      padding: 4px 9px; font-size: 13.5px; font-weight: 800; white-space: nowrap;
      box-shadow: var(--shadow-sm);
    }
    /* The stand: a wooden farmer's-market counter under a striped awning,
       with a hand-painted price sign leaning over it. Pure CSS/gradients, no
       image assets, matching the rest of the game's inline-SVG art. One
       crate per seed on sale sits on the counter; fertilizer gets its own
       sack off to the side rather than blending in with the seed row.
       flex:1 (not a fixed height) so it soaks up whatever room is left under
       the basket on any phone, rather than being sized for one screen and
       leaving a gap - or a scrollbar - on every other. */
    #stand-scene { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; margin: 0 -22px; padding: 0 22px; }
    #stand-canopy {
      flex: 0 0 auto; height: 20px; margin: 0 -22px 4px;
      background: repeating-linear-gradient(-45deg, #c0453c 0 16px, #f6ecd8 16px 32px);
      border-bottom: 3px solid #6b4423;
    }
    #stand-sign {
      flex: 0 0 auto; position: relative; left: 50%; transform: translateX(-50%) rotate(-2.5deg);
      width: fit-content; margin: -22px 0 12px;
      background: #7a5330; color: #fff6e0; border: 3px solid #5a3d22; border-radius: 8px;
      padding: 7px 16px; font-size: 12.5px; font-weight: 800; text-align: center; line-height: 1.35;
      box-shadow: var(--shadow-sm); white-space: nowrap;
    }
    #stand-counter {
      flex: 1 1 auto; min-height: 0;
      display: flex; flex-direction: column; gap: 14px;
      align-items: center; justify-content: center;
      background: repeating-linear-gradient(180deg, #b8824a 0 13px, #a06f3d 13px 15px);
      border: 3px solid #6b4423; border-radius: 14px;
      padding: 16px 14px 14px; box-shadow: inset 0 3px 10px rgba(0,0,0,0.28);
      overflow-y: auto; -webkit-overflow-scrolling: touch;
    }
    /* Seven crates, one per species on sale that day, always laid out three
       to a row - a fixed count (not a responsive auto-fill) since the
       species list itself is fixed, so there is no "does it still fit"
       guesswork. The seventh has no row-mate among the crates, so it shares
       the last row with the fertilizer sack instead: that row is centered
       and left at natural size (not stretched edge to edge like the two
       rows above it), so the odd flower-plus-sack pair reads as one small
       group under the two full rows rather than a stretched mismatch. */
    .stand-row { display: flex; gap: 9px; }
    .stand-row-crates { width: 100%; }
    .stand-row-crates .stand-item { flex: 1 1 0; min-width: 0; }
    .stand-row-last { justify-content: center; }
    /* Base width matches the fertilizer sack (86px) - without it, the
       seventh crate has no row-mates to stretch against on its own row and
       shrinks to fit its wrapped two-line name instead, reading noticeably
       narrower than the six crates above it. Rows 1/2 override this with
       flex-grow to stretch edge to edge. */
    .stand-item {
      display: flex; flex-direction: column; align-items: center; gap: 3px; width: 86px;
      background: linear-gradient(180deg, #fff6e0, #ecdcb2); border: 2px solid #6b4423;
      border-radius: 12px; padding: 8px 3px 6px; cursor: pointer; box-shadow: var(--shadow-sm);
    }
    .stand-item:disabled { filter: grayscale(60%); opacity: 0.5; cursor: default; box-shadow: none; }
    .stand-item-name { font-size: 9.5px; font-weight: 800; color: #5a3d22; text-align: center; line-height: 1.15; }
    .stand-item-price { font-size: 8.5px; font-weight: 700; color: #a06a00; }
    .stand-item-owned { font-size: 8px; font-weight: 700; color: #8a7550; }
    /* Fertilizer's own sack, styled apart from the seed crates but no
       longer set off with a divider line - it now just sits beside the
       seventh flower on their shared, centered row. */
    .stand-fert-btn {
      display: flex; flex-direction: column; align-items: center; gap: 3px; width: 86px;
      background: linear-gradient(180deg, #e8cfa0, #c9a565); border: 2px solid #6b4423;
      border-radius: 12px; padding: 10px 6px 7px; cursor: pointer; box-shadow: var(--shadow-sm);
    }
    .stand-fert-btn:disabled { filter: grayscale(60%); opacity: 0.5; cursor: default; box-shadow: none; }
    .stand-fert-icon { font-size: 26px; line-height: 1; }
    .stand-fert-label { font-size: 9.5px; font-weight: 800; color: #5a3d22; text-align: center; }
    .stand-fert-price { font-size: 8.5px; font-weight: 700; color: #a06a00; }
    .stand-fert-owned { font-size: 8px; font-weight: 700; color: #8a7550; margin-top: 4px; }
    /* Purchase confirmation: what you are about to buy, drawn big enough to
       tell a Red Tulip from a Pink one before the Petals are gone. */
    .buy-preview {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 14px; margin-bottom: 12px; border: 2px solid; border-radius: 16px;
      font-size: 15.5px; font-weight: 800; text-align: center;
    }

    /* ================= JOURNAL PANEL ================= */
    /* Full-screen like the shop, but dressed as a kept journal instead of a
       market stand: a page (#journal-sheet) resting on a table-colored
       backdrop. "Thicker paper" is a two-step drop shadow standing in for
       pages stacked underneath, plus a darker spine strip down the left
       edge as if the pages were bound there - CSS gradients and
       box-shadows only, the same trick the shop's crates use, no image
       assets. */
    #journal-panel {
      position: fixed; inset: 0; z-index: 1100;
      background: #cdb98c;
      padding: calc(54px + env(safe-area-inset-top, 0px)) 14px calc(14px + env(safe-area-inset-bottom, 0px));
      display: flex; flex-direction: column;
      transform: translateY(105%);
      transition: transform 0.28s ease;
    }
    #journal-panel.open { transform: translateY(0); }
    #journal-close-btn {
      position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: 16px;
      width: 32px; height: 32px; border-radius: 50%; z-index: 3;
      border: none; background: rgba(0,0,0,0.16); color: #fff; font-size: 18px; cursor: pointer;
    }
    /* The page itself: faint ruled lines, a couple of soft aged-paper
       blotches, and the stacked-edge shadow. Content is padded clear of
       the spine strip (::before) rather than sitting on top of it. */
    #journal-sheet {
      position: relative; flex: 1 1 auto; min-height: 0;
      margin: 0 8px 8px 0;
      border: 1px solid rgba(90,61,34,0.32); border-radius: 4px 16px 16px 4px;
      background:
        repeating-linear-gradient(180deg, transparent 0 27px, rgba(120,90,50,0.11) 27px 28px),
        radial-gradient(ellipse 340px 200px at 18% 12%, rgba(150,110,60,0.08), transparent 60%),
        radial-gradient(ellipse 300px 240px at 88% 85%, rgba(150,110,60,0.07), transparent 60%),
        linear-gradient(#faf1da, #f0dfb8);
      box-shadow: 5px 5px 0 -1px #e6d5a8, 9px 9px 0 -2px #dbc794, 0 12px 24px rgba(50,32,15,0.3);
      display: flex; flex-direction: column; overflow: hidden;
      padding: 16px 16px 14px 28px;
    }
    #journal-sheet::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 14px;
      background: linear-gradient(90deg, rgba(90,61,34,0.45), rgba(90,61,34,0.05));
      border-radius: 4px 0 0 4px;
    }
    #journal-heading {
      flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 8px;
      font-size: 19px; font-weight: 800; color: #4a3218; margin: 0 0 6px; text-align: center;
    }
    #journal-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }

    /* The scrapbook page: found colors get a looser grid than the crossing
       notes' plain swatch grid (.color-grid) does, since every found cell
       here is a little taped-down photo rather than a dot - it needs the
       extra room for the tape to overhang without crowding its neighbors. */
    .scrapbook-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr));
      gap: 22px 12px; margin: 10px 0 16px; padding-top: 4px;
    }
    /* Every found color is a little paper card taped to the page - a note
       card, not a glossy photo: a soft cream gradient with a couple of
       faint blotches (the same aged-paper trick as the journal-sheet
       background, scaled down) rather than flat white, plus a thin inset
       stroke standing in for a cut paper edge. A drop shadow lifts it off
       the page, a slight per-cell tilt (cycled by grid position, not
       random, so it never jitters on re-render) keeps it from looking
       grid-stamped, and two rotated strips of tape sit over the top
       corners. An unfound color stays a plain dashed pocket instead -
       nothing is taped down yet. */
    .color-cell.slot {
      position: relative; border: none; padding: 10px 4px 7px; border-radius: 2px;
      background:
        radial-gradient(ellipse 42px 22px at 18% 12%, rgba(120,90,50,0.07), transparent 70%),
        radial-gradient(ellipse 36px 20px at 82% 88%, rgba(120,90,50,0.06), transparent 70%),
        linear-gradient(178deg, #fffaf0 0%, #fbf0d4 100%);
      box-shadow: 0 3px 7px rgba(60,40,20,0.3), inset 0 0 0 1px rgba(120,90,50,0.1);
      transform: rotate(var(--tilt, -2deg));
    }
    .color-cell.slot:nth-child(4n+2) { --tilt: 2.5deg; }
    .color-cell.slot:nth-child(4n+3) { --tilt: -1.5deg; }
    .color-cell.slot:nth-child(4n) { --tilt: 1.5deg; }
    .color-cell.slot.held { cursor: pointer; }
    .color-cell.slot.picked {
      box-shadow: 0 0 0 2px var(--green), 0 6px 12px rgba(60,40,20,0.32),
        inset 0 0 0 1px rgba(120,90,50,0.1);
      transform: rotate(0deg) scale(1.05); z-index: 1;
    }
    .color-cell.slot:not(.blank)::before,
    .color-cell.slot:not(.blank)::after {
      content: ''; position: absolute; top: -7px; width: 26px; height: 14px;
      background: rgba(255,244,214,0.85); border: 1px solid rgba(160,120,60,0.4);
      box-shadow: 0 1px 2px rgba(60,40,20,0.28);
    }
    .color-cell.slot:not(.blank)::before { left: -6px; transform: rotate(-40deg); }
    .color-cell.slot:not(.blank)::after { right: -6px; transform: rotate(40deg); }
    /* An unfound color is a plain grey question mark in a dashed pocket -
       not a card, since nothing has been taped down yet. */
    .color-cell.slot.blank {
      background: transparent; border: 2px dashed rgba(90,61,34,0.3);
      box-shadow: none; color: #a49d90; transform: none;
    }
    .slot-unknown {
      display: inline-flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; border-radius: 50%; font-size: 15px; font-weight: 800;
      background: rgba(60,40,20,0.07); color: #a49d90;
    }
    /* Name and count on one line, centered together - not a badge stamped
       in a corner, which used to clip against the tape in the grid's last
       column. */
    .slot-line { display: flex; align-items: baseline; justify-content: center; gap: 4px; }
    .slot-label { font-style: italic; }
    /* No pill, no circle - just green ink in a handwriting-style font, as
       if the count were jotted onto the card by hand rather than printed.
       Muted when the color was found but none are on hand right now (kept,
       held 0); full green and bolder once you actually have some. */
    .slot-note {
      font-family: 'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive, sans-serif;
      font-size: 13px; color: rgba(61,143,87,0.6); display: inline-block; transform: rotate(-6deg);
    }
    .slot-note.some { color: var(--green-dark); font-weight: 700; }

    /* ================= MODAL ================= */
    #modal-overlay {
      position: fixed; inset: 0; z-index: 1500; background: rgba(30,25,15,0.4);
      display: none; align-items: center; justify-content: center; padding: 20px;
    }
    #modal-overlay.open { display: flex; }
    #modal-card {
      background: var(--panel-bg); border-radius: 22px; padding: 26px 24px; max-width: 360px;
      box-shadow: var(--shadow); text-align: center;
    }
    #modal-title { font-size: 20px; font-weight: 800; margin-bottom: 12px; }
    #modal-body { font-size: 14px; line-height: 1.55; color: var(--text); margin-bottom: 18px; text-align: left; }
    #modal-body p { margin: 0 0 10px; }
    /* Up to seven owned species can be listed, so this scrolls rather than
       pushing the modal's buttons off-screen. */
    .seed-pick-list { display: flex; flex-direction: column; gap: 10px; max-height: 52vh; overflow-y: auto; }

    /* Journal blocks. */
    .inv-meta { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
    .inv-stack-title { font-size: 13.5px; font-weight: 800; margin-top: 12px; }
    /* Two per row on a phone; Sell and Extract sit side by side so the choice
       between them is visible rather than sequential. */
    .inv-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 7px; }
    .inv-btn {
      flex: 1 1 44%; padding: 11px 8px; border-radius: 12px; font-size: 12.5px;
      font-weight: 800; cursor: pointer; box-shadow: var(--shadow-sm); border: none;
    }
    .inv-btn.sell { background: linear-gradient(90deg, var(--amber), #f5c169); color: #fff; }
    .inv-btn.extract { background: #fff; color: var(--green-dark); border: 2px solid var(--green); }

    /* Every color of one species, undiscovered ones dimmed - the collection's
       real goal, so a gap reads as "still to breed". Auto-fill rather than a
       fixed column count so it stays square on any phone width. */
    .color-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr));
      gap: 7px; margin-bottom: 12px;
    }
    .color-cell {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 7px 2px; border-radius: 12px; background: rgba(255,255,255,0.55);
      font-size: 9.5px; font-weight: 700; color: var(--text-dim); text-align: center;
    }
    .color-cell.missing { opacity: 0.26; filter: grayscale(70%); }
    /* .color-cell.slot (the journal page's own spots) is styled in the
       JOURNAL PANEL section below, as a taped-down scrapbook photo rather
       than a plain swatch. */

    /* Bookmarks along the top of the journal - one tab per species, so
       switching flower is one tap from anywhere instead of a trip back out to
       a contents page. The superscript is how many of that species you are
       holding, which is the thing you'd flip through looking for. */
    .journal-tabs { display: flex; gap: 4px; margin-bottom: 12px; }
    .journal-tab {
      position: relative; flex: 1 1 0; min-width: 0; padding: 7px 2px 6px; line-height: 0;
      border: 2px solid transparent; border-radius: 13px 13px 7px 7px;
      background: rgba(255,255,255,0.5); cursor: pointer;
    }
    .journal-tab.active { border-color: var(--green); background: #fff; box-shadow: var(--shadow-sm); }
    .journal-tab.blank { opacity: 0.4; }
    .journal-tab-count {
      position: absolute; top: -4px; right: -3px; min-width: 15px; padding: 0 3px;
      border-radius: 8px; background: var(--green); color: #fff;
      font-size: 9px; font-weight: 800; line-height: 15px; text-align: center;
    }
    .journal-caption { font-size: 11.5px; font-weight: 700; color: var(--text-dim); text-align: center; margin: 0 0 10px; }
    .journal-hint { font-size: 12px; color: var(--text-dim); text-align: center; margin: 0 0 4px; }
    /* One bordered block per color held, so a Red and a Purple of the same
       species never look like one interchangeable pile. */
    .inv-variant {
      border: 2px solid; border-radius: 14px; padding: 10px 13px 12px; margin-bottom: 10px;
    }
    .inv-variant-name { font-size: 14px; font-weight: 800; }
    .inv-variant .inv-stack-title:first-of-type { margin-top: 8px; }

    /* Crossing notes: one row per pairing tried, parents on the left and the
       results you've seen on the right. */
    .cross-list { display: flex; flex-direction: column; gap: 7px; max-height: 34vh; overflow-y: auto; }
    .cross-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      flex-wrap: wrap; padding: 9px 12px; border-radius: 12px; background: rgba(255,255,255,0.55);
      font-size: 12.5px; font-weight: 700;
    }
    .cross-parents { color: var(--text-dim); }
    .cross-results { display: flex; flex-wrap: wrap; gap: 8px; }
    .cross-result { white-space: nowrap; }
    .cross-dot {
      display: inline-block; width: 10px; height: 10px; border-radius: 50%;
      margin-right: 3px; vertical-align: -1px; border: 1px solid rgba(60,40,20,0.25);
    }
    .seed-pick-btn {
      display: flex; align-items: center; justify-content: space-between; width: 100%;
      padding: 13px 16px; border: 2px solid; border-radius: 14px; background: #fff;
      font-size: 14.5px; font-weight: 800; cursor: pointer;
    }
    .seed-pick-btn span:last-child { color: var(--text-dim); font-weight: 700; }
    #modal-body p:last-child { margin-bottom: 0; }
    #modal-ok-btn {
      display: block; width: 100%; padding: 14px; border: none; border-radius: 16px;
      font-size: 15px; font-weight: 800; cursor: pointer; color: #fff;
      background: linear-gradient(90deg, var(--green), var(--green-dark)); box-shadow: var(--shadow-sm);
    }

    /* ================= TOAST ================= */
    #toast-container {
      position: fixed; left: 0; right: 0; bottom: 92px; z-index: 1300;
      display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none;
    }
    .toast {
      background: rgba(40,35,25,0.92); color: #fff; font-size: 13px; font-weight: 600;
      padding: 10px 18px; border-radius: 999px; box-shadow: var(--shadow-sm);
      opacity: 0; transform: translateY(8px); transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* ================= ANIMATIONS ================= */
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    @keyframes sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
    .flourish-cluster { animation: sway 3.2s ease-in-out infinite; transform-origin: bottom center; }

    /* Wild flowers wear a soft halo so they read as "found" rather than
       "planted" at a glance, without needing a second marker shape. */
    @keyframes wild-pulse { 0%, 100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 0.9; transform: scale(1.12); } }
    .wild-glow { animation: wild-pulse 2.8s ease-in-out infinite; }

    /* Signature colors only (see COLORS `species`). These are drawn inside the
       flower's own SVG, so the same markup glows in a 26px bookmark and a
       110px map marker with no extra elements around it.

       Both base states are deliberately visible, not transparent: the global
       reduced-motion rule collapses every animation to 0.01ms and does not
       hold the final frame, so anything that starts at opacity 0 would simply
       vanish for those players. */
    @keyframes bloom-halo { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.9; } }
    @keyframes bloom-spark { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    .bloom-halo { opacity: 0.6; animation: bloom-halo 3.4s ease-in-out infinite; }
    .bloom-spark { opacity: 0.8; animation: bloom-spark 2.2s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important; animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

    <div id="growth-bar-label">&nbsp;</div>

    <button id="plant-action-btn">Water</button>
    <button id="breed-btn">Cross with a neighbour</button>
    <div id="harvest-row">
      <button id="keep-btn" class="harvest-btn keep-btn">Keep &#x1F33C;</button>
      <button id="sell-btn" class="harvest-btn sell-btn">Sell</button>
    </div>

  <div id="shop-panel">

    <div id="shop-basket">

        <div id="basket-petals">&#x1F338;&#x1F338;&#x1F338;&#x1F338;&#x1F338;</div>

  <div id="journal-panel">

    <div id="journal-sheet">

      <div id="journal-body"></div>
    </div>
  </div>

  <div id="modal-overlay">
    <div id="modal-card">
      <div id="modal-title">Welcome to Bloom</div>
      <div id="modal-body"></div>
      <button id="modal-ok-btn" onclick="closeModal()">Let's grow! &#x1F331;</button>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script>
    // =====================================================================
    //  BLOOM - a chill, walking-based gardening game.
    //  Plant seeds on foot, water them on your next walk, watch them grow.
    //  No score pressure and no failure state at all - flowers cannot die and
    //  are never taken away, so the only thing a long absence changes is how
    //  the garden looks. The whole point is a relaxed excuse to go outside.
    //
    //  Encoding note: every emoji below is written as a JS \u{...} escape
    //  (in script) or an HTML numeric entity &#x...; (in markup) rather than
    //  a raw UTF-8 glyph, so the file itself contains only ASCII bytes.
    // =====================================================================

    // ---------------------------------------------------------------------
    //  CONSTANTS
    // ---------------------------------------------------------------------
    var HOUR = 3600000;

    // Hex grid cell size - same ~20m scale used by the Porter game backbone,
    // a good balance between "walkable in a few minutes" and "not so tiny
    // that GPS jitter causes mis-taps".
    var CELL_LAT_DEG = 20 / 111111;
    var SQ3 = Math.sqrt(3);
    // Longitude degrees-per-meter shrink with latitude (cos(lat) factor), so
    // this is corrected once at first GPS lock and persisted - see onGpsLocked.
    var CELL_LNG_DEG = parseFloat(localStorage.getItem('bloom_cell_lng')) || CELL_LAT_DEG;

    var PLANT_RANGE_HEX = 2;   // how close (in hexes) you must be to plant or water
    // Visual-only radius for the glow circle around the player; derived from
    // the same hex lattice so it roughly matches the real (hex-distance)
    // interaction range without needing a second magic number.
    var RANGE_METERS = PLANT_RANGE_HEX * CELL_LAT_DEG * 111111 * SQ3;

    // Full water drains to empty over 2 days, at which point the flower starts
    // *looking* wilted. That is the entire consequence: wilting is cosmetic.
    // Plants cannot die and are never removed from the ground, so going away
    // for a fortnight costs you nothing but a droopy-looking garden and one
    // watering visit to perk it back up. A browser page can't send a reminder
    // notification, so any real penalty here would land as an unannounced loss
    // on a player who had no way to know it was coming - exactly the kind of
    // pressure this game is meant not to have.
    var WATER_DURATION_MS = 48 * HOUR;

    // Stages are advanced by WATERING, not by elapsed time. A plant becomes
    // "ready" STAGE_READY_MS after it was planted or last advanced, and the
    // next watering visit is what actually moves it up a stage - so a full
    // cluster costs three separate walks back, which is the entire point of
    // the game. (The old model accumulated growth purely from elapsed time,
    // which meant a plant reached a full cluster with zero watering visits
    // and the watering mechanic had no mechanical weight at all.)
    var STAGE_READY_MS = 12 * HOUR;
    var MAX_STAGE = 3;
    var STAGE_LABELS = ['Seed', 'Sprout', 'In Bloom', 'Flourishing'];
    // Indexed by the stage just reached; index 0 is unused (you never water
    // your way *into* being a seed).
    var GROWTH_MESSAGES = [
      '',
      'It sprouted! \u{1F331}',
      'It burst into bloom! \u{1F338}',
      'It flourished into a full cluster! \u{1F337}'
    ];

    // Every species is bought by name and every species is worth exactly the
    // same, so which flower you plant is a matter of taste rather than a
    // power decision. (The old common/rare/prized tiers made higher tiers
    // strictly dominant: growth time did not vary by tier, so once you could
    // afford the top one there was no reason to ever plant anything else,
    // and two thirds of the shop became dead content.)
    // Species is SHAPE, color is PAINT, and the two are deliberately
    // orthogonal: `shape` describes the flower's silhouette as rows of petals
    // and COLORS supplies every hex that gets painted into it. That split is
    // what makes cross-breeding possible at all - any color can be worn by any
    // species without a single new asset. Flowers used to be system emoji
    // glyphs on a tinted disc, which meant the "color" of a flower was baked
    // into a font we don't control: unrecolorable, and different on every
    // device. See flowerSVG() for how these rows are drawn.
    //
    // Rows are drawn outermost first. Each row: n petals of half-width rx and
    // half-height ry, centred r units out from the middle of a 100x100 box,
    // optionally rotated by `rot` degrees so a row interleaves with the one
    // outside it. `deep` paints the row a shade darker for depth; `tip` picks
    // the petal outline (round ellipse / pointed almond / notched heart).
    var SPECIES = [
      { key: 'sunflower', name: 'Sunflower', base: 'yellow',
        shape: { rows: [{ n: 16, rx: 6.5, ry: 20, r: 25, tip: 'point' },
                        { n: 16, rx: 5.5, ry: 14, r: 19, rot: 11.25, tip: 'point', deep: true }],
                 center: { r: 15, dots: 8 } } },
      { key: 'tulip', name: 'Tulip', base: 'red',
        shape: { rows: [{ n: 6, rx: 13, ry: 21, r: 19, tip: 'round' }],
                 center: { r: 7 } } },
      { key: 'daisy', name: 'Daisy', base: 'white',
        shape: { rows: [{ n: 16, rx: 4.5, ry: 21, r: 24, tip: 'round' }],
                 center: { r: 12 } } },
      { key: 'hibiscus', name: 'Hibiscus', base: 'red',
        shape: { rows: [{ n: 5, rx: 19, ry: 23, r: 19, tip: 'round' }],
                 center: { r: 6, stamen: true } } },
      { key: 'blossom', name: 'Blossom', base: 'white',
        shape: { rows: [{ n: 5, rx: 15, ry: 19, r: 20, tip: 'notch' }],
                 center: { r: 6, dots: 5 } } },
      { key: 'rose', name: 'Rose', base: 'red',
        shape: { rows: [{ n: 8, rx: 13, ry: 18, r: 22, tip: 'round' },
                        { n: 7, rx: 10, ry: 14, r: 15, rot: 26, tip: 'round', deep: true },
                        { n: 5, rx: 7.5, ry: 10, r: 8, rot: 14, tip: 'round', deep: true }],
                 center: { r: 4 } } },
      { key: 'lotus', name: 'Lotus', base: 'white',
        shape: { rows: [{ n: 8, rx: 8.5, ry: 24, r: 21, tip: 'point' },
                        { n: 8, rx: 7, ry: 17, r: 16, rot: 22.5, tip: 'point', deep: true }],
                 center: { r: 7 } } }
    ];
    function speciesFor(key) {
      for (var i = 0; i < SPECIES.length; i++) if (SPECIES[i].key === key) return SPECIES[i];
      return SPECIES[0];
    }

    // ---- Colors ----------------------------------------------------------
    // One palette shared by every species, so "red" means the same red on a
    // rose and on a lotus and the breeding table stays a single small table
    // rather than one per species.
    //
    // `tier` is breeding depth, not power: every color sells and grows exactly
    // the same, matching the flat economy above. Tier 0 are the STANDARDS -
    // the only colors the shop stocks and the only ones wild flowers come in -
    // and every other color has to be bred. Their six pairings produce the
    // six tier-1 colors, which is the whole entry-level table: four colors,
    // six pairs, six results, nothing to memorise from a wiki.
    //
    // Only `petal` and `center` are authored. Everything else (the darker
    // inner-row shade, the outline, the disc tint behind the flower) is
    // derived in resolveColors() so a new color is two hex values and cannot
    // drift out of step with itself.
    var COLORS = [
      { id: 'white',   name: 'White',   tier: 0, petal: '#fbfbf6', center: '#ffd45e' },
      { id: 'red',     name: 'Red',     tier: 0, petal: '#e03e52', center: '#ffd45e' },
      { id: 'yellow',  name: 'Yellow',  tier: 0, petal: '#ffcb3a', center: '#a06a22' },
      { id: 'blue',    name: 'Blue',    tier: 0, petal: '#4f86e8', center: '#ffe6a0' },
      { id: 'pink',    name: 'Pink',    tier: 1, petal: '#ff8ab4', center: '#ffe08a' },
      { id: 'orange',  name: 'Orange',  tier: 1, petal: '#ff8c3a', center: '#8a4715' },
      { id: 'purple',  name: 'Purple',  tier: 1, petal: '#9a63d8', center: '#ffe08a' },
      { id: 'green',   name: 'Green',   tier: 1, petal: '#5cb45f', center: '#f2f0c0' },
      { id: 'cream',   name: 'Cream',   tier: 1, petal: '#fff2c4', center: '#e0a83c' },
      { id: 'sky',     name: 'Sky',     tier: 1, petal: '#8ecff0', center: '#ffe6a0' },
      { id: 'magenta', name: 'Magenta', tier: 2, petal: '#d4359b', center: '#ffd45e' },
      { id: 'peach',   name: 'Peach',   tier: 2, petal: '#ffb184', center: '#b06a3a' },
      { id: 'black',   name: 'Midnight',tier: 2, petal: '#3b3648', center: '#b98ee8' },
      { id: 'gold',    name: 'Gold',    tier: 3, petal: '#e8a91c', center: '#fff3c2' },

      // ---- Signature colors ----------------------------------------------
      // Two per species, and the ONE place the species/color split is broken
      // on purpose. `species` locks a color to one shape: there is no such
      // thing as an Ember Daisy, and doBreed() enforces that rather than
      // trusting the breeding table to never produce one.
      //
      // They are the only colors with `grad` (a per-petal gradient, tip to
      // base), `glow` and `spark`, so the effect itself is the tell that you
      // are looking at something at the top of the tree. Tier 3, alongside
      // Gold, and reached only by crossing two of the same species - which is
      // what makes them feel like that flower's own color rather than another
      // entry in a shared palette.
      //
      // `petal` stays authored even though `grad` paints the petals: every
      // derived value (deep/edge/soft/ink/line) still comes from it, so the
      // legibility machinery needs no special case.
      { id: 'solaris',   name: 'Solaris',   tier: 3, species: 'sunflower',
        petal: '#ffb52e', center: '#6b3b0a', grad: ['#fff3b0', '#ffb52e', '#e06a12'],
        glow: '#ffcc4d', spark: '#fff2c0' },
      { id: 'eclipse',   name: 'Eclipse',   tier: 3, species: 'sunflower',
        petal: '#4a3f7a', center: '#ffd45e', grad: ['#8f7ad6', '#4a3f7a', '#1e1838'],
        glow: '#7a63c9', spark: '#ffe9a8' },
      { id: 'ember',     name: 'Ember',     tier: 3, species: 'tulip',
        petal: '#ff5a2e', center: '#ffb84d', grad: ['#ffd166', '#ff5a2e', '#a81c0c'],
        glow: '#ff7a3c', spark: '#ffd9a0' },
      { id: 'frost',     name: 'Frost',     tier: 3, species: 'tulip',
        petal: '#a8dcf0', center: '#dff4ff', grad: ['#ffffff', '#a8dcf0', '#4f8fb8'],
        glow: '#bfe9ff', spark: '#ffffff' },
      { id: 'moonlit',   name: 'Moonlit',   tier: 3, species: 'daisy',
        petal: '#c9d4f0', center: '#f2f4ff', grad: ['#ffffff', '#c9d4f0', '#7f8ec4'],
        glow: '#b9c8f5', spark: '#ffffff' },

    // stocks - so an old collection reads as "found the common one", never as
    // credit for a cross that was never bred. Merging is additive and keeps
    // the earliest firstAt, so nothing is lost if both keys somehow exist.
    function migrateInventory(inv) {
      if (!inv) return {};
      var out = {};
      Object.keys(inv).forEach(function (k) {
        var e = inv[k];
        if (typeof e.count === 'number' && typeof e.single !== 'number') {
          e.single = e.count;
          delete e.count;
        }
        if (typeof e.single !== 'number') e.single = 0;
        if (typeof e.cluster !== 'number') e.cluster = 0;
        if (!e.firstAt) e.firstAt = Date.now();

        var vk = k.indexOf(':') >= 0 ? k : variantKey(k, baseColorOf(k));
        var prev = out[vk];
        if (!prev) { out[vk] = e; return; }
        prev.single += e.single;
        prev.cluster += e.cluster;
        prev.firstAt = Math.min(prev.firstAt, e.firstAt);
      });
      return out;
    }

    function loadState() {
      var def = {
        plants: {},
        wild: {},            // hex key -> wild flower, scattered daily
        lastWildDay: null,   // local YYYY-MM-DD of the last spawn
        // hex key -> 1, every hex ever within planting range of the player.
        // Never shrinks - once a spot has been reachable it stays a priority
        // for wild spawning even if the player never goes back. See
        // markAccessible() and pickWildSpots().
        visited: {},
        // species key -> { single, cluster, firstAt }: the flowers you chose to
        // Keep, split by what they were when picked, since a cluster extracts
        // into more seeds than a single bloom. An entry is never deleted once
        // created - a species you've emptied still reads as discovered, so the
        // collection stays a record of what you've found, not just what's in
        // hand right now.
        inventory: {},
        // Crossings you have actually performed: pair key -> { colorId: count }.
        // This is the player's own notebook, not the recipe table - the Notes
        // screen only ever shows results you have seen yourself.
        crosses: {},
        // No `lost` counter - plants cannot die, so nothing is ever lost.
        stats: { planted: 0, bloomed: 0, flourished: 0, kept: 0, sold: 0, earned: 0,
                 extracted: 0, bred: 0 },
        seeds: starterSeeds(),
        fertilizer: 0,
        currency: 0,
        following: true,
        seenWelcome: false,
        tutorialDone: false // brand-new save -> the onboarding tutorial should run
      };
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return def;
      try {
        var parsed = JSON.parse(raw);
        var plants = parsed.plants || {};
        var migrateNow = Date.now();
        Object.keys(plants).forEach(function (k) { migratePlant(plants[k], migrateNow); });
        // Wild flowers predating colors get a standard color too - picked from
        // the species base rather than at random so the same flower doesn't
        // change color between two page loads.
        var wild = parsed.wild || {};
        Object.keys(wild).forEach(function (k) {
          if (!wild[k].color) wild[k].color = baseColorOf(wild[k].species);
        });
        return {
          plants: plants,
          wild: wild,
          lastWildDay: parsed.lastWildDay || null,
          visited: parsed.visited || {},
          inventory: migrateInventory(parsed.inventory),
          crosses: parsed.crosses || {},
          stats: Object.assign({}, def.stats, parsed.stats || {}),
          // A save that predates seeds/currency (v1.1.x) gets starter seeds
          // bootstrapped in rather than being left unable to plant anything -
          // the old free-plant mechanic this replaces never cost seeds. A
          // v1.2-v1.7 save gets its tier counts converted to species counts.
          seeds: migrateSeeds(parsed.seeds),
          fertilizer: typeof parsed.fertilizer === 'number' ? parsed.fertilizer : 0,
          currency: typeof parsed.currency === 'number' ? parsed.currency : 0,
          following: parsed.following !== false,
          seenWelcome: !!parsed.seenWelcome,
          // Any save that already exists predates the tutorial - never
          // interrupt an already-playing garden with onboarding.
          tutorialDone: typeof parsed.tutorialDone === 'boolean' ? parsed.tutorialDone : true
        };
      } catch (e) {
        return def; // corrupted save falls back to defaults rather than breaking load
      }
    }

    var state = loadState();
    state.userPos = null; // runtime-only, never persisted

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        plants: state.plants, wild: state.wild, lastWildDay: state.lastWildDay,
        visited: state.visited,
        inventory: state.inventory, crosses: state.crosses, stats: state.stats,
        seeds: state.seeds, fertilizer: state.fertilizer, currency: state.currency,
        following: state.following, seenWelcome: state.seenWelcome, tutorialDone: state.tutorialDone
      }));
    }

    // ---------------------------------------------------------------------
    //  HEX MATH (flat-top axial, same shape as the Porter backbone)
    // ---------------------------------------------------------------------
    function hexRound(qf, rf) {
      var sf = -qf - rf;
      var q = Math.round(qf), r = Math.round(rf), s = Math.round(sf);
      var dq = Math.abs(q - qf), dr = Math.abs(r - rf), ds = Math.abs(s - sf);
      if (dq > dr && dq > ds) q = -r - s;
      else if (dr > ds) r = -q - s;
      return { q: q, r: r };
    }
    function latLngToHex(lat, lng) {
      var nx = lng / CELL_LNG_DEG, ny = lat / CELL_LAT_DEG;
      return hexRound(2 / 3 * nx, -1 / 3 * nx + SQ3 / 3 * ny);
    }
    function hexCenter(q, r) {
      return { lat: (SQ3 / 2 * q + SQ3 * r) * CELL_LAT_DEG, lng: (3 / 2 * q) * CELL_LNG_DEG };
    }
    function hexKey(q, r) { return q + ',' + r; }
    function hexDist(q1, r1, q2, r2) {
      var dq = q1 - q2, dr = r1 - r2;
      return (Math.abs(dq) + Math.abs(dr) + Math.abs(dq + dr)) / 2;
    }

    // Same six directions Porter uses, paired with hexVerticesPx's edge index
    // (edge `e`, between vertices e and e+1, borders the neighbor at HEX_NEIGHBORS[e]).
    var HEX_NEIGHBORS = [[1, 0], [0, 1], [-1, 1], [-1, 0], [0, -1], [1, -1]];

    // Six corner points (in Leaflet layer-point space) of the hex at (q, r),
    // used only by the grid-mesh renderer below - plant markers are placed by
    // lat/lng center (hexCenter), not by these pixel vertices.
    function hexVerticesPx(q, r) {
      var verts = [];
      for (var i = 0; i < 6; i++) {
        var angle = Math.PI / 3 * i;
        var lat = (SQ3 / 2 * q + SQ3 * r + Math.sin(angle)) * CELL_LAT_DEG;
        var lng = (3 / 2 * q + Math.cos(angle)) * CELL_LNG_DEG;
        verts.push(map.latLngToLayerPoint([lat, lng]));
      }
      return verts;
    }
    // Cheap cull against gridRenderer's own (padded) bounds, in layer points.
    function hexOnScreen(verts) {
      var b = gridRenderer && gridRenderer._bounds;
      if (!b) return true;
      return verts.some(function (v) {
        return v.x >= b.min.x - 4 && v.x <= b.max.x + 4 && v.y >= b.min.y - 4 && v.y <= b.max.y + 4;
      });
    }

    // ---------------------------------------------------------------------
    //  GROWTH ENGINE
    //  Fully timestamp-derived so it stays correct across long offline gaps
    //  (the whole point of the game is that you walk away for hours/days).
    // ---------------------------------------------------------------------
    // Derives a plant's display state as of `now`. Purely a read - every stored
    // field it looks at (lastWateredAt, stage, readyAt) is only ever written by
    // an actual player action, so this is safe to call from render paths as
    // often as you like and can never advance the game on its own.
    //
    // `ready` is the whole loop: a plant that has finished its STAGE_READY_MS
    // wait is waiting on a real watering visit to move up a stage. Both
    // readiness and stage are entirely independent of `wilted`, which is now
    // purely a look - a wilted plant grows exactly as well as a lush one, so
    // neglect never costs progress, only appearances.
    function recomputePlant(p, now) {
      var d = {
        wilted: (now - p.lastWateredAt) >= WATER_DURATION_MS,
        stage: p.stage,
        ready: p.stage < MAX_STAGE && now >= p.readyAt,
        readyIn: Math.max(0, p.readyAt - now)
      };
      p._d = d;
      return d;
    }

    // Consumes one seed of the given species from inventory and plants exactly
    // that flower - no randomness, you get what you chose. Callers are expected
    // to have already confirmed a seed of this species is actually owned (see
    // attemptPlant/openSeedPicker) - this only re-checks defensively, it
    // doesn't surface its own error UI. Returns the new plant's hex key, or
    // null if there was no seed to spend.
    // Takes a variant key ("tulip:red"), not a bare species - a seed is a
    // species and a color, and planting spends exactly the one chosen.
    function plantSeedAt(q, r, vk) {
      if (!(state.seeds[vk] > 0)) return null;
      state.seeds[vk]--;
      if (state.seeds[vk] <= 0) delete state.seeds[vk]; // keep the pouch tidy

      var now = Date.now();
      var v = parseVariant(vk);
      var c = hexCenter(q, r);
      var key = hexKey(q, r);
      state.plants[key] = {
        q: q, r: r, lat: c.lat, lng: c.lng, species: v.species, color: v.color,
        plantedAt: now, lastWateredAt: now, stage: 0, readyAt: now + STAGE_READY_MS,
        reachedBloom: false, reachedFlourish: false
      };
      state.stats.planted++;
      saveState();
      renderPlants();
      updateHUD();
      toast('\u{1F331} ' + variantName(vk) + ' planted! It will be ready for water in ' +
        formatDuration(STAGE_READY_MS) + '.');
      vibrate(20);
      tutorialOnPlant(key);
      return key;
    }

    // Decides how to plant on an empty, in-range hex: always confirms via the
    // seed-tier picker first (even with only one tier owned) so a stray tap
    // on the map never silently spends a seed - points at the shop instead
    // when there's nothing to plant.
    function attemptPlant(q, r) {
      var owned = sortVariants(Object.keys(state.seeds).filter(function (vk) {
        return state.seeds[vk] > 0;
      })).map(function (vk) { return { vk: vk, count: state.seeds[vk] }; });
      if (owned.length === 0) { toast("You're out of seeds - open the Shop \u{1F338} to buy more"); return; }
      openSeedPicker(q, r, owned);
    }

    // Watering is always allowed in range and always refills the tank (which
    // resets the wilt/death clock), but it only advances a stage if the plant
    // has finished its readiness wait - that separation is what makes each
    // stage cost its own walk back without ever making a tap feel wasted.
    // Bloom/flourish milestones are credited here, at the moment they actually
    // happen, rather than being swept up later by tickPlants.
    function waterPlant(key) {
      var p = state.plants[key];
      if (!p) return;
      var now = Date.now();
      var grew = p.stage < MAX_STAGE && now >= p.readyAt;

      p.lastWateredAt = now;
      var revealed = null;
      if (grew) {
        p.stage++;
        p.readyAt = now + STAGE_READY_MS;
        if (p.stage >= 2 && !p.reachedBloom) { p.reachedBloom = true; state.stats.bloomed++; }
        if (p.stage >= 3 && !p.reachedFlourish) { p.reachedFlourish = true; state.stats.flourished++; }
        // A bred seedling opening is the payoff of the whole crossing loop, so
        // it gets its own message instead of the generic "burst into bloom".
        if (p.mystery && p.stage >= 2) {
          delete p.mystery;
          revealed = variantKey(p.species, colorOfPlant(p));
        }
      }

      recomputePlant(p, now);   // refresh derived state for immediate UI feedback
      saveState();
      renderPlants();
      if (viewingKey === key) renderPlantPanel(key);
      updateHUD();

      if (revealed) {
        toast('\u{1F338} Your cross opened - it\'s a ' + variantName(revealed) + '!');
      } else if (grew) {
        toast('\u{1F4A7} ' + GROWTH_MESSAGES[p.stage]);
      } else if (p.stage >= MAX_STAGE) {
        toast('\u{1F4A7} Watered! It is fully grown - Keep it or Sell it whenever you like.');
      } else {
        toast('\u{1F4A7} Watered! Ready to grow again in ' + formatDuration(p.readyAt - now) + '.');
      }
      vibrate(grew ? 30 : 15);
      tutorialOnWater(key);
    }

    // Records a kept flower against its species. A Keep used to only bump a
    // running total, so the flower vanished off the map leaving no trace of
    // what it had been - this is what makes Keep a real choice rather than a
    // discard, and what the collection screen lists.
    function addToInventory(vk, isCluster) {
      var e = state.inventory[vk];
      if (!e) e = state.inventory[vk] = { single: 0, cluster: 0, firstAt: Date.now() };
      if (isCluster) e.cluster++; else e.single++;
    }

    // Picks a fully-grown plant (single bloom or flourishing cluster) whether
    // to Keep (into your collection, no currency) or Sell (clears the hex for
    // Petals via harvestValue). Either way the hex frees up for replanting -
    // "harvesting" always removes the plant from the ground.
    function harvestPlant(key, sell) {
      var p = state.plants[key];
      if (!p) return;
      var d = recomputePlant(p, Date.now());
      var vk = variantKey(p.species, p.color || baseColorOf(p.species));
      var label = variantName(vk) + (d.stage >= 3 ? ' cluster' : '');
      delete state.plants[key];

      if (sell) {
        var val = harvestValue(p, d.stage);
        state.currency += val;
        state.stats.sold++;
        state.stats.earned += val;
        toast('Sold your ' + label + ' for ' + val + ' \u{1F338}');
      } else {
        state.stats.kept++;
        addToInventory(vk, d.stage >= MAX_STAGE);
        toast('Kept your ' + label + ' \u{1F33C} - it\'s in your collection');
      }

      saveState();
      renderPlants();
      updateHUD();
      updateCurrencyPill();
      closePlantPanel();
      vibrate(20);
      return sell ? harvestValue(p, d.stage) : 0; // used by the tutorial's bonus top-up
    }

    // Runs on load and every minute purely to refresh derived state, so the
    // HUD and map markers notice a plant crossing into ready or wilted. It
    // never changes a plant: stage advancement and milestone credit live in
    // waterPlant, and nothing removes a plant from the ground but harvesting.
    function tickPlants() {
      var now = Date.now();
      Object.keys(state.plants).forEach(function (key) { recomputePlant(state.plants[key], now); });

      // Wild flowers run on their own short clock and are the one thing in the
      // game that can be lost by leaving it - 12h to wilt, 18h to vanish.
      var vanished = 0;
      Object.keys(state.wild).forEach(function (key) {
        if (wildDerived(state.wild[key], now).gone) { delete state.wild[key]; vanished++; }
      });
      if (vanished > 0) saveState();

      renderPlants();
      renderWild();
      updateHUD();
      if (viewingKey) renderPlantPanel(viewingKey);
    }

    // ---------------------------------------------------------------------
    //  WILD FLOWERS
    //  Spawned once per local calendar day along real OSM paths. See the
    //  WILD_* constants above for the placement rules and the privacy note.
    // ---------------------------------------------------------------------
    // Local calendar day, not UTC - "the first time you open it each day"
    // should mean the player's day, so the roll-over happens at their midnight.
    function localDayKey(d) {
      d = d || new Date();
      var m = d.getMonth() + 1, day = d.getDate();
      return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
    }

    // How far through its short life a wild flower is. Entirely derived from
    // spawnedAt, so - like the plant growth engine - it stays correct across
    // however long the page was closed.
    function wildDerived(w, now) {
      var age = now - w.spawnedAt;
      return {
        wilted: age >= WILD_WILT_MS,
        gone: age >= WILD_GONE_MS,
        goneIn: Math.max(0, WILD_GONE_MS - age),
        lifeFrac: Math.max(0, Math.min(1, 1 - age / WILD_GONE_MS))
      };
    }

    // Records every hex within planting range of (q, r) as "accessible" - a
    // spot the player was actually able to stand close enough to plant at,
    // at least once. pickWildSpots draws from this pool first, so the wild
    // crop gravitates toward ground that's proven reachable instead of a
    // uniformly random disc that doesn't know about lakes, rooftops, or
    // fenced yards. Persisted forever (once reachable, always a priority),
    // and cheap: only newly-seen hexes trigger a save, so retracing the same
    // streets costs nothing after the first pass.
    function markAccessible(q, r) {
      var added = false;
      for (var dq = -PLANT_RANGE_HEX; dq <= PLANT_RANGE_HEX; dq++) {
        var rMin = Math.max(-PLANT_RANGE_HEX, -dq - PLANT_RANGE_HEX);
        var rMax = Math.min(PLANT_RANGE_HEX, -dq + PLANT_RANGE_HEX);
        for (var dr = rMin; dr <= rMax; dr++) {
          var key = hexKey(q + dq, r + dr);
          if (!state.visited[key]) { state.visited[key] = 1; added = true; }
        }
      }
      if (added) saveState();
    }

    // Priority + rejection sampling. First fills from state.visited - hexes
    // proven reachable before, within WILD_SPAWN_RADIUS_M and shuffled so the
    // same handful near home don't always win - then, if that pool can't
    // cover `needed` (a fresh save, or a walk into brand-new territory),
    // falls back to throwing darts at the disc around the player like
    // before. Either way, a spot only survives if it's at least
    // WILD_MIN_HEX_GAP hexes from every existing wild flower, every plant
    // the player owns, and every spot already chosen in this same pass.
    // Capped attempts on the fallback, so a garden so dense that nothing
    // fits simply yields fewer flowers instead of spinning.
    function pickWildSpots(needed) {
      if (!state.userPos) return [];
      var avoid = [];
      Object.keys(state.wild).forEach(function (k) { avoid.push(state.wild[k]); });
      Object.keys(state.plants).forEach(function (k) { avoid.push(state.plants[k]); });

      var origin = state.userPos;
      var lngScale = 111111 * Math.cos(origin.lat * Math.PI / 180);
      var chosen = [];

      var visitedCandidates = [];
      Object.keys(state.visited).forEach(function (k) {
        var parts = k.split(','), q = +parts[0], r = +parts[1];
        var c = hexCenter(q, r);
        if (metersBetween(origin, c) <= WILD_SPAWN_RADIUS_M) visitedCandidates.push({ q: q, r: r });
      });
      // Fisher-Yates - an unshuffled visited list would always favor the
      // earliest-discovered hexes over ground found more recently.
      for (var i = visitedCandidates.length - 1; i > 0; i--) {
        var j0 = Math.floor(Math.random() * (i + 1));
        var tmp = visitedCandidates[i]; visitedCandidates[i] = visitedCandidates[j0]; visitedCandidates[j0] = tmp;
      }
      for (var vi = 0; vi < visitedCandidates.length && chosen.length < needed; vi++) {
        var vh = visitedCandidates[vi];
        var vok = true;
        for (var vj = 0; vj < avoid.length; vj++) {
          if (hexDist(vh.q, vh.r, avoid[vj].q, avoid[vj].r) < WILD_MIN_HEX_GAP) { vok = false; break; }
        }
        if (!vok) continue;
        chosen.push(vh);
        avoid.push(vh);
      }

      var attempts = needed * 200;
      for (var a = 0; a < attempts && chosen.length < needed; a++) {
        // sqrt of a uniform gives an even spread over the disc's *area*;
        // without it everything bunches towards the player.
        var ang = Math.random() * Math.PI * 2;
        var dist = Math.sqrt(Math.random()) * WILD_SPAWN_RADIUS_M;
        var h = latLngToHex(
          origin.lat + (dist * Math.cos(ang)) / 111111,
          origin.lng + (dist * Math.sin(ang)) / lngScale
        );
        var ok = true;
        for (var j = 0; j < avoid.length; j++) {
          if (hexDist(h.q, h.r, avoid[j].q, avoid[j].r) < WILD_MIN_HEX_GAP) { ok = false; break; }
        }
        if (!ok) continue;
        chosen.push(h);
        avoid.push(h);
      }
      return chosen;
    }

    // Straight-line metres and a rough compass point, used by the Wild Flowers
    // screen so "nothing appeared" can always be told apart from "it appeared
    // 600m north of you". Equirectangular is plenty at sub-kilometre scale.
    function metersBetween(a, b) {
      var dLat = (b.lat - a.lat) * 111111;
      var dLng = (b.lng - a.lng) * 111111 * Math.cos(a.lat * Math.PI / 180);
      return Math.sqrt(dLat * dLat + dLng * dLng);
    }
    function compassLabel(from, to) {
      var dLat = to.lat - from.lat;
      var dLng = (to.lng - from.lng) * Math.cos(from.lat * Math.PI / 180);
      var ang = (Math.atan2(dLng, dLat) * 180 / Math.PI + 360) % 360;
      return ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][Math.round(ang / 45) % 8];
    }
    function nearestWild() {
      if (!state.userPos) return null;
      var best = null;
      Object.keys(state.wild).forEach(function (k) {
        var w = state.wild[k];
        var dist = metersBetween(state.userPos, w);
        if (!best || dist < best.dist) {
          best = { key: k, w: w, dist: dist, dir: compassLabel(state.userPos, w) };
        }
      });
      return best;
    }

    // Plain-language account of what the last spawn did, shown on the Wild
    // Flowers screen. Runtime-only. Most of a crop lands off-screen by design,
    // so without this a successful spawn and a skipped one look identical.
    var wildStatus = 'No crop scattered yet this session.';

    // Called once per session after the GPS locks. Now entirely local and
    // synchronous - no network, so the only way to come up short is a garden
    // too crowded to fit anything.
    function maybeSpawnWild() {
      var today = localDayKey();
      if (!state.userPos) { wildStatus = 'Waiting for GPS.'; return; }
      if (state.lastWildDay === today) {
        wildStatus = 'Today\'s crop has already been scattered. More tomorrow.';
        return;
      }

      var needed = WILD_MAX - Object.keys(state.wild).length;
      if (needed <= 0) {
        state.lastWildDay = today;
        wildStatus = 'The map is already full at ' + WILD_MAX + '. Pick some to make room.';
        saveState();
        return;
      }

      var spots = pickWildSpots(needed);
      spots.forEach(function (h) {
        var c = hexCenter(h.q, h.r);
        var sp = SPECIES[Math.floor(Math.random() * SPECIES.length)];
        // Wild flowers only ever come in the standard colors. Everything past
        // tier 0 has to be bred, so a walk can never hand you what breeding is
        // supposed to be for.
        var col = STANDARD_COLORS[Math.floor(Math.random() * STANDARD_COLORS.length)];
        state.wild[hexKey(h.q, h.r)] = {
          q: h.q, r: h.r, lat: c.lat, lng: c.lng, species: sp.key, color: col,
          stage: 2, spawnedAt: Date.now()
        };
      });

      state.lastWildDay = today;
      saveState();
      renderWild();
      updateHUD();

      if (spots.length > 0) {
        var near = nearestWild();
        wildStatus = spots.length + ' scattered within ' + WILD_SPAWN_RADIUS_M +
          'm. They wilt after ' + (WILD_WILT_MS / HOUR) + 'h and are gone by ' + (WILD_GONE_MS / HOUR) + 'h.';
        // Lead with the distance to the closest one - most of the crop lands
        // off-screen, so otherwise this announces blooms against a map that
        // looks completely unchanged.
        toast('\u{1F33C} ' + spots.length + ' wild ' + (spots.length === 1 ? 'flower' : 'flowers') +
          ' bloomed nearby' + (near ? ' - nearest is ' + Math.round(near.dist) + 'm ' + near.dir : '') + '!');
        vibrate(25);
      } else {
        wildStatus = 'Nowhere free to scatter any - your flowers cover the area.';
      }
    }

    // ---------------------------------------------------------------------
    //  VISUALS
    // ---------------------------------------------------------------------
    // ---- Flower artwork --------------------------------------------------
    // Flowers are drawn as inline SVG built here at runtime, not as emoji or
    // image files. That is what makes an arbitrary color wearable by an
    // arbitrary species: shape comes from species.shape, every fill comes from
    // the color, and the two never have to know about each other. It also
    // keeps the game a single dependency-free file and makes a flower look the
    // same on every device, which emoji never did.
    //
    // Everything is authored in a 100x100 viewBox and scaled by the caller, so
    // one definition serves an 18px inline chip and a 110px zoomed-in marker.
    var PETAL_STROKE = 2.2;  // viewBox units, so it scales with the flower

    // A petal centred `r` units above the middle, then rotated into place.
    function petalShape(row, cy, fill, edge, angle) {
      var rx = row.rx, ry = row.ry;
      var common = ' fill="' + fill + '" stroke="' + edge + '" stroke-width="' + PETAL_STROKE +
        '" stroke-linejoin="round" transform="rotate(' + angle.toFixed(2) + ' 50 50)"/>';
      if (row.tip === 'round') {
        return '<ellipse cx="50" cy="' + cy.toFixed(2) + '" rx="' + rx + '" ry="' + ry + '"' + common;
      }
      var top = cy - ry, bot = cy + ry;
      if (row.tip === 'notch') {
        // Heart-shaped petal: two lobes at the tip with a dip between them.
        return '<path d="M50 ' + (top + ry * 0.42).toFixed(2) +
          ' L' + (50 - rx * 0.55).toFixed(2) + ' ' + top.toFixed(2) +
          ' C' + (50 - rx).toFixed(2) + ' ' + (top + ry * 0.75).toFixed(2) +
          ' ' + (50 - rx).toFixed(2) + ' ' + (bot - ry * 0.35).toFixed(2) +
          ' 50 ' + bot.toFixed(2) +
          ' C' + (50 + rx).toFixed(2) + ' ' + (bot - ry * 0.35).toFixed(2) +
          ' ' + (50 + rx).toFixed(2) + ' ' + (top + ry * 0.75).toFixed(2) +
          ' ' + (50 + rx * 0.55).toFixed(2) + ' ' + top.toFixed(2) + ' Z"' + common;
      }
      // 'point' - an almond, tapered at both ends.
      return '<path d="M50 ' + top.toFixed(2) +
        ' C' + (50 + rx).toFixed(2) + ' ' + (top + ry * 0.55).toFixed(2) +
        ' ' + (50 + rx).toFixed(2) + ' ' + (bot - ry * 0.45).toFixed(2) +
        ' 50 ' + bot.toFixed(2) +
        ' C' + (50 - rx).toFixed(2) + ' ' + (bot - ry * 0.45).toFixed(2) +
        ' ' + (50 - rx).toFixed(2) + ' ' + (top + ry * 0.55).toFixed(2) +
        ' 50 ' + top.toFixed(2) + ' Z"' + common;
    }

    // Icons are rebuilt on every zoomend and every 60s tick, and a rose is 20
    // petals of path maths, so the finished markup is memoised. Species and
    // colors are both static, so the key is complete.
    // Gradient/halo/spark markup for a signature color, or '' for the rest.
    //
    // The gradient ids are deterministic (`pg-<colorid>`), so the same id
    // appears in every copy of that flower on screen at once. That is safe
    // *because* it is deterministic: every element carrying a given id has
    // byte-identical contents, so whichever one the browser resolves
    // url(#pg-ember) against paints the same thing, and each <svg> carries
    // its own copy so a reference can never be left dangling. Unique ids per
    // instance would defeat the memo cache below for no gain.
    function fancyDefs(color) {
      if (!color.grad) return '';
      var g = color.grad;
      // objectBoundingBox units (the default), so the axis is each petal's own
      // box - and since petals are drawn pointing up and then rotated, the
      // gradient rotates with them: light at every tip, deep at every base.
      return '<defs>' +
        '<linearGradient id="pg-' + color.id + '" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0" stop-color="' + g[0] + '"/>' +
        '<stop offset="0.55" stop-color="' + g[1] + '"/>' +
        '<stop offset="1" stop-color="' + g[2] + '"/></linearGradient>' +
        '<linearGradient id="pgd-' + color.id + '" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0" stop-color="' + shadeHex(g[0], 0.88) + '"/>' +
        '<stop offset="0.55" stop-color="' + shadeHex(g[1], 0.86) + '"/>' +
        '<stop offset="1" stop-color="' + shadeHex(g[2], 0.86) + '"/></linearGradient>' +
        '<radialGradient id="hg-' + color.id + '">' +
        '<stop offset="0.35" stop-color="' + color.glow + '" stop-opacity="0.75"/>' +
        '<stop offset="0.7" stop-color="' + color.glow + '" stop-opacity="0.28"/>' +
        '<stop offset="1" stop-color="' + color.glow + '" stop-opacity="0"/>' +
        '</radialGradient></defs>';
    }
    // Six motes on a ring outside the petals, twinkling out of phase. Fixed
    // positions rather than a particle simulation: this markup is memoised and
    // re-injected on every zoom, so it has to stay a pure function of the
    // color, and CSS does the moving.
    var SPARK_COUNT = 6;
    function sparkMarkup(color) {
      if (!color.spark) return '';
      var out = '';
      for (var i = 0; i < SPARK_COUNT; i++) {
        var a = (Math.PI * 2 / SPARK_COUNT) * i - Math.PI / 2;
        var rr = i % 2 ? 47 : 41;
        out += '<circle class="bloom-spark" cx="' + (50 + Math.cos(a) * rr).toFixed(2) +
          '" cy="' + (50 + Math.sin(a) * rr).toFixed(2) + '" r="' + (i % 2 ? 1.9 : 2.7) +
          '" fill="' + color.spark + '" style="animation-delay:' + (i * 0.37).toFixed(2) + 's"/>';
      }
      return out;
    }

    var flowerSvgCache = {};
    function flowerSVG(species, color, px) {
      var ck = species.key + '|' + color.id + '|' + px;
      if (flowerSvgCache[ck]) return flowerSvgCache[ck];

      var sh = species.shape, out = fancyDefs(color);
      if (color.glow) {
        out += '<circle class="bloom-halo" cx="50" cy="50" r="49" fill="url(#hg-' +
          color.id + ')"/>';
      }
      sh.rows.forEach(function (row) {
        var fill = color.grad
          ? 'url(#' + (row.deep ? 'pgd-' : 'pg-') + color.id + ')'
          : (row.deep ? color.deep : color.petal);
        var cy = 50 - row.r;
        for (var i = 0; i < row.n; i++) {
          out += petalShape(row, cy, fill, color.edge, (360 / row.n) * i + (row.rot || 0));
        }
      });

      var c = sh.center;
      out += '<circle cx="50" cy="50" r="' + c.r + '" fill="' + color.center +
        '" stroke="' + color.edge + '" stroke-width="' + PETAL_STROKE + '"/>';
      if (c.dots) {
        // Speckled disc florets - what separates a sunflower/blossom eye from
        // a plain dot at map scale.
        for (var d = 0; d < c.dots; d++) {
          var a = (Math.PI * 2 / c.dots) * d, rr = c.r * 0.5;
          out += '<circle cx="' + (50 + Math.cos(a) * rr).toFixed(2) + '" cy="' +
            (50 + Math.sin(a) * rr).toFixed(2) + '" r="' + (c.r * 0.22).toFixed(2) +
            '" fill="' + shadeHex(color.center, 0.7) + '"/>';
        }
      }
      if (c.stamen) {
        out += '<path d="M50 50 L50 ' + (50 - c.r * 3.2).toFixed(2) + '" stroke="' + color.center +
          '" stroke-width="2.4" stroke-linecap="round"/>' +
          '<circle cx="50" cy="' + (50 - c.r * 3.2).toFixed(2) + '" r="' + (c.r * 0.7).toFixed(2) +
          '" fill="' + color.center + '"/>';
      }

      // Sparks go last so they sit above the petals rather than behind them.
      out += sparkMarkup(color);

      var svg = '<svg viewBox="0 0 100 100" width="' + px + '" height="' + px +
        '" style="display:block">' + out + '</svg>';
      flowerSvgCache[ck] = svg;
      return svg;
    }

    function seedSVG(px) {
      return '<svg viewBox="0 0 100 100" width="' + px + '" height="' + px + '" style="display:block">' +
        '<ellipse cx="50" cy="54" rx="26" ry="32" fill="#a9773f" stroke="#7d5628" stroke-width="3"/>' +
        '<path d="M50 24 C45 40 45 52 50 68" stroke="#7d5628" stroke-width="3" fill="none"/>' +
        '<ellipse cx="41" cy="42" rx="7" ry="10" fill="#d8b184" opacity="0.75" ' +
        'transform="rotate(-22 41 42)"/></svg>';
    }

    function sproutSVG(px) {
      return '<svg viewBox="0 0 100 100" width="' + px + '" height="' + px + '" style="display:block">' +
        '<path d="M50 86 C50 64 50 50 50 32" stroke="#4e8b3f" stroke-width="6" fill="none" ' +
        'stroke-linecap="round"/>' +
        '<ellipse cx="31" cy="52" rx="18" ry="11" fill="#7cc45f" stroke="#4e8b3f" stroke-width="2.6" ' +
        'transform="rotate(-26 31 52)"/>' +
        '<ellipse cx="69" cy="62" rx="16" ry="10" fill="#66b04d" stroke="#4e8b3f" stroke-width="2.6" ' +
        'transform="rotate(24 69 62)"/></svg>';
    }

    // The round backing every stage sits on. It is what makes a marker legible
    // against an arbitrary patch of basemap; the flower itself only has to be
    // a flower.
    function discStyle(bg, size) {
      return 'background:' + bg + ';border:2px solid rgba(255,255,255,0.85);border-radius:50%;width:' +
        size + 'px;height:' + size + 'px;display:flex;align-items:center;justify-content:center;' +
        'box-shadow:0 2px 8px rgba(60,40,20,0.3);flex-shrink:0;overflow:hidden';
    }

    // Builds the "look" for a plant at a given stage/size and returns its
    // rendered box dimensions so callers (map marker vs. big panel preview)
    // can size their container to match exactly.
    function buildPlantVisual(species, color, stage, wilted, base) {
      var wiltFilter = wilted ? 'filter:grayscale(55%) opacity(0.7);' : '';
      function dot(size) {
        return '<div style="' + discStyle(color.soft, size) + '">' +
          flowerSVG(species, color, Math.round(size * 0.94)) + '</div>';
      }
      var html, w, h;
      if (stage === 0) {
        w = h = Math.round(base * 0.5);
        html = '<div style="' + wiltFilter + discStyle('#e6cfa8', w) + '">' +
          seedSVG(Math.round(w * 0.72)) + '</div>';
      } else if (stage === 1) {
        w = h = Math.round(base * 0.55);
        html = '<div style="' + wiltFilter + discStyle('#d8ecc4', w) + '">' +
          sproutSVG(Math.round(w * 0.82)) + '</div>';
      } else if (stage === 2) {
        w = h = Math.round(base * 0.85);
        html = '<div style="' + wiltFilter + '">' + dot(w) + '</div>';
      } else {
        var ds = Math.round(base * 0.5), gap = Math.max(2, Math.round(base * 0.04));
        w = 2 * ds + gap; h = 2 * ds + gap;
        html = '<div class="flourish-cluster" style="' + wiltFilter + 'display:flex;flex-direction:column;' +
          'gap:' + gap + 'px;align-items:center"><div style="display:flex;gap:' + gap + 'px">' +
          dot(ds) + dot(ds) + '</div>' + dot(ds) + '</div>';
      }
      return { html: html, w: w, h: h };
    }
