<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>BLOOM</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <style>
    :root {
      --hud-top-h: 74px;
      --bg: #eaf6ee;
      --panel-bg: rgba(255,255,255,0.94);
      --panel-border: rgba(60,40,20,0.08);
      --text: #332e28;
      --text-dim: #8a8478;
      --green: #4caf6d;
      --green-dark: #3d8f57;
      --blue: #4aa3ff;
      --pink: #ff6fa0;
      --amber: #f0a93a;
      --shadow: 0 6px 24px rgba(60,40,20,0.16);
      --shadow-sm: 0 2px 10px rgba(60,40,20,0.14);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bg); }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--text); }
    button { font-family: inherit; }

    #map { position: fixed; inset: 0; background: var(--bg); }
    .leaflet-container { background: var(--bg); }

    /* ================= TOP BAR ================= */
    #hud-top {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(255,255,255,0.86));
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 14px 16px 10px;
      display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
      box-shadow: var(--shadow-sm);
      border-radius: 0 0 22px 22px;
    }
    #title-wrap { display: flex; flex-direction: column; line-height: 1.1; }
    #game-title {
      font-weight: 800; font-size: 23px; letter-spacing: 1.5px;
      background: linear-gradient(90deg, #ff6fa0, #f0a93a, #4caf6d, #4aa3ff);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    #game-version { font-size: 10px; color: var(--text-dim); font-weight: 600; letter-spacing: 0.4px; margin-top: 2px; }

    #top-right { display: flex; align-items: center; gap: 8px; }
    #gps-status {
      font-size: 10px; font-weight: 700; letter-spacing: 0.5px; padding: 5px 10px;
      border-radius: 999px; background: rgba(240,169,58,0.16); color: #a06a00;
      white-space: nowrap;
    }
    #gps-status.pending { animation: pulse 1.6s ease-in-out infinite; }
    #gps-status.locked { background: rgba(76,175,109,0.16); color: var(--green-dark); }
    #gps-status.err { background: rgba(240,169,58,0.22); color: #a06a00; }

    #currency-pill {
      font-size: 11px; font-weight: 800; letter-spacing: 0.3px; padding: 5px 10px;
      border-radius: 999px; background: rgba(240,169,58,0.16); color: #a06a00;
      white-space: nowrap; cursor: pointer;
    }
    #currency-pill:active { background: rgba(240,169,58,0.26); }

    #top-menu-btn {
      width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--panel-border);
      background: rgba(255,255,255,0.9); color: var(--text); font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-sm);
    }
    #top-menu-btn:active { background: rgba(0,0,0,0.06); }

    #menu-dropdown {
      position: fixed; top: 68px; right: 16px; z-index: 1001;
      background: var(--panel-bg); border-radius: 16px; box-shadow: var(--shadow);
      border: 1px solid var(--panel-border); overflow: hidden;
      display: none; min-width: 190px;
    }
    #menu-dropdown.open { display: block; }
    #menu-dropdown button {
      display: block; width: 100%; text-align: left; padding: 13px 16px; border: none;
      background: none; font-size: 14px; color: var(--text); cursor: pointer;
      border-bottom: 1px solid var(--panel-border);
    }
    #menu-dropdown button:last-child { border-bottom: none; }
    #menu-dropdown button:active { background: rgba(0,0,0,0.05); }
    #menu-dropdown button.danger { color: #c0554a; }

    /* ================= BOTTOM HUD ================= */
    #hud-bottom {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 900;
      background: linear-gradient(0deg, rgba(255,255,255,0.97), rgba(255,255,255,0.88));
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 14px 18px calc(14px + env(safe-area-inset-bottom, 0px));
      border-radius: 22px 22px 0 0;
      box-shadow: var(--shadow-sm);
      text-align: center;
    }
    #hud-status-line { font-size: 13.5px; color: var(--text); font-weight: 600; }

    #recenter-btn {
      position: fixed; right: 16px; bottom: 96px; z-index: 900;
      width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--panel-border);
      background: var(--panel-bg); box-shadow: var(--shadow); font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    #recenter-btn:active { background: rgba(0,0,0,0.06); }

    /* ================= TUTORIAL BANNER ================= */
    /* First-run only (see the TUTORIAL section in the script). Sits just
       below the top bar, using --hud-top-h so it never overlaps it. */
    #tutorial-banner {
      position: fixed; left: 12px; right: 12px; top: calc(var(--hud-top-h) + 10px); z-index: 950;
      background: linear-gradient(135deg, #fff6e0, #ffffff);
      border: 2px solid var(--amber); border-radius: 16px; box-shadow: var(--shadow);
      padding: 12px 16px; text-align: center; display: none;
    }
    #tutorial-banner.open { display: block; }
    #tutorial-text { font-size: 13.5px; font-weight: 700; line-height: 1.4; }
    #tutorial-skip-link {
      display: inline-block; margin-top: 6px; font-size: 11px; font-weight: 700;
      color: var(--text-dim); text-decoration: underline; cursor: pointer;
    }

    /* ================= PLANT PANEL ================= */
    #plant-panel {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 1100;
      background: var(--panel-bg); border-radius: 24px 24px 0 0; box-shadow: var(--shadow);
      padding: 10px 22px calc(22px + env(safe-area-inset-bottom, 0px));
      transform: translateY(105%);
      transition: transform 0.28s ease;
    }
    #plant-panel.open { transform: translateY(0); }
    .panel-handle { width: 40px; height: 4px; border-radius: 2px; background: var(--panel-border); margin: 4px auto 10px; }
    #panel-close-btn {
      position: absolute; top: 14px; right: 16px; width: 30px; height: 30px; border-radius: 50%;
      border: none; background: rgba(0,0,0,0.05); font-size: 17px; color: var(--text-dim); cursor: pointer;
    }
    #plant-icon-big { display: flex; align-items: center; justify-content: center; margin: 4px auto 8px; }
    #plant-title { text-align: center; font-size: 18px; font-weight: 800; margin-bottom: 2px; }
    #plant-meta { text-align: center; font-size: 12.5px; color: var(--text-dim); margin-bottom: 12px; }

    .water-bar-track { width: 100%; height: 10px; background: rgba(0,0,0,0.07); border-radius: 999px; overflow: hidden; }
    #water-bar-fill { height: 100%; background: linear-gradient(90deg, #4aa3ff, #7ec8ff); border-radius: 999px; transition: width 0.4s ease; }
    #water-bar-label { text-align: center; font-size: 11.5px; color: var(--text-dim); margin-top: 5px; margin-bottom: 10px; }

    #plant-status-line { text-align: center; font-size: 13.5px; font-weight: 700; margin-bottom: 14px; }
    .status-good { color: var(--green-dark); }
    .status-thirsty { color: var(--amber); }
    .status-wilt { color: var(--blue); }

    #plant-action-btn {
      display: block; width: 100%; padding: 14px; border: none; border-radius: 16px;
      font-size: 15px; font-weight: 800; letter-spacing: 0.3px; cursor: pointer;
      background: linear-gradient(90deg, var(--blue), #7ec8ff); color: #fff; box-shadow: var(--shadow-sm);
    }
    #plant-action-btn:disabled { background: #d8d4c8; color: #948e80; box-shadow: none; cursor: default; }

    /* Hidden by default - renderPlantPanel shows this only once a plant has
       reached single-bloom or flourishing stage and the player is in range. */
    #harvest-row { display: none; gap: 10px; margin-top: 10px; }
    .harvest-btn {
      flex: 1; padding: 13px; border-radius: 14px; font-size: 14px; font-weight: 800;
      cursor: pointer; box-shadow: var(--shadow-sm);
    }
    .keep-btn { background: #fff; color: var(--green-dark); border: 2px solid var(--green); }
    .sell-btn { background: linear-gradient(90deg, var(--amber), #f5c169); color: #fff; border: none; }

    /* ================= SHOP PANEL ================= */
    #shop-panel {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 1100;
      background: var(--panel-bg); border-radius: 24px 24px 0 0; box-shadow: var(--shadow);
      padding: 10px 22px calc(22px + env(safe-area-inset-bottom, 0px));
      transform: translateY(105%);
      transition: transform 0.28s ease;
    }
    #shop-panel.open { transform: translateY(0); }
    #shop-close-btn {
      position: absolute; top: 14px; right: 16px; width: 30px; height: 30px; border-radius: 50%;
      border: none; background: rgba(0,0,0,0.05); font-size: 17px; color: var(--text-dim); cursor: pointer;
    }
    #shop-title { text-align: center; font-size: 18px; font-weight: 800; margin: 4px 0 2px; }
    #shop-balance { text-align: center; font-size: 13px; color: var(--text-dim); margin-bottom: 16px; }
    .shop-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px 14px; border: 2px solid; border-radius: 16px; margin-bottom: 10px;
    }
    .shop-row-name { font-size: 14.5px; font-weight: 800; }
    .shop-row-meta { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }
    .shop-buy-btn {
      flex-shrink: 0; padding: 10px 16px; border: none; border-radius: 12px;
      font-size: 13.5px; font-weight: 800; cursor: pointer; color: #fff;
      background: linear-gradient(90deg, var(--green), var(--green-dark)); box-shadow: var(--shadow-sm);
    }
    .shop-buy-btn:disabled { background: #d8d4c8; color: #948e80; box-shadow: none; cursor: default; }

    /* ================= MODAL ================= */
    #modal-overlay {
      position: fixed; inset: 0; z-index: 1500; background: rgba(30,25,15,0.4);
      display: none; align-items: center; justify-content: center; padding: 20px;
    }
    #modal-overlay.open { display: flex; }
    #modal-card {
      background: var(--panel-bg); border-radius: 22px; padding: 26px 24px; max-width: 360px;
      box-shadow: var(--shadow); text-align: center;
    }
    #modal-title { font-size: 20px; font-weight: 800; margin-bottom: 12px; }
    #modal-body { font-size: 14px; line-height: 1.55; color: var(--text); margin-bottom: 18px; text-align: left; }
    #modal-body p { margin: 0 0 10px; }
    .seed-pick-list { display: flex; flex-direction: column; gap: 10px; }
    .seed-pick-btn {
      display: flex; align-items: center; justify-content: space-between; width: 100%;
      padding: 13px 16px; border: 2px solid; border-radius: 14px; background: #fff;
      font-size: 14.5px; font-weight: 800; cursor: pointer;
    }
    .seed-pick-btn span:last-child { color: var(--text-dim); font-weight: 700; }
    #modal-body p:last-child { margin-bottom: 0; }
    #modal-ok-btn {
      display: block; width: 100%; padding: 14px; border: none; border-radius: 16px;
      font-size: 15px; font-weight: 800; cursor: pointer; color: #fff;
      background: linear-gradient(90deg, var(--green), var(--green-dark)); box-shadow: var(--shadow-sm);
    }

    /* ================= TOAST ================= */
    #toast-container {
      position: fixed; left: 0; right: 0; bottom: 92px; z-index: 1300;
      display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none;
    }
    .toast {
      background: rgba(40,35,25,0.92); color: #fff; font-size: 13px; font-weight: 600;
      padding: 10px 18px; border-radius: 999px; box-shadow: var(--shadow-sm);
      opacity: 0; transform: translateY(8px); transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* ================= ANIMATIONS ================= */
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    @keyframes sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
    .flourish-cluster { animation: sway 3.2s ease-in-out infinite; transform-origin: bottom center; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important; animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="hud-top">
    <div id="title-wrap">
      <span id="game-title">BLOOM &#x1F338;</span>
      <span id="game-version">v1.3.1</span>
    </div>
    <div id="top-right">
      <span id="gps-status" class="pending">LOCATING&hellip;</span>
      <span id="currency-pill" onclick="openShop()" title="Open the Seed Shop">&#x1F338; 0</span>
      <button id="top-menu-btn" onclick="toggleMenu()">&#8942;</button>
    </div>
  </div>

  <div id="menu-dropdown">
    <button onclick="toggleMenu();openShop()">Seed Shop</button>
    <button onclick="openHowToPlay()">How to Play</button>
    <button class="danger" onclick="onResetSave()">Reset Save</button>
  </div>

  <button id="recenter-btn" onclick="onRecenter()" title="Center on me">&#x1F3AF;</button>

  <div id="tutorial-banner">
    <div id="tutorial-text">&nbsp;</div>
    <span id="tutorial-skip-link" onclick="skipTutorial()">Skip tutorial</span>
  </div>

  <div id="hud-bottom">
    <div id="hud-status-line">Finding your location&hellip;</div>
  </div>

  <div id="plant-panel">
    <div class="panel-handle"></div>
    <button id="panel-close-btn" onclick="closePlantPanel()">&times;</button>
    <div id="plant-icon-big"></div>
    <div id="plant-title">&nbsp;</div>
    <div id="plant-meta">&nbsp;</div>
    <div class="water-bar-track"><div id="water-bar-fill" style="width:0%"></div></div>
    <div id="water-bar-label">&nbsp;</div>
    <div id="plant-status-line">&nbsp;</div>
    <button id="plant-action-btn">Water</button>
    <div id="harvest-row">
      <button id="keep-btn" class="harvest-btn keep-btn">Keep &#x1F33C;</button>
      <button id="sell-btn" class="harvest-btn sell-btn">Sell</button>
    </div>
  </div>

  <div id="shop-panel">
    <div class="panel-handle"></div>
    <button id="shop-close-btn" onclick="closeShop()">&times;</button>
    <div id="shop-title">Seed Shop</div>
    <div id="shop-balance">&nbsp;</div>
    <div id="shop-rows"></div>
  </div>

  <div id="modal-overlay">
    <div id="modal-card">
      <div id="modal-title">Welcome to Bloom</div>
      <div id="modal-body"></div>
      <button id="modal-ok-btn" onclick="closeModal()">Let's grow! &#x1F331;</button>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script>
    // =====================================================================
    //  BLOOM - a chill, walking-based gardening game.
    //  Plant seeds on foot, water them on your next walk, watch them grow.
    //  No score pressure, no failure state beyond "walk back and water it" -
    //  the whole point is to give a relaxed excuse to go outside.
    //
    //  Encoding note: every emoji below is written as a JS \u{...} escape
    //  (in script) or an HTML numeric entity &#x...; (in markup) rather than
    //  a raw UTF-8 glyph, so the file itself contains only ASCII bytes.
    // =====================================================================

    // ---------------------------------------------------------------------
    //  CONSTANTS
    // ---------------------------------------------------------------------
    var HOUR = 3600000;

    // Hex grid cell size - same ~20m scale used by the Porter game backbone,
    // a good balance between "walkable in a few minutes" and "not so tiny
    // that GPS jitter causes mis-taps".
    var CELL_LAT_DEG = 20 / 111111;
    var SQ3 = Math.sqrt(3);
    // Longitude degrees-per-meter shrink with latitude (cos(lat) factor), so
    // this is corrected once at first GPS lock and persisted - see onGpsLocked.
    var CELL_LNG_DEG = parseFloat(localStorage.getItem('bloom_cell_lng')) || CELL_LAT_DEG;

    var PLANT_RANGE_HEX = 2;   // how close (in hexes) you must be to plant or water
    // Visual-only radius for the glow circle around the player; derived from
    // the same hex lattice so it roughly matches the real (hex-distance)
    // interaction range without needing a second magic number.
    var RANGE_METERS = PLANT_RANGE_HEX * CELL_LAT_DEG * 111111 * SQ3;

    var WATER_DURATION_MS = 48 * HOUR;  // full water drains to empty over 2 days
    var GRACE_MS          = 24 * HOUR;  // then it can sit dry a day before wilting
    var DEATH_MS           = 96 * HOUR; // ...and up to 4 more wilted days before it dies
    // growthMs thresholds for [seed, sprout, single bloom, flourishing cluster]
    var GROWTH_THRESHOLDS = [0, 8 * HOUR, 20 * HOUR, 40 * HOUR];
    var STAGE_LABELS = ['Seed', 'Sprout', 'In Bloom', 'Flourishing'];

    // `tier` (0/1/2) maps each species onto TIERS below - it's what a seed's
    // price/sell value and the shop actually key off, species itself is just
    // which flower you get within that tier.
    var SPECIES = [
      { key: 'sunflower',  emoji: '\u{1F33B}', name: 'Sunflower', color: '#ffd23f', tier: 0 },
      { key: 'tulip',      emoji: '\u{1F337}', name: 'Tulip',     color: '#ff7fae', tier: 0 },
      { key: 'daisy',      emoji: '\u{1F33C}', name: 'Daisy',     color: '#fff2a8', tier: 0 },
      { key: 'hibiscus',   emoji: '\u{1F33A}', name: 'Hibiscus',  color: '#ff8aa8', tier: 1 },
      { key: 'blossom',    emoji: '\u{1F338}', name: 'Blossom',   color: '#ffc7e0', tier: 1 },
      { key: 'rose',       emoji: '\u{1F339}', name: 'Rose',      color: '#f0637f', tier: 2 },
      { key: 'lotus',      emoji: '\u{1FAB7}', name: 'Lotus',     color: '#caa8f5', tier: 2 }
    ];
    function speciesFor(key) {
      for (var i = 0; i < SPECIES.length; i++) if (SPECIES[i].key === key) return SPECIES[i];
      return SPECIES[0];
    }
    function speciesOfTier(tierIdx) { return SPECIES.filter(function (s) { return s.tier === tierIdx; }); }

    // Seed cost and harvest value by tier. sellSingle is a near-breakeven
    // price on purpose (roughly the seed's own cost) so cashing out early
    // isn't clearly "correct" - sellCluster is the real payoff, rewarding
    // patience (and a couple of watering visits) without punishing anyone
    // who harvests early or just wants to Keep a flower instead of selling.
    var TIERS = [
      { key: 'common', name: 'Common', color: '#4caf6d', seedCost: 10, sellSingle: 8,  sellCluster: 18 },
      { key: 'rare',   name: 'Rare',   color: '#4aa3ff', seedCost: 30, sellSingle: 25, sellCluster: 55 },
      { key: 'prized', name: 'Prized', color: '#f0a93a', seedCost: 70, sellSingle: 60, sellCluster: 130 }
    ];
    function harvestValue(p, stage) {
      var t = TIERS[speciesFor(p.species).tier];
      return stage >= 3 ? t.sellCluster : t.sellSingle;
    }

    // ---------------------------------------------------------------------
    //  STATE & PERSISTENCE
    //  Small, single-blob save (unlike Porter's many-key layout) since
    //  Bloom's whole state is just a dictionary of plants plus a few stats.
    // ---------------------------------------------------------------------
    var STORAGE_KEY = 'bloom_state_v1';
    // A factory, not a shared object literal - state.seeds gets mutated in
    // place by plantSeedAt/buySeed, so every caller needs its own fresh copy
    // (a shared literal here would let gameplay silently mutate the "starter"
    // values themselves, corrupting what a fresh/reset save starts with).
    function starterSeeds() { return { common: 3, rare: 0, prized: 0 }; }

    function loadState() {
      var def = {
        plants: {},
        stats: { planted: 0, bloomed: 0, flourished: 0, lost: 0, kept: 0, sold: 0, earned: 0 },
        seeds: starterSeeds(),
        currency: 0,
        following: true,
        seenWelcome: false,
        tutorialDone: false // brand-new save -> the onboarding tutorial should run
      };
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return def;
      try {
        var parsed = JSON.parse(raw);
        return {
          plants: parsed.plants || {},
          stats: Object.assign({}, def.stats, parsed.stats || {}),
          // A save that predates seeds/currency (v1.1.x) gets starter seeds
          // bootstrapped in rather than being left unable to plant anything -
          // the old free-plant mechanic this replaces never cost seeds.
          seeds: parsed.seeds || starterSeeds(),
          currency: typeof parsed.currency === 'number' ? parsed.currency : 0,
          following: parsed.following !== false,
          seenWelcome: !!parsed.seenWelcome,
          // Any save that already exists predates the tutorial - never
          // interrupt an already-playing garden with onboarding.
          tutorialDone: typeof parsed.tutorialDone === 'boolean' ? parsed.tutorialDone : true
        };
      } catch (e) {
        return def; // corrupted save falls back to defaults rather than breaking load
      }
    }

    var state = loadState();
    state.userPos = null; // runtime-only, never persisted

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        plants: state.plants, stats: state.stats, seeds: state.seeds, currency: state.currency,
        following: state.following, seenWelcome: state.seenWelcome, tutorialDone: state.tutorialDone
      }));
    }

    // ---------------------------------------------------------------------
    //  HEX MATH (flat-top axial, same shape as the Porter backbone)
    // ---------------------------------------------------------------------
    function hexRound(qf, rf) {
      var sf = -qf - rf;
      var q = Math.round(qf), r = Math.round(rf), s = Math.round(sf);
      var dq = Math.abs(q - qf), dr = Math.abs(r - rf), ds = Math.abs(s - sf);
      if (dq > dr && dq > ds) q = -r - s;
      else if (dr > ds) r = -q - s;
      return { q: q, r: r };
    }
    function latLngToHex(lat, lng) {
      var nx = lng / CELL_LNG_DEG, ny = lat / CELL_LAT_DEG;
      return hexRound(2 / 3 * nx, -1 / 3 * nx + SQ3 / 3 * ny);
    }
    function hexCenter(q, r) {
      return { lat: (SQ3 / 2 * q + SQ3 * r) * CELL_LAT_DEG, lng: (3 / 2 * q) * CELL_LNG_DEG };
    }
    function hexKey(q, r) { return q + ',' + r; }
    function hexDist(q1, r1, q2, r2) {
      var dq = q1 - q2, dr = r1 - r2;
      return (Math.abs(dq) + Math.abs(dr) + Math.abs(dq + dr)) / 2;
    }

    // Same six directions Porter uses, paired with hexVerticesPx's edge index
    // (edge `e`, between vertices e and e+1, borders the neighbor at HEX_NEIGHBORS[e]).
    var HEX_NEIGHBORS = [[1, 0], [0, 1], [-1, 1], [-1, 0], [0, -1], [1, -1]];

    // Six corner points (in Leaflet layer-point space) of the hex at (q, r),
    // used only by the grid-mesh renderer below - plant markers are placed by
    // lat/lng center (hexCenter), not by these pixel vertices.
    function hexVerticesPx(q, r) {
      var verts = [];
      for (var i = 0; i < 6; i++) {
        var angle = Math.PI / 3 * i;
        var lat = (SQ3 / 2 * q + SQ3 * r + Math.sin(angle)) * CELL_LAT_DEG;
        var lng = (3 / 2 * q + Math.cos(angle)) * CELL_LNG_DEG;
        verts.push(map.latLngToLayerPoint([lat, lng]));
      }
      return verts;
    }
    // Cheap cull against gridRenderer's own (padded) bounds, in layer points.
    function hexOnScreen(verts) {
      var b = gridRenderer && gridRenderer._bounds;
      if (!b) return true;
      return verts.some(function (v) {
        return v.x >= b.min.x - 4 && v.x <= b.max.x + 4 && v.y >= b.min.y - 4 && v.y <= b.max.y + 4;
      });
    }

    // ---------------------------------------------------------------------
    //  GROWTH ENGINE
    //  Fully timestamp-derived so it stays correct across long offline gaps
    //  (the whole point of the game is that you walk away for hours/days).
    // ---------------------------------------------------------------------
    function stageForGrowth(growthMs) {
      for (var i = GROWTH_THRESHOLDS.length - 1; i >= 0; i--) {
        if (growthMs >= GROWTH_THRESHOLDS[i]) return i;
      }
      return 0;
    }

    // Recomputes a plant's derived state as of `now` and mutates its stored
    // growth accumulator. Safe to call any number of times (idempotent aside
    // from accruing whatever real time has actually passed since the last call).
    //
    // Growth only accrues while the plant isn't wilted: `wiltStartAt` is the
    // exact timestamp watering would need to happen by to avoid wilting, so
    // clamping the growth window to min(now, wiltStartAt) accounts for offline
    // gaps that span a wilt transition without needing stored history.
    function recomputePlant(p, now) {
      var wiltStartAt = p.lastWateredAt + WATER_DURATION_MS + GRACE_MS;
      var growEnd = Math.min(now, wiltStartAt);
      var added = Math.max(0, growEnd - p.lastGrowthCheckAt);
      p.growthMs += added;
      p.lastGrowthCheckAt = now;

      var dryMs = Math.max(0, now - p.lastWateredAt - WATER_DURATION_MS);
      var d = {
        waterFrac: Math.max(0, Math.min(1, 1 - (now - p.lastWateredAt) / WATER_DURATION_MS)),
        wilted: dryMs > GRACE_MS,
        dead: dryMs > GRACE_MS + DEATH_MS,
        stage: stageForGrowth(p.growthMs)
      };
      p._d = d;
      return d;
    }

    // Consumes one seed of the given tier from inventory and plants a random
    // species from that tier. Callers are expected to have already confirmed
    // a seed of this tier is actually owned (see attemptPlant/openSeedPicker) -
    // this only re-checks defensively, it doesn't surface its own error UI.
    // Returns the new plant's hex key, or null if there was no seed to spend.
    function plantSeedAt(q, r, tierIdx) {
      var tier = TIERS[tierIdx], seedKey = tier.key;
      if (!(state.seeds[seedKey] > 0)) return null;
      state.seeds[seedKey]--;

      var now = Date.now();
      var pool = speciesOfTier(tierIdx);
      var species = pool[Math.floor(Math.random() * pool.length)].key;
      var c = hexCenter(q, r);
      var key = hexKey(q, r);
      state.plants[key] = {
        q: q, r: r, lat: c.lat, lng: c.lng, species: species,
        plantedAt: now, lastWateredAt: now, growthMs: 0, lastGrowthCheckAt: now,
        reachedBloom: false, reachedFlourish: false
      };
      state.stats.planted++;
      saveState();
      renderPlants();
      updateHUD();
      toast('\u{1F331} ' + tier.name + ' seed planted! Come back and water it soon.');
      vibrate(20);
      tutorialOnPlant(key);
      return key;
    }

    // Decides which seed to plant on an empty, in-range hex: skips the picker
    // entirely if the player only owns one tier (the common case stays a
    // single tap, same as before seeds existed), asks when they own more than
    // one, and points them at the shop when they're out.
    function attemptPlant(q, r) {
      var owned = TIERS.map(function (t, i) { return { i: i, t: t, count: state.seeds[t.key] || 0 }; })
        .filter(function (o) { return o.count > 0; });
      if (owned.length === 0) { toast("You're out of seeds - open the Shop \u{1F338} to buy more"); return; }
      if (owned.length === 1) { plantSeedAt(q, r, owned[0].i); return; }
      openSeedPicker(q, r, owned);
    }

    function waterPlant(key) {
      var p = state.plants[key];
      if (!p) return;
      var now = Date.now();
      recomputePlant(p, now);   // accrue any growth earned before the dry spell
      p.lastWateredAt = now;
      recomputePlant(p, now);   // refresh derived state for immediate UI feedback
      saveState();
      renderPlants();
      if (viewingKey === key) renderPlantPanel(key);
      updateHUD();
      toast('\u{1F4A7} Watered!');
      vibrate(15);
      tutorialOnWater(key);
    }

    // Picks a fully-grown plant (single bloom or flourishing cluster) whether
    // to Keep (a free personal-collection tally, no currency) or Sell (clears
    // the hex for Petals via harvestValue). Either way the hex frees up for
    // replanting - "harvesting" always removes the plant from the ground.
    function harvestPlant(key, sell) {
      var p = state.plants[key];
      if (!p) return;
      var d = recomputePlant(p, Date.now());
      var species = speciesFor(p.species);
      var label = species.name + (d.stage >= 3 ? ' cluster' : '');
      delete state.plants[key];

      if (sell) {
        var val = harvestValue(p, d.stage);
        state.currency += val;
        state.stats.sold++;
        state.stats.earned += val;
        toast('Sold your ' + label + ' for ' + val + ' \u{1F338}');
      } else {
        state.stats.kept++;
        toast('Kept your ' + label + ' \u{1F33C}');
      }

      saveState();
      renderPlants();
      updateHUD();
      updateCurrencyPill();
      closePlantPanel();
      vibrate(20);
      return sell ? harvestValue(p, d.stage) : 0; // used by the tutorial's bonus top-up
    }

    // Runs on load and every minute: advances growth, tracks first-time
    // milestones, and gently retires anything left dry for too long.
    function tickPlants() {
      var now = Date.now();
      var removed = 0;
      Object.keys(state.plants).forEach(function (key) {
        var p = state.plants[key];
        var d = recomputePlant(p, now);
        if (d.dead) { delete state.plants[key]; state.stats.lost++; removed++; return; }
        if (d.stage >= 2 && !p.reachedBloom) { p.reachedBloom = true; state.stats.bloomed++; }
        if (d.stage >= 3 && !p.reachedFlourish) { p.reachedFlourish = true; state.stats.flourished++; }
      });
      saveState();
      renderPlants();
      updateHUD();
      if (viewingKey) renderPlantPanel(viewingKey);
      if (removed > 0) {
        toast(removed === 1
          ? 'A flower quietly returned to the earth. \u{1F90D}'
          : removed + ' flowers quietly returned to the earth. \u{1F90D}');
      }
    }

    // ---------------------------------------------------------------------
    //  VISUALS
    // ---------------------------------------------------------------------
    // Builds the emoji "look" for a plant at a given stage/size and returns
    // its rendered box dimensions so callers (map marker vs. big panel
    // preview) can size their container to match exactly.
    function buildPlantVisual(species, stage, wilted, base) {
      var wiltFilter = wilted ? 'filter:grayscale(55%) opacity(0.7);' : '';
      function dot(size) {
        var fs = Math.round(size * 0.6);
        return '<div style="background:' + species.color + ';border:2px solid rgba(255,255,255,0.85);' +
          'border-radius:50%;width:' + size + 'px;height:' + size + 'px;display:flex;align-items:center;' +
          'justify-content:center;font-size:' + fs + 'px;box-shadow:0 2px 8px rgba(60,40,20,0.3);flex-shrink:0">' +
          species.emoji + '</div>';
      }
      var html, w, h;
      if (stage === 0) {
        w = h = Math.round(base * 0.5);
        html = '<div style="' + wiltFilter + 'background:#c9a06a;border:2px solid rgba(255,255,255,0.85);' +
          'border-radius:50%;width:' + w + 'px;height:' + h + 'px;display:flex;align-items:center;' +
          'justify-content:center;font-size:' + Math.round(w * 0.55) + 'px;box-shadow:0 2px 8px rgba(60,40,20,0.3)">' +
          '\u{1F330}</div>';
      } else if (stage === 1) {
        w = h = Math.round(base * 0.55);
        html = '<div style="' + wiltFilter + 'background:#bfe6a0;border:2px solid rgba(255,255,255,0.85);' +
          'border-radius:50%;width:' + w + 'px;height:' + h + 'px;display:flex;align-items:center;' +
          'justify-content:center;font-size:' + Math.round(w * 0.58) + 'px;box-shadow:0 2px 8px rgba(60,40,20,0.3)">' +
          '\u{1F331}</div>';
      } else if (stage === 2) {
        w = h = Math.round(base * 0.85);
        html = '<div style="' + wiltFilter + '">' + dot(w) + '</div>';
      } else {
        var ds = Math.round(base * 0.5), gap = Math.max(2, Math.round(base * 0.04));
        w = 2 * ds + gap; h = 2 * ds + gap;
        html = '<div class="flourish-cluster" style="' + wiltFilter + 'display:flex;flex-direction:column;' +
          'gap:' + gap + 'px;align-items:center"><div style="display:flex;gap:' + gap + 'px">' +
          dot(ds) + dot(ds) + '</div>' + dot(ds) + '</div>';
      }
      return { html: html, w: w, h: h };
    }

    function makePlantIcon(plant) {
      var d = recomputePlant(plant, Date.now());
      var v = buildPlantVisual(speciesFor(plant.species), d.stage, d.wilted, 44);
      var html = v.html;
      if (d.wilted) {
        html = '<div style="position:relative;width:' + v.w + 'px;height:' + v.h + 'px">' + html +
          '<div style="position:absolute;top:-4px;right:-6px;background:#4aa3ff;color:#fff;' +
          'border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center;' +
          'font-size:10px;box-shadow:0 1px 4px rgba(0,0,0,0.35)">\u{1F4A7}</div></div>';
      }
      return L.divIcon({ html: html, iconSize: [v.w, v.h], iconAnchor: [v.w / 2, v.h / 2], className: '' });
    }

    // ---------------------------------------------------------------------
    //  MAP
    // ---------------------------------------------------------------------
    var map = L.map('map', { zoomControl: false, attributionControl: false, minZoom: 14, maxZoom: 19, zoomSnap: 0.5 });
    // Voyager tiles - colorful parks/water/roads, matching the "pretty and
    // colorful" brief better than a flat greyscale basemap would.
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      subdomains: 'abcd', maxZoom: 20
    }).addTo(map);

    // Pane ladder (bottom -> top): tilePane 200 < gridPane 350 (hex mesh) <
    // overlayPane 400 (range circle, Leaflet default) < markerPane 600 (plants/
    // user, Leaflet default). Much shorter than Porter's ladder since Bloom has
    // no zones or connection lines to layer in between.
    map.createPane('gridPane').style.zIndex = 350;
    var gridRenderer = L.canvas({ pane: 'gridPane', padding: 1.0 });
    gridRenderer.addTo(map);

    map.setView([20, 0], 3);
    map.on('dragstart', function () { state.following = false; });

    // Hex mesh is only drawn once zoomed in this close - below it the hex count
    // in view would grow into the thousands (this is a full-viewport mesh, not
    // a bounded zone like Porter's), so it simply fades away on a wide view
    // rather than costing a redraw budget to render or read.
    var GRID_MIN_ZOOM = 17;
    var GRID_MAX_HEXES = 3000; // safety cap in case the viewport math overshoots

    var _gridRedrawPending = false;
    function scheduleGridRedraw() {
      if (_gridRedrawPending) return;
      _gridRedrawPending = true;
      requestAnimationFrame(function () { _gridRedrawPending = false; renderGridMesh(); });
    }

    // Soft outline mesh over the current viewport so planting spots read at a
    // glance. Every edge is shared by exactly two hexes; only drawing edge
    // indices 0-2 of each hex (see HEX_NEIGHBORS / hexVerticesPx) still covers
    // every edge exactly once, so there's no dedup pass and no doubled lines.
    function renderGridMesh() {
      if (!gridRenderer._ctx || !gridRenderer._bounds) return;
      var ctx = gridRenderer._ctx, b = gridRenderer._bounds, sz = b.getSize();
      ctx.clearRect(b.min.x, b.min.y, sz.x, sz.y);
      if (map.getZoom() < GRID_MIN_ZOOM) return;

      var vb = map.getBounds().pad(0.25);
      var corners = [
        latLngToHex(vb.getSouth(), vb.getWest()), latLngToHex(vb.getNorth(), vb.getEast()),
        latLngToHex(vb.getSouth(), vb.getEast()), latLngToHex(vb.getNorth(), vb.getWest())
      ];
      var minQ = Math.min.apply(null, corners.map(function (c) { return c.q; })) - 1;
      var maxQ = Math.max.apply(null, corners.map(function (c) { return c.q; })) + 1;
      var minR = Math.min.apply(null, corners.map(function (c) { return c.r; })) - 1;
      var maxR = Math.max.apply(null, corners.map(function (c) { return c.r; })) + 1;
      if ((maxQ - minQ) * (maxR - minR) > GRID_MAX_HEXES) return;

      ctx.strokeStyle = 'rgba(70,120,80,0.14)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (var q = minQ; q <= maxQ; q++) {
        for (var r = minR; r <= maxR; r++) {
          var verts = hexVerticesPx(q, r);
          if (!hexOnScreen(verts)) continue;
          for (var e = 0; e < 3; e++) {
            ctx.moveTo(verts[e].x, verts[e].y);
            ctx.lineTo(verts[(e + 1) % 6].x, verts[(e + 1) % 6].y);
          }
        }
      }
      ctx.stroke();
    }
    map.on('moveend zoomend viewreset resize', scheduleGridRedraw);

    var plantMarkers = {};
    function renderPlants() {
      var seen = {};
      Object.keys(state.plants).forEach(function (key) {
        var p = state.plants[key];
        seen[key] = true;
        var icon = makePlantIcon(p);
        if (plantMarkers[key]) plantMarkers[key].setIcon(icon);
        else plantMarkers[key] = L.marker([p.lat, p.lng], { icon: icon, interactive: false, zIndexOffset: 100 }).addTo(map);
      });
      Object.keys(plantMarkers).forEach(function (key) {
        if (!seen[key]) { map.removeLayer(plantMarkers[key]); delete plantMarkers[key]; }
      });
    }

    // Empty ground within range plants immediately; an occupied hex opens its
    // panel (from any distance - browsing your garden from afar is fine,
    // only *acting* on a plant requires being physically close).
    map.on('click', function (e) {
      var h = latLngToHex(e.latlng.lat, e.latlng.lng);
      var key = hexKey(h.q, h.r);
      if (state.plants[key]) { openPlantPanel(key); return; }
      if (!state.userPos) { toast('Waiting for GPS to lock on...'); return; }
      var uh = latLngToHex(state.userPos.lat, state.userPos.lng);
      if (hexDist(uh.q, uh.r, h.q, h.r) > PLANT_RANGE_HEX) {
        toast('Walk closer to plant a seed here \u{1F6B6}');
        return;
      }
      attemptPlant(h.q, h.r);
    });

    // ---------------------------------------------------------------------
    //  GPS
    // ---------------------------------------------------------------------
    // No player marker - only the translucent range circle marks the player,
    // so it never sits on top of (and hides) a flower planted right next to
    // them. userHexQ/userHexR is the hex the circle is currently snapped to.
    var rangeCircle = null, viewingKey = null;
    var userHexQ = null, userHexR = null;
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (!navigator.geolocation) {
      document.getElementById('gps-status').textContent = 'NO GPS';
      document.getElementById('hud-status-line').textContent = 'Geolocation is not supported on this device.';
    } else {
      navigator.geolocation.watchPosition(onLocationUpdate, onLocationError, {
        enableHighAccuracy: true, maximumAge: 3000, timeout: 15000
      });
    }

    // Eases the range circle from one hex center to the next over ~450ms
    // instead of jumping. Only runs on an actual hex change (see
    // onLocationUpdate), so ordinary GPS jitter within the same hex never
    // moves the circle at all - that's the real fix for the twitchiness,
    // this animation just makes real hex-to-hex steps read as movement
    // rather than a teleport.
    var _circleAnimRAF = null;
    function animateCircleTo(fromLat, fromLng, toLat, toLng) {
      if (_circleAnimRAF) cancelAnimationFrame(_circleAnimRAF);
      if (reduceMotion) { rangeCircle.setLatLng([toLat, toLng]); return; }
      var start = performance.now(), dur = 450;
      function step(now) {
        var t = Math.min(1, (now - start) / dur);
        var e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; // ease-in-out-quad
        rangeCircle.setLatLng([fromLat + (toLat - fromLat) * e, fromLng + (toLng - fromLng) * e]);
        _circleAnimRAF = (t < 1) ? requestAnimationFrame(step) : null;
      }
      _circleAnimRAF = requestAnimationFrame(step);
    }

    function onLocationUpdate(pos) {
      var lat = pos.coords.latitude, lng = pos.coords.longitude;
      state.userPos = { lat: lat, lng: lng };

      // Snap the displayed position to the current hex's center rather than
      // following raw GPS - range checks elsewhere already work in hex
      // distance (hexDist), not raw lat/lng, so this changes nothing about
      // what counts as "in range", only how steady the circle looks.
      var h = latLngToHex(lat, lng);
      var c = hexCenter(h.q, h.r);

      if (!rangeCircle) {
        userHexQ = h.q; userHexR = h.r;
        rangeCircle = L.circle([c.lat, c.lng], {
          radius: RANGE_METERS, color: '#4caf6d', weight: 1.5,
          fillColor: '#4caf6d', fillOpacity: 0.08, interactive: false
        }).addTo(map);
        map.setView([c.lat, c.lng], 17);
        onGpsLocked();
      } else if (h.q !== userHexQ || h.r !== userHexR) {
        var from = hexCenter(userHexQ, userHexR);
        userHexQ = h.q; userHexR = h.r;
        animateCircleTo(from.lat, from.lng, c.lat, c.lng);
        if (state.following) map.panTo([c.lat, c.lng], { animate: true, duration: 0.4 });
      }
      if (viewingKey) renderPlantPanel(viewingKey); // range may have just changed
      updateHUD();
    }

    function onLocationError(err) {
      var msgs = { 1: 'Location permission denied.', 2: 'Position unavailable.', 3: 'GPS timed out, retrying...' };
      var badge = document.getElementById('gps-status');
      badge.textContent = 'NO GPS'; badge.className = 'err';
      document.getElementById('hud-status-line').textContent = msgs[err.code] || err.message;
    }

    function onGpsLocked() {
      var badge = document.getElementById('gps-status');
      badge.textContent = 'GPS LOCKED';
      badge.className = 'locked';
      setTimeout(function () { badge.style.display = 'none'; }, 3000);
      // Longitude scale depends on latitude - lock it once so hexes stay
      // visually even-sided near where the player actually is.
      if (!localStorage.getItem('bloom_cell_lng')) {
        CELL_LNG_DEG = CELL_LAT_DEG / Math.cos(state.userPos.lat * Math.PI / 180);
        localStorage.setItem('bloom_cell_lng', CELL_LNG_DEG);
      }
      // The map.setView() a moment ago in onLocationUpdate already fired
      // 'moveend' (and so a grid redraw) before CELL_LNG_DEG was corrected
      // above - redraw once more now so the very first mesh isn't stretched.
      scheduleGridRedraw();
      vibrate(30);
      tickPlants();
      // Brand-new player: show the welcome modal, then the tutorial starts
      // once they dismiss it (see openWelcome). Returning to a save where the
      // tutorial was started but never finished/skipped (app closed mid-way)
      // skips straight to resuming it, since they've already seen Welcome.
      if (!state.seenWelcome) openWelcome();
      else if (!state.tutorialDone) startTutorial();
    }

    // ---------------------------------------------------------------------
    //  PLANT PANEL
    // ---------------------------------------------------------------------
    function formatAgo(ts) {
      var min = Math.floor((Date.now() - ts) / 60000);
      if (min < 1) return 'just now';
      if (min < 60) return min + (min === 1 ? ' minute ago' : ' minutes ago');
      var hr = Math.floor(min / 60);
      if (hr < 24) return hr + (hr === 1 ? ' hour ago' : ' hours ago');
      var day = Math.floor(hr / 24);
      return day + (day === 1 ? ' day ago' : ' days ago');
    }

    function openPlantPanel(key) {
      closeShop(); // the shop and plant panel are both bottom sheets - only one at a time
      viewingKey = key;
      renderPlantPanel(key);
      document.getElementById('plant-panel').classList.add('open');
    }
    function closePlantPanel() {
      viewingKey = null;
      document.getElementById('plant-panel').classList.remove('open');
    }

    function renderPlantPanel(key) {
      var p = state.plants[key];
      if (!p) { closePlantPanel(); return; }
      var d = recomputePlant(p, Date.now());
      var species = speciesFor(p.species);

      var v = buildPlantVisual(species, d.stage, d.wilted, 88);
      var iconEl = document.getElementById('plant-icon-big');
      iconEl.innerHTML = v.html;
      iconEl.style.width = v.w + 'px';
      iconEl.style.height = v.h + 'px';

      document.getElementById('plant-title').textContent = species.name + ' - ' + STAGE_LABELS[d.stage];
      document.getElementById('plant-meta').textContent = 'Planted ' + formatAgo(p.plantedAt);

      var pct = Math.round(d.waterFrac * 100);
      document.getElementById('water-bar-fill').style.width = pct + '%';
      document.getElementById('water-bar-label').textContent = pct + '% watered';

      var statusEl = document.getElementById('plant-status-line');
      if (d.wilted) { statusEl.textContent = 'Wilting - water it to help it bounce back'; statusEl.className = 'status-wilt'; }
      else if (d.waterFrac < 0.34) { statusEl.textContent = 'Getting thirsty - water it soon'; statusEl.className = 'status-thirsty'; }
      else { statusEl.textContent = 'Thriving'; statusEl.className = 'status-good'; }

      var uh = state.userPos ? latLngToHex(state.userPos.lat, state.userPos.lng) : null;
      var inRange = uh && hexDist(uh.q, uh.r, p.q, p.r) <= PLANT_RANGE_HEX;
      var btn = document.getElementById('plant-action-btn');
      if (inRange) {
        btn.disabled = false;
        btn.textContent = 'Water \u{1F4A7}';
        btn.onclick = function () { waterPlant(key); };
      } else {
        btn.disabled = true;
        btn.textContent = 'Walk closer to water';
        btn.onclick = null;
      }

      // Harvesting (Keep or Sell) only shows up once a plant has something to
      // harvest - single bloom or flourishing cluster - and only when close
      // enough to act on it, same proximity rule as watering.
      var harvestRow = document.getElementById('harvest-row');
      if (d.stage >= 2 && inRange) {
        harvestRow.style.display = 'flex';
        document.getElementById('sell-btn').textContent = 'Sell ' + harvestValue(p, d.stage) + ' \u{1F338}';
        document.getElementById('sell-btn').onclick = function () { onHarvestClick(key, true); };
        document.getElementById('keep-btn').onclick = function () { onHarvestClick(key, false); };
      } else {
        harvestRow.style.display = 'none';
      }
    }

    // Thin wrapper so the tutorial (see TUTORIAL section) can observe a real
    // harvest without renderPlantPanel needing to know it exists.
    function onHarvestClick(key, sell) {
      var value = harvestPlant(key, sell);
      tutorialOnHarvest(key, sell, value);
    }

    // ---------------------------------------------------------------------
    //  HUD / MENU / MODAL / TOAST
    // ---------------------------------------------------------------------
    function updateHUD() {
      var keys = Object.keys(state.plants);
      var total = keys.length;
      var thirsty = keys.filter(function (k) {
        var d = state.plants[k]._d;
        return d && (d.wilted || d.waterFrac < 0.34);
      }).length;

      var line;
      if (total === 0) line = 'Tap the map near you to plant your first seed \u{1F331}';
      else if (thirsty > 0) {
        line = thirsty + (thirsty === 1 ? ' flower is' : ' flowers are') + ' thirsty \u{1F4A7} &bull; ' +
          state.stats.bloomed + ' in bloom';
      } else {
        line = '\u{1F338} ' + total + ' growing &bull; ' + state.stats.bloomed + ' in bloom &bull; all watered';
      }
      document.getElementById('hud-status-line').innerHTML = line;
    }

    function toggleMenu() { document.getElementById('menu-dropdown').classList.toggle('open'); }
    document.addEventListener('click', function (e) {
      var menu = document.getElementById('menu-dropdown'), btn = document.getElementById('top-menu-btn');
      if (menu.classList.contains('open') && !menu.contains(e.target) && e.target !== btn) menu.classList.remove('open');
    });

    function onRecenter() {
      state.following = true;
      saveState();
      // Pan to the snapped hex center (where the range circle actually is),
      // not raw GPS - otherwise recenter can land slightly off from the
      // visible circle.
      if (userHexQ !== null) {
        var c = hexCenter(userHexQ, userHexR);
        map.panTo([c.lat, c.lng], { animate: true });
      }
    }

    // Wipes the whole save (garden, seeds, Petals, stats, and the welcome/
    // tutorial flags) and reloads, rather than resetting each state field by
    // hand - that way a full reset can never drift out of sync as new state
    // fields get added later (it always matches whatever loadState()'s
    // defaults are, since a reload with no saved key runs the exact same
    // brand-new-player path, tutorial included).
    function onResetSave() {
      toggleMenu();
      if (!confirm('Erase your save completely - garden, seeds, Petals, and all progress? This cannot be undone.')) return;
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    }

    function openWelcome() {
      resetModalChrome();
      document.getElementById('modal-title').textContent = 'Welcome to Bloom';
      document.getElementById('modal-body').innerHTML =
        '<p>Bloom gives you a gentle reason to get out and walk. Plant one of your starter seeds in the ' +
        'ground near you, then swing back by every so often to water it.</p>' +
        '<p>It grows into a single flower, then a whole flourishing cluster, over a few real days. Harvest ' +
        'it to keep for yourself or sell to the shop for Petals \u{1F338} - spend those on seeds for rarer, ' +
        'more valuable flowers.</p>' +
        '<p>Leave a flower too thirsty for too long and it\'ll wilt - water always brings it back, unless ' +
        'it\'s left dry for a very long while. No score, no clock, no rush.</p>';
      document.getElementById('modal-ok-btn').textContent = "Let's grow! \u{1F331}";
      document.getElementById('modal-ok-btn').onclick = function () {
        state.seenWelcome = true; saveState(); closeModal();
        if (!state.tutorialDone) startTutorial();
      };
      document.getElementById('modal-overlay').classList.add('open');
    }

    function openHowToPlay() {
      toggleMenu();
      resetModalChrome();
      document.getElementById('modal-title').textContent = 'How to Play';
      var s = state.stats;
      document.getElementById('modal-body').innerHTML =
        '<p><b>Plant</b> - tap the ground within a couple hexes of you to plant a seed. Only asks which ' +
        'tier if you own more than one.</p>' +
        '<p><b>Water</b> - tap a growing flower, then walk close enough for the Water button to light up.</p>' +
        '<p><b>Grow</b> - watered plants move from seed to sprout to a single bloom to a full flourishing ' +
        'cluster over a few days.</p>' +
        '<p><b>Harvest</b> - once a flower is in bloom or flourishing, walk up to it and Keep it for ' +
        'yourself or Sell it for Petals \u{1F338} - clusters sell for much more than a single bloom.</p>' +
        '<p><b>Shop</b> - tap your Petals total (top right) to buy Common, Rare, or Prized seeds. Rarer ' +
        'tiers cost more but sell for a lot more too.</p>' +
        '<p><b>Don\'t forget them</b> - flowers left dry for a long stretch wilt, then eventually return to ' +
        'the earth. A watering visit any time before that brings them right back.</p>' +
        '<p style="color:var(--text-dim);margin-top:14px">So far: ' + s.planted + ' planted &bull; ' +
        s.bloomed + ' bloomed &bull; ' + s.flourished + ' flourished &bull; ' + s.sold + ' sold for ' +
        s.earned + ' Petals &bull; ' + s.kept + ' kept</p>';
      document.getElementById('modal-ok-btn').textContent = 'Got it';
      document.getElementById('modal-ok-btn').onclick = closeModal;
      document.getElementById('modal-overlay').classList.add('open');
    }

    // Seed-tier picker for planting when the player owns more than one tier
    // (see attemptPlant). Reuses the same generic modal as Welcome/How to
    // Play/etc, just with the OK button hidden in favor of one button per tier.
    function openSeedPicker(q, r, owned) {
      resetModalChrome();
      document.getElementById('modal-title').textContent = 'Choose a Seed';
      document.getElementById('modal-body').innerHTML = '<div class="seed-pick-list">' +
        owned.map(function (o) {
          return '<button class="seed-pick-btn" style="border-color:' + o.t.color + '" onclick="plantSeedAt(' +
            q + ',' + r + ',' + o.i + ');closeModal();"><span style="color:' + o.t.color + '">' + o.t.name +
            '</span><span>x' + o.count + '</span></button>';
        }).join('') + '</div>';
      document.getElementById('modal-ok-btn').style.display = 'none';
      document.getElementById('modal-overlay').classList.add('open');
    }

    // Modals normally show one full-width OK button; the seed picker hides it
    // in favor of its own buttons. Called at the top of every other opener so
    // that state doesn't leak between modal uses.
    function resetModalChrome() { document.getElementById('modal-ok-btn').style.display = ''; }

    function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
    // Tapping the dimmed backdrop (not the card itself) closes whatever
    // modal is open - mainly so the seed picker has a way to back out
    // without planting, since it hides the usual OK/close button.
    document.getElementById('modal-overlay').addEventListener('click', function (e) {
      if (e.target.id === 'modal-overlay') closeModal();
    });

    // ---------------------------------------------------------------------
    //  SHOP
    // ---------------------------------------------------------------------
    function updateCurrencyPill() {
      document.getElementById('currency-pill').innerHTML = '\u{1F338} ' + state.currency;
    }

    function renderShopRows() {
      document.getElementById('shop-balance').innerHTML = 'You have <b>' + state.currency + '</b> \u{1F338} Petals';
      document.getElementById('shop-rows').innerHTML = TIERS.map(function (t, i) {
        var owned = state.seeds[t.key] || 0;
        var afford = state.currency >= t.seedCost;
        return '<div class="shop-row" style="border-color:' + t.color + '">' +
          '<div class="shop-row-info">' +
          '<div class="shop-row-name" style="color:' + t.color + '">' + t.name + ' Seed</div>' +
          '<div class="shop-row-meta">You have ' + owned + ' &bull; sells ' + t.sellSingle + '-' +
          t.sellCluster + ' \u{1F338}</div></div>' +
          '<button class="shop-buy-btn"' + (afford ? '' : ' disabled') + ' onclick="buySeed(' + i + ')">' +
          t.seedCost + ' \u{1F338}</button></div>';
      }).join('');
    }

    function buySeed(i) {
      var t = TIERS[i];
      if (state.currency < t.seedCost) return;
      state.currency -= t.seedCost;
      state.seeds[t.key] = (state.seeds[t.key] || 0) + 1;
      saveState();
      renderShopRows();
      updateCurrencyPill();
      toast('Bought a ' + t.name + ' seed \u{1F331}');
      vibrate(15);
      tutorialOnBuy();
    }

    // Opened both from the menu ("Seed Shop") and by tapping the currency
    // pill directly - callers handle closing the menu dropdown themselves
    // (see the menu button's onclick) so this doesn't force it open/closed.
    function openShop() {
      closePlantPanel(); // the shop and plant panel are both bottom sheets - only one at a time
      renderShopRows();
      document.getElementById('shop-panel').classList.add('open');
    }
    function closeShop() { document.getElementById('shop-panel').classList.remove('open'); }

    function toast(msg) {
      var c = document.getElementById('toast-container');
      var t = document.createElement('div');
      t.className = 'toast';
      t.textContent = msg;
      c.appendChild(t);
      requestAnimationFrame(function () { t.classList.add('show'); });
      setTimeout(function () {
        t.classList.remove('show');
        setTimeout(function () { t.remove(); }, 300);
      }, 2600);
    }

    function vibrate(ms) {
      if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} }
    }

    // ---------------------------------------------------------------------
    //  TUTORIAL (first run only)
    //  A brand-new save (see loadState's tutorialDone default) walks through
    //  one real plant -> water -> water -> harvest -> shop cycle. The growth
    //  waits are simulated (tutorialFastForward jumps the ONE tutorial plant's
    //  own growthMs, not a global time multiplier - see the growth engine's
    //  recomputePlant, which treats a jumped growthMs no differently from real
    //  elapsed time on every later call), so a new player sees the whole loop
    //  in under a minute instead of waiting real days. Every other step -
    //  actually planting, actually tapping Water, actually harvesting, actually
    //  buying - is a real action the player performs; nothing is auto-clicked
    //  for them. Always skippable via the banner's persistent link.
    // ---------------------------------------------------------------------
    var tutorial = { active: false, step: null, plantKey: null };

    function showTutorialBanner(html) {
      document.getElementById('tutorial-text').innerHTML = html;
      document.getElementById('tutorial-banner').classList.add('open');
    }
    function hideTutorialBanner() { document.getElementById('tutorial-banner').classList.remove('open'); }

    function startTutorial() {
      tutorial.active = true;
      tutorial.step = 'plant';
      tutorial.plantKey = null;
      showTutorialBanner('Let\'s plant your first seed - tap the ground within the green circle \u{1F331}');
    }

    function skipTutorial() {
      tutorial.active = false;
      state.tutorialDone = true;
      saveState();
      hideTutorialBanner();
    }

    function finishTutorial() {
      tutorial.active = false;
      state.tutorialDone = true;
      saveState();
      showTutorialBanner('You\'ve got the hang of it! Plant, water, harvest, and shop for better seeds ' +
        'whenever you like. Have fun out there! \u{1F337}');
      setTimeout(hideTutorialBanner, 6000);
    }

    // Jumps the one tutorial plant straight past the next stage's growth
    // threshold. recomputePlant can't tell this apart from real elapsed
    // time on any later call, so nothing needs to be "reverted" once the
    // tutorial ends - it's just a normal plant with a running start.
    function tutorialFastForward(p, targetStage) {
      var now = Date.now();
      p.growthMs = GROWTH_THRESHOLDS[targetStage] + 1000;
      p.lastGrowthCheckAt = now;
      var d = recomputePlant(p, now);
      if (d.stage >= 2 && !p.reachedBloom) { p.reachedBloom = true; state.stats.bloomed++; }
      if (d.stage >= 3 && !p.reachedFlourish) { p.reachedFlourish = true; state.stats.flourished++; }
      saveState();
      renderPlants();
      if (viewingKey === hexKey(p.q, p.r)) renderPlantPanel(viewingKey);
      updateHUD();
    }

    function tutorialOnPlant(key) {
      if (!tutorial.active || tutorial.step !== 'plant') return;
      tutorial.plantKey = key;
      tutorial.step = 'grow-sprout';
      showTutorialBanner('Nice! Watch it grow&hellip; \u{1F331}');
      setTimeout(function () {
        var p = state.plants[tutorial.plantKey];
        if (!p || !tutorial.active) return; // lost, or skipped while waiting - leave it be
        tutorialFastForward(p, 1);
        tutorial.step = 'water1';
        showTutorialBanner('It sprouted! Tap it, then tap Water to help it keep growing \u{1F4A7}');
      }, 2500);
    }

    function tutorialOnWater(key) {
      if (!tutorial.active || key !== tutorial.plantKey) return;
      if (tutorial.step === 'water1') {
        tutorial.step = 'grow-bloom';
        showTutorialBanner('Great, it\'s drinking that in&hellip; \u{1F4A7}');
        setTimeout(function () {
          var p = state.plants[tutorial.plantKey];
          if (!p || !tutorial.active) return;
          tutorialFastForward(p, 2);
          tutorial.step = 'water2';
          showTutorialBanner('It\'s in bloom! \u{1F338} One more visit and it\'ll flourish - tap it, then Water again \u{1F4A7}');
        }, 2500);
      } else if (tutorial.step === 'water2') {
        tutorial.step = 'grow-flourish';
        showTutorialBanner('Almost there&hellip; \u{1F4A7}');
        setTimeout(function () {
          var p = state.plants[tutorial.plantKey];
          if (!p || !tutorial.active) return;
          tutorialFastForward(p, 3);
          tutorial.step = 'harvest';
          showTutorialBanner('Flourishing! Tap it, then Keep it for yourself or Sell it to the shop \u{1F337}');
        }, 2500);
      }
    }

    function tutorialOnHarvest(key, sell, value) {
      if (!tutorial.active || tutorial.step !== 'harvest' || key !== tutorial.plantKey) return;
      // A flat bonus (on top of any sale) guarantees a first seed is
      // affordable either way - Keep is never presented as the "wrong"
      // choice, this just makes sure the shop step isn't a wall for it.
      var bonus = 15;
      state.currency += bonus;
      saveState();
      updateCurrencyPill();
      tutorial.step = 'shop';
      var msg = sell
        ? 'Nice sale! Plus a first-harvest bonus of +' + bonus + ' \u{1F338}.'
        : 'Kept for your collection! Here\'s a first-harvest bonus of +' + bonus + ' \u{1F338} to get you started.';
      showTutorialBanner(msg + ' Open the Shop (top right) and buy your next seed \u{1F337}');
    }

    function tutorialOnBuy() {
      if (!tutorial.active || tutorial.step !== 'shop') return;
      finishTutorial();
    }

    // ---------------------------------------------------------------------
    //  INIT
    // ---------------------------------------------------------------------
    tickPlants();               // recompute any growth/wilt accrued while closed
    updateHUD();
    updateCurrencyPill();
    setInterval(tickPlants, 60000);
  </script>
</body>
</html>
