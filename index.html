        'whenever you like. Have fun out there! \u{1F337}');
      // The fertilizer modal (if the tutorial plant flourished along the way)
      // waits for this banner to clear rather than stacking on top of it.
      setTimeout(function () { hideTutorialBanner(); maybeStartFertTutorial(); }, 6000);
    }

    // Clears the one tutorial plant's readiness wait so the next watering
    // advances it immediately. recomputePlant can't tell this apart from a
    // real 1.5 hours having passed, so nothing needs to be "reverted" once the
    // tutorial ends - it's just a normal plant with a running start.
    function tutorialMakeReady(p) {
      p.readyAt = Date.now();
      saveState();
      renderPlants();
      if (viewingKey === cellKey(p.q, p.r)) renderPlantPanel(viewingKey);
      updateHUD();
    }

    // Shared by every "wait, then it's ready again" beat. The callback
    // re-checks tutorial.active and the plant's existence because the player
    // can skip the tutorial - or harvest the plant - during the wait.
    function tutorialReadyAfterPause(bannerHtml) {
      tutorial.step = 'settling';
      setTimeout(function () {
        var p = state.plants[tutorial.plantKey];
        if (!p || !tutorial.active || tutorial.step !== 'settling') return;
        tutorialMakeReady(p);
        tutorial.step = 'water';
        setToolHint('water');
        showTutorialBanner(bannerHtml);
      }, 2500);
    }

    function tutorialOnPlant(key) {
      if (!tutorial.active || tutorial.step !== 'plant') return;
      tutorial.plantKey = key;
      showTutorialBanner('Nice! Give it a moment to settle in&hellip; \u{1F331}');
      tutorialReadyAfterPause('It\'s ready! Tap the toolbox (top left), pick the watering can, then tap ' +
        'your flower \u{1F4A7}');
    }

    // Out in the real game each of these beats is a 1.5-hour wait and a walk
    // back; here they're a 2.5s pause so the shape of the loop lands without
    // the player having to leave and return three times before anything
    // happens. Driven off the plant's real stage, not a step counter, so it
    // stays correct no matter which watering tap actually advanced it.
    function tutorialOnWater(key) {
      if (!tutorial.active || tutorial.step !== 'water' || key !== tutorial.plantKey) return;
      var p = state.plants[key];
      if (!p) return;
      if (p.stage >= MAX_STAGE) {
        tutorial.step = 'harvest';
        setToolHint('shear');
        showTutorialBanner('Flourishing! From the toolbox take the shears (or $ to sell) and press and ' +
          'hold on it \u{1F337}');
        return;
      }
      showTutorialBanner(GROWTH_MESSAGES[p.stage] + ' Give it another moment&hellip;');
      tutorialReadyAfterPause(p.stage === 1
        ? 'Ready again - water it once more to bring it into bloom \u{1F4A7}'
        : 'Ready again! One more watering makes it a full cluster \u{1F4A7}');
    }

    // Deliberately accepts a harvest at ANY step, not just the scripted one.
    // The Extract/Sell row is genuinely available from "In Bloom" onward, so
    // a player who harvests a stage early would otherwise leave the tutorial
    // pointing at a plant that no longer exists, with no way to advance it
    // short of Skip. Any pending settle timer sees the plant is gone and bows
    // out on its own, so the step move to 'shop' below can't be clobbered.
    function tutorialOnHarvest(key, mode, value) {
      if (!tutorial.active || key !== tutorial.plantKey) return;
      // A bonus (on top of any sale/extraction) guarantees a first seed is
      // affordable either way - Extract is never presented as the "wrong"
      // choice, this just makes sure the shop step isn't a wall for it. Tied
      // to SEED_COST rather than a literal so it cannot silently stop
      // covering a seed if the price is ever retuned; Extract pays no
      // Petals on its own, so this bonus is the whole budget for that path.
      var bonus = SEED_COST;
      state.currency += bonus;
      saveState();
      updateCurrencyPill();
      tutorial.step = 'shop';
      setToolHint(null);
      var msg = mode === 'sell'
        ? 'Nice sale! Plus a first-harvest bonus of +' + bonus + ' \u{1F338}.'
        : 'Seeds extracted! Here\'s a first-harvest bonus of +' + bonus + ' \u{1F338} to get you started too.';
      showTutorialBanner(msg + ' Open the Shop (top right) and buy your next seed \u{1F337}');
    }

    function tutorialOnBuy() {
      if (!tutorial.active || tutorial.step !== 'shop') return;
      finishTutorial();
    }

    // ---------------------------------------------------------------------
    //  FERTILIZER UNLOCK (first flourish, once)
    //  Fertilizer used to be buyable from the moment a save existed. Now it
    //  stays out of the Shop and Crossing Notes stays out of the menu until
    //  the player has actually grown one flower of their own all the way to
    //  flourishing - state.fertReady, set the instant that happens (see the
    //  reachedFlourish branch in waterPlant). The instant it does, this
    //  either shows the explainer modal right away or - if the onboarding
    //  tutorial banner is still up, which is the common case, since a
    //  scripted flourish is what sends that tutorial to its own harvest step
    //  - defers until skipTutorial/finishTutorial call back in here. Nothing
    //  actually unlocks (state.fertUnlocked) until the player dismisses that
    //  modal, so a save closed mid-way resumes it on the next GPS lock (see
    //  onGpsLocked) instead of silently granting or withholding access.
    // ---------------------------------------------------------------------
    function maybeStartFertTutorial() {
      if (state.fertUnlocked || !state.fertReady) return;
      if (tutorial.active) return; // onboarding still running - it calls back in when it wraps up
      openFertTutorial();
    }

    function openFertTutorial() {
      resetModalChrome();
      document.getElementById('modal-title').textContent = 'Fertilizer Unlocked! \u{1F33E}';
      document.getElementById('modal-body').innerHTML =
        '<p>Your first flower flourished into a full cluster - nice work! That opens up ' +
        '<b>fertilizer</b>, the only way to reach the colors the Shop never stocks.</p>' +
        '<p>Grow two flowers to <b>flourishing</b> on tiles next to each other, then buy a bag of ' +
        'fertilizer from the Shop. Equip it from the toolbox and press and hold either flower - or open ' +
        'its details and tap <b>Cross with a neighbour</b> - to cross it with a random flourishing ' +
        'neighbour, never one you pick. A seedling comes up in the gap between them, and its color stays ' +
        'a mystery until you water it into bloom.</p>' +
        '<p>Both parents rest for ' + formatDuration(BREED_COOLDOWN_MS) + ' afterwards. Your new ' +
        '<b>Crossing Notes</b> page in the menu will remember every pairing you try.</p>';
      document.getElementById('modal-ok-btn').textContent = 'Got it \u{1F331}';
      document.getElementById('modal-ok-btn').onclick = function () {
        state.fertUnlocked = true;
        saveState();
        closeModal();
        syncFertUnlockUI();
        toast('Fertilizer is in the Shop, and Crossing Notes is in the menu \u{1F338}');
      };
      document.getElementById('modal-overlay').classList.add('open');
    }

    // ---------------------------------------------------------------------
    //  WHAT'S NEW
    //  Called from onGpsLocked, after the onboarding/fertilizer branches
    //  above it - see that chain's own comments for why order matters. Only
    //  opens the popup when the save actually remembers a *different*,
    //  older version (see CHANGELOG/state.lastSeenVersion). A null
    //  lastSeenVersion (brand-new save, or an existing save from before
    //  this feature existed) is deliberately silent: it just starts
    //  tracking from here so the mechanism is live for the *next* update,
    //  rather than dumping a changelog on someone mid-tutorial or
    //  surfacing "what's new" for versions a returning player already
    //  lived through unannounced.
    // ---------------------------------------------------------------------
    // Returns true if it opened the popup (so onGpsLocked's caller can skip
    // the welcome-back tour on this same lock, the same way it already
    // defers to the fertilizer/tutorial modals above it), false otherwise.
    function maybeShowWhatsNew() {
      var current = document.getElementById('game-version').textContent;
      if (!state.lastSeenVersion) {
        // Nothing to compare against - just start remembering from now on.
        state.lastSeenVersion = current;
        saveState();
        return false;
      }
      if (state.lastSeenVersion === current) return false;
      openWhatsNew(current);
      return true;
    }

    function openWhatsNew(current) {
      var entry = CHANGELOG.filter(function (e) { return e.version === current; })[0];
      var changes = entry ? entry.changes : [];
      resetModalChrome();
      document.getElementById('modal-title').textContent = 'What\'s New in ' + current;
      document.getElementById('modal-body').innerHTML =
        '<ul>' + changes.map(function (c) { return '<li>' + c + '</li>'; }).join('') + '</ul>';
      document.getElementById('modal-ok-btn').textContent = 'Got it \u{1F331}';
      // Recorded on close, not on open: if the app crashes or the tab closes
      // with the modal still up, lastSeenVersion is still the old value, so
      // the popup correctly shows again next launch instead of silently
      // being marked "seen" for a version the player never actually read.
      document.getElementById('modal-ok-btn').onclick = function () {
        state.lastSeenVersion = current;
        saveState();
        closeModal();
      };
      document.getElementById('modal-overlay').classList.add('open');
    }

    // Reveals the two pieces of UI that were gated on state.fertUnlocked -
    // the Shop's fertilizer sack (see renderShopRows) and the Crossing Notes
    // menu entry. Called once at boot (in case a returning player is already
    // unlocked) and again the moment the fertilizer modal above is dismissed.
    function syncFertUnlockUI() {
      document.body.classList.toggle('fert-unlocked', state.fertUnlocked);
      if (document.getElementById('shop-panel').classList.contains('open')) renderShopRows();
    }

    // ---------------------------------------------------------------------
    //  INIT
    // ---------------------------------------------------------------------
    initToolRail();             // draw the three tool icons once
    syncFertUnlockUI();         // show Crossing Notes/fert sack right away for an already-unlocked save
    syncGreenhouseUnlockUI();   // show the Greenhouse menu entry right away for an already-unlocked save
    recomputeRainRingsFull();   // seed rain rings from whatever's already planted - see its own comment
    catchUpSprinklersOffline(); // bank any stages a placed sprinkler earned while fully closed
    catchUpRainRingsOffline();  // then bank whatever an already-active rain ring earned the same way
    tickPlants();               // recompute any growth/wilt accrued while closed
    renderWild();               // wild flowers persist across sessions until picked
    renderSprinklers();         // placed sprinklers persist across sessions until picked back up
    renderWeeds();              // weeds persist across sessions until plucked, same as wild flowers
    renderRainRings();          // rain rings persist across sessions too, same as sprinklers
    updateHUD();
    updateCurrencyPill();
    setInterval(tickPlants, 60000);
    // Its own, much shorter interval than tickPlants - a sprinkler is meant
    // to read as "noticing" a flower needs water within about a second (see
    // SPRINKLER_ANIM_DELAY_MS), not on the same minute-long cadence the
    // player's own badges refresh on.
    setInterval(tickSprinklers, SPRINKLER_TICK_MS);
    setInterval(tickRainRings, RAIN_TICK_MS);
  </script>
</body>
</html>
