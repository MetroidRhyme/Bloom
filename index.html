<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>BLOOM</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <style>
    :root {
      --hud-top-h: 74px;
      --bg: #eaf6ee;
      --panel-bg: rgba(255,255,255,0.94);
      --panel-border: rgba(60,40,20,0.08);
      --text: #332e28;
      --text-dim: #8a8478;
      --green: #4caf6d;
      --green-dark: #3d8f57;
      --blue: #4aa3ff;
      --pink: #ff6fa0;
      --amber: #f0a93a;
      --shadow: 0 6px 24px rgba(60,40,20,0.16);
      --shadow-sm: 0 2px 10px rgba(60,40,20,0.14);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bg); }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--text); }
    button { font-family: inherit; }

    #map { position: fixed; inset: 0; background: var(--bg); }
    .leaflet-container { background: var(--bg); }

    /* ================= TOP BAR ================= */
    #hud-top {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(255,255,255,0.86));
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 14px 16px 10px;
      display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
      box-shadow: var(--shadow-sm);
      border-radius: 0 0 22px 22px;
    }
    #title-wrap { display: flex; flex-direction: column; line-height: 1.1; }
    #game-title {
      font-weight: 800; font-size: 23px; letter-spacing: 1.5px;
      background: linear-gradient(90deg, #ff6fa0, #f0a93a, #4caf6d, #4aa3ff);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    #game-version { font-size: 10px; color: var(--text-dim); font-weight: 600; letter-spacing: 0.4px; margin-top: 2px; }

    #top-right { display: flex; align-items: center; gap: 8px; }
    #gps-status {
      font-size: 10px; font-weight: 700; letter-spacing: 0.5px; padding: 5px 10px;
      border-radius: 999px; background: rgba(240,169,58,0.16); color: #a06a00;
      white-space: nowrap;
    }
    #gps-status.pending { animation: pulse 1.6s ease-in-out infinite; }
    #gps-status.locked { background: rgba(76,175,109,0.16); color: var(--green-dark); }
    #gps-status.err { background: rgba(240,169,58,0.22); color: #a06a00; }

    #currency-pill {
      font-size: 11px; font-weight: 800; letter-spacing: 0.3px; padding: 5px 10px;
      border-radius: 999px; background: rgba(240,169,58,0.16); color: #a06a00;
      white-space: nowrap; cursor: pointer;
    }
    #currency-pill:active { background: rgba(240,169,58,0.26); }

    #top-menu-btn {
      width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--panel-border);
      background: rgba(255,255,255,0.9); color: var(--text); font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-sm);
    }
    #top-menu-btn:active { background: rgba(0,0,0,0.06); }

    #menu-dropdown {
      position: fixed; top: 68px; right: 16px; z-index: 1001;
      background: var(--panel-bg); border-radius: 16px; box-shadow: var(--shadow);
      border: 1px solid var(--panel-border); overflow: hidden;
      display: none; min-width: 190px;
    }
    #menu-dropdown.open { display: block; }
    #menu-dropdown button {
      display: block; width: 100%; text-align: left; padding: 13px 16px; border: none;
      background: none; font-size: 14px; color: var(--text); cursor: pointer;
      border-bottom: 1px solid var(--panel-border);
    }
    #menu-dropdown button:last-child { border-bottom: none; }
    #menu-dropdown button:active { background: rgba(0,0,0,0.05); }
    #menu-dropdown button.danger { color: #c0554a; }

    /* ================= BOTTOM HUD ================= */
    #hud-bottom {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 900;
      background: linear-gradient(0deg, rgba(255,255,255,0.97), rgba(255,255,255,0.88));
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 14px 18px calc(14px + env(safe-area-inset-bottom, 0px));
      border-radius: 22px 22px 0 0;
      box-shadow: var(--shadow-sm);
      text-align: center;
    }
    #hud-status-line { font-size: 13.5px; color: var(--text); font-weight: 600; }

    #recenter-btn {
      position: fixed; right: 16px; bottom: 96px; z-index: 900;
      width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--panel-border);
      background: var(--panel-bg); box-shadow: var(--shadow); font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    #recenter-btn:active { background: rgba(0,0,0,0.06); }

    /* ================= TUTORIAL BANNER ================= */
    /* First-run only (see the TUTORIAL section in the script). Sits just
       below the top bar, using --hud-top-h so it never overlaps it. */
    #tutorial-banner {
      position: fixed; left: 12px; right: 12px; top: calc(var(--hud-top-h) + 10px); z-index: 950;
      background: linear-gradient(135deg, #fff6e0, #ffffff);
      border: 2px solid var(--amber); border-radius: 16px; box-shadow: var(--shadow);
      padding: 12px 16px; text-align: center; display: none;
    }
    #tutorial-banner.open { display: block; }
    #tutorial-text { font-size: 13.5px; font-weight: 700; line-height: 1.4; }
    #tutorial-skip-link {
      display: inline-block; margin-top: 6px; font-size: 11px; font-weight: 700;
      color: var(--text-dim); text-decoration: underline; cursor: pointer;
    }

    /* ================= PLANT PANEL ================= */
    #plant-panel {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 1100;
      background: var(--panel-bg); border-radius: 24px 24px 0 0; box-shadow: var(--shadow);
      padding: 10px 22px calc(22px + env(safe-area-inset-bottom, 0px));
      transform: translateY(105%);
      transition: transform 0.28s ease;
    }
    #plant-panel.open { transform: translateY(0); }
    .panel-handle { width: 40px; height: 4px; border-radius: 2px; background: var(--panel-border); margin: 4px auto 10px; }
    #panel-close-btn {
      position: absolute; top: 14px; right: 16px; width: 30px; height: 30px; border-radius: 50%;
      border: none; background: rgba(0,0,0,0.05); font-size: 17px; color: var(--text-dim); cursor: pointer;
    }
    #plant-icon-big { display: flex; align-items: center; justify-content: center; margin: 4px auto 8px; }
    #plant-title { text-align: center; font-size: 18px; font-weight: 800; margin-bottom: 2px; }
    #plant-meta { text-align: center; font-size: 12.5px; color: var(--text-dim); margin-bottom: 12px; }

    /* Progress toward the next stage, i.e. how long until this plant is ready
       for its next watering visit. There is no water-level bar any more -
       water is not a resource that meters down, it is just the action that
       advances a stage (or clears a cosmetic wilt). */
    .growth-bar-track { width: 100%; height: 10px; background: rgba(0,0,0,0.07); border-radius: 999px; overflow: hidden; }
    #growth-bar-fill { height: 100%; background: linear-gradient(90deg, var(--green), #8fd9a8); border-radius: 999px; transition: width 0.4s ease; }
    /* Wild flowers reuse the same bar as a life bar - amber, so an emptying
       bar is never mistaken for growth. */
    #growth-bar-fill.fading { background: linear-gradient(90deg, var(--amber), #f5c169); }
    #growth-bar-label { text-align: center; font-size: 11.5px; color: var(--text-dim); margin-top: 5px; margin-bottom: 10px; }

    #plant-status-line { text-align: center; font-size: 13.5px; font-weight: 700; margin-bottom: 14px; }
    .status-good { color: var(--green-dark); }
    .status-wilt { color: var(--blue); }

    #plant-action-btn {
      display: block; width: 100%; padding: 14px; border: none; border-radius: 16px;
      font-size: 15px; font-weight: 800; letter-spacing: 0.3px; cursor: pointer;
      background: linear-gradient(90deg, var(--blue), #7ec8ff); color: #fff; box-shadow: var(--shadow-sm);
    }
    #plant-action-btn:disabled { background: #d8d4c8; color: #948e80; box-shadow: none; cursor: default; }

    /* Hidden by default - renderPlantPanel shows this only once a plant has
       reached single-bloom or flourishing stage and the player is in range. */
    #harvest-row { display: none; gap: 10px; margin-top: 10px; }
    .harvest-btn {
      flex: 1; padding: 13px; border-radius: 14px; font-size: 14px; font-weight: 800;
      cursor: pointer; box-shadow: var(--shadow-sm);
    }
    .keep-btn { background: #fff; color: var(--green-dark); border: 2px solid var(--green); }
    .sell-btn { background: linear-gradient(90deg, var(--amber), #f5c169); color: #fff; border: none; }

    /* ================= SHOP PANEL ================= */
    #shop-panel {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 1100;
      background: var(--panel-bg); border-radius: 24px 24px 0 0; box-shadow: var(--shadow);
      padding: 10px 22px calc(22px + env(safe-area-inset-bottom, 0px));
      transform: translateY(105%);
      transition: transform 0.28s ease;
    }
    #shop-panel.open { transform: translateY(0); }
    #shop-close-btn {
      position: absolute; top: 14px; right: 16px; width: 30px; height: 30px; border-radius: 50%;
      border: none; background: rgba(0,0,0,0.05); font-size: 17px; color: var(--text-dim); cursor: pointer;
    }
    #shop-title { text-align: center; font-size: 18px; font-weight: 800; margin: 4px 0 2px; }
    #shop-balance { text-align: center; font-size: 13px; color: var(--text-dim); margin-bottom: 16px; }
    /* Seven species now, so the sheet scrolls internally instead of growing
       past the top of the screen on a short phone. */
    #shop-rows { max-height: 46vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .shop-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px 14px; border: 2px solid; border-radius: 16px; margin-bottom: 10px;
    }
    .shop-row-name { font-size: 14.5px; font-weight: 800; }
    .shop-row-meta { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }
    .shop-buy-btn {
      flex-shrink: 0; padding: 10px 16px; border: none; border-radius: 12px;
      font-size: 13.5px; font-weight: 800; cursor: pointer; color: #fff;
      background: linear-gradient(90deg, var(--green), var(--green-dark)); box-shadow: var(--shadow-sm);
    }
    .shop-buy-btn:disabled { background: #d8d4c8; color: #948e80; box-shadow: none; cursor: default; }

    /* ================= MODAL ================= */
    #modal-overlay {
      position: fixed; inset: 0; z-index: 1500; background: rgba(30,25,15,0.4);
      display: none; align-items: center; justify-content: center; padding: 20px;
    }
    #modal-overlay.open { display: flex; }
    #modal-card {
      background: var(--panel-bg); border-radius: 22px; padding: 26px 24px; max-width: 360px;
      box-shadow: var(--shadow); text-align: center;
    }
    #modal-title { font-size: 20px; font-weight: 800; margin-bottom: 12px; }
    #modal-body { font-size: 14px; line-height: 1.55; color: var(--text); margin-bottom: 18px; text-align: left; }
    #modal-body p { margin: 0 0 10px; }
    /* Up to seven owned species can be listed, so this scrolls rather than
       pushing the modal's buttons off-screen. */
    .seed-pick-list { display: flex; flex-direction: column; gap: 10px; max-height: 52vh; overflow-y: auto; }
    .seed-pick-btn {
      display: flex; align-items: center; justify-content: space-between; width: 100%;
      padding: 13px 16px; border: 2px solid; border-radius: 14px; background: #fff;
      font-size: 14.5px; font-weight: 800; cursor: pointer;
    }
    .seed-pick-btn span:last-child { color: var(--text-dim); font-weight: 700; }
    #modal-body p:last-child { margin-bottom: 0; }
    #modal-ok-btn {
      display: block; width: 100%; padding: 14px; border: none; border-radius: 16px;
      font-size: 15px; font-weight: 800; cursor: pointer; color: #fff;
      background: linear-gradient(90deg, var(--green), var(--green-dark)); box-shadow: var(--shadow-sm);
    }

    /* ================= TOAST ================= */
    #toast-container {
      position: fixed; left: 0; right: 0; bottom: 92px; z-index: 1300;
      display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none;
    }
    .toast {
      background: rgba(40,35,25,0.92); color: #fff; font-size: 13px; font-weight: 600;
      padding: 10px 18px; border-radius: 999px; box-shadow: var(--shadow-sm);
      opacity: 0; transform: translateY(8px); transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* ================= ANIMATIONS ================= */
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    @keyframes sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
    .flourish-cluster { animation: sway 3.2s ease-in-out infinite; transform-origin: bottom center; }

    /* Wild flowers wear a soft halo so they read as "found" rather than
       "planted" at a glance, without needing a second marker shape. */
    @keyframes wild-pulse { 0%, 100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 0.9; transform: scale(1.12); } }
    .wild-glow { animation: wild-pulse 2.8s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important; animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="hud-top">
    <div id="title-wrap">
      <span id="game-title">BLOOM &#x1F338;</span>
      <span id="game-version">v1.11.0</span>
    </div>
    <div id="top-right">
      <span id="gps-status" class="pending">LOCATING&hellip;</span>
      <span id="currency-pill" onclick="openShop()" title="Open the Seed Shop">&#x1F338; 0</span>
      <button id="top-menu-btn" onclick="toggleMenu()">&#8942;</button>
    </div>
  </div>

  <div id="menu-dropdown">
    <button onclick="toggleMenu();openShop()">Seed Shop</button>
    <button onclick="openWildInfo()">Wild Flowers</button>
    <button onclick="openHowToPlay()">How to Play</button>
    <button class="danger" onclick="onResetSave()">Reset Save</button>
  </div>

  <button id="recenter-btn" onclick="onRecenter()" title="Center on me">&#x1F3AF;</button>

  <div id="tutorial-banner">
    <div id="tutorial-text">&nbsp;</div>
    <span id="tutorial-skip-link" onclick="skipTutorial()">Skip tutorial</span>
  </div>

  <div id="hud-bottom">
    <div id="hud-status-line">Finding your location&hellip;</div>
  </div>

  <div id="plant-panel">
    <div class="panel-handle"></div>
    <button id="panel-close-btn" onclick="closePlantPanel()">&times;</button>
    <div id="plant-icon-big"></div>
    <div id="plant-title">&nbsp;</div>
    <div id="plant-meta">&nbsp;</div>
    <div id="growth-bar-track" class="growth-bar-track"><div id="growth-bar-fill" style="width:0%"></div></div>
    <div id="growth-bar-label">&nbsp;</div>
    <div id="plant-status-line">&nbsp;</div>
    <button id="plant-action-btn">Water</button>
    <div id="harvest-row">
      <button id="keep-btn" class="harvest-btn keep-btn">Keep &#x1F33C;</button>
      <button id="sell-btn" class="harvest-btn sell-btn">Sell</button>
    </div>
  </div>

  <div id="shop-panel">
    <div class="panel-handle"></div>
    <button id="shop-close-btn" onclick="closeShop()">&times;</button>
    <div id="shop-title">Seed Shop</div>
    <div id="shop-balance">&nbsp;</div>
    <div id="shop-rows"></div>
  </div>

  <div id="modal-overlay">
    <div id="modal-card">
      <div id="modal-title">Welcome to Bloom</div>
      <div id="modal-body"></div>
      <button id="modal-ok-btn" onclick="closeModal()">Let's grow! &#x1F331;</button>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script>
    // =====================================================================
    //  BLOOM - a chill, walking-based gardening game.
    //  Plant seeds on foot, water them on your next walk, watch them grow.
    //  No score pressure and no failure state at all - flowers cannot die and
    //  are never taken away, so the only thing a long absence changes is how
    //  the garden looks. The whole point is a relaxed excuse to go outside.
    //
    //  Encoding note: every emoji below is written as a JS \u{...} escape
    //  (in script) or an HTML numeric entity &#x...; (in markup) rather than
    //  a raw UTF-8 glyph, so the file itself contains only ASCII bytes.
    // =====================================================================

    // ---------------------------------------------------------------------
    //  CONSTANTS
    // ---------------------------------------------------------------------
    var HOUR = 3600000;

    // Hex grid cell size - same ~20m scale used by the Porter game backbone,
    // a good balance between "walkable in a few minutes" and "not so tiny
    // that GPS jitter causes mis-taps".
    var CELL_LAT_DEG = 20 / 111111;
    var SQ3 = Math.sqrt(3);
    // Longitude degrees-per-meter shrink with latitude (cos(lat) factor), so
    // this is corrected once at first GPS lock and persisted - see onGpsLocked.
    var CELL_LNG_DEG = parseFloat(localStorage.getItem('bloom_cell_lng')) || CELL_LAT_DEG;

    var PLANT_RANGE_HEX = 2;   // how close (in hexes) you must be to plant or water
    // Visual-only radius for the glow circle around the player; derived from
    // the same hex lattice so it roughly matches the real (hex-distance)
    // interaction range without needing a second magic number.
    var RANGE_METERS = PLANT_RANGE_HEX * CELL_LAT_DEG * 111111 * SQ3;

    // Full water drains to empty over 2 days, at which point the flower starts
    // *looking* wilted. That is the entire consequence: wilting is cosmetic.
    // Plants cannot die and are never removed from the ground, so going away
    // for a fortnight costs you nothing but a droopy-looking garden and one
    // watering visit to perk it back up. A browser page can't send a reminder
    // notification, so any real penalty here would land as an unannounced loss
    // on a player who had no way to know it was coming - exactly the kind of
    // pressure this game is meant not to have.
    var WATER_DURATION_MS = 48 * HOUR;

    // Stages are advanced by WATERING, not by elapsed time. A plant becomes
    // "ready" STAGE_READY_MS after it was planted or last advanced, and the
    // next watering visit is what actually moves it up a stage - so a full
    // cluster costs three separate walks back, which is the entire point of
    // the game. (The old model accumulated growth purely from elapsed time,
    // which meant a plant reached a full cluster with zero watering visits
    // and the watering mechanic had no mechanical weight at all.)
    var STAGE_READY_MS = 12 * HOUR;
    var MAX_STAGE = 3;
    var STAGE_LABELS = ['Seed', 'Sprout', 'In Bloom', 'Flourishing'];
    // Indexed by the stage just reached; index 0 is unused (you never water
    // your way *into* being a seed).
    var GROWTH_MESSAGES = [
      '',
      'It sprouted! \u{1F331}',
      'It burst into bloom! \u{1F338}',
      'It flourished into a full cluster! \u{1F337}'
    ];

    // Every species is bought by name and every species is worth exactly the
    // same, so which flower you plant is a matter of taste rather than a
    // power decision. (The old common/rare/prized tiers made higher tiers
    // strictly dominant: growth time did not vary by tier, so once you could
    // afford the top one there was no reason to ever plant anything else,
    // and two thirds of the shop became dead content.)
    var SPECIES = [
      { key: 'sunflower',  emoji: '\u{1F33B}', name: 'Sunflower', color: '#ffd23f' },
      { key: 'tulip',      emoji: '\u{1F337}', name: 'Tulip',     color: '#ff7fae' },
      { key: 'daisy',      emoji: '\u{1F33C}', name: 'Daisy',     color: '#fff2a8' },
      { key: 'hibiscus',   emoji: '\u{1F33A}', name: 'Hibiscus',  color: '#ff8aa8' },
      { key: 'blossom',    emoji: '\u{1F338}', name: 'Blossom',   color: '#ffc7e0' },
      { key: 'rose',       emoji: '\u{1F339}', name: 'Rose',      color: '#f0637f' },
      { key: 'lotus',      emoji: '\u{1FAB7}', name: 'Lotus',     color: '#caa8f5' }
    ];
    function speciesFor(key) {
      for (var i = 0; i < SPECIES.length; i++) if (SPECIES[i].key === key) return SPECIES[i];
      return SPECIES[0];
    }

    // One flat price for every seed, and one flat payout for every flower.
    // SELL_SINGLE sits just under SEED_COST on purpose so cashing out at the
    // single-bloom stage is never clearly "correct" - SELL_CLUSTER is the real
    // payoff, rewarding the extra watering visit without punishing anyone who
    // harvests early or just wants to Keep a flower instead of selling it.
    var SEED_COST = 20;
    var SELL_SINGLE = 16;
    var SELL_CLUSTER = 40;
    function harvestValue(p, stage) { return stage >= MAX_STAGE ? SELL_CLUSTER : SELL_SINGLE; }

    // ---- Wild flowers ----------------------------------------------------
    // Once per local calendar day, the first time the page is opened, a crop of
    // wild blooms is scattered at random around the player. They cost nothing,
    // can't be watered or grown, and are simply there to be found and picked -
    // a daily reason to take a walk. Leave one and it wilts after 12 hours,
    // then disappears 6 hours after that; unlike your own flowers, these are
    // genuinely fleeting, which is what makes going out today worth it.
    //
    // Placement is purely random within WILD_SPAWN_RADIUS_M. There is no road
    // or footpath check: the raster basemap carries no geometry to test
    // against, and the third-party lookup that would provide it was not worth
    // the dependency, the failure modes, or sending a location off-device.
    // Some will land somewhere you can't stand - they expire on their own, and
    // there are always others.
    var WILD_MAX = 10;               // most wild flowers on the map at one time
    var WILD_MIN_HEX_GAP = 5;        // min hex distance from each other AND from your own plants
    // At zoom 17 a phone shows roughly 370m x 730m, so at 800m most of a crop
    // starts off-screen. That is deliberate - walking to them is the point -
    // and the Wild Flowers screen in the menu is what keeps it from reading
    // as "nothing spawned".
    var WILD_SPAWN_RADIUS_M = 800;
    var WILD_WILT_MS = 12 * HOUR;    // uncollected: starts looking wilted
    var WILD_GONE_MS = 18 * HOUR;    // ...and vanishes 6 hours after that

    // ---------------------------------------------------------------------
    //  STATE & PERSISTENCE
    //  Small, single-blob save (unlike Porter's many-key layout) since
    //  Bloom's whole state is just a dictionary of plants plus a few stats.
    // ---------------------------------------------------------------------
    var STORAGE_KEY = 'bloom_state_v1';
    // A factory, not a shared object literal - state.seeds gets mutated in
    // place by plantSeedAt/buySeed, so every caller needs its own fresh copy
    // (a shared literal here would let gameplay silently mutate the "starter"
    // values themselves, corrupting what a fresh/reset save starts with).
    // One of each of the first three, rather than three of one - a new player
    // meets the "pick which flower" choice on their very first plant.
    function starterSeeds() { return { sunflower: 1, tulip: 1, daisy: 1 }; }

    // Seeds used to be counted per tier (common/rare/prized) and the species
    // was rolled at random within the tier. They are counted per species now,
    // so a pre-v1.8 save's tier counts are handed out round-robin across the
    // species that tier used to be able to produce - same number of seeds, no
    // refund maths, and nothing in the player's pocket disappears.
    var OLD_TIER_SPECIES = {
      common: ['sunflower', 'tulip', 'daisy'],
      rare:   ['hibiscus', 'blossom'],
      prized: ['rose', 'lotus']
    };
    function migrateSeeds(seeds) {
      if (!seeds) return starterSeeds();
      var isTierKeyed = Object.keys(seeds).some(function (k) { return OLD_TIER_SPECIES[k]; });
      if (!isTierKeyed) return seeds;
      var out = {};
      Object.keys(OLD_TIER_SPECIES).forEach(function (tierKey) {
        var pool = OLD_TIER_SPECIES[tierKey];
        for (var i = 0; i < (seeds[tierKey] || 0); i++) {
          var s = pool[i % pool.length];
          out[s] = (out[s] || 0) + 1;
        }
      });
      return out;
    }

    // Saves from before the water-gated growth model (v1.4.x and earlier)
    // stored a `growthMs` accumulator instead of an explicit `stage`. Convert
    // once on load: award whatever stage the old thresholds had already earned
    // them, then start the readiness clock from now rather than backdating it,
    // so a returning player's next watering advances one stage instead of
    // silently swallowing all the visits they never had to make.
    var OLD_GROWTH_THRESHOLDS = [0, 8 * HOUR, 20 * HOUR, 40 * HOUR];
    function migratePlant(p, now) {
      if (typeof p.stage === 'number') return p;
      var g = p.growthMs || 0;
      p.stage = 0;
      for (var i = OLD_GROWTH_THRESHOLDS.length - 1; i >= 0; i--) {
        if (g >= OLD_GROWTH_THRESHOLDS[i]) { p.stage = i; break; }
      }
      p.readyAt = now;
      delete p.growthMs;
      delete p.lastGrowthCheckAt;
      return p;
    }

    function loadState() {
      var def = {
        plants: {},
        wild: {},            // hex key -> wild flower, spawned daily along real paths
        lastWildDay: null,   // local YYYY-MM-DD of the last successful wild spawn
        // No `lost` counter - plants cannot die, so nothing is ever lost.
        stats: { planted: 0, bloomed: 0, flourished: 0, kept: 0, sold: 0, earned: 0 },
        seeds: starterSeeds(),
        currency: 0,
        following: true,
        seenWelcome: false,
        tutorialDone: false // brand-new save -> the onboarding tutorial should run
      };
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return def;
      try {
        var parsed = JSON.parse(raw);
        var plants = parsed.plants || {};
        var migrateNow = Date.now();
        Object.keys(plants).forEach(function (k) { migratePlant(plants[k], migrateNow); });
        return {
          plants: plants,
          wild: parsed.wild || {},
          lastWildDay: parsed.lastWildDay || null,
          stats: Object.assign({}, def.stats, parsed.stats || {}),
          // A save that predates seeds/currency (v1.1.x) gets starter seeds
          // bootstrapped in rather than being left unable to plant anything -
          // the old free-plant mechanic this replaces never cost seeds. A
          // v1.2-v1.7 save gets its tier counts converted to species counts.
          seeds: migrateSeeds(parsed.seeds),
          currency: typeof parsed.currency === 'number' ? parsed.currency : 0,
          following: parsed.following !== false,
          seenWelcome: !!parsed.seenWelcome,
          // Any save that already exists predates the tutorial - never
          // interrupt an already-playing garden with onboarding.
          tutorialDone: typeof parsed.tutorialDone === 'boolean' ? parsed.tutorialDone : true
        };
      } catch (e) {
        return def; // corrupted save falls back to defaults rather than breaking load
      }
    }

    var state = loadState();
    state.userPos = null; // runtime-only, never persisted

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        plants: state.plants, wild: state.wild, lastWildDay: state.lastWildDay,
        stats: state.stats, seeds: state.seeds, currency: state.currency,
        following: state.following, seenWelcome: state.seenWelcome, tutorialDone: state.tutorialDone
      }));
    }

    // ---------------------------------------------------------------------
    //  HEX MATH (flat-top axial, same shape as the Porter backbone)
    // ---------------------------------------------------------------------
    function hexRound(qf, rf) {
      var sf = -qf - rf;
      var q = Math.round(qf), r = Math.round(rf), s = Math.round(sf);
      var dq = Math.abs(q - qf), dr = Math.abs(r - rf), ds = Math.abs(s - sf);
      if (dq > dr && dq > ds) q = -r - s;
      else if (dr > ds) r = -q - s;
      return { q: q, r: r };
    }
    function latLngToHex(lat, lng) {
      var nx = lng / CELL_LNG_DEG, ny = lat / CELL_LAT_DEG;
      return hexRound(2 / 3 * nx, -1 / 3 * nx + SQ3 / 3 * ny);
    }
    function hexCenter(q, r) {
      return { lat: (SQ3 / 2 * q + SQ3 * r) * CELL_LAT_DEG, lng: (3 / 2 * q) * CELL_LNG_DEG };
    }
    function hexKey(q, r) { return q + ',' + r; }
    function hexDist(q1, r1, q2, r2) {
      var dq = q1 - q2, dr = r1 - r2;
      return (Math.abs(dq) + Math.abs(dr) + Math.abs(dq + dr)) / 2;
    }

    // Same six directions Porter uses, paired with hexVerticesPx's edge index
    // (edge `e`, between vertices e and e+1, borders the neighbor at HEX_NEIGHBORS[e]).
    var HEX_NEIGHBORS = [[1, 0], [0, 1], [-1, 1], [-1, 0], [0, -1], [1, -1]];

    // Six corner points (in Leaflet layer-point space) of the hex at (q, r),
    // used only by the grid-mesh renderer below - plant markers are placed by
    // lat/lng center (hexCenter), not by these pixel vertices.
    function hexVerticesPx(q, r) {
      var verts = [];
      for (var i = 0; i < 6; i++) {
        var angle = Math.PI / 3 * i;
        var lat = (SQ3 / 2 * q + SQ3 * r + Math.sin(angle)) * CELL_LAT_DEG;
        var lng = (3 / 2 * q + Math.cos(angle)) * CELL_LNG_DEG;
        verts.push(map.latLngToLayerPoint([lat, lng]));
      }
      return verts;
    }
    // Cheap cull against gridRenderer's own (padded) bounds, in layer points.
    function hexOnScreen(verts) {
      var b = gridRenderer && gridRenderer._bounds;
      if (!b) return true;
      return verts.some(function (v) {
        return v.x >= b.min.x - 4 && v.x <= b.max.x + 4 && v.y >= b.min.y - 4 && v.y <= b.max.y + 4;
      });
    }

    // ---------------------------------------------------------------------
    //  GROWTH ENGINE
    //  Fully timestamp-derived so it stays correct across long offline gaps
    //  (the whole point of the game is that you walk away for hours/days).
    // ---------------------------------------------------------------------
    // Derives a plant's display state as of `now`. Purely a read - every stored
    // field it looks at (lastWateredAt, stage, readyAt) is only ever written by
    // an actual player action, so this is safe to call from render paths as
    // often as you like and can never advance the game on its own.
    //
    // `ready` is the whole loop: a plant that has finished its STAGE_READY_MS
    // wait is waiting on a real watering visit to move up a stage. Both
    // readiness and stage are entirely independent of `wilted`, which is now
    // purely a look - a wilted plant grows exactly as well as a lush one, so
    // neglect never costs progress, only appearances.
    function recomputePlant(p, now) {
      var d = {
        wilted: (now - p.lastWateredAt) >= WATER_DURATION_MS,
        stage: p.stage,
        ready: p.stage < MAX_STAGE && now >= p.readyAt,
        readyIn: Math.max(0, p.readyAt - now)
      };
      p._d = d;
      return d;
    }

    // Consumes one seed of the given species from inventory and plants exactly
    // that flower - no randomness, you get what you chose. Callers are expected
    // to have already confirmed a seed of this species is actually owned (see
    // attemptPlant/openSeedPicker) - this only re-checks defensively, it
    // doesn't surface its own error UI. Returns the new plant's hex key, or
    // null if there was no seed to spend.
    function plantSeedAt(q, r, speciesKey) {
      if (!(state.seeds[speciesKey] > 0)) return null;
      state.seeds[speciesKey]--;

      var now = Date.now();
      var species = speciesFor(speciesKey).key;
      var c = hexCenter(q, r);
      var key = hexKey(q, r);
      state.plants[key] = {
        q: q, r: r, lat: c.lat, lng: c.lng, species: species,
        plantedAt: now, lastWateredAt: now, stage: 0, readyAt: now + STAGE_READY_MS,
        reachedBloom: false, reachedFlourish: false
      };
      state.stats.planted++;
      saveState();
      renderPlants();
      updateHUD();
      toast('\u{1F331} ' + speciesFor(speciesKey).name + ' planted! It will be ready for water in ' +
        formatDuration(STAGE_READY_MS) + '.');
      vibrate(20);
      tutorialOnPlant(key);
      return key;
    }

    // Decides how to plant on an empty, in-range hex: always confirms via the
    // seed-tier picker first (even with only one tier owned) so a stray tap
    // on the map never silently spends a seed - points at the shop instead
    // when there's nothing to plant.
    function attemptPlant(q, r) {
      var owned = SPECIES.map(function (s) { return { s: s, count: state.seeds[s.key] || 0 }; })
        .filter(function (o) { return o.count > 0; });
      if (owned.length === 0) { toast("You're out of seeds - open the Shop \u{1F338} to buy more"); return; }
      openSeedPicker(q, r, owned);
    }

    // Watering is always allowed in range and always refills the tank (which
    // resets the wilt/death clock), but it only advances a stage if the plant
    // has finished its readiness wait - that separation is what makes each
    // stage cost its own walk back without ever making a tap feel wasted.
    // Bloom/flourish milestones are credited here, at the moment they actually
    // happen, rather than being swept up later by tickPlants.
    function waterPlant(key) {
      var p = state.plants[key];
      if (!p) return;
      var now = Date.now();
      var grew = p.stage < MAX_STAGE && now >= p.readyAt;

      p.lastWateredAt = now;
      if (grew) {
        p.stage++;
        p.readyAt = now + STAGE_READY_MS;
        if (p.stage >= 2 && !p.reachedBloom) { p.reachedBloom = true; state.stats.bloomed++; }
        if (p.stage >= 3 && !p.reachedFlourish) { p.reachedFlourish = true; state.stats.flourished++; }
      }

      recomputePlant(p, now);   // refresh derived state for immediate UI feedback
      saveState();
      renderPlants();
      if (viewingKey === key) renderPlantPanel(key);
      updateHUD();

      if (grew) {
        toast('\u{1F4A7} ' + GROWTH_MESSAGES[p.stage]);
      } else if (p.stage >= MAX_STAGE) {
        toast('\u{1F4A7} Watered! It is fully grown - Keep it or Sell it whenever you like.');
      } else {
        toast('\u{1F4A7} Watered! Ready to grow again in ' + formatDuration(p.readyAt - now) + '.');
      }
      vibrate(grew ? 30 : 15);
      tutorialOnWater(key);
    }

    // Picks a fully-grown plant (single bloom or flourishing cluster) whether
    // to Keep (a free personal-collection tally, no currency) or Sell (clears
    // the hex for Petals via harvestValue). Either way the hex frees up for
    // replanting - "harvesting" always removes the plant from the ground.
    function harvestPlant(key, sell) {
      var p = state.plants[key];
      if (!p) return;
      var d = recomputePlant(p, Date.now());
      var species = speciesFor(p.species);
      var label = species.name + (d.stage >= 3 ? ' cluster' : '');
      delete state.plants[key];

      if (sell) {
        var val = harvestValue(p, d.stage);
        state.currency += val;
        state.stats.sold++;
        state.stats.earned += val;
        toast('Sold your ' + label + ' for ' + val + ' \u{1F338}');
      } else {
        state.stats.kept++;
        toast('Kept your ' + label + ' \u{1F33C}');
      }

      saveState();
      renderPlants();
      updateHUD();
      updateCurrencyPill();
      closePlantPanel();
      vibrate(20);
      return sell ? harvestValue(p, d.stage) : 0; // used by the tutorial's bonus top-up
    }

    // Runs on load and every minute purely to refresh derived state, so the
    // HUD and map markers notice a plant crossing into ready or wilted. It
    // never changes a plant: stage advancement and milestone credit live in
    // waterPlant, and nothing removes a plant from the ground but harvesting.
    function tickPlants() {
      var now = Date.now();
      Object.keys(state.plants).forEach(function (key) { recomputePlant(state.plants[key], now); });

      // Wild flowers run on their own short clock and are the one thing in the
      // game that can be lost by leaving it - 12h to wilt, 18h to vanish.
      var vanished = 0;
      Object.keys(state.wild).forEach(function (key) {
        if (wildDerived(state.wild[key], now).gone) { delete state.wild[key]; vanished++; }
      });
      if (vanished > 0) saveState();

      renderPlants();
      renderWild();
      updateHUD();
      if (viewingKey) renderPlantPanel(viewingKey);
    }

    // ---------------------------------------------------------------------
    //  WILD FLOWERS
    //  Spawned once per local calendar day along real OSM paths. See the
    //  WILD_* constants above for the placement rules and the privacy note.
    // ---------------------------------------------------------------------
    // Local calendar day, not UTC - "the first time you open it each day"
    // should mean the player's day, so the roll-over happens at their midnight.
    function localDayKey(d) {
      d = d || new Date();
      var m = d.getMonth() + 1, day = d.getDate();
      return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
    }

    // How far through its short life a wild flower is. Entirely derived from
    // spawnedAt, so - like the plant growth engine - it stays correct across
    // however long the page was closed.
    function wildDerived(w, now) {
      var age = now - w.spawnedAt;
      return {
        wilted: age >= WILD_WILT_MS,
        gone: age >= WILD_GONE_MS,
        goneIn: Math.max(0, WILD_GONE_MS - age),
        lifeFrac: Math.max(0, Math.min(1, 1 - age / WILD_GONE_MS))
      };
    }

    // Rejection sampling: throw darts at a disc around the player and keep the
    // ones that land at least WILD_MIN_HEX_GAP hexes from every existing wild
    // flower, every plant the player owns, and every spot already chosen in
    // this same pass. Capped attempts, so a garden so dense that nothing fits
    // simply yields fewer flowers instead of spinning.
    function pickWildSpots(needed) {
      if (!state.userPos) return [];
      var avoid = [];
      Object.keys(state.wild).forEach(function (k) { avoid.push(state.wild[k]); });
      Object.keys(state.plants).forEach(function (k) { avoid.push(state.plants[k]); });

      var origin = state.userPos;
      var lngScale = 111111 * Math.cos(origin.lat * Math.PI / 180);
      var chosen = [];
      var attempts = needed * 200;
      for (var a = 0; a < attempts && chosen.length < needed; a++) {
        // sqrt of a uniform gives an even spread over the disc's *area*;
        // without it everything bunches towards the player.
        var ang = Math.random() * Math.PI * 2;
        var dist = Math.sqrt(Math.random()) * WILD_SPAWN_RADIUS_M;
        var h = latLngToHex(
          origin.lat + (dist * Math.cos(ang)) / 111111,
          origin.lng + (dist * Math.sin(ang)) / lngScale
        );
        var ok = true;
        for (var j = 0; j < avoid.length; j++) {
          if (hexDist(h.q, h.r, avoid[j].q, avoid[j].r) < WILD_MIN_HEX_GAP) { ok = false; break; }
        }
        if (!ok) continue;
        chosen.push(h);
        avoid.push(h);
      }
      return chosen;
    }

    // Straight-line metres and a rough compass point, used by the Wild Flowers
    // screen so "nothing appeared" can always be told apart from "it appeared
    // 600m north of you". Equirectangular is plenty at sub-kilometre scale.
    function metersBetween(a, b) {
      var dLat = (b.lat - a.lat) * 111111;
      var dLng = (b.lng - a.lng) * 111111 * Math.cos(a.lat * Math.PI / 180);
      return Math.sqrt(dLat * dLat + dLng * dLng);
    }
    function compassLabel(from, to) {
      var dLat = to.lat - from.lat;
      var dLng = (to.lng - from.lng) * Math.cos(from.lat * Math.PI / 180);
      var ang = (Math.atan2(dLng, dLat) * 180 / Math.PI + 360) % 360;
      return ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][Math.round(ang / 45) % 8];
    }
    function nearestWild() {
      if (!state.userPos) return null;
      var best = null;
      Object.keys(state.wild).forEach(function (k) {
        var w = state.wild[k];
        var dist = metersBetween(state.userPos, w);
        if (!best || dist < best.dist) {
          best = { key: k, w: w, dist: dist, dir: compassLabel(state.userPos, w) };
        }
      });
      return best;
    }

    // Plain-language account of what the last spawn did, shown on the Wild
    // Flowers screen. Runtime-only. Most of a crop lands off-screen by design,
    // so without this a successful spawn and a skipped one look identical.
    var wildStatus = 'No crop scattered yet this session.';

    // Called once per session after the GPS locks. Now entirely local and
    // synchronous - no network, so the only way to come up short is a garden
    // too crowded to fit anything.
    function maybeSpawnWild() {
      var today = localDayKey();
      if (!state.userPos) { wildStatus = 'Waiting for GPS.'; return; }
      if (state.lastWildDay === today) {
        wildStatus = 'Today\'s crop has already been scattered. More tomorrow.';
        return;
      }

      var needed = WILD_MAX - Object.keys(state.wild).length;
      if (needed <= 0) {
        state.lastWildDay = today;
        wildStatus = 'The map is already full at ' + WILD_MAX + '. Pick some to make room.';
        saveState();
        return;
      }

      var spots = pickWildSpots(needed);
      spots.forEach(function (h) {
        var c = hexCenter(h.q, h.r);
        var sp = SPECIES[Math.floor(Math.random() * SPECIES.length)];
        state.wild[hexKey(h.q, h.r)] = {
          q: h.q, r: h.r, lat: c.lat, lng: c.lng, species: sp.key,
          stage: 2, spawnedAt: Date.now()
        };
      });

      state.lastWildDay = today;
      saveState();
      renderWild();
      updateHUD();

      if (spots.length > 0) {
        var near = nearestWild();
        wildStatus = spots.length + ' scattered within ' + WILD_SPAWN_RADIUS_M +
          'm. They wilt after ' + (WILD_WILT_MS / HOUR) + 'h and are gone by ' + (WILD_GONE_MS / HOUR) + 'h.';
        // Lead with the distance to the closest one - most of the crop lands
        // off-screen, so otherwise this announces blooms against a map that
        // looks completely unchanged.
        toast('\u{1F33C} ' + spots.length + ' wild ' + (spots.length === 1 ? 'flower' : 'flowers') +
          ' bloomed nearby' + (near ? ' - nearest is ' + Math.round(near.dist) + 'm ' + near.dir : '') + '!');
        vibrate(25);
      } else {
        wildStatus = 'Nowhere free to scatter any - your flowers cover the area.';
      }
    }

    // ---------------------------------------------------------------------
    //  VISUALS
    // ---------------------------------------------------------------------
    // Builds the emoji "look" for a plant at a given stage/size and returns
    // its rendered box dimensions so callers (map marker vs. big panel
    // preview) can size their container to match exactly.
    function buildPlantVisual(species, stage, wilted, base) {
      var wiltFilter = wilted ? 'filter:grayscale(55%) opacity(0.7);' : '';
      function dot(size) {
        var fs = Math.round(size * 0.6);
        return '<div style="background:' + species.color + ';border:2px solid rgba(255,255,255,0.85);' +
          'border-radius:50%;width:' + size + 'px;height:' + size + 'px;display:flex;align-items:center;' +
          'justify-content:center;font-size:' + fs + 'px;box-shadow:0 2px 8px rgba(60,40,20,0.3);flex-shrink:0">' +
          species.emoji + '</div>';
      }
      var html, w, h;
      if (stage === 0) {
        w = h = Math.round(base * 0.5);
        html = '<div style="' + wiltFilter + 'background:#c9a06a;border:2px solid rgba(255,255,255,0.85);' +
          'border-radius:50%;width:' + w + 'px;height:' + h + 'px;display:flex;align-items:center;' +
          'justify-content:center;font-size:' + Math.round(w * 0.55) + 'px;box-shadow:0 2px 8px rgba(60,40,20,0.3)">' +
          '\u{1F330}</div>';
      } else if (stage === 1) {
        w = h = Math.round(base * 0.55);
        html = '<div style="' + wiltFilter + 'background:#bfe6a0;border:2px solid rgba(255,255,255,0.85);' +
          'border-radius:50%;width:' + w + 'px;height:' + h + 'px;display:flex;align-items:center;' +
          'justify-content:center;font-size:' + Math.round(w * 0.58) + 'px;box-shadow:0 2px 8px rgba(60,40,20,0.3)">' +
          '\u{1F331}</div>';
      } else if (stage === 2) {
        w = h = Math.round(base * 0.85);
        html = '<div style="' + wiltFilter + '">' + dot(w) + '</div>';
      } else {
        var ds = Math.round(base * 0.5), gap = Math.max(2, Math.round(base * 0.04));
        w = 2 * ds + gap; h = 2 * ds + gap;
        html = '<div class="flourish-cluster" style="' + wiltFilter + 'display:flex;flex-direction:column;' +
          'gap:' + gap + 'px;align-items:center"><div style="display:flex;gap:' + gap + 'px">' +
          dot(ds) + dot(ds) + '</div>' + dot(ds) + '</div>';
      }
      return { html: html, w: w, h: h };
    }

    // Flower icons are sized relative to the current zoom (a fixed real-world
    // size, not a fixed screen-pixel size) so zooming in genuinely makes them
    // bigger and easier to see instead of staying constant while everything
    // else on the map grows. Leaflet's built-in zoom animation already scales
    // markers up visually mid-gesture, but snaps them back to their built-in
    // iconSize once the gesture settles - rebuilding icons on 'zoomend' (see
    // the map.on binding below) is what makes the bigger size actually stick.
    // Clamped so icons stay legible at minZoom and don't get absurd at maxZoom.
    var PLANT_ICON_REF_ZOOM = 17; // the zoom PLANT_ICON_REF_PX looks "normal" at
    var PLANT_ICON_REF_PX = 44;
    function plantIconBase() {
      var scale = Math.pow(2, map.getZoom() - PLANT_ICON_REF_ZOOM);
      return PLANT_ICON_REF_PX * Math.max(0.5, Math.min(2.5, scale));
    }

    function makePlantIcon(plant) {
      var d = recomputePlant(plant, Date.now());
      var v = buildPlantVisual(speciesFor(plant.species), d.stage, d.wilted, plantIconBase());
      var html = v.html;
      // A corner droplet marks any plant that wants a visit, so the map alone
      // answers "is there anything to do right now?". Green means it is ready
      // to grow a stage and takes priority; blue is the cosmetic wilt nudge.
      // Both are fixed by the same action, so they share one badge shape.
      if (d.ready || d.wilted) {
        var badgeBg = d.ready ? '#4caf6d' : '#4aa3ff';
        html = '<div style="position:relative;width:' + v.w + 'px;height:' + v.h + 'px">' + html +
          '<div style="position:absolute;top:-4px;right:-6px;background:' + badgeBg + ';color:#fff;' +
          'border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center;' +
          'font-size:10px;box-shadow:0 1px 4px rgba(0,0,0,0.35)">\u{1F4A7}</div></div>';
      }
      return L.divIcon({ html: html, iconSize: [v.w, v.h], iconAnchor: [v.w / 2, v.h / 2], className: '' });
    }

    // Same bloom artwork as a planted flower, wrapped in a pulsing halo so a
    // wild one is distinguishable at a glance without inventing a second
    // marker shape. Always drawn at single-bloom stage and never wilted -
    // wild flowers don't grow and can't be neglected.
    function makeWildIcon(w) {
      var d = wildDerived(w, Date.now());
      var v = buildPlantVisual(speciesFor(w.species), 2, d.wilted, plantIconBase());
      var pad = Math.max(6, Math.round(v.w * 0.18));
      var box = v.w + pad * 2, boxH = v.h + pad * 2;
      var html = '<div style="position:relative;width:' + box + 'px;height:' + boxH + 'px;' +
        'display:flex;align-items:center;justify-content:center">' +
        '<div class="wild-glow" style="position:absolute;inset:0;border-radius:50%;background:' +
        'radial-gradient(circle,rgba(255,255,255,0.9),rgba(255,236,150,0.5) 52%,rgba(255,236,150,0) 72%)"></div>' +
        '<div style="position:relative">' + v.html + '</div></div>';
      return L.divIcon({ html: html, iconSize: [box, boxH], iconAnchor: [box / 2, boxH / 2], className: '' });
    }

    // ---------------------------------------------------------------------
    //  MAP
    // ---------------------------------------------------------------------
    var map = L.map('map', { zoomControl: false, attributionControl: false, minZoom: 14, maxZoom: 19, zoomSnap: 0.5 });
    // Voyager tiles - colorful parks/water/roads, matching the "pretty and
    // colorful" brief better than a flat greyscale basemap would.
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      subdomains: 'abcd', maxZoom: 20
    }).addTo(map);

    // Pane ladder (bottom -> top): tilePane 200 < gridPane 350 (hex mesh) <
    // overlayPane 400 (range circle, Leaflet default) < markerPane 600 (plants/
    // user, Leaflet default). Much shorter than Porter's ladder since Bloom has
    // no zones or connection lines to layer in between.
    map.createPane('gridPane').style.zIndex = 350;
    var gridRenderer = L.canvas({ pane: 'gridPane', padding: 1.0 });
    gridRenderer.addTo(map);

    map.setView([20, 0], 3);
    // Persist immediately: tickPlants no longer saves (it has nothing to save),
    // so without this a player who drags the map and closes the tab comes back
    // to it snapping to their location again.
    map.on('dragstart', function () { state.following = false; saveState(); });

    // Hex mesh is only drawn once zoomed in this close - below it the hex count
    // in view would grow into the thousands (this is a full-viewport mesh, not
    // a bounded zone like Porter's), so it simply fades away on a wide view
    // rather than costing a redraw budget to render or read.
    var GRID_MIN_ZOOM = 17;
    var GRID_MAX_HEXES = 3000; // safety cap in case the viewport math overshoots

    var _gridRedrawPending = false;
    function scheduleGridRedraw() {
      if (_gridRedrawPending) return;
      _gridRedrawPending = true;
      requestAnimationFrame(function () { _gridRedrawPending = false; renderGridMesh(); });
    }

    // Soft outline mesh over the current viewport so planting spots read at a
    // glance. Every edge is shared by exactly two hexes; only drawing edge
    // indices 0-2 of each hex (see HEX_NEIGHBORS / hexVerticesPx) still covers
    // every edge exactly once, so there's no dedup pass and no doubled lines.
    function renderGridMesh() {
      if (!gridRenderer._ctx || !gridRenderer._bounds) return;
      var ctx = gridRenderer._ctx, b = gridRenderer._bounds, sz = b.getSize();
      ctx.clearRect(b.min.x, b.min.y, sz.x, sz.y);
      if (map.getZoom() < GRID_MIN_ZOOM) return;

      var vb = map.getBounds().pad(0.25);
      var corners = [
        latLngToHex(vb.getSouth(), vb.getWest()), latLngToHex(vb.getNorth(), vb.getEast()),
        latLngToHex(vb.getSouth(), vb.getEast()), latLngToHex(vb.getNorth(), vb.getWest())
      ];
      var minQ = Math.min.apply(null, corners.map(function (c) { return c.q; })) - 1;
      var maxQ = Math.max.apply(null, corners.map(function (c) { return c.q; })) + 1;
      var minR = Math.min.apply(null, corners.map(function (c) { return c.r; })) - 1;
      var maxR = Math.max.apply(null, corners.map(function (c) { return c.r; })) + 1;
      if ((maxQ - minQ) * (maxR - minR) > GRID_MAX_HEXES) return;

      ctx.strokeStyle = 'rgba(70,120,80,0.14)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (var q = minQ; q <= maxQ; q++) {
        for (var r = minR; r <= maxR; r++) {
          var verts = hexVerticesPx(q, r);
          if (!hexOnScreen(verts)) continue;
          for (var e = 0; e < 3; e++) {
            ctx.moveTo(verts[e].x, verts[e].y);
            ctx.lineTo(verts[(e + 1) % 6].x, verts[(e + 1) % 6].y);
          }
        }
      }
      ctx.stroke();
    }
    map.on('moveend zoomend viewreset resize', scheduleGridRedraw);

    var plantMarkers = {};
    function renderPlants() {
      var seen = {};
      Object.keys(state.plants).forEach(function (key) {
        var p = state.plants[key];
        seen[key] = true;
        var icon = makePlantIcon(p);
        if (plantMarkers[key]) plantMarkers[key].setIcon(icon);
        else plantMarkers[key] = L.marker([p.lat, p.lng], { icon: icon, interactive: false, zIndexOffset: 100 }).addTo(map);
      });
      Object.keys(plantMarkers).forEach(function (key) {
        if (!seen[key]) { map.removeLayer(plantMarkers[key]); delete plantMarkers[key]; }
      });
    }
    // Wild flowers sit just under the player's own plants (zIndexOffset 90 vs
    // 100), so on the rare overlap your garden is never hidden by scenery.
    var wildMarkers = {};
    function renderWild() {
      var seen = {};
      Object.keys(state.wild).forEach(function (key) {
        var w = state.wild[key];
        seen[key] = true;
        var icon = makeWildIcon(w);
        if (wildMarkers[key]) wildMarkers[key].setIcon(icon);
        else wildMarkers[key] = L.marker([w.lat, w.lng], { icon: icon, interactive: false, zIndexOffset: 90 }).addTo(map);
      });
      Object.keys(wildMarkers).forEach(function (key) {
        if (!seen[key]) { map.removeLayer(wildMarkers[key]); delete wildMarkers[key]; }
      });
    }

    // Rebuild every icon at the new zoom's size once a zoom gesture settles -
    // see plantIconBase()/makePlantIcon above for why this is what actually
    // makes zooming in grow the flowers instead of them snapping back.
    map.on('zoomend', function () { renderPlants(); renderWild(); });

    // Empty ground within range plants immediately; an occupied hex opens its
    // panel (from any distance - browsing your garden from afar is fine,
    // only *acting* on a plant requires being physically close).
    map.on('click', function (e) {
      var h = latLngToHex(e.latlng.lat, e.latlng.lng);
      var key = hexKey(h.q, h.r);
      if (state.plants[key]) { openPlantPanel(key); return; }
      if (state.wild[key]) { openPlantPanel(key, true); return; }
      if (!state.userPos) { toast('Waiting for GPS to lock on...'); return; }
      var uh = latLngToHex(state.userPos.lat, state.userPos.lng);
      if (hexDist(uh.q, uh.r, h.q, h.r) > PLANT_RANGE_HEX) {
        toast('Walk closer to plant a seed here \u{1F6B6}');
        return;
      }
      attemptPlant(h.q, h.r);
    });

    // ---------------------------------------------------------------------
    //  GPS
    // ---------------------------------------------------------------------
    // No player marker - only the translucent range circle marks the player,
    // so it never sits on top of (and hides) a flower planted right next to
    // them. userHexQ/userHexR is the hex the circle is currently snapped to.
    var rangeCircle = null, viewingKey = null, viewingWild = false;
    var userHexQ = null, userHexR = null;
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (!navigator.geolocation) {
      document.getElementById('gps-status').textContent = 'NO GPS';
      document.getElementById('hud-status-line').textContent = 'Geolocation is not supported on this device.';
    } else {
      navigator.geolocation.watchPosition(onLocationUpdate, onLocationError, {
        enableHighAccuracy: true, maximumAge: 3000, timeout: 15000
      });
    }

    // Eases the range circle from one hex center to the next over ~450ms
    // instead of jumping. Only runs on an actual hex change (see
    // onLocationUpdate), so ordinary GPS jitter within the same hex never
    // moves the circle at all - that's the real fix for the twitchiness,
    // this animation just makes real hex-to-hex steps read as movement
    // rather than a teleport.
    var _circleAnimRAF = null;
    function animateCircleTo(fromLat, fromLng, toLat, toLng) {
      if (_circleAnimRAF) cancelAnimationFrame(_circleAnimRAF);
      if (reduceMotion) { rangeCircle.setLatLng([toLat, toLng]); return; }
      var start = performance.now(), dur = 450;
      function step(now) {
        var t = Math.min(1, (now - start) / dur);
        var e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; // ease-in-out-quad
        rangeCircle.setLatLng([fromLat + (toLat - fromLat) * e, fromLng + (toLng - fromLng) * e]);
        _circleAnimRAF = (t < 1) ? requestAnimationFrame(step) : null;
      }
      _circleAnimRAF = requestAnimationFrame(step);
    }

    function onLocationUpdate(pos) {
      var lat = pos.coords.latitude, lng = pos.coords.longitude;
      state.userPos = { lat: lat, lng: lng };

      // Snap the displayed position to the current hex's center rather than
      // following raw GPS - range checks elsewhere already work in hex
      // distance (hexDist), not raw lat/lng, so this changes nothing about
      // what counts as "in range", only how steady the circle looks.
      var h = latLngToHex(lat, lng);
      var c = hexCenter(h.q, h.r);

      if (!rangeCircle) {
        userHexQ = h.q; userHexR = h.r;
        rangeCircle = L.circle([c.lat, c.lng], {
          radius: RANGE_METERS, color: '#4caf6d', weight: 1.5,
          fillColor: '#4caf6d', fillOpacity: 0.08, interactive: false
        }).addTo(map);
        map.setView([c.lat, c.lng], 17);
        onGpsLocked();
      } else if (h.q !== userHexQ || h.r !== userHexR) {
        var from = hexCenter(userHexQ, userHexR);
        userHexQ = h.q; userHexR = h.r;
        animateCircleTo(from.lat, from.lng, c.lat, c.lng);
        if (state.following) map.panTo([c.lat, c.lng], { animate: true, duration: 0.4 });
      }
      if (viewingKey) renderPlantPanel(viewingKey); // range may have just changed
      updateHUD();
    }

    function onLocationError(err) {
      var msgs = { 1: 'Location permission denied.', 2: 'Position unavailable.', 3: 'GPS timed out, retrying...' };
      var badge = document.getElementById('gps-status');
      badge.textContent = 'NO GPS'; badge.className = 'err';
      document.getElementById('hud-status-line').textContent = msgs[err.code] || err.message;
    }

    function onGpsLocked() {
      var badge = document.getElementById('gps-status');
      badge.textContent = 'GPS LOCKED';
      badge.className = 'locked';
      setTimeout(function () { badge.style.display = 'none'; }, 3000);
      // Longitude scale depends on latitude - lock it once so hexes stay
      // visually even-sided near where the player actually is.
      if (!localStorage.getItem('bloom_cell_lng')) {
        CELL_LNG_DEG = CELL_LAT_DEG / Math.cos(state.userPos.lat * Math.PI / 180);
        localStorage.setItem('bloom_cell_lng', CELL_LNG_DEG);
      }
      // The map.setView() a moment ago in onLocationUpdate already fired
      // 'moveend' (and so a grid redraw) before CELL_LNG_DEG was corrected
      // above - redraw once more now so the very first mesh isn't stretched.
      scheduleGridRedraw();
      vibrate(30);
      tickPlants();
      // Needs a real fix before it can ask "what paths are near here?", so it
      // hangs off the lock rather than off init. No-ops if today already ran.
      maybeSpawnWild();
      // Brand-new player: show the welcome modal, then the tutorial starts
      // once they dismiss it (see openWelcome). Returning to a save where the
      // tutorial was started but never finished/skipped (app closed mid-way)
      // skips straight to resuming it, since they've already seen Welcome.
      if (!state.seenWelcome) openWelcome();
      else if (!state.tutorialDone) startTutorial();
    }

    // ---------------------------------------------------------------------
    //  PLANT PANEL
    // ---------------------------------------------------------------------
    function formatAgo(ts) {
      var min = Math.floor((Date.now() - ts) / 60000);
      if (min < 1) return 'just now';
      if (min < 60) return min + (min === 1 ? ' minute ago' : ' minutes ago');
      var hr = Math.floor(min / 60);
      if (hr < 24) return hr + (hr === 1 ? ' hour ago' : ' hours ago');
      var day = Math.floor(hr / 24);
      return day + (day === 1 ? ' day ago' : ' days ago');
    }

    // Forward-looking counterpart to formatAgo, for the ready-to-water wait.
    // Rounds up so a plant never reads "0m" while still counting down.
    function formatDuration(ms) {
      var min = Math.ceil(ms / 60000);
      if (min < 60) return min + 'm';
      var hr = Math.floor(min / 60), rem = min % 60;
      return rem > 0 ? hr + 'h ' + rem + 'm' : hr + 'h';
    }

    function openPlantPanel(key, isWild) {
      closeShop(); // the shop and plant panel are both bottom sheets - only one at a time
      viewingKey = key;
      viewingWild = !!isWild;
      renderPlantPanel(key);
      document.getElementById('plant-panel').classList.add('open');
    }
    function closePlantPanel() {
      viewingKey = null;
      viewingWild = false;
      document.getElementById('plant-panel').classList.remove('open');
    }

    // A wild flower reuses the same sheet, minus everything that only applies
    // to something you planted: no growth bar (it never grows) and no water
    // button (it can't be tended). All that's left is picking it.
    function renderWildPanel(key) {
      var w = state.wild[key];
      if (!w) { closePlantPanel(); return; }
      var species = speciesFor(w.species);
      var d = wildDerived(w, Date.now());

      var v = buildPlantVisual(species, 2, d.wilted, 88);
      var iconEl = document.getElementById('plant-icon-big');
      iconEl.innerHTML = v.html;
      iconEl.style.width = v.w + 'px';
      iconEl.style.height = v.h + 'px';

      document.getElementById('plant-title').textContent = 'Wild ' + species.name;
      document.getElementById('plant-meta').textContent = 'Found growing wild \u{1F33C} ' + formatAgo(w.spawnedAt);

      // The growth bar is reused as a life bar here - a wild flower doesn't
      // grow, it runs down. Amber rather than green so an emptying bar never
      // reads as progress.
      var track = document.getElementById('growth-bar-track');
      var fill = document.getElementById('growth-bar-fill');
      var barLabel = document.getElementById('growth-bar-label');
      track.style.display = '';
      barLabel.style.display = '';
      fill.classList.add('fading');
      fill.style.width = Math.round(d.lifeFrac * 100) + '%';
      barLabel.textContent = 'Fades in ' + formatDuration(d.goneIn);

      var btn = document.getElementById('plant-action-btn');
      btn.style.display = 'none';
      btn.onclick = null;

      var uh = state.userPos ? latLngToHex(state.userPos.lat, state.userPos.lng) : null;
      var inRange = uh && hexDist(uh.q, uh.r, w.q, w.r) <= PLANT_RANGE_HEX;

      var statusEl = document.getElementById('plant-status-line');
      if (!inRange) { statusEl.textContent = 'Walk over to pick it'; statusEl.className = 'status-wilt'; }
      else if (d.wilted) { statusEl.textContent = 'Wilting - pick it before it fades'; statusEl.className = 'status-wilt'; }
      else { statusEl.textContent = 'Ready to pick - it\'s yours if you want it'; statusEl.className = 'status-good'; }

      var harvestRow = document.getElementById('harvest-row');
      if (inRange) {
        harvestRow.style.display = 'flex';
        document.getElementById('sell-btn').textContent = 'Sell ' + SELL_SINGLE + ' \u{1F338}';
        document.getElementById('sell-btn').onclick = function () { pickWild(key, true); };
        document.getElementById('keep-btn').onclick = function () { pickWild(key, false); };
      } else {
        harvestRow.style.display = 'none';
      }
    }

    // Wild flowers are free, so picking one is pure upside either way - Keep
    // adds it to your tally, Sell pays the single-bloom rate. Either way the
    // hex clears, which is also what makes room for the next daily spawn.
    function pickWild(key, sell) {
      var w = state.wild[key];
      if (!w) return;
      var species = speciesFor(w.species);
      delete state.wild[key];

      if (sell) {
        state.currency += SELL_SINGLE;
        state.stats.sold++;
        state.stats.earned += SELL_SINGLE;
        toast('Sold a wild ' + species.name + ' for ' + SELL_SINGLE + ' \u{1F338}');
      } else {
        state.stats.kept++;
        toast('Picked a wild ' + species.name + ' \u{1F33C}');
      }

      saveState();
      renderWild();
      updateHUD();
      updateCurrencyPill();
      closePlantPanel();
      vibrate(20);
    }

    function renderPlantPanel(key) {
      if (viewingWild) { renderWildPanel(key); return; }
      var p = state.plants[key];
      if (!p) { closePlantPanel(); return; }
      // Undo whatever the wild variant may have changed last time round.
      document.getElementById('growth-bar-track').style.display = '';
      document.getElementById('growth-bar-label').style.display = '';
      document.getElementById('growth-bar-fill').classList.remove('fading');
      var d = recomputePlant(p, Date.now());
      var species = speciesFor(p.species);

      var v = buildPlantVisual(species, d.stage, d.wilted, 88);
      var iconEl = document.getElementById('plant-icon-big');
      iconEl.innerHTML = v.html;
      iconEl.style.width = v.w + 'px';
      iconEl.style.height = v.h + 'px';

      document.getElementById('plant-title').textContent = species.name + ' - ' + STAGE_LABELS[d.stage];
      document.getElementById('plant-meta').textContent = 'Planted ' + formatAgo(p.plantedAt);

      // The bar fills across the readiness wait, so it reads as "this plant is
      // getting there" rather than "this plant is running out of something".
      var growthPct = d.stage >= MAX_STAGE
        ? 100
        : Math.max(0, Math.min(100, Math.round((1 - d.readyIn / STAGE_READY_MS) * 100)));
      document.getElementById('growth-bar-fill').style.width = growthPct + '%';
      document.getElementById('growth-bar-label').textContent =
        d.stage >= MAX_STAGE ? 'Fully grown' :
        d.ready ? 'Ready to grow now!' :
        'Ready to grow in ' + formatDuration(d.readyIn);

      // Status line says how the plant is doing; the bar above says when it
      // next needs you. Readiness leads because it is the only state a visit
      // converts into progress - wilt is cosmetic, so it ranks below it.
      var statusEl = document.getElementById('plant-status-line');
      if (d.ready) { statusEl.textContent = 'Ready to grow - give it a drink!'; statusEl.className = 'status-good'; }
      else if (d.wilted) { statusEl.textContent = 'Looking wilted - a drink will perk it back up'; statusEl.className = 'status-wilt'; }
      else if (d.stage >= MAX_STAGE) { statusEl.textContent = 'Fully grown - Keep it or Sell it'; statusEl.className = 'status-good'; }
      else { statusEl.textContent = 'Thriving'; statusEl.className = 'status-good'; }

      var uh = state.userPos ? latLngToHex(state.userPos.lat, state.userPos.lng) : null;
      var inRange = uh && hexDist(uh.q, uh.r, p.q, p.r) <= PLANT_RANGE_HEX;
      // Watering is only offered when it would actually do something: advance
      // a stage, or clear a cosmetic wilt. A plant that is mid-wait has no
      // action to take, so the button is hidden rather than shown as a tap
      // that quietly achieves nothing.
      var btn = document.getElementById('plant-action-btn');
      if (!d.ready && !d.wilted) {
        btn.style.display = 'none';
        btn.onclick = null;
      } else {
        btn.style.display = '';
        if (inRange) {
          btn.disabled = false;
          btn.textContent = d.ready ? 'Water + Grow \u{1F4A7}' : 'Water \u{1F4A7}';
          btn.onclick = function () { waterPlant(key); };
        } else {
          btn.disabled = true;
          btn.textContent = 'Walk closer to water';
          btn.onclick = null;
        }
      }

      // Harvesting (Keep or Sell) only shows up once a plant has something to
      // harvest - single bloom or flourishing cluster - and only when close
      // enough to act on it, same proximity rule as watering.
      var harvestRow = document.getElementById('harvest-row');
      if (d.stage >= 2 && inRange) {
        harvestRow.style.display = 'flex';
        document.getElementById('sell-btn').textContent = 'Sell ' + harvestValue(p, d.stage) + ' \u{1F338}';
        document.getElementById('sell-btn').onclick = function () { onHarvestClick(key, true); };
        document.getElementById('keep-btn').onclick = function () { onHarvestClick(key, false); };
      } else {
        harvestRow.style.display = 'none';
      }
    }

    // Thin wrapper so the tutorial (see TUTORIAL section) can observe a real
    // harvest without renderPlantPanel needing to know it exists.
    function onHarvestClick(key, sell) {
      var value = harvestPlant(key, sell);
      tutorialOnHarvest(key, sell, value);
    }

    // ---------------------------------------------------------------------
    //  HUD / MENU / MODAL / TOAST
    // ---------------------------------------------------------------------
    function updateHUD() {
      var keys = Object.keys(state.plants);
      var total = keys.length;
      var wilted = keys.filter(function (k) {
        var d = state.plants[k]._d;
        return d && d.wilted;
      }).length;
      // state.stats.bloomed is a lifetime "ever reached bloom" counter (it
      // never decrements, even after that plant is harvested) - that's right
      // for the How to Play footer, but wrong here: "N in bloom" needs to
      // count what's actually blooming right now, so a harvested flower
      // stops being counted immediately instead of lingering forever.
      var blooming = keys.filter(function (k) {
        var d = state.plants[k]._d;
        return d && d.stage >= 2;
      }).length;

      // Ready-to-grow outranks merely wilted: it is the one line that sends
      // the player out the door, and it is the only status that a watering
      // visit converts into actual progress.
      var ready = keys.filter(function (k) {
        var d = state.plants[k]._d;
        return d && d.ready;
      }).length;

      // Wild flowers are a standing "there's something out there to find", so
      // they get a tail on every line rather than competing for the whole one.
      var wildCount = Object.keys(state.wild).length;
      var wildTail = wildCount > 0
        ? ' &bull; \u{1F33C} ' + wildCount + ' wild to find'
        : '';

      var line;
      if (total === 0) {
        line = 'Tap the map near you to plant your first seed \u{1F331}' + wildTail;
        document.getElementById('hud-status-line').innerHTML = line;
        return;
      }
      if (ready > 0) {
        line = '\u{1F4A7} ' + ready + (ready === 1 ? ' flower is' : ' flowers are') +
          ' ready to grow &bull; go water ' + (ready === 1 ? 'it' : 'them') + '!';
      } else if (wilted > 0) {
        line = wilted + (wilted === 1 ? ' flower is' : ' flowers are') + ' looking wilted \u{1F4A7} &bull; ' +
          blooming + ' in bloom';
      } else {
        // No "all watered" tail here any more - watering stopped being upkeep
        // when it became the thing that grows a plant, so there is nothing to
        // reassure the player about, and the line needs room for wildTail.
        line = '\u{1F338} ' + total + ' growing &bull; ' + blooming + ' in bloom';
      }
      document.getElementById('hud-status-line').innerHTML = line + wildTail;
    }

    function toggleMenu() { document.getElementById('menu-dropdown').classList.toggle('open'); }
    document.addEventListener('click', function (e) {
      var menu = document.getElementById('menu-dropdown'), btn = document.getElementById('top-menu-btn');
      if (menu.classList.contains('open') && !menu.contains(e.target) && e.target !== btn) menu.classList.remove('open');
    });

    function onRecenter() {
      state.following = true;
      saveState();
      // Pan to the snapped hex center (where the range circle actually is),
      // not raw GPS - otherwise recenter can land slightly off from the
      // visible circle.
      if (userHexQ !== null) {
        var c = hexCenter(userHexQ, userHexR);
        map.panTo([c.lat, c.lng], { animate: true });
      }
    }

    // Wipes the whole save (garden, seeds, Petals, stats, and the welcome/
    // tutorial flags) and reloads, rather than resetting each state field by
    // hand - that way a full reset can never drift out of sync as new state
    // fields get added later (it always matches whatever loadState()'s
    // defaults are, since a reload with no saved key runs the exact same
    // brand-new-player path, tutorial included).
    function onResetSave() {
      toggleMenu();
      if (!confirm('Erase your save completely - garden, seeds, Petals, and all progress? This cannot be undone.')) return;
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    }

    function openWelcome() {
      resetModalChrome();
      document.getElementById('modal-title').textContent = 'Welcome to Bloom';
      document.getElementById('modal-body').innerHTML =
        '<p>Bloom gives you a gentle reason to get out and walk. Plant one of your starter seeds in the ' +
        'ground near you, then swing back by to water it.</p>' +
        '<p>Watering is what makes it grow. About every 12 hours a plant is ready for a drink, and each ' +
        'visit moves it up a stage - seed to sprout to bloom to a full flourishing cluster. Three walks ' +
        'back, three stages.</p>' +
        '<p>Harvest it to keep for yourself or sell to the shop for Petals \u{1F338} - spend those on more ' +
        'seeds. Every flower costs and sells for the same, so plant whichever ones you like the look of.</p>' +
        '<p>Nothing here can be lost. Go a couple of days without watering and a flower just looks a bit ' +
        'wilted until your next visit - it never dies, and it never stops being ready to grow. No score, ' +
        'no clock, no rush.</p>';
      document.getElementById('modal-ok-btn').textContent = "Let's grow! \u{1F331}";
      document.getElementById('modal-ok-btn').onclick = function () {
        state.seenWelcome = true; saveState(); closeModal();
        if (!state.tutorialDone) startTutorial();
      };
      document.getElementById('modal-overlay').classList.add('open');
    }

    function openHowToPlay() {
      toggleMenu();
      resetModalChrome();
      document.getElementById('modal-title').textContent = 'How to Play';
      var s = state.stats;
      document.getElementById('modal-body').innerHTML =
        '<p><b>Plant</b> - tap the ground within a couple hexes of you, then confirm which seed to plant ' +
        '- a quick safety check so a stray tap never spends one by accident.</p>' +
        '<p><b>Water</b> - tap a growing flower, then walk close enough for the Water button to light up.</p>' +
        '<p><b>Grow</b> - watering is what grows a plant, not just time. Every 12 hours or so it becomes ' +
        'ready, and your next watering visit moves it up a stage: seed, sprout, single bloom, full ' +
        'flourishing cluster. A green \u{1F4A7} on the map means one is ready right now. Watering early is ' +
        'never wasted - it still tops up the tank and holds off wilting.</p>' +
        '<p><b>Harvest</b> - once a flower is in bloom or flourishing, walk up to it and Keep it for ' +
        'yourself or Sell it for Petals \u{1F338} - clusters sell for much more than a single bloom.</p>' +
        '<p><b>Shop</b> - tap your Petals total (top right) to buy seeds. All seven flowers cost the same ' +
        'and sell for the same, so pick by looks, not by value.</p>' +
        '<p><b>Wild flowers</b> \u{1F33C} - each day you open Bloom, up to ten wild blooms are scattered ' +
        'around you, marked with a soft glow. They cost nothing - just walk over and pick one. Unlike your ' +
        'own flowers they don\'t last: a wild bloom wilts after 12 hours and is gone 6 hours later, so ' +
        'they\'re worth going out for today.</p>' +
        '<p><b>No pressure</b> - after a couple of days without water a flower starts to look wilted, and ' +
        'that\'s all it is: a look. Flowers never die, never get removed, and keep becoming ready to grow ' +
        'no matter how long you\'ve been away. One drink perks a wilted one right back up.</p>' +
        '<p style="color:var(--text-dim);margin-top:14px">So far: ' + s.planted + ' planted &bull; ' +
        s.bloomed + ' bloomed &bull; ' + s.flourished + ' flourished &bull; ' + s.sold + ' sold for ' +
        s.earned + ' Petals &bull; ' + s.kept + ' kept</p>';
      document.getElementById('modal-ok-btn').textContent = 'Got it';
      document.getElementById('modal-ok-btn').onclick = closeModal;
      document.getElementById('modal-overlay').classList.add('open');
    }

    // Answers "where are they, then?". Most of a day's wild flowers land
    // off-screen on purpose - the whole point is to walk to them - so without
    // a screen like this a successful spawn is indistinguishable from a failed
    // one, since both leave the visible map unchanged.
    function openWildInfo() {
      toggleMenu();
      resetModalChrome();
      document.getElementById('modal-title').textContent = 'Wild Flowers \u{1F33C}';

      var n = Object.keys(state.wild).length;
      var near = nearestWild();
      var html = '<p><b>' + n + '</b> wild ' + (n === 1 ? 'flower is' : 'flowers are') +
        ' out on the map right now, of up to ' + WILD_MAX + '.</p>';

      if (near) {
        var nd = wildDerived(near.w, Date.now());
        html += '<p>The nearest is a <b>' + speciesFor(near.w.species).name + '</b>, about <b>' +
          Math.round(near.dist) + 'm</b> to the <b>' + near.dir + '</b>' +
          (nd.wilted ? ', already wilting' : '') + ' - fades in <b>' + formatDuration(nd.goneIn) + '</b>.</p>';
      } else if (n > 0) {
        html += '<p>Waiting on GPS before it can tell you how far off they are.</p>';
      }

      if (n > 0) {
        html += '<p style="color:var(--text-dim)">They can be up to ' + WILD_SPAWN_RADIUS_M +
          'm away, so most start off-screen - zoom out and look for the glowing ones.</p>';
      }
      html += '<p style="color:var(--text-dim)">Wild flowers wilt after ' + (WILD_WILT_MS / HOUR) +
        ' hours and vanish ' + ((WILD_GONE_MS - WILD_WILT_MS) / HOUR) + ' hours after that.</p>';
      html += '<p style="color:var(--text-dim)">Today: ' + wildStatus + '</p>';

      // Spawning is local and synchronous now, so it can't fail and there is
      // nothing to retry - the day either ran or is still waiting on GPS.
      document.getElementById('modal-ok-btn').textContent = 'Got it';
