      // of registering a second setInterval for the same idea.
      maybeSpawnWeeds();

      renderPlants();
      renderWild();
      renderWeeds();
      updateHUD();
      if (viewingKey) renderPlantPanel(viewingKey);
      // Keep an open Greenhouse fresh the same way an open plant panel is
      // kept fresh above - a pot left wilting or ready while the panel sits
      // open should still update without needing to back out and reopen it.
      if (document.getElementById('greenhouse-panel').classList.contains('open')) renderGreenhouse();
      // Independent of whether the panel is open - the menu badge (see
      // updateGreenhouseMenuBadge) has to stay current even while the
      // player is off in the Shop or Journal, not just while looking at
      // the shelves themselves.
      else updateGreenhouseMenuBadge();
    }

    // ---------------------------------------------------------------------
    //  SPRINKLERS
    //  Placeable equipment (see the SHOP section for how one is bought and
    //  the EQUIPMENT section near the tool rail for how one is placed/moved)
    //  that waters every one of its eight neighbouring tiles automatically -
    //  the one thing in Bloom that acts on a plant without a walk-up visit.
    // ---------------------------------------------------------------------
    // The unlock gate for the shop's sprinkler row - ten flowers grown,
    // extracted or sold, the same lifetime tally the "Harvester" milestone
    // already uses (see MILESTONE_DEFS). Purely a read, recomputed live
    // rather than cached, since state.stats never shrinks.
    function sprinklerUnlocked() {
      return state.stats.grown >= SPRINKLER_UNLOCK_FLOWERS;
    }
    // Every sprinkler you have ever bought, whether it's currently placed or
    // still sitting unplaced in the equipment toggle - nothing ever destroys
    // one, so "owned" and "lifetime purchased" are the same number.
    function sprinklerOwnedCount() {
      return state.sprinklerInventory + Object.keys(state.sprinklers).length;
    }
    // What the NEXT purchase costs - each one already owned adds another
    // SPRINKLER_COST_STEP on top of the base price, so the first is 500, the
    // second 600, and so on. Recomputed live off sprinklerOwnedCount rather
    // than stored, so it can never drift out of sync with what's actually
    // owned.
    function nextSprinklerCost() {
      return SPRINKLER_COST + SPRINKLER_COST_STEP * sprinklerOwnedCount();
    }
    // Fires the one-time "you can buy this now" toast the moment the gate
    // above first opens. Called from every place stats.grown changes
    // (harvestPlant, pickWild) rather than off a timer, so it lands right at
    // the harvest that actually crossed the line - and the persisted flag
    // means it can never repeat even though every call site rechecks the
    // same threshold.
    function checkSprinklerUnlock() {
      if (state.sprinklerUnlockAnnounced || !sprinklerUnlocked()) return;
      state.sprinklerUnlockAnnounced = true;
      saveState();
      toast('\u{1F4A6} Sprinklers unlocked! Check the Shop \u{1F338}');
    }

    // Runs on its own short interval (SPRINKLER_TICK_MS, well under
    // tickPlants' 60s) rather than living inside tickPlants - tickPlants is
    // deliberately a pure read (see its own comment above), and this one
    // genuinely mutates plants, exactly the way waterPlant does, just
    // without a finger behind it. Purely detection: for every adjacent
    // plant that newly qualifies, it hands off to startSprinklerWatering
    // (below) and moves on - the actual watering happens at the end of that
    // plant's own animation, not here, so a garden full of sprinklers
    // doesn't all water in perfect lockstep. autoWaterAnimKeys is the guard
    // against re-starting a plant that's already mid-flight; each plant
    // only ever advances one stage per completed watering, same as a real
    // watering visit (applyWatering sets readyAt relative to *now*, not to
    // the missed threshold).
    //
    // That one-stage-per-tick behavior only describes what happens while
    // this interval is actually running, though - it is NOT how a real
    // offline gap (the tab closed, or backgrounded long enough to be
    // throttled/suspended) is handled. Multiple stages ARE banked across an
    // absence like that: catchUpSprinklersOffline (below) replays this same
    // wilted-or-ready check across the whole gap in one shot at resume
    // time, before this interval ever gets a chance to tick again, so a
    // sprinkler left running for days catches an adjacent plant all the way
    // up to MAX_STAGE (water permitting) rather than resuming at one stage
    // per visit like it used to.
    var SPRINKLER_TICK_MS = 1000;
    function tickSprinklers() {
      if (!Object.keys(state.sprinklers).length) return;
      var now = Date.now();
      Object.keys(state.sprinklers).forEach(function (skey) {
        var s = state.sprinklers[skey];
        CELL_NEIGHBORS.forEach(function (d) {
          var pkey = cellKey(s.q + d[0], s.r + d[1]);
          if (autoWaterAnimKeys[pkey]) return; // already on its way to this one
          var p = state.plants[pkey];
          if (!p) return;
          var wilted = (now - p.lastWateredAt) >= WATER_DURATION_MS;
          var ready = p.stage < MAX_STAGE && now >= p.readyAt;
          if (!wilted && !ready) return; // already fully topped up - nothing to do here
          startSprinklerWatering(pkey, s);
        });
      });
    }

    // ---------------------------------------------------------------------
    //  OFFLINE SPRINKLER CATCH-UP  (issue #8)
    //  tickSprinklers (above) only ever advances a plant one stage per
    //  completed watering because it's built to run *live*, every
    //  SPRINKLER_TICK_MS, while the tab is open - it was never meant to
    //  replay a gap, just to notice "ready or wilted right now" once a
    //  second. This is the offline counterpart: called once at the top of
    //  every real "resume" (a fresh page load, and the visibilitychange
    //  listener's real-gap branch - see both call sites), before anything
    //  else reads plant state, in particular before the welcome-back tour
    //  builds its stops from recomputePlant.
    //
    //  Same timestamp-derived philosophy as recomputePlant (see the GROWTH
    //  ENGINE section above): a plant's own lastWateredAt/readyAt/stage
    //  already pin down exactly where a continuously-running sprinkler
    //  would have left it the instant the tab was backgrounded (live
    //  ticking keeps them current right up to that moment), so no separate
    //  "gap started here" timestamp needs to be threaded in - the plant's
    //  own fields already are one. Replaying the same wilted-or-ready check
    //  tickSprinklers uses, forward from those stored fields to right now,
    //  applying applyWatering at each instant a real sprinkler would have
    //  fired, reproduces exactly the end state a session left open the
    //  whole time would have reached. Bypasses the droplet animation
    //  entirely (calls applyWatering directly, not
    //  startSprinklerWatering/finishAutoWatering) - replaying a
    //  multi-day gap one droplet burst at a time makes no sense, so this
    //  resolves the final state in one shot and lets the normal render
    //  paths pick it up, same as any other state mutation. The rain-ring
    //  counterpart, catchUpRainRingsOffline (see RAIN RINGS, above), takes
    //  the exact same shortcut for the exact same reason.
    function catchUpSprinklersOffline() {
      if (!Object.keys(state.sprinklers).length) return;
      var now = Date.now();

      // Same reachability tickSprinklers checks (a per-sprinkler neighbor
      // scan), collapsed to a plain set of plant keys first: once a plant
      // is adjacent to any placed sprinkler at all, which one (or how many)
      // doesn't change the simulation below - watering it at a given
      // instant is the same event no matter how many sprinklers would have
      // triggered it, so there's no need to actually iterate per-sprinkler
      // for the catch-up itself.
      var reachedKeys = {};
      Object.keys(state.sprinklers).forEach(function (skey) {
        var s = state.sprinklers[skey];
        CELL_NEIGHBORS.forEach(function (d) {
          var pkey = cellKey(s.q + d[0], s.r + d[1]);
          if (state.plants[pkey]) reachedKeys[pkey] = true;
        });
      });

      var changed = false;
      Object.keys(reachedKeys).forEach(function (pkey) {
        var p = state.plants[pkey];
        // `stage < MAX_STAGE` alone terminates this under the real game
        // constants: readyAt is always far closer than the 48h wilt clock
        // while a plant still has stages left (STAGE_READY_MS is 1.5h,
        // WATER_DURATION_MS is 48h), so a plant that isn't already maxed
        // reaches MAX_STAGE in at most MAX_STAGE passes regardless of how
        // long the gap was. The iteration cap is purely defensive - a
        // corrupted save or a future constant change (stageReadyMs()
        // somehow returning 0, or exceeding WATER_DURATION_MS) is the only
        // way this would otherwise spin, and this guarantees it can't.
        var guard = 0;
        while (p.stage < MAX_STAGE && guard++ < 1000) {
          var wiltAt = p.lastWateredAt + WATER_DURATION_MS;
          var nextEvent = Math.min(wiltAt, p.readyAt);
          if (nextEvent > now) break; // nothing more a sprinkler would have done yet
          applyWatering(p, nextEvent);
          changed = true;
        }
        // A plant that reached MAX_STAGE (during the gap, or already
        // before it) has nothing left to grow, but a running sprinkler
        // would still have kept topping it off every time it crossed the
        // wilt threshold - live tickSprinklers re-waters a maxed plant the
        // moment it notices it's wilted (ready is permanently false once
        // maxed, but wilted alone is still enough to trigger a visit), so
        // in practice a maxed plant beside a running sprinkler is never
        // actually seen wilted. Match that by refreshing the wilt clock
        // straight to now instead of looping every WATER_DURATION_MS for
        // however many cycles fit in the gap - none of those intermediate
        // wilted/rewatered flickers were ever visible to anyone while the
        // tab was closed, so there's nothing to actually replay.
        if (p.stage >= MAX_STAGE && (now - p.lastWateredAt) >= WATER_DURATION_MS) {
          p.lastWateredAt = now;
          changed = true;
        }
      });

      if (!changed) return;
      saveState();
      renderPlants();
      updateHUD();
      if (viewingKey && reachedKeys[viewingKey]) renderPlantPanel(viewingKey);
    }

    // ---------------------------------------------------------------------
    //  RAIN RINGS  (basic elemental magic - see RAIN_RING_RADIUS above)
    //
    //  `rainRings` is NOT part of `state` - unlike state.sprinklers (a
    //  player-placed object, the only source of truth for where it is),
    //  a ring is entirely a function of what's already sitting in
    //  state.plants, so persisting a second copy would just be one more
    //  thing that could drift out of sync with the real garden. Instead
    //  it's rebuilt into this plain in-memory cache once at load
    //  (recomputeRainRingsFull, called from INIT) and kept current for the
    //  rest of the session by refreshRainRingCandidates - called from every
    //  place state.plants can actually change: plantSeedAt, doBreed,
    //  harvestPlant, and (the one that lets a ring complete in the first
    //  place) applyWatering's own stage-reaches-MAX_STAGE block. Since
    //  every watering path in the game - a manual tap, a sprinkler, and
    //  a rain ring itself - funnels through that one applyWatering, a
    //  ring completing (or another plant growing into blue-cluster range
    //  because THIS ring watered it) is caught automatically with no extra
    //  wiring at each of those call sites.
    var rainRings = {}; // centerKey ("q,r") -> { q, r, lat, lng }

    // A ring is valid at (cq, cr) iff that tile itself is empty AND all 8
    // neighbors are blue flowers already grown to a full cluster. Species
    // doesn't matter (any of the 8 can be a different kind of flower) - only
    // color and stage do.
    function isRainRingComplete(cq, cr) {
      if (state.plants[cellKey(cq, cr)]) return false; // center tile must stay empty
      for (var i = 0; i < CELL_NEIGHBORS.length; i++) {
        var d = CELL_NEIGHBORS[i];
        var p = state.plants[cellKey(cq + d[0], cr + d[1])];
        if (!p || colorOfPlant(p) !== RAIN_RING_COLOR || p.stage < MAX_STAGE) return false;
      }
      return true;
    }

    // Every tile whose ring-membership could possibly have changed because
    // of something happening AT (q, r): (q, r) itself (it may have just
    // become empty/occupied, i.e. could now be a center) plus its 8
    // neighbors (it may have just become/stopped being one of THEIR
    // spokes). Nothing further out than that can ever be affected by a
    // single-tile change, since a ring only ever looks at its own center
    // and its own 8 neighbors.
    function candidateRingCentersAround(q, r) {
      var list = [{ q: q, r: r }];
      CELL_NEIGHBORS.forEach(function (d) { list.push({ q: q + d[0], r: r + d[1] }); });
      return list;
    }

    // Re-tests a batch of candidate centers against the real garden and
    // adds/removes them from `rainRings` to match, redrawing the map markers
    // once at the end if anything actually changed. Cheap regardless of
    // garden size - bounded by the (tiny) list of candidates passed in, not
    // by the whole plant count.
    function refreshRainRingCandidates(centers) {
      var changed = false;
      centers.forEach(function (c) {
        var key = cellKey(c.q, c.r);
        var was = !!rainRings[key];
        var valid = isRainRingComplete(c.q, c.r);
        if (valid && !was) {
          var ll = cellCenter(c.q, c.r);
          rainRings[key] = { q: c.q, r: c.r, lat: ll.lat, lng: ll.lng };
          changed = true;
        } else if (!valid && was) {
          delete rainRings[key];
          changed = true;
        }
      });
      if (changed) renderRainRings();
      return changed;
    }

    // Full rebuild from scratch - only ever needed once, at boot (see INIT),
    // to seed `rainRings` from whatever a returning player already has
    // planted (an old save can easily already contain a qualifying ring).
    // From then on refreshRainRingCandidates keeps it current incrementally,
    // so nothing else needs to call this. Still cheap even here: only a
    // blue flower already at MAX_STAGE can ever be a ring's spoke, so this
    // walks the (usually tiny) set of those, not the whole garden.
    function recomputeRainRingsFull() {
      var candidates = {};
      Object.keys(state.plants).forEach(function (key) {
        var p = state.plants[key];
        if (colorOfPlant(p) !== RAIN_RING_COLOR || p.stage < MAX_STAGE) return;
        CELL_NEIGHBORS.forEach(function (d) {
          var ck = cellKey(p.q + d[0], p.r + d[1]);
          candidates[ck] = { q: p.q + d[0], r: p.r + d[1] };
        });
      });
      rainRings = {};
      Object.keys(candidates).forEach(function (ck) {
        var c = candidates[ck];
        if (isRainRingComplete(c.q, c.r)) rainRings[ck] = { q: c.q, r: c.r, lat: cellCenter(c.q, c.r).lat, lng: cellCenter(c.q, c.r).lng };
      });
    }

    // Live tick, same cadence/shape as tickSprinklers, and - now that the
    // ring has a rune to actually spawn from - the same droplet-flight
    // animation too: for every active ring, hand any wilted-or-ready plant
    // within RAIN_RING_RADIUS tiles of its center to startRainWatering
    // (below, alongside the sprinkler animation it shares its machinery
    // with) rather than mutating it here directly. Purely detection, same
    // division of labor as tickSprinklers - the actual state change and
    // its save/render happen once each droplet lands, in finishAutoWatering.
    // A ring growing one of its own neighbors' neighbors into a fresh blue
    // cluster (and so completing a second ring) is picked up for free by
    // applyWatering's own hook at that point - nothing extra to do here
    // for that.
    var RAIN_TICK_MS = 1000;
    function tickRainRings() {
      var keys = Object.keys(rainRings);
      if (!keys.length) return;
      var now = Date.now();
      keys.forEach(function (rk) {
        var ring = rainRings[rk];
        if (!ring) return; // a ring earlier in this same pass grew a spoke that broke this one
        for (var dq = -RAIN_RING_RADIUS; dq <= RAIN_RING_RADIUS; dq++) {
          for (var dr = -RAIN_RING_RADIUS; dr <= RAIN_RING_RADIUS; dr++) {
            var pkey = cellKey(ring.q + dq, ring.r + dr);
            if (autoWaterAnimKeys[pkey]) continue; // already on its way to this one
            var p = state.plants[pkey];
            if (!p) continue;
            var wilted = (now - p.lastWateredAt) >= WATER_DURATION_MS;
            var ready = p.stage < MAX_STAGE && now >= p.readyAt;
            if (!wilted && !ready) continue;
            startRainWatering(pkey, ring);
          }
        }
      });
    }

    // Offline counterpart, same spirit as catchUpSprinklersOffline (see its
    // own comment for the general reasoning) - called right after that one,
    // so a ring that only just completed because a sprinkler grew its last
    // spoke during the same gap is already registered in `rainRings` by the
    // time this runs. Iterates a snapshot of the rings active at the start
    // of the gap; a ring that only comes into existence THROUGH this pass's
    // own catch-up (this ring's watering grows another ring's last spoke)
    // catches up for real on the very next live tickRainRings a second
    // later instead of within this same pass - a rare enough chain for a
    // basic first version of this spell not to chase any further.
    function catchUpRainRingsOffline() {
      var ringKeys = Object.keys(rainRings);
      if (!ringKeys.length) return;
      var now = Date.now();
      var changed = false;
      ringKeys.forEach(function (rk) {
        var ring = rainRings[rk];
        if (!ring) return;
        for (var dq = -RAIN_RING_RADIUS; dq <= RAIN_RING_RADIUS; dq++) {
          for (var dr = -RAIN_RING_RADIUS; dr <= RAIN_RING_RADIUS; dr++) {
            var p = state.plants[cellKey(ring.q + dq, ring.r + dr)];
            if (!p) continue;
            var guard = 0;
            while (p.stage < MAX_STAGE && guard++ < 1000) {
              var wiltAt = p.lastWateredAt + WATER_DURATION_MS;
              var nextEvent = Math.min(wiltAt, p.readyAt);
              if (nextEvent > now) break;
              applyWatering(p, nextEvent);
              changed = true;
            }
            if (p.stage >= MAX_STAGE && (now - p.lastWateredAt) >= WATER_DURATION_MS) {
              p.lastWateredAt = now;
              changed = true;
            }
          }
        }
      });
      if (!changed) return;
      saveState();
      renderPlants();
      updateHUD();
      if (viewingKey) renderPlantPanel(viewingKey);
    }

    // ---- Rune marker (the empty center tile) -------------------------------
    // An 8-point compass star (two squares 45deg apart - deliberately not a
    // 5-fold shape, so it never reads as a pentagram) inside two plain
    // circles, alternating tick marks around the rim, small diamond glyphs
    // at the star's points, and a lined raindrop at the center - the exact
    // design signed off on in the standalone preview. Colors are inlined
    // literals rather than the page's CSS custom properties: this markup
    // gets serialized into a divIcon's `html` string and re-parsed by
    // Leaflet outside the page's normal cascade, so a var(--x) reference
    // here would just fail to resolve.
    var RAIN_RUNE_LINE = '#8ecff0';
    var RAIN_RUNE_GLOW = '#9fe0ff';
    var RAIN_RUNE_BACKING = '#16324a';
    var RAIN_RUNE_DROP_TOP = '#eaf9ff';
    var RAIN_RUNE_DROP_MID = '#6fc4ee';
    var RAIN_RUNE_DROP_END = '#2f7ea8';
    function polarPoint(cx, cy, r, deg) {
      var rad = (deg - 90) * Math.PI / 180;
      return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
    }
    function runeSquarePoints(cx, cy, r, rotDeg) {
      var pts = [];
      for (var i = 0; i < 4; i++) pts.push(polarPoint(cx, cy, r, rotDeg + i * 90));
      return pts.map(function (p) { return p.x.toFixed(2) + ',' + p.y.toFixed(2); }).join(' ');
    }
    // idSuffix keeps each ring's gradient <defs> ids unique - divIcon markup
    // gets inserted into the live page DOM as real sibling elements, so two
    // simultaneous rings sharing one id would be invalid HTML (harmless here
    // since both gradients are identical, but not something to rely on).
    function buildRainRuneSVG(px, idSuffix) {
      var cx = 60, cy = 60, rOuter = 54, rTickOuter = 60, rTickShort = 57, rInner = 32, rDiamond = 43;
      var ticks = '';
      for (var i = 0; i < 16; i++) {
        var deg = i * 22.5, long = (i % 2 === 0);
        var from = polarPoint(cx, cy, rOuter, deg), to = polarPoint(cx, cy, long ? rTickOuter : rTickShort, deg);
        ticks += '<line x1="' + from.x.toFixed(2) + '" y1="' + from.y.toFixed(2) + '" x2="' + to.x.toFixed(2) +
          '" y2="' + to.y.toFixed(2) + '" stroke="' + RAIN_RUNE_LINE + '" stroke-width="' + (long ? 1.6 : 1) +
          '" stroke-linecap="round" opacity="' + (long ? 0.9 : 0.55) + '"/>';
      }
      var diamonds = '';
      for (var j = 0; j < 8; j++) {
        var dp = polarPoint(cx, cy, rDiamond, j * 45);
        diamonds += '<rect x="' + (dp.x - 2.6).toFixed(2) + '" y="' + (dp.y - 2.6).toFixed(2) +
          '" width="5.2" height="5.2" transform="rotate(45 ' + dp.x.toFixed(2) + ' ' + dp.y.toFixed(2) + ')" ' +
          'fill="' + RAIN_RUNE_GLOW + '" opacity="0.85"/>';
      }
      var gid = 'rr' + idSuffix;
      return '<svg viewBox="0 0 120 120" width="' + px + '" height="' + px + '">' +
        '<defs>' +
          '<radialGradient id="glow-' + gid + '" cx="50%" cy="50%" r="50%">' +
            '<stop offset="0%" stop-color="' + RAIN_RUNE_GLOW + '" stop-opacity="0.55"/>' +
            '<stop offset="100%" stop-color="' + RAIN_RUNE_GLOW + '" stop-opacity="0"/>' +
          '</radialGradient>' +
          '<radialGradient id="drop-' + gid + '" cx="35%" cy="30%" r="75%">' +
            '<stop offset="0%" stop-color="' + RAIN_RUNE_DROP_TOP + '"/>' +
            '<stop offset="55%" stop-color="' + RAIN_RUNE_DROP_MID + '"/>' +
            '<stop offset="100%" stop-color="' + RAIN_RUNE_DROP_END + '"/>' +
          '</radialGradient>' +
        '</defs>' +
        '<circle cx="60" cy="60" r="58" fill="' + RAIN_RUNE_BACKING + '" opacity="0.55"/>' +
        '<circle cx="60" cy="60" r="70" fill="url(#glow-' + gid + ')"/>' +
        '<g class="rain-rune-spin">' +
          '<circle cx="60" cy="60" r="' + rOuter + '" fill="none" stroke="' + RAIN_RUNE_LINE + '" stroke-width="1.4" opacity="0.85"/>' +
          '<polygon points="' + runeSquarePoints(cx, cy, 46, 0) + '" fill="none" stroke="' + RAIN_RUNE_LINE + '" stroke-width="1.1" opacity="0.7"/>' +
          '<polygon points="' + runeSquarePoints(cx, cy, 46, 45) + '" fill="none" stroke="' + RAIN_RUNE_LINE + '" stroke-width="1.1" opacity="0.7"/>' +
          ticks + diamonds +
        '</g>' +
        '<circle cx="60" cy="60" r="' + rInner + '" fill="none" stroke="' + RAIN_RUNE_LINE + '" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.8"/>' +
        '<path d="M60 38 C69 51 78 62 78 71 C78 82 70 89 60 89 C50 89 42 82 42 71 C42 62 51 51 60 38 Z" ' +
          'fill="url(#drop-' + gid + ')" stroke="' + RAIN_RUNE_DROP_TOP + '" stroke-width="1" opacity="0.97"/>' +
      '</svg>';
    }
    function makeRainRuneIcon(px, idSuffix) {
      return L.divIcon({
        html: buildRainRuneSVG(px, idSuffix), iconSize: [px, px], iconAnchor: [px / 2, px / 2], className: ''
      });
    }

    // ---- Boundary glyphs (the edge of the 5x5 zone) ------------------------
    // Fragments of the same linework "branching out" from the rune to mark
    // how far it reaches: a dashed square (no fill - a flat color wash reads
    // as a highlight, not a rune), an etched right-angle bracket at each of
    // the 4 corners, and a short outward tick capped with a small diamond at
    // each of the 4 edge midpoints. All in real lat/lng (like cellRingLatLngs
    // already used for the plant-range preview), not pixel-sized markers, so
    // they reproject for free on pan/zoom with no rescale handling needed.
    function rainBoundaryGeometry(centerQ, centerR, N) {
      var half = N + 0.5, arm = 0.62, tickLen = 0.55, capD = 0.16;
      function ll(qOff, rOff) { return [(centerR + rOff) * CELL_LAT_DEG, (centerQ + qOff) * CELL_LNG_DEG]; }

      var square = [ll(-half, -half), ll(half, -half), ll(half, half), ll(-half, half)]; // BL, BR, TR, TL

      var lines = [];
      function bracket(qOff, rOff, armQSign, armRSign) {
        lines.push([ll(qOff, rOff), ll(qOff, rOff + armRSign * arm)]);
        lines.push([ll(qOff, rOff), ll(qOff + armQSign * arm, rOff)]);
      }
      bracket(-half, -half, 1, 1);   // BL: arms point inward - east and north
      bracket(half, -half, -1, 1);   // BR: west and north
      bracket(half, half, -1, -1);   // TR: west and south
      bracket(-half, half, 1, -1);   // TL: east and south

      var diamonds = [];
      function edgeTick(qOff, rOff, dq, dr) {
        var tipLL = ll(qOff + dq * tickLen, rOff + dr * tickLen);
        lines.push([ll(qOff, rOff), tipLL]);
        diamonds.push([
          [tipLL[0] + capD * CELL_LAT_DEG, tipLL[1]],
          [tipLL[0], tipLL[1] + capD * CELL_LNG_DEG],
          [tipLL[0] - capD * CELL_LAT_DEG, tipLL[1]],
          [tipLL[0], tipLL[1] - capD * CELL_LNG_DEG]
        ]);
      }
      edgeTick(0, -half, 0, -1); // bottom mid, ticking further south
      edgeTick(0, half, 0, 1);   // top mid, ticking further north
      edgeTick(-half, 0, -1, 0); // left mid, ticking further west
      edgeTick(half, 0, 1, 0);   // right mid, ticking further east

      return { square: square, lines: lines, diamonds: diamonds };
    }

    // px is sized the same way every other plant-adjacent icon is
    // (plantIconBase(), the current on-screen width of one tile), so the
    // rune scales with zoom exactly like a flower or sprinkler would - see
    // the rescalePlantIcons()/scheduleMarkerRender() hookups below for the
    // live in-gesture and settled-zoom halves of that. The boundary layers
    // never need a rebuild call here at all (real lat/lng geometry, not
    // pixel icons), only teardown when a ring itself goes away.
    var rainRingLayers = {}; // centerKey -> { marker, area, lines, diamonds }
    function renderRainRings() {
      var seen = {};
      var basePx = plantIconBase();
      _iconBuiltPx = basePx; // same bookkeeping makeSprinklerIcon does with its own unscaled px
      var px = Math.round(basePx * 0.92);
      Object.keys(rainRings).forEach(function (key) {
        var ring = rainRings[key];
        seen[key] = true;
        var existing = rainRingLayers[key];
        var iconKey = px + '';
        if (existing) {
          if (existing.marker._iconKey !== iconKey) {
            existing.marker.setIcon(makeRainRuneIcon(px, key.replace(/[^a-zA-Z0-9]/g, '_')));
            existing.marker._iconKey = iconKey;
          }
          return;
        }
        var marker = L.marker([ring.lat, ring.lng], {
          icon: makeRainRuneIcon(px, key.replace(/[^a-zA-Z0-9]/g, '_')), interactive: false, zIndexOffset: 80
        }).addTo(map);
        marker._iconKey = iconKey;
        var geo = rainBoundaryGeometry(ring.q, ring.r, RAIN_RING_RADIUS);
        var area = L.polygon(geo.square, {
          color: RAIN_RUNE_LINE, weight: 1.4, fill: false, dashArray: '5 6', opacity: 0.55, interactive: false
        }).addTo(map);
        var lines = L.polyline(geo.lines, {
          color: RAIN_RUNE_LINE, weight: 1.6, opacity: 0.75, lineCap: 'round', interactive: false
        }).addTo(map);
        var diamonds = L.polygon(geo.diamonds, {
          color: RAIN_RUNE_GLOW, weight: 0, fillColor: RAIN_RUNE_GLOW, fillOpacity: 0.85, interactive: false
        }).addTo(map);
        rainRingLayers[key] = { marker: marker, area: area, lines: lines, diamonds: diamonds };
      });
      Object.keys(rainRingLayers).forEach(function (key) {
        if (seen[key]) return;
        var l = rainRingLayers[key];
        map.removeLayer(l.marker); map.removeLayer(l.area); map.removeLayer(l.lines); map.removeLayer(l.diamonds);
        delete rainRingLayers[key];
      });
    }

    // ---- Automatic watering animation (sprinklers AND rain rings) ----------
    // Neither a placed sprinkler nor a rain ring's rune reaches out and
    // touches a flower the way a watering-can tap does, so the state change
    // needs its own signal, the same reasoning waterWithCan already applies
    // to a manual tap: play the animation, then apply the real mutation once
    // it lands, so the animation reads as the cause of the watering rather
    // than decoration tacked on after the fact. A beat passes first
    // (SPRINKLER_ANIM_DELAY_MS - "it noticed"), then a handful of droplets
    // burst outward from the source in random directions and curve back in
    // to converge on the flower. This machinery was sprinkler-only until the
    // rain ring got its own rune to spawn droplets from (see RAIN RINGS,
    // above) - the SPRINKLER_ prefix on the shared timing constants below is
    // legacy from that, not a sign this is still sprinkler-specific.
    var SPRINKLER_ANIM_DELAY_MS = 1000; // the pause between "needs water" and the droplets launching
    var SPRINKLER_DROPLET_COUNT = 4;
    var SPRINKLER_DROPLET_MS = 750;     // flight time per droplet, burst-out to landing
    // Plant key -> true while that plant has ANY auto-watering event in
    // flight (a sprinkler's or a rain ring's - the delay, or the droplets
    // themselves) - guards tickSprinklers/tickRainRings from starting a
    // second one on top of it before the first lands, and keeps a plant in
    // range of both a sprinkler and a rain ring from getting double-watered
    // in the same moment.
    var autoWaterAnimKeys = {};

    function startSprinklerWatering(pkey, sprinkler) {
      autoWaterAnimKeys[pkey] = true;
      // Reduced motion collapses every animation to 0.01ms elsewhere in the
      // game, so there's nothing to wait out here either - straight to the
      // result, same as waterWithCan's own reduceMotion branch.
      if (reduceMotion) { delete autoWaterAnimKeys[pkey]; finishAutoWatering(pkey); return; }
      setTimeout(function () {
        var p = state.plants[pkey];
        if (!p) { delete autoWaterAnimKeys[pkey]; return; } // harvested during the delay
        playWaterDroplets(sprinkler, pkey, function (landed) {
          delete autoWaterAnimKeys[pkey];
          if (landed) finishAutoWatering(pkey);
        });
      }, SPRINKLER_ANIM_DELAY_MS);
    }

    // Same shape as startSprinklerWatering, sourced from a rain ring's
    // center tile (see tickRainRings, above) instead of a placed sprinkler -
    // the rune sitting there is the "sprinkler head" for this spell.
    function startRainWatering(pkey, ring) {
      autoWaterAnimKeys[pkey] = true;
      if (reduceMotion) { delete autoWaterAnimKeys[pkey]; finishAutoWatering(pkey); return; }
      setTimeout(function () {
        var p = state.plants[pkey];
        if (!p) { delete autoWaterAnimKeys[pkey]; return; }
        playWaterDroplets(ring, pkey, function (landed) {
          delete autoWaterAnimKeys[pkey];
          if (landed) finishAutoWatering(pkey);
        });
      }, SPRINKLER_ANIM_DELAY_MS);
    }

    // Drives SPRINKLER_DROPLET_COUNT droplets along their own quadratic
    // Bezier curve each frame: source -> a random outward point (the
    // "burst") -> the flower (the "home in"). `source` just needs a
    // lat/lng - a placed sprinkler and a rain ring's center both qualify.
    // Recomputes both endpoints' screen position every frame
    // (map.latLngToContainerPoint) rather than caching them once, so a pan
    // or zoom mid-flight doesn't leave the droplets drifting off their real
    // targets - same reasoning the fx-layer comment already gives for
    // repositioning on 'move zoom'. Calls back with false (no watering
    // applied) if the flower was harvested out from under the animation
    // before it landed.
    function playWaterDroplets(source, plantKey, onDone) {
      var layer = document.getElementById('fx-layer');
      var drops = [];
      for (var i = 0; i < SPRINKLER_DROPLET_COUNT; i++) {
        var el = document.createElement('div');
        el.className = 'fx-item sprinkler-drop';
        layer.appendChild(el);
        drops.push({
          el: el,
          angle: Math.random() * Math.PI * 2,
          burst: 10 + Math.random() * 16,   // px flung outward before curving toward the flower
          delay: Math.random() * 160        // slight stagger so the burst doesn't read as one blob
        });
      }
      var start = performance.now();
      function frame(now) {
        var p = state.plants[plantKey];
        if (!p) { drops.forEach(function (d) { d.el.remove(); }); onDone(false); return; }
        var s = map.latLngToContainerPoint([source.lat, source.lng]);
        var e = map.latLngToContainerPoint([p.lat, p.lng]);
        var allDone = true;
        drops.forEach(function (d) {
          var elapsed = now - start - d.delay;
          if (elapsed < 0) { d.el.style.opacity = '0'; allDone = false; return; }
          var frac = Math.min(1, elapsed / SPRINKLER_DROPLET_MS);
          if (frac < 1) allDone = false;
          var ctrlX = s.x + Math.cos(d.angle) * d.burst;
          var ctrlY = s.y + Math.sin(d.angle) * d.burst;
          var u = 1 - frac;
          var x = u * u * s.x + 2 * u * frac * ctrlX + frac * frac * e.x;
          var y = u * u * s.y + 2 * u * frac * ctrlY + frac * frac * e.y;
          // Fade in fast, hold, fade out right at landing (reads as a small splash).
          d.el.style.opacity = frac < 0.12 ? (frac / 0.12) : (frac > 0.82 ? Math.max(0, (1 - frac) / 0.18) : 1);
          d.el.style.transform = 'translate(' + (x - 3) + 'px,' + (y - 4) + 'px)';
        });
        if (!allDone) requestAnimationFrame(frame);
        else { drops.forEach(function (d) { d.el.remove(); }); onDone(true); }
      }
      requestAnimationFrame(frame);
    }

    // The actual mutation, applied once the droplets land - same worker
    // waterPlant uses, just with its own messaging (no vibrate; an automatic
    // watering source acting on its own isn't something to buzz the
    // player's phone over). Shared by both a landed sprinkler droplet and a
    // landed rain-ring droplet.
    function finishAutoWatering(pkey) {
      var p = state.plants[pkey];
      if (!p) return;
      var now = Date.now();
      var res = applyWatering(p, now);
      recomputePlant(p, now);
      saveState();
      renderPlants();
      updateHUD();
      if (viewingKey === pkey) renderPlantPanel(pkey);
      if (res.revealed) {
        toast('\u{1F338} Your cross opened - it\'s a ' + variantName(res.revealed) + '!');
      } else if (res.grew) {
        toast('\u{1F4A6} ' + GROWTH_MESSAGES[p.stage]);
      }
    }

    // ---------------------------------------------------------------------
    //  WILD FLOWERS
    //  Spawned once per local calendar day along real OSM paths. See the
    //  WILD_* constants above for the placement rules and the privacy note.
    // ---------------------------------------------------------------------
    // Local calendar day, not UTC - "the first time you open it each day"
    // should mean the player's day, so the roll-over happens at their midnight.
    function localDayKey(d) {
      d = d || new Date();
      var m = d.getMonth() + 1, day = d.getDate();
      return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
    }

    // How far through its short life a wild flower is. Entirely derived from
    // spawnedAt, so - like the plant growth engine - it stays correct across
    // however long the page was closed.
    function wildDerived(w, now) {
      var age = now - w.spawnedAt;
      return {
        wilted: age >= WILD_WILT_MS,
        gone: age >= WILD_GONE_MS,
        goneIn: Math.max(0, WILD_GONE_MS - age),
        lifeFrac: Math.max(0, Math.min(1, 1 - age / WILD_GONE_MS))
      };
    }

    // Records every tile within planting range of (q, r) as "accessible" - a
    // spot the player was actually able to stand close enough to plant at,
    // at least once. pickWildSpots draws from this pool first, so the wild
    // crop gravitates toward ground that's proven reachable instead of a
    // uniformly random disc that doesn't know about lakes, rooftops, or
    // fenced yards. Persisted forever (once reachable, always a priority),
    // and cheap: only newly-seen tiles trigger a save, so retracing the same
    // streets costs nothing after the first pass.
    function markAccessible(q, r) {
      var added = false;
      for (var dq = -PLANT_RANGE; dq <= PLANT_RANGE; dq++) {
        for (var dr = -PLANT_RANGE; dr <= PLANT_RANGE; dr++) {
          var key = cellKey(q + dq, r + dr);
          if (!state.visited[key]) { state.visited[key] = 1; added = true; }
        }
      }
      if (added) saveState();
    }

    // Sibling to markAccessible() above, but keyed to the player's local
    // calendar day instead of forever: records every tile within planting
    // range of (q, r) as usable for the rest of today, so a spot tended
    // earlier on a walk stays actionable after the player has moved
    // somewhere else entirely (see inRange()). Resets itself the first time
    // it's called after a local-midnight rollover. NOT the same set as
    // state.visited - that one is permanent and only ever biases wild-flower
    // spawning; this one is real gameplay range and clears daily.
    function markAccessibleToday(q, r) {
      var today = localDayKey();
      if (state.todayAccessibleDay !== today) {
        state.todayAccessible = {};
        state.todayAccessibleDay = today;
      }
      var added = false;
      for (var dq = -PLANT_RANGE; dq <= PLANT_RANGE; dq++) {
        for (var dr = -PLANT_RANGE; dr <= PLANT_RANGE; dr++) {
          var key = cellKey(q + dq, r + dr);
          if (!state.todayAccessible[key]) { state.todayAccessible[key] = 1; added = true; }
        }
      }
      if (added) {
        saveState();
        // The green today-access fill (see renderGridMesh) needs to grow
        // right away, not just on the next pan/zoom - e.g. the player is
        // walking with 'following' off, so nothing else is about to pan the
        // map and trigger a redraw on its own. scheduleGridRedraw is
        // declared later in the file, textually, but function declarations
        // (unlike var) are hoisted whole, not just their name, so it's
        // already callable here regardless of source order. renderGridMesh
        // itself is a no-op until the map/canvas actually exist and are
        // zoomed in past GRID_MIN_ZOOM, so there's nothing to guard here.
        scheduleGridRedraw();
      }
    }

    // The one gate every plant/water/harvest/sell/fertilize/pick/sprinkler
    // action goes through: true if the player's LIVE position is within
    // PLANT_RANGE of (q, r) right now, OR if (q, r) was within range at any
    // point earlier today (state.todayAccessible) - rewarding the walk
    // itself rather than requiring the player to be standing right next to
    // a tile at the exact moment they want to tend it. The day check is
    // re-verified here (not just trusted from whenever todayAccessible was
    // last written) so a set left over from before a midnight rollover that
    // simply hasn't been touched yet is never mistaken for today's.
    function inRange(q, r) {
      if (!state.userPos) return false;
      var uh = latLngToCell(state.userPos.lat, state.userPos.lng);
      if (cellDist(uh.q, uh.r, q, r) <= PLANT_RANGE) return true;
      if (state.todayAccessibleDay !== localDayKey()) return false;
      return !!state.todayAccessible[cellKey(q, r)];
    }

    // Priority + rejection sampling. First fills from state.visited - tiles
    // proven reachable before, within WILD_SPAWN_RADIUS_M and shuffled so the
    // same handful near home don't always win - then, if that pool can't
    // cover `needed` (a fresh save, or a walk into brand-new territory),
    // falls back to throwing darts at the disc around the player like
    // before. Either way, a spot only survives if it's at least
    // WILD_MIN_GAP tiles from every existing wild flower, every plant
    // the player owns, and every spot already chosen in this same pass.
    // Capped attempts on the fallback, so a garden so dense that nothing
    // fits simply yields fewer flowers instead of spinning.
    function pickWildSpots(needed) {
      if (!state.userPos) return [];
      var avoid = [];
      Object.keys(state.wild).forEach(function (k) { avoid.push(state.wild[k]); });
      Object.keys(state.plants).forEach(function (k) { avoid.push(state.plants[k]); });
      Object.keys(state.sprinklers).forEach(function (k) { avoid.push(state.sprinklers[k]); });

      var origin = state.userPos;
      var lngScale = 111111 * Math.cos(origin.lat * Math.PI / 180);
      var chosen = [];

      var visitedCandidates = [];
      Object.keys(state.visited).forEach(function (k) {
        var parts = k.split(','), q = +parts[0], r = +parts[1];
        var c = cellCenter(q, r);
        if (metersBetween(origin, c) <= WILD_SPAWN_RADIUS_M) visitedCandidates.push({ q: q, r: r });
      });
      // Fisher-Yates - an unshuffled visited list would always favor the
      // earliest-discovered tiles over ground found more recently.
      for (var i = visitedCandidates.length - 1; i > 0; i--) {
        var j0 = Math.floor(Math.random() * (i + 1));
        var tmp = visitedCandidates[i]; visitedCandidates[i] = visitedCandidates[j0]; visitedCandidates[j0] = tmp;
      }
      for (var vi = 0; vi < visitedCandidates.length && chosen.length < needed; vi++) {
        var vh = visitedCandidates[vi];
        var vok = true;
        for (var vj = 0; vj < avoid.length; vj++) {
          if (cellDist(vh.q, vh.r, avoid[vj].q, avoid[vj].r) < WILD_MIN_GAP) { vok = false; break; }
        }
        if (!vok) continue;
        chosen.push(vh);
        avoid.push(vh);
      }

      var attempts = needed * 200;
      for (var a = 0; a < attempts && chosen.length < needed; a++) {
        // sqrt of a uniform gives an even spread over the disc's *area*;
        // without it everything bunches towards the player.
        var ang = Math.random() * Math.PI * 2;
        var dist = Math.sqrt(Math.random()) * WILD_SPAWN_RADIUS_M;
        var h = latLngToCell(
          origin.lat + (dist * Math.cos(ang)) / 111111,
          origin.lng + (dist * Math.sin(ang)) / lngScale
        );
        var ok = true;
        for (var j = 0; j < avoid.length; j++) {
          if (cellDist(h.q, h.r, avoid[j].q, avoid[j].r) < WILD_MIN_GAP) { ok = false; break; }
        }
        if (!ok) continue;
        chosen.push(h);
        avoid.push(h);
      }
      return chosen;
    }

    // Straight-line metres and a rough compass point, used by the wild-flower
    // spawn toast so "nothing appeared" can always be told apart from "it
    // appeared 600m north of you". Equirectangular is plenty at sub-kilometre scale.
    function metersBetween(a, b) {
      var dLat = (b.lat - a.lat) * 111111;
      var dLng = (b.lng - a.lng) * 111111 * Math.cos(a.lat * Math.PI / 180);
      return Math.sqrt(dLat * dLat + dLng * dLng);
    }
    function compassLabel(from, to) {
      var dLat = to.lat - from.lat;
      var dLng = (to.lng - from.lng) * Math.cos(from.lat * Math.PI / 180);
      var ang = (Math.atan2(dLng, dLat) * 180 / Math.PI + 360) % 360;
      return ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][Math.round(ang / 45) % 8];
    }
    function nearestWild() {
      if (!state.userPos) return null;
      var best = null;
      Object.keys(state.wild).forEach(function (k) {
        var w = state.wild[k];
        var dist = metersBetween(state.userPos, w);
        if (!best || dist < best.dist) {
          best = { key: k, w: w, dist: dist, dir: compassLabel(state.userPos, w) };
        }
      });
      return best;
    }

    // Plain-language account of what the last spawn did, shown on the Wild
    // Flowers screen. Runtime-only. Most of a crop lands off-screen by design,
    // so without this a successful spawn and a skipped one look identical.
    var wildStatus = 'No crop scattered yet this session.';

    // Called once per session after the GPS locks. Now entirely local and
    // synchronous - no network, so the only way to come up short is a garden
    // too crowded to fit anything.
    function maybeSpawnWild() {
      var today = localDayKey();
      if (!state.userPos) { wildStatus = 'Waiting for GPS.'; return; }
      if (state.lastWildDay === today) {
        wildStatus = 'Today\'s crop has already been scattered. More tomorrow.';
        return;
      }

      var needed = WILD_MAX - Object.keys(state.wild).length;
      if (needed <= 0) {
        state.lastWildDay = today;
        wildStatus = 'The map is already full at ' + WILD_MAX + '. Pick some to make room.';
        saveState();
        return;
      }

      var spots = pickWildSpots(needed);
      var rareSpawned = false;
      spots.forEach(function (h) {
        var c = cellCenter(h.q, h.r);
        var sp = SPECIES[Math.floor(Math.random() * SPECIES.length)];
        // Wild flowers are almost always standard colors - everything past
        // tier 0 has to be bred, so a walk can basically never hand you what
        // breeding is for. WILD_RARE_CHANCE is the one deliberate exception,
        // capped at tier 1 - see its own comment above.
        var rare = Math.random() < WILD_RARE_CHANCE;
        var col = rare
          ? WILD_RARE_COLORS[Math.floor(Math.random() * WILD_RARE_COLORS.length)]
          : STANDARD_COLORS[Math.floor(Math.random() * STANDARD_COLORS.length)];
        if (rare) rareSpawned = true;
        state.wild[cellKey(h.q, h.r)] = {
          q: h.q, r: h.r, lat: c.lat, lng: c.lng, species: sp.key, color: col,
          stage: 2, spawnedAt: Date.now()
        };
      });

      state.lastWildDay = today;
      saveState();
      renderWild();
      updateHUD();

      if (spots.length > 0) {
        var near = nearestWild();
        wildStatus = spots.length + ' scattered within ' + WILD_SPAWN_RADIUS_M +
          'm. They wilt after ' + (WILD_WILT_MS / HOUR) + 'h and are gone by ' + (WILD_GONE_MS / HOUR) + 'h.';
        // Lead with the distance to the closest one - most of the crop lands
        // off-screen, so otherwise this announces blooms against a map that
        // looks completely unchanged. A rare color in the batch gets its own
        // call-out rather than blending into the ordinary count, since
        // otherwise the one thing worth hurrying out for reads identically
        // to every other day's crop.
        toast((rareSpawned ? '\u{2728} A rare-colored wild flower is out there today! ' : '\u{1F33C} ') +
          spots.length + ' wild ' + (spots.length === 1 ? 'flower' : 'flowers') + ' bloomed nearby' +
          (near ? ' - nearest is ' + Math.round(near.dist) + 'm ' + near.dir : '') + '!');
        vibrate(25);
      } else {
        wildStatus = 'Nowhere free to scatter any - your flowers cover the area.';
      }
    }

    // ---- Weeds (spawn) -----------------------------------------------------
    // Deliberately parallel to pickWildSpots above, not a shared helper - the
    // wild version prioritizes state.visited (proven-reachable ground) which
    // matters for a once-a-day crop meant to pull a player out on a walk;
    // weeds are a much smaller, much more frequent trickle where that extra
    // bookkeeping isn't worth it. A plain dart-throw against the same
    // avoid-list shape (cellDist + WEED_MIN_GAP) is plenty.
    function pickWeedSpots(needed) {
      if (!state.userPos) return [];
      var avoid = [];
      Object.keys(state.plants).forEach(function (k) { avoid.push(state.plants[k]); });
      Object.keys(state.wild).forEach(function (k) { avoid.push(state.wild[k]); });
      Object.keys(state.sprinklers).forEach(function (k) { avoid.push(state.sprinklers[k]); });
      Object.keys(state.weeds).forEach(function (k) { avoid.push(state.weeds[k]); });

      var origin = state.userPos;
      var lngScale = 111111 * Math.cos(origin.lat * Math.PI / 180);
      var chosen = [];

      // attempts scales with `needed` (not a fixed count), so the issue #6
      // bump from WEED_MAX 6 to 30 already carries a proportional retry
      // budget for free - 1200 attempts at needed=6, 6000 at needed=30, same
      // ~200-per-slot ratio either way. Checked the actual odds too: a cell
      // is CELL_LAT_DEG ~20m across, WEED_MIN_GAP=3 excludes a Chebyshev
      // radius of 2 around every avoid entry (a ~5x5-cell, ~100m x 100m
      // block, ~10,000 sq m), and WEED_SPAWN_RADIUS_M=700 gives a disc of
      // pi*700^2 =~1.54M sq m. Even fully packed with all 30 weeds already
      // placed (worst case, ignoring plants/wild/sprinklers on top), that is
      // 30 * 10,000 =~300,000 sq m excluded, ~19% of the disc - each dart
      // still lands clean roughly 80% of the time, so 200 tries for that
      // last slot is overkill, not a shortfall. No change needed here.
      var attempts = needed * 200;
      for (var a = 0; a < attempts && chosen.length < needed; a++) {
        // sqrt of a uniform gives an even spread over the disc's *area*; same
        // reasoning as pickWildSpots's own fallback loop.
        var ang = Math.random() * Math.PI * 2;
        var dist = Math.sqrt(Math.random()) * WEED_SPAWN_RADIUS_M;
        var h = latLngToCell(
          origin.lat + (dist * Math.cos(ang)) / 111111,
          origin.lng + (dist * Math.sin(ang)) / lngScale
        );
        var ok = true;
        for (var j = 0; j < avoid.length; j++) {
          if (cellDist(h.q, h.r, avoid[j].q, avoid[j].r) < WEED_MIN_GAP) { ok = false; break; }
        }
        if (!ok) continue;
        chosen.push(h);
        avoid.push(h);
      }
      return chosen;
    }

    // Called from tickPlants() - a rolling cooldown (WEED_SPAWN_INTERVAL_MS)
    // rather than wild flowers' once-per-calendar-day gate, so weeds trickle
    // back in a couple hours after being cleared instead of requiring a
    // fresh day. Stamps lastWeedSpawnAt even when nothing actually spawned
    // (board already full, or no free tile found) - same reasoning as
    // maybeSpawnWild stamping lastWildDay regardless of outcome - so a full
    // board doesn't retry every single tick until something clears.
    function maybeSpawnWeeds() {
      if (!state.userPos) return;
      var now = Date.now();
      if (state.lastWeedSpawnAt && now - state.lastWeedSpawnAt < WEED_SPAWN_INTERVAL_MS) return;
      state.lastWeedSpawnAt = now;

      var needed = WEED_MAX - Object.keys(state.weeds).length;
      if (needed <= 0) { saveState(); return; }

      var spots = pickWeedSpots(needed);
      spots.forEach(function (h) {
        var c = cellCenter(h.q, h.r);
        state.weeds[cellKey(h.q, h.r)] = { q: h.q, r: h.r, lat: c.lat, lng: c.lng, spawnedAt: now };
      });
      saveState();
      renderWeeds();
    }

    // ---------------------------------------------------------------------
    //  VISUALS
    // ---------------------------------------------------------------------
    // ---- Flower artwork --------------------------------------------------
    // Flowers are drawn as inline SVG built here at runtime, not as emoji or
    // image files. That is what makes an arbitrary color wearable by an
    // arbitrary species: shape comes from species.shape, every fill comes from
    // the color, and the two never have to know about each other. It also
    // keeps the game a single dependency-free file and makes a flower look the
    // same on every device, which emoji never did.
    //
    // Everything is authored in a 100x100 viewBox and scaled by the caller, so
    // one definition serves an 18px inline chip and a 110px zoomed-in marker.
    var PETAL_STROKE = 2.2;  // viewBox units, so it scales with the flower

    // A petal centred `r` units above the middle, then rotated into place.
    function petalShape(row, cy, fill, edge, angle) {
      var rx = row.rx, ry = row.ry;
      var common = ' fill="' + fill + '" stroke="' + edge + '" stroke-width="' + PETAL_STROKE +
        '" stroke-linejoin="round" transform="rotate(' + angle.toFixed(2) + ' 50 50)"/>';
      if (row.tip === 'round') {
        return '<ellipse cx="50" cy="' + cy.toFixed(2) + '" rx="' + rx + '" ry="' + ry + '"' + common;
      }
      var top = cy - ry, bot = cy + ry;
      if (row.tip === 'notch') {
        // Heart-shaped petal: two lobes at the tip with a dip between them.
        return '<path d="M50 ' + (top + ry * 0.42).toFixed(2) +
          ' L' + (50 - rx * 0.55).toFixed(2) + ' ' + top.toFixed(2) +
          ' C' + (50 - rx).toFixed(2) + ' ' + (top + ry * 0.75).toFixed(2) +
          ' ' + (50 - rx).toFixed(2) + ' ' + (bot - ry * 0.35).toFixed(2) +
          ' 50 ' + bot.toFixed(2) +
          ' C' + (50 + rx).toFixed(2) + ' ' + (bot - ry * 0.35).toFixed(2) +
          ' ' + (50 + rx).toFixed(2) + ' ' + (top + ry * 0.75).toFixed(2) +
          ' ' + (50 + rx * 0.55).toFixed(2) + ' ' + top.toFixed(2) + ' Z"' + common;
      }
      // 'point' - an almond, tapered at both ends.
      return '<path d="M50 ' + top.toFixed(2) +
        ' C' + (50 + rx).toFixed(2) + ' ' + (top + ry * 0.55).toFixed(2) +
        ' ' + (50 + rx).toFixed(2) + ' ' + (bot - ry * 0.45).toFixed(2) +
        ' 50 ' + bot.toFixed(2) +
        ' C' + (50 - rx).toFixed(2) + ' ' + (bot - ry * 0.45).toFixed(2) +
        ' ' + (50 - rx).toFixed(2) + ' ' + (top + ry * 0.55).toFixed(2) +
        ' 50 ' + top.toFixed(2) + ' Z"' + common;
    }

    // Icons are rebuilt on every zoomend and every 60s tick, and a rose is 20
    // petals of path maths, so the finished markup is memoised. Species and
    // colors are both static, so the key is complete.
    // Gradient/halo/spark markup for a signature color, or '' for the rest.
    //
    // The gradient ids are deterministic (`pg-<colorid>`), so the same id
    // appears in every copy of that flower on screen at once. That is safe
    // *because* it is deterministic: every element carrying a given id has
    // byte-identical contents, so whichever one the browser resolves
    // url(#pg-ember) against paints the same thing, and each <svg> carries
    // its own copy so a reference can never be left dangling. Unique ids per
    // instance would defeat the memo cache below for no gain.
    function fancyDefs(color) {
      if (!color.grad) return '';
      var g = color.grad;
      // objectBoundingBox units (the default), so the axis is each petal's own
      // box - and since petals are drawn pointing up and then rotated, the
      // gradient rotates with them: light at every tip, deep at every base.
      return '<defs>' +
        '<linearGradient id="pg-' + color.id + '" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0" stop-color="' + g[0] + '"/>' +
        '<stop offset="0.55" stop-color="' + g[1] + '"/>' +
        '<stop offset="1" stop-color="' + g[2] + '"/></linearGradient>' +
        '<linearGradient id="pgd-' + color.id + '" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0" stop-color="' + shadeHex(g[0], 0.88) + '"/>' +
        '<stop offset="0.55" stop-color="' + shadeHex(g[1], 0.86) + '"/>' +
        '<stop offset="1" stop-color="' + shadeHex(g[2], 0.86) + '"/></linearGradient>' +
        '<radialGradient id="hg-' + color.id + '">' +
        '<stop offset="0.35" stop-color="' + color.glow + '" stop-opacity="0.75"/>' +
        '<stop offset="0.7" stop-color="' + color.glow + '" stop-opacity="0.28"/>' +
        '<stop offset="1" stop-color="' + color.glow + '" stop-opacity="0"/>' +
        '</radialGradient></defs>';
    }
    // Six motes on a ring outside the petals, twinkling out of phase. Fixed
    // positions rather than a particle simulation: this markup is memoised and
    // re-injected on every zoom, so it has to stay a pure function of the
    // color, and CSS does the moving.
    var SPARK_COUNT = 6;
    function sparkMarkup(color) {
      if (!color.spark) return '';
      var out = '';
      for (var i = 0; i < SPARK_COUNT; i++) {
        var a = (Math.PI * 2 / SPARK_COUNT) * i - Math.PI / 2;
        var rr = i % 2 ? 47 : 41;
        out += '<circle class="bloom-spark" cx="' + (50 + Math.cos(a) * rr).toFixed(2) +
          '" cy="' + (50 + Math.sin(a) * rr).toFixed(2) + '" r="' + (i % 2 ? 1.9 : 2.7) +
          '" fill="' + color.spark + '" style="animation-delay:' + (i * 0.37).toFixed(2) + 's"/>';
      }
      return out;
    }

    // The flower head's own markup - halo, petal rows, center circle,
    // dots/stamen, sparks - with no <svg> wrapper and no fancyDefs. Shared by
    // flowerSVG (the flat, standalone flower used in chips/panels) and
    // headGroup (the same flower head mounted on a stem - see
    // buildPlantVisual) so both draw byte-identical petal geometry.
    function flowerHeadInner(species, color) {
      var sh = species.shape, out = '';
      if (color.glow) {
        out += '<circle class="bloom-halo" cx="50" cy="50" r="49" fill="url(#hg-' +
          color.id + ')"/>';
      }
      sh.rows.forEach(function (row) {
        var fill = color.grad
          ? 'url(#' + (row.deep ? 'pgd-' : 'pg-') + color.id + ')'
          : (row.deep ? color.deep : color.petal);
        var cy = 50 - row.r;
        for (var i = 0; i < row.n; i++) {
          out += petalShape(row, cy, fill, color.edge, (360 / row.n) * i + (row.rot || 0));
        }
      });

      var c = sh.center;
      out += '<circle cx="50" cy="50" r="' + c.r + '" fill="' + color.center +
        '" stroke="' + color.edge + '" stroke-width="' + PETAL_STROKE + '"/>';
      if (c.dots) {
        // Speckled disc florets - what separates a sunflower/blossom eye from
        // a plain dot at map scale.
        for (var d = 0; d < c.dots; d++) {
          var a = (Math.PI * 2 / c.dots) * d, rr = c.r * 0.5;
          out += '<circle cx="' + (50 + Math.cos(a) * rr).toFixed(2) + '" cy="' +
            (50 + Math.sin(a) * rr).toFixed(2) + '" r="' + (c.r * 0.22).toFixed(2) +
            '" fill="' + shadeHex(color.center, 0.7) + '"/>';
        }
      }
      if (c.stamen) {
        out += '<path d="M50 50 L50 ' + (50 - c.r * 3.2).toFixed(2) + '" stroke="' + color.center +
          '" stroke-width="2.4" stroke-linecap="round"/>' +
          '<circle cx="50" cy="' + (50 - c.r * 3.2).toFixed(2) + '" r="' + (c.r * 0.7).toFixed(2) +
          '" fill="' + color.center + '"/>';
      }

      // Sparks go last so they sit above the petals rather than behind them.
      out += sparkMarkup(color);
      return out;
    }

    var flowerSvgCache = {};
    function flowerSVG(species, color, px) {
      var ck = species.key + '|' + color.id + '|' + px;
      if (flowerSvgCache[ck]) return flowerSvgCache[ck];

      var out = fancyDefs(color) + flowerHeadInner(species, color);
      var svg = '<svg viewBox="0 0 100 100" width="' + px + '" height="' + px +
        '" style="display:block">' + out + '</svg>';
      flowerSvgCache[ck] = svg;
      return svg;
    }

    // The round backing the sprinkler marker still sits on (flower growth
    // stages no longer use this - see buildPlantVisual below).
    function discStyle(bg, size) {
      return 'background:' + bg + ';border:2px solid rgba(255,255,255,0.85);border-radius:50%;width:' +
        size + 'px;height:' + size + 'px;display:flex;align-items:center;justify-content:center;' +
        'box-shadow:0 2px 8px rgba(60,40,20,0.3);flex-shrink:0;overflow:hidden';
    }

    // ---------------------------------------------------------------------
    //  PLANT VISUAL - a small planting (soil + grass + stem + flower head)
    //  rather than a flower icon on a disc. See buildPlantVisual below for
    //  the entry point; everything above it is supporting art.
    // ---------------------------------------------------------------------

    // Scale applied to a flower head (in its own 100x100 local space) before
    // it is mounted on a stem tip.
    var HEAD_SCALE = 0.6;

    // A single blade: filled and tapered (wide at the base, a point at the
    // tip), not a constant-width stroke - a stroked line reads as a wire or
    // a tendril because it never changes thickness. Two quadratic curves
    // (left edge base->tip, right edge tip->base) share one bend control
    // point, offset sideways by the blade's own half-width so it keeps a
    // visible belly rather than pinching straight to a point immediately.
    // Closed with Z along the ground so the base edge just disappears into
    // the soil/neighboring blades. Outlined a shade darker, same fill+edge
    // pairing every other piece of plant art in this file uses.
    function bladePath(bx, by, cx, cy, tx, ty, w, fill) {
      var edge = shadeHex(fill, 0.72);
      return '<path d="M' + (bx - w).toFixed(1) + ' ' + by +
        ' Q' + (cx - w * 0.45).toFixed(1) + ' ' + cy + ' ' + tx + ' ' + ty +
        ' Q' + (cx + w * 0.45).toFixed(1) + ' ' + cy + ' ' + (bx + w).toFixed(1) + ' ' + by +
        ' Z" fill="' + fill + '" stroke="' + edge + '" stroke-width="1" stroke-linejoin="round"/>';
    }

    // Three depth bands instead of one flat row: FAR sits behind the mound
    // and is drawn first (partly buried by it), MID is the main clump
    // framing the mound's edges (drawn with it), and NEAR is drawn
    // separately - appended AFTER the stem/head, not here - so those blades
    // land in front of the plant's own base instead of only ever behind it.
    // That's what turns two flat rows into a little patch the plant is
    // standing IN, rather than a backdrop.
    //
    // The mound itself is static (dirt doesn't blow in the wind) and shared
    // by every tile, so it's its own var, unjittered and unswayed.
    var GROUND_MOUND =
      '<ellipse cx="50" cy="100" rx="25" ry="8" fill="#5c3a1f"/>' +
      '<ellipse cx="50" cy="95" rx="22" ry="9.5" fill="#8a5a34"/>' +
      '<ellipse cx="43" cy="90" rx="9" ry="3.6" fill="#b98a54" opacity="0.55"/>' +
      '<ellipse cx="60" cy="93" rx="2.4" ry="2" fill="#6b431f" opacity="0.8"/>' +
      '<ellipse cx="37" cy="97" rx="2.2" ry="1.7" fill="#6b431f" opacity="0.7"/>';

    // ===================================================================
    //  WIND - the sway travels across the map as a wave (a per-tile delay
    //  derived from the tile's own q/r) instead of every plant twitching in
    //  sync. See the .wind-grass-back/.wind-grass-front/.wind-stem CSS
    //  above for the animation itself.
    // ===================================================================
    var WIND_CYCLE_S = 8;
    var WIND_DELAY_PER_TILE = 0.16;
    var WIND_DIR_Q = 1, WIND_DIR_R = 0.4;
    function windDelayFor(q, r) {
      var phase = (q * WIND_DIR_Q + r * WIND_DIR_R) * WIND_DELAY_PER_TILE;
      return -(((phase % WIND_CYCLE_S) + WIND_CYCLE_S) % WIND_CYCLE_S);
    }
    // Wraps a stem/head markup block in the sway group used by every plant
    // stage (sprout, single bloom, cluster). transform-origin is the point
    // where the stem meets the ground (see GROUND_MOUND/bladePath
    // coordinates above) - not fill-box, per the CSS comment above.
    function windStemWrap(markup) {
      return '<g class="wind-stem" style="transform-origin:50px 92px">' + markup + '</g>';
    }

    // ===================================================================
    //  GRASS CLUMPS - randomized per-tile tufts instead of a fixed
    //  scattered band. Deterministic per tile (seeded off q,r - see
    //  buildNewVisual) so the same tile always looks the same rather than
    //  re-randomizing on every icon rebuild.
    // ===================================================================
    function jitter(rng, range) { return (rng() - 0.5) * 2 * range; }

    // t.bx/t.by are used EXACTLY as given, NEVER jittered here - they must
    // land exactly on the clump's own transform-origin (see clumpMarkup). A
    // rotation only leaves its own center point stationary; any gap between
    // where a blade is actually drawn and where its group pivots reads as
    // the base sliding through a small arc on every swing - a real bug
    // found and fixed during mockup iteration, not a stylistic choice.
    function jitterBlade(rng, t) {
      var lenScale = 0.85 + rng() * 0.3;
      var leanShift = jitter(rng, 2.5);
      var tx = t.bx + (t.tx - t.bx) * lenScale + leanShift;
      var ty = t.by + (t.ty - t.by) * lenScale;
      var cx = t.bx + (t.cx - t.bx) * lenScale + leanShift * 0.6 + jitter(rng, 0.8);
      var cy = t.by + (t.cy - t.by) * lenScale;
      var w = t.w * (0.85 + rng() * 0.3);
      return bladePath(t.bx, t.by, cx, cy, tx, ty, w, t.fill);
    }

    // One clump's shape relative to its own root at (0,0): left/right splay
    // out to their own side with a slight upward lean, center is taller and
    // near-vertical - the fan silhouette of an actual grass tuft, not a
    // scattered row. Narrower base widths (1.9-2.1) than GROUND_MOUND's own
    // framing blades (up to 4.2) but less taper, which is what reads as
    // "thick" without needing a wide base to do it.
    var CLUMP_SHAPE = [
      { dcx: -4.2, dcy: -3.2, dtx: -7.5, dty: -5.5, w: 1.9 },
      { dcx: 0.4, dcy: -6, dtx: 0.6, dty: -10.5, w: 2.1 },
      { dcx: 4.2, dcy: -3.2, dtx: 7.5, dty: -5.5, w: 1.9 }
    ];

    // Builds one full clump at spot.bx/spot.by: a static dirt indent (NOT
    // in the sway group - dirt doesn't blow in the wind, only what's rooted
    // in it does) plus three jittered blades inside their own <g>.
    function clumpMarkup(rng, spot, swayClass) {
      // Rounded once, here, reused as-is everywhere below (both the blade
      // paths' own base coordinate AND the sway group's transform-origin
      // string) - bladePath() doesn't round bx/by the way it rounds every
      // other coordinate, so leaving these as raw floats would let the
      // path's actual base drift a fraction of a unit from transform-
      // origin's rounded string.
      var bx = Math.round((spot.bx + jitter(rng, 2.5)) * 10) / 10;
      var by = Math.round((spot.by + jitter(rng, 0.8)) * 10) / 10;
      var scale = 0.85 + rng() * 0.3;
      var indent = '<ellipse cx="' + bx.toFixed(1) + '" cy="' + (by + 1.1).toFixed(1) + '" rx="' +
        (4.6 * scale).toFixed(1) + '" ry="' + (1.8 * scale).toFixed(1) + '" fill="#6b431f" opacity="0.38"/>';
      var blades = CLUMP_SHAPE.map(function (shape, i) {
        var t = {
          bx: bx, by: by,
          cx: bx + shape.dcx * scale, cy: by + shape.dcy * scale,
          tx: bx + shape.dtx * scale, ty: by + shape.dty * scale,
          w: shape.w * scale, fill: i === 1 ? spot.fillCenter : spot.fill
        };
        return jitterBlade(rng, t);
      }).join('');
      return indent + '<g class="' + swayClass + '" style="transform-origin:' + bx.toFixed(1) + 'px ' + by.toFixed(1) + 'px">' +
        blades + '</g>';
    }

    // Five spots: one behind the mound, two framing its sides (drawn after
    // the mound - overlapping its edge, the "grass at the base" look the
    // old GROUND_MARKUP front band had), and two out front in
    // groundNearRandom (drawn after the stem so they cross in front of it,
    // same idea as the old GROUND_NEAR).
    var FAR_CLUMP_SPOTS = [
      { bx: 50, by: 90, fill: '#345c30', fillCenter: '#3f6b3a' }
    ];
    var MID_CLUMP_SPOTS = [
      { bx: 25, by: 96, fill: '#3f6b3a', fillCenter: '#4e8b3f' },
      { bx: 75, by: 96, fill: '#3f6b3a', fillCenter: '#4e8b3f' }
    ];
    var NEAR_CLUMP_SPOTS = [
      { bx: 40, by: 102, fill: '#5ea648', fillCenter: '#7cc45f' },
      { bx: 60, by: 103, fill: '#5ea648', fillCenter: '#7cc45f' }
    ];

    function groundMarkupRandom(rng) {
      var far = FAR_CLUMP_SPOTS.map(function (s) { return clumpMarkup(rng, s, 'wind-grass-back'); }).join('');
      var mid = MID_CLUMP_SPOTS.map(function (s) { return clumpMarkup(rng, s, 'wind-grass-back'); }).join('');
      return far + GROUND_MOUND + mid;
    }
    function groundNearRandom(rng) {
      return NEAR_CLUMP_SPOTS.map(function (s) { return clumpMarkup(rng, s, 'wind-grass-front'); }).join('');
    }

    // A sprout, capped with a closed bud rather than just two bare leaves -
    // the stem is stretched a little taller (was 64, now 56) to make room
    // for it. The bud is two nested almond shapes, both green (a lighter
    // outer sepal casing, a darker inner crease for a bit of shape) -
    // deliberately carries no hint of the species' actual petal color, so
    // what it's about to bloom into stays a surprise until it actually
    // opens at stage 2. No longer takes a color argument, since it no
    // longer uses one.
    function sproutMarkup() {
      return '<path d="M50 92 C49 80 51 66 50 56" stroke="#4e8b3f" stroke-width="4" fill="none" stroke-linecap="round"/>' +
        '<ellipse cx="39" cy="78" rx="9" ry="5.5" fill="#7cc45f" stroke="#4e8b3f" stroke-width="1.6" transform="rotate(-28 39 78)"/>' +
        '<ellipse cx="61" cy="83" rx="8" ry="5" fill="#66b04d" stroke="#4e8b3f" stroke-width="1.6" transform="rotate(24 61 83)"/>' +
        '<path d="M50 38 C58 44 58 52 50 58 C42 52 42 44 50 38 Z" fill="#5ea648" stroke="' +
        shadeHex('#5ea648', 0.72) + '" stroke-width="1.4"/>' +
        '<path d="M50 41 C55 45 55 51 50 55 C45 51 45 45 50 41 Z" fill="#3f6b3a" stroke="' +
        shadeHex('#3f6b3a', 0.75) + '" stroke-width="1"/>';
    }

    var BLOOM_STEM_MARKUP =
      '<path d="M50 92 C49 74 51 54 50 40" stroke="#4e8b3f" stroke-width="4.2" fill="none" stroke-linecap="round"/>' +
      '<ellipse cx="39" cy="68" rx="7.5" ry="4.6" fill="#7cc45f" stroke="#4e8b3f" stroke-width="1.5" transform="rotate(-30 39 68)"/>' +
      '<ellipse cx="61" cy="74" rx="7" ry="4.2" fill="#66b04d" stroke="#4e8b3f" stroke-width="1.5" transform="rotate(26 61 74)"/>';

    // The center stem carries one leaf (at 41,70); each side stem gets its
    // own smaller leaf near its own bend (36,76 and 64,76) so a cluster
    // reads as three stems each with foliage, not three bare stems with a
    // leaf tucked in the middle.
    var CLUSTER_STEM_MARKUP =
      '<path d="M48 92 C40 78 34 65 33 55" stroke="#4e8b3f" stroke-width="3.4" fill="none" stroke-linecap="round"/>' +
      '<path d="M52 92 C60 78 66 65 67 55" stroke="#4e8b3f" stroke-width="3.2" fill="none" stroke-linecap="round"/>' +
      '<path d="M50 92 C50 76 50 54 50 36" stroke="#4e8b3f" stroke-width="4.2" fill="none" stroke-linecap="round"/>' +
      '<ellipse cx="36" cy="76" rx="5.5" ry="3.4" fill="#66b04d" stroke="#4e8b3f" stroke-width="1.3" transform="rotate(-22 36 76)"/>' +
      '<ellipse cx="64" cy="76" rx="5.5" ry="3.4" fill="#7cc45f" stroke="#4e8b3f" stroke-width="1.3" transform="rotate(22 64 76)"/>' +
      '<ellipse cx="41" cy="70" rx="6.5" ry="4" fill="#7cc45f" stroke="#4e8b3f" stroke-width="1.4" transform="rotate(-26 41 70)"/>';

    // A soft directional sheen on every head (gloss so a flat, radially-
    // symmetric flower face doesn't read as a paper cutout), plus an
    // optional "recede" wash for a head sitting behind the main one. Both
    // clipped to the flower's own petal silhouette (see headClipDefs) - an
    // earlier version wasn't clipped and it showed as a faint circular halo
    // outside the petals and through the gaps between them.
    var HEAD_FX_DEFS =
      '<radialGradient id="headSheen" cx="34%" cy="26%" r="70%">' +
      '<stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>' +
      '<stop offset="45%" stop-color="#ffffff" stop-opacity="0.1"/>' +
      '<stop offset="100%" stop-color="#ffffff" stop-opacity="0"/></radialGradient>' +
      '<filter id="headContactShadow" x="-60%" y="-60%" width="220%" height="220%">' +
      '<feGaussianBlur stdDeviation="4"/></filter>';

    // The exact same row/petal geometry the flower-head renderer paints,
    // but as bare clip shapes (no fill/stroke - a clipPath only reads
    // geometry). This is the flower's true silhouette, petal gaps and all.
    function headSilhouetteShapes(species) {
      var sh = species.shape, out = '';
      sh.rows.forEach(function (row) {
        var cy = 50 - row.r;
        for (var i = 0; i < row.n; i++) out += petalShape(row, cy, '#000', '#000', (360 / row.n) * i + (row.rot || 0));
      });
      out += '<circle cx="50" cy="50" r="' + sh.center.r + '"/>';
      return out;
    }
    function headClipId(species) { return 'headClip-' + species.key; }
    function headClipDefs(species) {
      return '<clipPath id="' + headClipId(species) + '">' + headSilhouetteShapes(species) + '</clipPath>';
    }

    // scale() runs on the flower's raw local coordinates BEFORE translate()
    // shifts them - so translate(cx cy) alone lands the flower's own center
    // (local 50,50) at (cx + 50*scale, cy + 50*scale), not at (cx,cy). The
    // translate has to pre-subtract that scaled offset so the flower's
    // center - not some point down-and-right of it - lands on the stem tip.
    // opts.scale lets a head be drawn smaller than HEAD_SCALE (the two side
    // heads in a cluster); opts.recede adds the dulling wash for a head
    // sitting behind the front one. Only the sheen/recede overlay gets
    // clipped, in its own inner group - the flower head itself stays
    // unclipped, because a signature color's glow halo and sparks are drawn
    // deliberately bigger than the petals and clipping the whole head to
    // the petal outline would wrongly cut those off too.
    function headGroup(species, color, cx, cy, opts) {
      opts = opts || {};
      var s = opts.scale || HEAD_SCALE, tx = cx - 50 * s, ty = cy - 50 * s;
      var overlay = '<g clip-path="url(#' + headClipId(species) + ')"><circle cx="50" cy="50" r="48" fill="url(#headSheen)"/>' +
        (opts.recede ? '<circle cx="50" cy="50" r="48" fill="#1c1208" opacity="0.16"/>' : '') + '</g>';
      var inner = flowerHeadInner(species, color) + overlay;
      return '<g transform="translate(' + tx + ' ' + ty + ') scale(' + s + ')">' + inner + '</g>';
    }
    // A blurred, low-opacity dark ellipse sitting just behind the front
    // head - a contact shadow it casts onto whatever peeks out from behind
    // it. Clipped to the union of all three heads' own silhouettes (each in
    // its own position/scale), so it can only ever darken actual petal
    // pixels - never bleed into the empty space around any of them.
    function headContactShadow(species, front, sides) {
      var clipId = 'clusterShadowClip-' + species.key;
      var all = [front].concat(sides);
      var clipShapes = all.map(function (h) {
        var tx = h.cx - 50 * h.scale, ty = h.cy - 50 * h.scale;
        return '<g transform="translate(' + tx + ' ' + ty + ') scale(' + h.scale + ')">' + headSilhouetteShapes(species) + '</g>';
      }).join('');
      var defs = '<clipPath id="' + clipId + '">' + clipShapes + '</clipPath>';
      var tx = front.cx - 50 * front.scale, ty = front.cy - 50 * front.scale + 3;
      var shadow = '<g clip-path="url(#' + clipId + ')"><g transform="translate(' + tx + ' ' + ty + ') scale(' + front.scale + ')">' +
        '<ellipse cx="50" cy="52" rx="44" ry="42" fill="#241505" opacity="0.28" filter="url(#headContactShadow)"/></g></g>';
      return { defs: defs, markup: shadow };
    }

    // Slightly different, both smaller than the front bloom - a real
    // handful of stems is never three identical flowers, and the size step
    // reinforces which one is in front vs. tucked behind it.
    var SIDE_SCALE_L = HEAD_SCALE * 0.80;
    var SIDE_SCALE_R = HEAD_SCALE * 0.70;

    // The body of buildPlantVisual - stage 0 is bare ground, stage 1 a
    // sprout, stage 2 a single bloom on a stem, stage 3 a three-head
    // cluster. Returns {html, w, h} at the given px width. q, r seed the
    // grass clump randomization and the wind delay (see groundMarkupRandom/
    // windDelayFor above) - same tile, same look, every rebuild.
    function buildNewVisual(species, color, stage, px, q, r) {
      var rng = mulberry32(dailyStockSeed(cellKey(q, r)));
      var defs = '<defs>' + HEAD_FX_DEFS + headClipDefs(species) + '</defs>' + fancyDefs(color);
      var body = groundMarkupRandom(rng);
      if (stage === 1) body += windStemWrap(sproutMarkup());
      else if (stage === 2) body += windStemWrap(BLOOM_STEM_MARKUP + headGroup(species, color, 50, 40));
      else if (stage === 3) {
        var left = { cx: 33, cy: 55, scale: SIDE_SCALE_L };
        var right = { cx: 67, cy: 55, scale: SIDE_SCALE_R };
        var front = { cx: 50, cy: 36, scale: HEAD_SCALE };
        var shadow = headContactShadow(species, front, [left, right]);
        defs += shadow.defs;
        body += windStemWrap(CLUSTER_STEM_MARKUP +
          headGroup(species, color, left.cx, left.cy, { scale: left.scale, recede: true }) +
          headGroup(species, color, right.cx, right.cy, { scale: right.scale, recede: true }) +
          shadow.markup +
          headGroup(species, color, front.cx, front.cy, { scale: front.scale }));
      }
      // Drawn last, on top of the stem/head - see groundNearRandom above.
      body += groundNearRandom(rng);
      var vw = 100, vh = 112, dispH = Math.round(px * vh / vw);
      var windDelay = windDelayFor(q, r);
      var html = '<svg viewBox="0 0 ' + vw + ' ' + vh + '" width="' + px + '" height="' + dispH +
        '" style="display:block;--wind-delay:' + windDelay.toFixed(2) + 's">' + defs + body + '</svg>';
      return { html: html, w: px, h: dispH };
    }

    // Builds the "look" for a plant at a given stage/size and returns its
    // rendered box dimensions so callers (map marker vs. big panel preview)
    // can size their container to match exactly. `base` is the width in px
    // to render at, used directly for every stage - the ground/grass base
    // is common to all four stages, so (unlike the old disc icons) they all
    // share one canvas size rather than growing stage by stage. q, r are the
    // plant's grid position, forwarded to buildNewVisual for the grass seed
    // and wind delay.
    function buildPlantVisual(species, color, stage, wilted, base, q, r) {
      var v = buildNewVisual(species, color, stage, base, q, r);
      var html = wilted
        ? '<div style="filter:grayscale(55%) opacity(0.7)">' + v.html + '</div>'
        : v.html;
      return { html: html, w: v.w, h: v.h };
    }

    // -----------------------------------------------------------------------
    //  POTTED PLANT ART (greenhouse) - reuses the outdoor stem/leaf/flower-
    //  head markup verbatim (sproutMarkup/BLOOM_STEM_MARKUP/
    //  CLUSTER_STEM_MARKUP/headGroup, all unmodified, all still rooted at
    //  local (50,92)) but swaps what's underneath: a clay pot with a small
    //  soil mound instead of a grass-covered ground mound, and no wind - see
